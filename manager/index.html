<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Manager">
<meta name="theme-color" content="#f2f4f7">
<meta name="description" content="Run an artist-management company: five careers, one calendar, and a commission on everything.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Manager: 360 Deal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Achromatic ledger: the chrome is ink on a blue-grey ledger ground. The one hue (#1d5fbf) marks booked time and money in;
   artists carry pale identity tints; red and green only where a figure changed. */
:root{
  --ground:#f2f4f7;--surface:#ffffff;--raised:#eceef2;--border:#e3e6eb;--rule:#eef0f3;--control:#d4d7dd;
  --text:#0a0a0a;--soft:#3d3d3d;--muted:#666a72;--accent:#141414;--hue:#1d5fbf;--hue-pale:#e6eefa;
  --positive:#2e7d32;--negative:#c4242a;--warning:#92400e;
  --pill-pos-bg:#dcfae5;--pill-pos:#04250e;--pill-neg-bg:#ffedea;--pill-neg:#831c1e;--pill-warn-bg:#fff4dc;--pill-warn:#7a3a0b;--pill-neu-bg:#eceef2;--pill-neu:#3d3d3d;
  --rc:8px;--rk:6px;--sans:'Geist',Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--text);-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;font-weight:500;text-wrap:balance}
h1{font-size:24px;letter-spacing:-.015em}h2{font-size:17px}h3{font-size:15px;font-weight:500}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.money{font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.soft{color:var(--soft)}.small{font-size:13px}.xs{font-size:12px}
.pos{color:var(--positive)}.neg{color:var(--negative)}.warn{color:var(--warning)}.hue{color:var(--hue)}
:focus-visible{outline:2px solid var(--hue);outline-offset:2px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top,0px) + 6px) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:44px}
.mark{width:30px;height:30px;flex:none;display:block}
.top .when{display:flex;flex-direction:column;min-width:0;flex:1}
.top .when b{font-size:15px;font-weight:500}
.top .when span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.app.bare{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;color:var(--muted);font-size:11.5px;font-weight:500;position:relative;min-height:54px}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--text)}
.tab.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--text)}
.tab .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--negative);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:16px;font-weight:500}
.sec .aside{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:4px;min-width:0}
.list{display:flex;flex-direction:column}
.list>*{border-top:1px solid var(--rule)}
.list>*:first-child{border-top:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);background:var(--surface);border:1px solid var(--border);border-radius:var(--rc)}
.kpis>div{padding:12px 14px;min-width:0;border-top:1px solid var(--border)}
.kpis>div:nth-child(-n+2){border-top:0}
.kpis>div:nth-child(2n){border-left:1px solid var(--border)}
.kpis>div.lead{grid-column:1/-1;border-left:0}
.kpis>div.lead+div{border-left:0;border-top:1px solid var(--border)}
.kpis>div.lead+div+div{border-left:1px solid var(--border);border-top:1px solid var(--border)}
.kpis span{display:block;font-size:12.5px;color:var(--muted)}
.kpis b{display:block;font-size:22px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis .lead b{font-size:32px;font-weight:700;letter-spacing:-.02em}
.kpis small{font-size:12px;color:var(--muted)}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}.kpis>div{border-top:0!important;border-left:1px solid var(--border)!important}.kpis>div:first-child{border-left:0!important}.kpis>div.lead{grid-column:auto}}

/* controls */
.btn{border:0;border-radius:var(--rk);min-height:40px;padding:0 16px;font-weight:500;font-size:14.5px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .08s,background .15s}
.btn.sec2{background:#e5e5e5;color:var(--text)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--control)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn.block{width:100%;min-height:46px}
.btn.danger{background:transparent;color:var(--negative);border:1px solid #f0c9c6}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:not(:disabled):active,.opt:not(:disabled):active,.task:not(:disabled):active{transform:scale(.98)}
.btn:not(:disabled):hover{filter:brightness(1.08)}
.opt{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%;min-height:48px;transition:border-color .15s}
.opt:not(:disabled):hover{border-color:var(--control)}
.opt b{font-weight:500;font-size:14.5px}
.opt small{color:var(--muted);font-size:12.5px;line-height:1.35}
.opt:disabled{opacity:.42;cursor:not-allowed}
.opt.on{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.opt .cost{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.one{grid-template-columns:1fr}
.seg{display:flex;gap:18px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{background:none;border:0;padding:10px 0 9px;color:var(--muted);font-size:14px;font-weight:500;position:relative;white-space:nowrap}
.seg button.on{color:var(--text)}
.seg button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--text)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--pill-neu-bg);color:var(--pill-neu);white-space:nowrap}
.pill.pos{background:var(--pill-pos-bg);color:var(--pill-pos)}.pill.neg{background:var(--pill-neg-bg);color:var(--pill-neg)}.pill.warn{background:var(--pill-warn-bg);color:var(--pill-warn)}
.pill.hue{background:var(--hue-pale);color:var(--hue)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--muted)}
.field>span b{color:var(--text);font-weight:500}
input[type=text]{width:100%;background:var(--surface);border:1px solid var(--control);border-radius:var(--rk);padding:11px 12px;min-height:46px;font-size:16px}
input[type=range]{width:100%;accent-color:var(--text);height:30px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--control);background:var(--surface);display:grid;place-items:center;flex:none}

/* people */
.face{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:500;font-size:15px}
.face.sm{width:26px;height:26px;font-size:11px}
.face.lg{width:56px;height:56px;font-size:19px}
.artist{display:flex;gap:12px;align-items:flex-start;width:100%;background:none;border:0;text-align:left;padding:13px 0}
.artist .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.artist .nm{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.artist .nm b{font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artist .meta{font-size:12.5px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bars div{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.meter{height:5px;background:var(--raised);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--text);border-radius:3px}
.meter.low i{background:var(--negative)}
.meter.hue i{background:var(--hue)}

/* the week: five careers as lanes */
.week{display:grid;grid-template-columns:96px repeat(7,1fr);gap:0;font-size:12px}
.week .hd{padding:0 0 6px;text-align:center;color:var(--muted);font-size:11.5px}
.week .hd.today{color:var(--text);font-weight:500}
.week .lane{display:flex;align-items:center;gap:7px;min-width:0;padding:4px 6px 4px 0;height:44px;border-top:1px solid var(--rule);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.week .lane b{font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.week .lane small{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week .cell{height:44px;border-top:1px solid var(--rule);border-left:1px solid var(--rule);padding:10px 1px;position:relative}
.week .cell.we{background:#f7f8fa}
.bk{height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:500;overflow:hidden;white-space:nowrap}
.bk.show{background:var(--hue);color:#fff}
.bk.fest{background:#0a0a0a;color:#fff}
.bk.studio{background:#d9dce2;color:#2a2a2a}
.bk.write{background:#eceef2;color:#3d3d3d}
.bk.promo{background:#fff;box-shadow:inset 0 0 0 1px #9aa0a8;color:#3d3d3d}
.bk.brand{background:#fff;box-shadow:inset 0 0 0 1px var(--hue);color:var(--hue)}
.bk.rest{background:repeating-linear-gradient(135deg,#eceef2 0 3px,#fff 3px 6px);color:#666} /* taste-skill-ignore: hatch is the calendar mark for rest */
.bk.off{background:transparent;color:#b0b4bb}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.blocks{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.blk{height:34px;border-radius:6px;background:var(--raised);display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:500}
.blk.used{background:var(--surface);border:1px solid var(--border);color:var(--text)}

/* tasks */
.task{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:11px 13px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;min-height:52px}
.task b{font-weight:500;font-size:14.5px}
.task small{grid-column:1;color:var(--muted);font-size:12.5px;line-height:1.35}
.task .c{grid-column:2;grid-row:1/3;font-size:12.5px;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.task:not(:disabled):hover,.todo:hover,.artist:hover,.offer:hover{background:#fafbfc}
.task:disabled{opacity:.42;cursor:not-allowed}
.todo{display:flex;gap:10px;align-items:center;padding:11px 0;width:100%;background:none;border:0;text-align:left}
.todo .dot{width:8px;height:8px;border-radius:50%;background:var(--negative);flex:none}
.todo .dot.mid{background:#c9a227}.todo .dot.low{background:var(--control)}

/* money tables */
.dealrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
.dealrow span{color:var(--muted)}
.dealrow span{flex:1 1 auto;min-width:0}
.dealrow b{font-weight:400;font-variant-numeric:tabular-nums;text-align:right;flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.dealrow b.money{font-weight:700}
.dealrow.total{border-top:1px solid var(--border);padding-top:9px;margin-top:2px}
.dealrow.total span{color:var(--text)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans);font-size:10.5px;fill:#6c6c6c}
.chartrow{display:grid;grid-template-columns:28px 1fr 74px;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.chartrow .p{color:var(--muted);text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.chartrow .s{min-width:0}
.chartrow .s b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chartrow .s span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chartrow .n{font-size:12.5px;text-align:right;color:var(--soft);font-variant-numeric:tabular-nums}
.chartrow.mine{box-shadow:inset 3px 0 0 var(--hue);padding-left:10px;margin-left:-10px}
.chartrow.mine .s b{color:var(--hue)}

/* feed */
.post{display:flex;gap:10px;padding:12px 0}
.post .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.post .h{font-size:13px;color:var(--muted)}
.post .h b{color:var(--text);font-weight:500}
.post .stats{font-size:12px;color:var(--muted)}
.news{padding:12px 0;display:flex;flex-direction:column;gap:4px}
.news .src{font-size:12px;color:var(--muted)}
.news b{font-size:15.5px;font-weight:500;line-height:1.3}
.news p{font-size:13.5px;color:var(--soft)}
.offer{display:flex;flex-direction:column;gap:6px;padding:13px 0;width:100%;background:none;border:0;text-align:left}
.offer .h{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.offer b{font-size:15px;font-weight:500}
.offer p{font-size:13.5px;color:var(--soft)}

/* 3D */
.stage{position:relative;height:240px;border-radius:var(--rc);overflow:hidden;background:#dfe3ea;border:1px solid var(--border);touch-action:pan-y}
.stage.tall{height:290px}
.stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px}
.stage canvas~.fb{display:none}
.stage .cap{position:absolute;left:10px;bottom:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:12px}
.stage .cap span{background:rgba(255,255,255,.88);padding:3px 9px;border-radius:999px;color:#111}

/* sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{background:var(--ground);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;box-shadow:0 -10px 34px rgba(0,0,0,.18);animation:up .2s ease-out;overscroll-behavior:contain}
.sheet>*{flex-shrink:0}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--control);margin:-6px auto 0}
.sheet .x{position:sticky;top:-16px;z-index:2;background:var(--ground);margin:-16px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border)}
.sheet .x h2{font-size:18px}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);z-index:60;width:min(560px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--text);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s ease-out}

/* title */
.hero{padding:calc(env(safe-area-inset-top,0px) + 28px) 0 4px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:44px;letter-spacing:-.035em;line-height:.95;font-weight:700}
.hero p{font-size:16px;color:var(--soft);max-width:36ch}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
.grade{font-size:48px;line-height:1;font-weight:700}
.empty{padding:22px 0;text-align:center;color:var(--muted);font-size:14px}
.ledger{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:13.5px}
.ledger span{color:var(--muted)}
.ledger b{font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="top"></div>
<main class="app" id="app"></main>
<nav id="tabs"></nav>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="sheet"></div>
<script>
'use strict';
const APP_VER='202610250100';
const $=(s,r=document)=>r.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const chance=p=>Math.random()<p;
const sum=a=>a.reduce((s,x)=>s+x,0);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const N=(m,s)=>m+gauss()*s;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
function hsh(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function srand(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function fmtN(n){n=Math.round(n);const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(2)+'B';if(a>=1e6)return (n/1e6).toFixed(a>=1e8?0:a>=1e7?1:2)+'M';if(a>=1e4)return Math.round(n/1e3)+'K';if(a>=1e3)return (n/1e3).toFixed(1)+'K';return String(n)}
const fmt$=n=>(n<0?'−$':'$')+fmtN(Math.abs(n));

<script>

let S=null;

const art=id=>S.artists.find(a=>a.id===id);

function useBlocks(n,aid,t){for(let i=0;i<n;i++)S.used.push({aid,t});const a=aid&&art(aid);if(a)a.att+=n}

/* ---------- people ---------- */
function actName(kind,genre){
  if(kind==='band')return (chance(.55)?'The ':'')+pick(BADJ)+' '+pick(BNOUN);
  if(kind==='duo')return chance(.5)?pick(FIRST)+' & '+pick(FIRST):pick(BADJ)+' '+pick(BNOUN).replace(/s$/,'');
  const f=pick(FIRST),l=pick(LAST);if(genre==='hiphop'&&chance(.45))return pick(['Lil ','Yung ','Big '])+f;return chance(.25)?f:f+' '+l}
const SKINS=['#f5d6c1','#eac0a0','#d9a07a','#b97a52','#8d5a3b','#5e3b26','#f1c9a5','#c68e65'];
const HAIRC=['#1b1410','#3a2416','#6b4423','#a8742f','#d9b25f','#c23b22','#e8e2d0','#2f4f8f','#ff6fa8','#111111'];
const TOPS=['#e94f37','#2e86ab','#f6c90e','#3bb273','#ff8c42','#111111','#f2f2f2','#c03e73','#1f6f78','#4a4e69'];
function genLook(seed){const r=srand(seed);const p=a=>a[Math.floor(r()*a.length)];return {skin:p(SKINS),hair:p(HAIRC),top:p(TOPS),pants:p(['#1e1e24','#2b3a55','#3c2f2f','#555b6e','#14213d']),style:p(['short','long','buzz','afro','bun','mop','spiky','bald']),seed}}
function genArtist(st,o={}){
  const genre=o.genre||pick(GK);const r=Math.random();const kind=['indie','alt','country'].includes(genre)&&r<.6?'band':r<.12?'duo':'solo';const n=kind==='band'?ri(3,5):kind==='duo'?2:1;
  const ml=Math.round([rnd(9e3,6e4),rnd(1.3e5,1.1e6),rnd(1.8e6,8e6),rnd(1.3e7,3e7)][st]);
  const gk=Object.keys(GOALS);const g1=pick(gk);let g2=pick(gk.filter(x=>x!==g1&&!(g1==='indie'&&x==='masters')));
  const a={id:uid(),name:actName(kind,genre),kind,n,genre,age:ri(19,23)+st*3,pers:o.pers||pick(Object.keys(PERS)),goals:[{k:g1,done:false},{k:g2,done:false}],hue:0,look:[],
    ml,fans:Math.round(ml*rnd(.07,.12)),hype:ri(25,50)+st*6,tal:clamp(Math.round(N(64,13)),30,97),songs:ri(2,7),q:0,
    health:ri(70,92),morale:ri(55,72),trust:ri(55,70),jeal:ri(0,12),att:0,attH:[],neglect:0,idle:0,
    contract:{rate:st>=2?15:20,start:1,end:ri(40,150),sunset:2},label:null,pub:null,act:{k:'write',t:0,need:0},rels:[],tour:null,lastTier:st>=2?'theatre':'club',
    cash:Math.round([4000,25000,180000,900000][st]*rnd(.6,1.3)),earn:{life:0,live:0,merch:0,rec:0,pub:0,brand:0,sync:0,adv:0},comm:0,commWk:[],streamsWk:[],status:'active',flags:{},feud:null,joined:1,best:999,gold:false,st0:st};
  for(let i=0;i<n;i++)a.look.push(genLook(hsh(a.id+i)));
  if(st===0)a.label={n:DISTRO,kind:'dist',share:90,bal:0,albums:0,mkt:0};
  else if(st===1)a.label=chance(.5)?{n:pick(LABELS.filter(l=>l.kind==='indie')).n,kind:'indie',split:50,bal:-rnd(30000,120000),albums:2,mkt:60000,p360:0}:{n:DISTRO,kind:'dist',share:90,bal:0,albums:0,mkt:0};
  else{const L=pick(LABELS.filter(l=>l.kind==='major'));a.label={n:L.n,kind:'major',pts:ri(16,20),bal:-rnd(150000,900000)*(st===3?.3:1),albums:ri(1,3),mkt:st===3?600000:250000,p360:L.p360}}
  a.pub=st===0?{kind:'none',n:'Self-published',bal:0}:st===1?{kind:'admin',n:pick(PUBS),bal:0}:{kind:'copub',n:pick(PUBS),bal:-rnd(50000,400000)};
  if(st>=1){const wk=-ri(8,50);a.rels.push({t:songTitle(),kind:'album',wk,peak:ml*.85*rnd(1.1,1.8),tot:0,q:ri(50,80)})}
  return a}
function stageNow(a){return stageIx(a)}
function moodWord(a){const m=(a.morale+a.trust)/2;return m>75?'Thriving':m>58?'Good':m>42?'Uneasy':m>28?'Unhappy':'Ready to walk'}

/* ---------- streams and money ---------- */
function relCurve(t){if(t<0)return 0;if(t===0)return .6;if(t===1)return .9;if(t===2)return 1;return Math.max(.92**(t-2),.07*.995**t)}
function weeklyStreams(a){let s=a.fans*1.1;for(const r of a.rels)s+=r.peak*relCurve(S.wk-r.wk)*(r.boost&&r.boostTo>=S.wk?r.boost:1);return s}
function addIncome(a,type,amt,note){if(!amt||amt<=0)return 0;
  const rate=a.status==='active'?a.contract.rate/100:0;const tourNet=type==='live'&&a.flags.netTour;
  const base=tourNet?Math.max(0,amt*.55):amt;const comm=base*rate;const biz=S.staff.bm?amt*BIZ:0;
  a.earn[type]=(a.earn[type]||0)+amt;a.earn.life+=amt;a.cash+=amt-comm-biz;a.comm+=comm;S.cash+=comm;S.wkL[type]=(S.wkL[type]||0)+comm;S.wkL.total+=comm;return comm}
function payArtist(a,master,pub){const L=a.label;
  // the master side
  if(L.kind==='dist')addIncome(a,'rec',master*L.share/100);
  else{const share=L.kind==='major'?L.pts/100:L.split/100;const before=Math.max(0,L.bal);L.bal+=master*share;const pay=Math.max(0,L.bal)-before;if(pay>0)addIncome(a,'rec',pay)}
  // the writer's share always goes straight to the writer through their collection society
  addIncome(a,'pub',pub*.5);const P=a.pub;const ps=pub*.5;
  if(P.kind==='none')addIncome(a,'pub',ps*.6);

  else{const before=Math.max(0,P.bal);P.bal+=ps*.5;const pay=Math.max(0,P.bal)-before;if(pay>0)addIncome(a,'pub',pay)}}

/* ---------- touring ---------- */
function demand(a,region='home'){return a.ml*.0012*(.75+a.hype/200)*(region==='world'?.85:region==='abroad'?.75:1)+a.fans*.004}
function tourPlan(a,o){const T=TIERS.find(t=>t.k===o.tier);const R=REGIONS[o.region];const d=demand(a,o.region);
  const pf=Math.pow(T.price/o.price,.6);const sold=Math.min(T.cap,d*pf);const gross=sold*o.price;
  const fee=Math.max(o.guar,.85*(gross-T.cost));const merchG=sold*T.merch*(.7+a.hype/200);const merchNet=merchG*.45;
  const costs=(T.prod+T.travel*R.tr)*(S.staff.tm?.92:1);const agent=fee*AGENT;const rate=a.contract.rate/100;const mgr=(a.flags.netTour?fee*.55:fee)*rate+merchNet*rate;const biz=S.staff.bm?(fee+merchNet)*BIZ:0;
  const l360=a.label&&a.label.p360?Math.max(0,fee+merchNet-costs-agent)*a.label.p360/100:0;
  const net=fee+merchNet-costs-agent-mgr-biz-l360;
  return {T,sold,pct:sold/T.cap,gross,fee,merchNet,costs,agent,mgr,biz,l360,net,dates:o.dates,tot:{gross:gross*o.dates,fee:fee*o.dates,net:net*o.dates,mgr:mgr*o.dates}}}
function guarantee(a,tier,region,price){const T=TIERS.find(t=>t.k===tier);const d=demand(a,region);const sold=Math.min(T.cap,d*Math.pow(T.price/price,.6));return Math.max(tier==='club'?250:0,Math.round(.85*(sold*price-T.cost)*.7/50)*50)}
function bookTour(a,o){a.tour={...o,start:S.wk+1,done:0,gross:0,fee:0,merch:0,costs:0,agent:0,comm:0,net:0,sold:0,cap:0,shows:[]};a.act={k:'tour',t:0,need:Math.ceil(o.dates/4)};a.lastTier=o.tier;
  const n=roster().filter(x=>x.tour&&x!==a&&x.tour.start+Math.ceil(x.tour.dates/4)>S.wk+1).length;if(S.staff.tm&&n&&!S.tmFor)S.dec.push({t:'evt',k:'tmclash',aid:a.id,aid2:roster().find(x=>x.tour&&x!==a).id})}
function tourWeek(a,log){const t=a.tour;if(S.wk<t.start)return;const shows=Math.min(4,t.dates-t.done);if(shows<=0)return;
  const T=TIERS.find(x=>x.k===t.tier);const R=REGIONS[t.region];const tmHere=S.staff.tm&&(!S.tmFor||S.tmFor===a.id);
  for(let i=0;i<shows;i++){const d=demand(a,t.region)*rnd(.82,1.15);const sold=Math.round(Math.min(T.cap,d*Math.pow(T.price/t.price,.6)));const gross=sold*t.price;
    const fee=Math.max(t.guar,.85*(gross-T.cost));const merchG=sold*T.merch*(.7+a.hype/200);const merchNet=merchG*.45;const costs=(T.prod+T.travel*R.tr)*(tmHere?.92:1);
    const c1=addIncome(a,'live',fee);const c2=addIncome(a,'merch',merchNet);const agent=fee*AGENT;a.cash-=agent+costs;
    const l360=a.label&&a.label.p360?Math.max(0,fee+merchNet-costs-agent)*a.label.p360/100:0;a.cash-=l360;
    t.gross+=gross;t.fee+=fee;t.merch+=merchNet;t.costs+=costs;t.agent+=agent;t.comm+=c1+c2;t.net+=fee+merchNet-costs-agent-c1-c2-l360-(S.staff.bm?(fee+merchNet)*BIZ:0);t.sold+=sold;t.cap+=T.cap;t.done++;
    a.fans+=Math.round(sold*.035*R.fans);a.hype=clamp(a.hype+(sold/T.cap>.9?.8:.2),0,100)}
  a.health=clamp(a.health-shows*2.4*(tmHere?.65:1),0,100);
  if(t.done>=t.dates){const pct=t.sold/t.cap;log.push(`${a.name} ${vb(a,'finish','finishes')} the ${TIERS.find(x=>x.k===t.tier).n.toLowerCase()} tour: ${Math.round(pct*100)}% sold, ${fmt$(t.net)} to the artist after costs.`);

    if(t.tier==='arena'&&pct>=.95)goal(a,'arena');

/* ---------- the chart ---------- */
function bgSong(age){return {t:songTitle(),ar:pick(BGARTISTS),peak:Math.pow(10,rnd(6.75,7.75)),wk:S.wk-age}}
function bgStreams(b){const t=S.wk-b.wk;if(t<0)return 0;if(t===0)return b.peak*.7;return b.peak*Math.max(.955**t,.18)}
function buildChart(){const rows=[];for(const b of S.bg)rows.push({t:b.t,ar:b.ar,s:bgStreams(b)});
  for(const a of S.artists){const sg=a.rels.filter(r=>r.kind==='single'&&S.wk-r.wk<60);for(const r of sg){rows.push({t:r.t,ar:a.name,s:r.peak*relCurve(S.wk-r.wk)*(r.boost&&r.boostTo>=S.wk?r.boost:1)*.75,mine:a.status==='active',aid:a.id})}}
  rows.sort((x,y)=>y.s-x.s);rows.forEach((r,i)=>r.pos=i+1);const prev=S.chart?Object.fromEntries(S.chart.map(r=>[r.ar+r.t,r.pos])):{};for(const r of rows)r.prev=prev[r.ar+r.t]||null;S.chart=rows.slice(0,100);
  for(const r of S.chart){if(!r.mine)continue;const a=art(r.aid);if(r.pos<a.best){a.best=r.pos}
    if(r.pos<=10&&!a.flags['t10'+r.t]){a.flags['t10'+r.t]=1;goal(a,'top10');S.rep=clamp(S.rep+4,0,100);social(a,'hit');news('Pulse Daily',`${a.name} ${vb(a,'go','goes')} top ten`,`“${r.t}” is #${r.pos} on the Pulse 40.`,true)}
    else if(r.pos<=40&&!a.flags['t40'+r.t]){a.flags['t40'+r.t]=1;S.rep=clamp(S.rep+2,0,100);news('Pulse Daily',`${a.name} ${vb(a,'enter','enters')} the Pulse 40`,`“${r.t}” debuts at #${r.pos}.`,true)}}
  S.bg=S.bg.filter(b=>bgStreams(b)>4.2e6||S.wk-b.wk<3);while(S.bg.length<92)S.bg.push(bgSong(-ri(0,1)))}

/* ---------- new game ---------- */
function newGame(o){
  S={v:1,slot:o.slot,co:o.co||'North Star Management',you:o.you||'Alex',wk:1,cash:60000,rep:30,artists:[],prospects:[],staff:{asst:false,tm:false,pr:false,law:false,bm:false},prFor:null,tmFor:null,
    used:[],offers:[],dec:[],news:[],social:[],mail:[],chart:null,bg:[],sunsets:[],hist:[],wkL:{total:0},ledger:[],bookings:[],over:false,sound:true,three:true,recap:null,debt:[],peakCash:60000};
  for(let i=0;i<70;i++)S.bg.push(bgSong(ri(0,40)));
  o.roster.forEach((a,i)=>{a.hue=HUES[i];a.joined=1;S.artists.push(a)});
  S.prospects=[genArtist(0),genArtist(chance(.5)?1:0),genArtist(1)].map(p=>{p.status='prospect';return p});
  buildChart();
  mail('Your accountant','Opening balance',`${S.co} starts the year with ${full$(S.cash)} in the bank. Rent and your draw cost ${full$(2400)} a week. Commission is the only thing that comes in.`,null);
  const big=S.artists.slice().sort((x,y)=>y.ml-x.ml)[0];mail(big.name,'Can we talk this week?',`New year. I want ${GOALS[big.goals[0].k].toLowerCase()}. Tell me you have a plan.`,big.id);
  news('The Ledger',`${S.co} opens its doors`,`${S.you}'s new management company starts with ${S.artists.length} artists: ${S.artists.map(a=>a.name).join(', ')}.`,true)}
function rollRoster(){return [genArtist(2,{pers:'diva'}),genArtist(1),genArtist(0)]}

<script>
'use strict';
/* ---------- offers ---------- */
function offerFor(a,type,o={}){const ml=a.ml,st=stageNow(a),h=a.hype;const id=uid();let f={id,type,aid:a.id,exp:S.wk+ri(2,4),c:0};
  if(type==='label'){const pool=LABELS.filter(l=>o.kind?l.kind===o.kind:st>=1||l.kind==='indie');const L=pick(pool);const major=L.kind==='major';
    const adv=r1k(major?(120000+ml*.12)*(.7+h/100):(30000+ml*.04)*(.7+h/100));
    f={...f,from:L.n,kind:L.kind,adv:Math.min(adv,major?6e6:1.2e6),rec:r1k(major?150000+st*80000:60000),pts:major?ri(16,19):0,split:major?0:50,p360:L.p360,albums:major?ri(2,4):2,mkt:major?r1k(200000+st*150000):r1k(50000+st*30000)}}
  else if(type==='pub'){const cp=chance(.6)||st>=2;f={...f,from:pick(PUBS),kind:cp?'copub':'admin',adv:r1k(cp?clamp(ml*.06,25000,3e6):clamp(ml*.008,0,150000)),years:cp?4:3}}
  else if(type==='brand'){const b=pick(BRANDS);f={...f,from:b[0],cat:b[1],fee:r1k(clamp(ml*.018*b[2]*(.6+h/80),8000,2.5e6)),days:ri(1,2),cred:b[0]==='Ember'||b[0]==='Volt Energy'?1:.5}}
  else if(type==='sync'){const show=pick(SHOWS);const song=(a.rels.length?pick(a.rels).t:songTitle());f={...f,from:'Music supervisor, '+show,show,song,fee:r1k(clamp(15000+ml*.01*(a.tal/60),15000,300000))}}
  else if(type==='fest'){const F=o.fest||pick(FESTS);const slot=o.slot||(ml>9e6&&h>55?'Headliner':ml>1e6?'Main stage':ml>1.5e5?'Second stage':'Opening slot');const mult={Headliner:3,'Main stage':1,'Second stage':.45,'Opening slot':.2}[slot];
    f={...f,from:F.n+' Festival',fest:F.n,fwk:yearStart(S.wk)+F.wk-1,slot,fee:r1k(clamp(ml*.012*mult,3000,2.2e6)),exp:S.wk+ri(3,5)}}
  else if(type==='tv'){f={...f,from:pick(['Late Night with Dana Price','The Friday Show','Morning Live']),wk2:S.wk+ri(1,3),exp:S.wk+2}}
  S.offers.push(f);return f}
const yearStart=w=>w-((w-1)%52);
function opinion(a,f){const r=[];let s=0;const G=a.goals.filter(g=>!g.done).map(g=>g.k);const P=a.pers;
  if(f.type==='label'){if(f.kind==='major'&&(G.includes('indie')||P==='rebel')){s-=40;r.push('They never wanted a major.')}
    if(f.kind==='major'&&G.includes('masters')){s-=25;r.push('The label would own the masters.')}
    if(f.p360){s-=f.p360;r.push(`The ${f.p360}% 360 bothers them.`)}
    if(f.adv>a.ml*.1){s+=20;r.push('The advance is life-changing.')}else if(f.adv>30000){s+=8;r.push('The advance would help.')}
    if(f.kind!=='major'&&G.includes('masters')){s+=15;r.push('They keep control.')}}
  else if(f.type==='brand'){if(P==='rebel'){s-=45;r.push('A '+f.cat+' ad? They would rather quit.')}else if(f.cred>=1){s-=10;r.push('Fans may call it a sell-out.')}if(f.fee>a.cash*.5){s+=25;r.push('The money is real.')}else s+=8}
  else if(f.type==='sync'){s+=20;r.push('They love the show.');if(P==='rebel'&&chance(.3)){s-=25;r.push('They hate the network.')}}
  else if(f.type==='fest'){s+=f.slot==='Headliner'?50:25;r.push(f.slot==='Headliner'?'This is the dream.':'Good exposure.');if(a.health<40){s-=20;r.push('They are exhausted.')}}
  else if(f.type==='pub'){s+=f.adv>50000?20:5;r.push(f.kind==='copub'?'Money now, the publisher keeps a quarter of the songs.':'They keep the songs; admin fee only.')}
  else if(f.type==='tv'){s+=P==='anxious'?-10:25;r.push(P==='anxious'?'Live TV terrifies them.':'Huge exposure.')}
  return {s,r,word:s>=30?'Loves it':s>=10?'Into it':s>=-10?'Unsure':s>=-30?'Against it':'Hates it'}}
function commOn(a,f){const r=a.contract.rate/100;if(f.type==='label')return (f.adv)*r;if(f.type==='pub')return f.adv*r;if(f.type==='brand'||f.type==='fest')return f.fee*r;if(f.type==='sync')return f.fee*.5*.5*r+f.fee*.25*r;return 0}
function acceptOffer(f){const a=art(f.aid);const op=opinion(a,f);S.offers=S.offers.filter(x=>x!==f);
  if(op.s<-10){a.trust=clamp(a.trust+op.s/3,0,100);a.morale=clamp(a.morale+op.s/4,0,100)}else{a.trust=clamp(a.trust+3,0,100)}
  if(f.type==='label'){if(f.kind==='major')a.goals.filter(g=>g.k==='indie').forEach(g=>g.failed=true);
    a.label={n:f.from,kind:f.kind,pts:f.pts,split:f.split,bal:-(f.adv+f.rec),albums:f.albums,mkt:f.mkt,p360:f.p360,rec:f.rec};addIncome(a,'adv',f.adv);
    if(f.kind!=='major')goal(a,'masters');news('Trackside',`${a.name} ${vb(a,'sign','signs')} with ${f.from}`,`A ${f.albums}-album deal, ${fmt$(f.adv)} advance${f.p360?', with a '+f.p360+'% 360':''}. Managed by ${S.co}.`,true)}
  else if(f.type==='pub'){a.pub={kind:f.kind,n:f.from,bal:-f.adv};addIncome(a,'adv',f.adv);news('Trackside',`${a.name} ${vb(a,'sign','signs')} a publishing deal`,`${f.from} lands the ${a.kind==='solo'?'songwriter':'band'} in a ${f.kind==='copub'?'co-publishing':'admin'} deal.`,true)}
  else if(f.type==='brand'){S.bookings.push({aid:a.id,wk:S.wk+1,day:2,kind:'brand',n:f.from,fee:f.fee,days:f.days});if(f.cred>=1&&chance(.4))social(a,'brand')}
  else if(f.type==='sync'){const pubHalf=f.fee*.5,masHalf=f.fee*.5;if(a.label.kind==='dist')addIncome(a,'sync',masHalf);else{const b=Math.max(0,a.label.bal);a.label.bal+=masHalf*.5;const p=Math.max(0,a.label.bal)-b;if(p>0)addIncome(a,'sync',p)}
    addIncome(a,'sync',pubHalf*.5+(a.pub.kind==='copub'?0:pubHalf*.5*(a.pub.kind==='admin'?.85:.6)));a.hype=clamp(a.hype+8,0,100);const r=a.rels.find(x=>x.t===f.song);if(r){r.boost=1.6;r.boostTo=S.wk+4}
    news('Pulse Daily',`“${f.song}” lands in ${f.show}`,`The ${a.name} song soundtracks the episode everyone is talking about.`,true)}
  else if(f.type==='fest'){S.bookings.push({aid:a.id,wk:f.fwk,day:5,kind:'fest',n:f.fest,fee:f.fee,slot:f.slot});news('Festival Watch',`${f.fest} adds ${a.name}`,`${f.slot} at ${f.fest} this summer.`,true)}
  else if(f.type==='tv'){S.bookings.push({aid:a.id,wk:f.wk2,day:3,kind:'tv',n:f.from})}
  return op}
function counterOffer(f){const law=S.staff.law;if(!law)useBlocks(1,f.aid,'Counter: '+f.from);f.c++;const a=art(f.aid);
  const p=(law?.75:.55)+a.hype/400-f.c*.12;if(chance(p)){const up=law?1.25:1.15;if(f.adv!=null)f.adv=r1k(f.adv*up);if(f.fee!=null)f.fee=r1k(f.fee*up);if(f.type==='label'&&f.p360)f.p360=Math.max(0,f.p360-5);else if(f.type==='label'&&f.pts)f.pts=Math.min(22,f.pts+1);return 'up'}
  if(chance(law?.1:.25)){S.offers=S.offers.filter(x=>x!==f);return 'gone'}return 'same'}

/* ---------- releases ---------- */
function startRecording(a){const L=a.label;const kind=a.songs>=10?'album':'EP';const cost=kind==='album'?(L.kind==='dist'?35000:L.rec||120000):(L.kind==='dist'?12000:60000);
  if(L.kind==='dist'){a.cash-=cost}else{L.bal-=cost}a.act={k:'studio',t:0,need:kind==='album'?ri(5,8):ri(3,4),kind,cost};}
function releasePlan(a,lead){const p=a.ready;const L=a.label;const mkt=L.kind==='dist'?(a.flags.selfMkt||0):L.mkt;
  const A=(.4*p.q+.16*a.hype+.16*Math.min(100,Math.log10(a.fans+10)*14)+.12*a.tal+(lead==='radio'?4:0))/100;const sd=lead==='weird'?.4:lead==='fan'?.25:.18;
  const mm=1+.3*Math.log10(1+mkt/40000);const peak=Math.pow(10,3.7+3.5*A+N(0,sd))*mm*(lead==='fan'?(.8+a.hype/150):1);
  const t=songTitle();a.rels.push({t,kind:'single',wk:S.wk+1,peak,tot:0,q:p.q});
  a.rels.push({t:p.kind==='album'?pick(['Everything After','Night Shift','Open Late','Second Skin','All of It','Smaller Hours','Low Season','Back Roads','Wide Awake','Neon Prayer']):a.name+' EP',kind:p.kind==='album'?'album':'ep',wk:S.wk+7,peak:peak*(p.kind==='album'?1.4:.6),tot:0,q:p.q,albumOf:t});
  if(L.kind!=='dist'){L.albums=Math.max(0,L.albums-(p.kind==='album'?1:0));L.bal-=Math.min(mkt*.2,60000)}else if(mkt){a.cash-=mkt}
  a.hype=clamp(a.hype+10,0,100);a.ready=null;a.act={k:'promo',t:0,need:3};
  news('Trackside',`${a.name} ${vb(a,'announce','announces')} “${t}”`,`The lead single from the new ${p.kind==='album'?'album':'EP'}, out through ${L.n}.`,true)}

/* ---------- events ---------- */
const EVT={
  burnout:{t:a=>`${a.name}: running on empty`,b:a=>`${a.name}'s health is at ${Math.round(a.health)}. Their partner calls you at 2am. They can't keep going like this.`,

       {n:'One week off, then back out',d:'Lose this week\'s dates.',f:a=>{if(a.tour)a.tour.dates=Math.max(a.tour.done,a.tour.dates-4);a.health=clamp(a.health+12,0,100);return 'A week at home. They are not fixed, but they are better.'}},
       {n:'Push through',d:'Keep the money. Risky.',f:a=>{if(chance(.5)){a.health=0;a.act={k:'rest',t:0,need:5};if(a.tour)a.tour.dates=a.tour.done;a.trust=clamp(a.trust-25,0,100);S.rep=clamp(S.rep-4,0,100);news('Pulse Daily',`${a.name} ${vb(a,'collapse','collapses')} on stage`,'The rest of the tour is cancelled.',true);return 'They collapse mid-set in front of four thousand people. The tour is over, and they blame you.'}a.trust=clamp(a.trust-10,0,100);return 'They make it, barely. They will not forget who made them.'}}]},
  scandal:{t:a=>`${a.name} ${vb(a,'are','is')} trending`,b:a=>pick([`A video from an after-party shows ${a.name} trashing a hotel suite. It has two million views.`,`Old posts from ${a.name}'s teenage account have resurfaced. Some of them are bad.`,`${a.name} insulted a festival crowd's city on stage. Local radio is furious.`]),
    c:[{n:'Full apology, with the publicist',d:'Needs a publicist, or $15K for a crisis firm.',f:a=>{if(!S.staff.pr){S.cash-=15000}a.hype=clamp(a.hype-4,0,100);a.morale=clamp(a.morale-5,0,100);return 'A careful statement and a sit-down interview. It blows over in a week.'}},
       {n:'Say nothing',d:'Let it pass.',f:a=>{const k=S.staff.pr?.5:1;a.hype=clamp(a.hype-10*k,0,100);a.fans=Math.round(a.fans*(1-.06*k));S.offers=S.offers.filter(o=>!(o.aid===a.id&&o.type==='brand'));return 'The silence reads as guilt. Brands quietly pull out.'}},

  dispute:{t:a=>`${a.name}'s lawyer wants a word`,b:(a,b,d)=>`The tour lost money for ${a.name}, but you took ${full$(d.amt)} in commission on the gross. Their lawyer says commission should come off the net.`,

       {n:'Promise more time',d:'Two blocks next week go to them.',f:a=>{S.debt.push({aid:a.id,n:2,t:'Damage control'});a.trust=clamp(a.trust+10,0,100);return 'You clear your calendar. It helps.'}},

    c:[{n:'Take them out, this week',d:'One block next week. Jealousy drops.',f:a=>{S.debt.push({aid:a.id,n:1,t:'Check-in'});a.jeal=clamp(a.jeal-35,0,100);a.trust=clamp(a.trust+5,0,100);return 'A long lunch. They feel seen.'}},

  feud:{t:(a,b)=>`${a.name} vs ${b.name}`,b:(a,b)=>`${a.name} ${vb(a,'say','says')} ${b.name} lifted their sound. ${b.name} ${vb(b,'reply','replies')} with a meme. Both camps are calling you.`,
    c:[{n:'Mediate: get them in a room',d:'Two blocks next week. Might end in a collaboration.',f:(a,b)=>{S.debt.push({aid:a.id,n:1,t:'Mediation'});S.debt.push({aid:b.id,n:1,t:'Mediation'});a.feud=b.feud=null;if(chance(.35)){a.hype+=8;b.hype+=8;news('Pulse Daily',`${a.name} and ${b.name} bury it with a duet`,'Nobody saw that coming.',true);return 'They end the night writing a song together.'}return 'A tense hour, then a handshake.'}},

       {n:'Hold your rate',label:a=>`Hold at ${a.contract.rate}%`,d:'Depends on trust.',f:a=>{if(a.trust>62||chance(a.trust/150)){a.contract={...a.contract,start:S.wk,end:S.wk+156};return 'They grumble and sign.'}depart(a,'contract');return 'They walk. Your sunset clause starts now.'}},
       {n:'Part ways',d:'The sunset clause pays you for a while.',f:a=>{depart(a,'contract');return 'A long handshake. It is over.'}}]},

       {n:'Let them go',d:'The sunset clause applies.',f:a=>{depart(a,'fired');return 'You keep the commission the contract allows, and nothing else.'}}]},
  tax:{t:a=>`${a.name} ${vb(a,'owe','owes')} the tax office`,b:a=>`Nobody set money aside. ${a.name} ${vb(a,'have','has')} a ${full$(Math.max(8000,a.earn.life*.06))} tax bill due this month.`,
    c:[{n:'Hire a business manager for the roster',d:'Artists pay 5%; no more surprises.',f:a=>{S.staff.bm=true;a.cash-=Math.max(8000,a.earn.life*.06);a.morale-=4;return 'Paid, painfully. A business manager starts Monday.'}},
       {n:'They pay it and move on',d:'Morale drops.',f:a=>{a.cash-=Math.max(8000,a.earn.life*.06);a.morale-=12;a.trust-=6;return 'They pay. They ask why nobody warned them.'}}]},
  tmclash:{t:(a,b)=>`Two tours, one tour manager`,b:(a,b)=>`${a.name} and ${b.name} are on the road at the same time. Your tour manager can only be in one place.`,

       {n:'Ask them to finish this week first',d:'Keeps four dates.',f:a=>{a.trust-=15;a.act={k:'rest',t:0,need:2};return 'They finish the week, and they will remember that too.'}}]}};
function renewRate(a){const st=stageNow(a);return st>=3?12.5:st>=2?15:a.contract.rate}
function depart(a,why){if(a.status!=='active')return;a.status='left';a.leftWk=S.wk;const base=a.commWk.slice(-12).reduce((s,x)=>s+x,0)/12;
  if(a.contract.sunset)S.sunsets.push({aid:a.id,name:a.name,start:S.wk,base,years:a.contract.sunset});S.rep=clamp(S.rep-(why==='contract'?1:4),0,100);
  news('Trackside',`${a.name} ${vb(a,'leave','leaves')} ${S.co}`,why==='poached'?'They have signed with a rival management company.':why==='fired'?'The split is said to be acrimonious.':'Their management term has ended.',true);
  S.offers=S.offers.filter(o=>o.aid!==a.id);S.bookings=S.bookings.filter(b=>b.aid!==a.id);for(const b of roster())if(b.feud===a.id)b.feud=null}
function sunsetIncome(){let t=0;for(const s of S.sunsets){const y=Math.floor((S.wk-s.start)/52);const f=y<s.years?[1,.5,.25][Math.min(2,y)]*.6:0;const x=s.base*f*Math.pow(.99,S.wk-s.start);if(x>0){t+=x;s.paid=(s.paid||0)+x}}S.cash+=t;S.wkL.sunset=(S.wkL.sunset||0)+t;S.wkL.total+=t;return t}

/* ---------- the week ---------- */
function endWeek(){const log=[];S.wkL={total:0};const rs=roster();
  // bookings that happen this week
  for(const b of S.bookings.filter(b=>b.wk===S.wk)){const a=art(b.aid);if(!a||a.status!=='active')continue;
    if(b.kind==='brand'){addIncome(a,'brand',b.fee);a.hype=clamp(a.hype+3,0,100);if(a.pers==='rebel')a.morale-=10;log.push(`${a.name} ${vb(a,'shoot','shoots')} the ${b.n} campaign: ${fmt$(b.fee)}.`)}

    if(b.kind==='tv'){a.hype=clamp(a.hype+10,0,100);a.fans=Math.round(a.fans*1.03);if(a.pers==='anxious')a.health-=8;log.push(`${a.name} ${vb(a,'play','plays')} ${b.n}.`)}}

    else if(k==='studio'){a.health=clamp(a.health-1,0,100);if(a.act.t>=a.act.need+(a.pers==='perfectionist'&&chance(.3)?1:0)){const q=clamp(Math.round(a.tal*.7+a.morale*.15+(a.label.kind==='major'?10:a.label.kind==='indie'?6:2)+N(0,8)+(a.pers==='perfectionist'?6:0)),10,99);

    // streams and money
    const st=weeklyStreams(a);a.streamsWk.push(Math.round(st));if(a.streamsWk.length>156)a.streamsWk.shift();a.lastStreams=st;
    for(const r of a.rels){const x=r.peak*relCurve(S.wk-r.wk)*(r.boost&&r.boostTo>=S.wk?r.boost:1);r.tot+=x;if(r.tot>75e6&&!r.gold){r.gold=true;a.gold=true;goal(a,'gold');news('Pulse Daily',`${a.name} ${vb(a,'go','goes')} gold`,`“${r.t}” passes 75 million streams.`,true)}}

    const share=totAtt?a.att/totAtt:1/rs.length;if(totAtt>=4&&share<.5/rs.length)a.jeal=clamp(a.jeal+6*PERS[a.pers].jeal,0,100);else a.jeal=clamp(a.jeal-4,0,100);
    a.morale=clamp(a.morale+(62-a.morale)*.06-(a.health<35?3:0)-(a.jeal>60?2:0)-(a.feud?2:0)+(S.staff.bm?.4:0),0,100);
    if(a.cash<0&&!S.staff.bm){a.morale=clamp(a.morale-2,0,100)}

  }
  for(const a of S.artists){a.trust=clamp(a.trust,0,100);a.morale=clamp(a.morale,0,100);a.health=clamp(a.health,0,100);a.jeal=clamp(a.jeal,0,100);a.hype=clamp(a.hype,0,100)}
  // commission lines per artist this week
  for(const a of S.artists){if(a.commWk.length&&a.status==='active'){a.commWk[a.commWk.length-1]=a.comm-(a._c||0);a._c=a.comm;if(a.commWk.length>156)a.commWk.shift()}}
  sunsetIncome();
  // overheads
  const staffCost=sum(Object.entries(S.staff).filter(([k,v])=>v).map(([k])=>STAFF[k].cost));const over=2400;S.cash-=staffCost+over;
  S.hist.push({w:S.wk,inc:S.wkL.total,cost:staffCost+over,cash:S.cash,L:{...S.wkL}});if(S.hist.length>260)S.hist.shift();
  // events
  for(const a of rs){if(a.status!=='active')continue;const P=PERS[a.pers];const r=Math.random();
    if(a.health<28&&!S.dec.some(d=>d.aid===a.id&&d.k==='burnout')&&chance(.55*P.burn+.15))S.dec.push({t:'evt',k:'burnout',aid:a.id});
    else if(r<.018*P.scan*(a.hype/50))S.dec.push({t:'evt',k:'scandal',aid:a.id});
    else if(r<.03&&a.kind==='band'&&a.n>2)S.dec.push({t:'evt',k:'member',aid:a.id});
    else if(r<.04&&a.jeal>62){const fav=rs.filter(b=>b!==a).sort((x,y)=>sum(y.attH)-sum(x.attH))[0];if(fav)S.dec.push({t:'evt',k:'jealous',aid:a.id,aid2:fav.id})}
    else if(r<.05&&rs.length>2&&!a.feud&&a.jeal>40){const o=pick(rs.filter(b=>b!==a&&b.genre===a.genre)||[]);if(o)S.dec.push({t:'evt',k:'feud',aid:a.id,aid2:o.id})}
    else if(r<.058)S.dec.push({t:'evt',k:'family',aid:a.id});
    if(a.trust<38&&stageNow(a)>=1&&chance(.05)){const R=pick(RIVALS);S.dec.push({t:'evt',k:'poach',aid:a.id,riv:R.n,who:R.who})}
    if(a.trust<=12&&!S.dec.some(d=>d.aid===a.id&&d.k==='leave'))S.dec.push({t:'evt',k:'leave',aid:a.id});
    if(S.wk>=a.contract.end&&!S.dec.some(d=>d.aid===a.id&&d.k==='renew'))S.dec.push({t:'evt',k:'renew',aid:a.id});
    if(!S.staff.bm&&wOfY(S.wk)===15&&a.earn.life>150000&&chance(.5))S.dec.push({t:'evt',k:'tax',aid:a.id});
    // the label loses patience after a flop
    const last=a.rels.filter(x=>x.kind!=='single').pop();if(a.label.kind!=='dist'&&last&&S.wk-last.wk===10&&last.tot<a.ml*1.2&&a.label.bal<-200000&&chance(.4))S.dec.push({t:'evt',k:'drop',aid:a.id});
    // offers find you
    const st=stageNow(a);if(chance(.03+a.hype/1500))offerFor(a,'brand');if(chance(.02+a.tal/4000)&&a.rels.length)offerFor(a,'sync');if(chance(.015+a.hype/2000))offerFor(a,'tv');

  S.offers=S.offers.filter(o=>o.exp>S.wk);

  for(const a of roster())for(const g of a.goals)if(g.k==='million'&&!g.done&&a.earn.life>=1e6)goal(a,'million');

  if(S.cash>S.peakCash)S.peakCash=S.cash}
function refreshProspect(){if(S.prospects.length>=3)S.prospects.shift();const st=Math.min(3,ri(0,1)+(S.rep>55?1:0)+(S.rep>80?1:0));const p=genArtist(st);p.status='prospect';S.prospects.push(p)}

<script>
'use strict';
const IC={

const actLabel={write:'Writing',studio:'In the studio',promo:'Promo run',rest:'Resting',tour:'On tour',idle:'Nothing booked'};
function barChart(vals,{h=150,w=340,startWk,line}={}){if(!vals.length)return '<p class="empty">No data yet.</p>';
  const max=Math.max(...vals,...(line||[]),1);const mag=Math.pow(10,Math.floor(Math.log10(max)));let step=mag;for(const m of [1,2,2.5,5,10]){if(max/(mag*m)<=4){step=mag*m;break}}const top=Math.ceil(max*1.05/step)*step;
  const L0=44,B=h-20,T0=8,W=w-L0-6;const n=vals.length;const bw=W/n;const y=v=>B-(v/top)*(B-T0);let g='';
  for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${L0}" x2="${w-6}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#9aa0a8':'#e8eaee'}"/><text x="${L0-6}" y="${y(v)+3.5}" text-anchor="end">${fmtN(v)}</text>`;

function lineChart(vals,{h=140,w=340,startWk}={}){if(vals.length<2)return '<p class="empty">Not enough weeks yet.</p>';const max=Math.max(...vals,1);const mag=Math.pow(10,Math.floor(Math.log10(max)));let step=mag;for(const m of [1,2,2.5,5,10]){if(max/(mag*m)<=4){step=mag*m;break}}const top=Math.ceil(max*1.05/step)*step;
  const L0=44,B=h-20,T0=8,W=w-L0-6;const x=i=>L0+i/(vals.length-1)*W;const y=v=>B-(v/top)*(B-T0);let g='';
  for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${L0}" x2="${w-6}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#9aa0a8':'#e8eaee'}"/><text x="${L0-6}" y="${y(v)+3.5}" text-anchor="end">${fmtN(v)}</text>`;
  const n=vals.length;for(const i of [0,Math.floor(n/3),Math.floor(2*n/3),n-1])g+=`<text x="${clamp(x(i),L0+14,w-22)}" y="${h-4}" text-anchor="middle">${dateOf(startWk+i)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Weekly streams, peak ${fmtN(max)}">${g}<polyline points="${vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}" fill="none" stroke="#1d5fbf" stroke-width="2" stroke-linejoin="round"/></svg>`}

/* ---------- the week as lanes ---------- */
function dayPlan(a,w=S.wk){const d=Array(7).fill(null);const k=a.act.k;
  if(k==='tour'&&a.tour&&w>=a.tour.start){const left=a.tour.dates-a.tour.done;[1,3,4,5].slice(0,Math.min(4,left)).forEach(i=>d[i]={k:'show',t:'Show'})}
  else if(k==='tour'&&a.tour){[2,3,4].forEach(i=>d[i]={k:'studio',t:'Rehearse'})}

function todos(){const t=[];const rs=roster();
  for(const a of rs){if(a.health<35)t.push([0,`${a.name}: health ${Math.round(a.health)}`,'Book rest or cancel dates.',a.id]);

  <div class="stage" data-stage="art:${p.id}"><div class="fb">${face(p,'lg')}</div><div class="cap"><span>Showcase set</span><span>Drag to spin</span></div></div>
  <div class="kpis"><div><span>Monthly listeners</span><b>${fmtN(p.ml)}</b></div><div><span>Tickets per city</span><b>${fmtN(demand(p))}</b></div></div>
  <p class="small soft">${esc(PERS[p.pers].d)} Wants: ${p.goals.map(g=>esc(GOALS[g.k].toLowerCase())).join('; ')}. Records: ${esc(p.label.n)}.</p>
  ${rng('rate','Commission',10,20,2.5,v=>v+'%')}${rng('term','Term',2,5,1,v=>v+' years')}${rng('sunset','Sunset clause',0,3,1,v=>v?v+' years, stepping down':'none')}
  <p class="small" id="chance">Chance they say yes: <b>${c>.7?'likely':c>.45?'coin flip':c>.2?'long shot':'very unlikely'}</b>${roster().length>=5?' · they worry you are stretched':''}</p>
  <button class="btn block" data-a="signpro" ${blocksLeft()<2||roster().length>=6?'disabled':''}>Pitch them · 2 blocks</button>`}
function dealsTab(){const by=t=>S.offers.filter(o=>o.type===t);const L=[['label','Record deals'],['pub','Publishing'],['fest','Festivals'],['brand','Brands'],['sync','Sync'],['tv','TV']];
  return `<div class="sec"><h1>Deals</h1><span class="aside">${S.offers.length} open</span></div>
  ${S.offers.length?L.filter(([t])=>by(t).length).map(([t,n])=>`<section class="card"><div class="sec"><h2>${n}</h2></div><div class="list">${by(t).map(o=>{const a=art(o.aid);const op=opinion(a,o);return `<button class="offer" data-a="openoffer" data-v="${o.id}"><div class="h"><span>${face(a,'sm')} ${esc(a.name)}</span><span>expires ${dateOf(o.exp)}</span></div><b>${esc(o.from)}</b><p>${offerLine(o)}</p><span class="small ${op.s<-10?'neg':op.s>=10?'pos':'muted'}">${op.word}</span></button>`}).join('')}</div></section>`).join(''):'<p class="empty">No offers on the table. Pitch your artists to labels, brands, publishers and festivals from their pages.</p>'}`}
function offerLine(o){if(o.type==='label')return `${o.kind==='major'?'Major':'Indie'} deal · ${fmt$(o.adv)} advance · ${o.kind==='major'?o.pts+' points':o.split+'/50 split'}${o.p360?' · '+o.p360+'% 360':''} · ${o.albums} albums`;
  if(o.type==='pub')return `${o.kind==='copub'?'Co-publishing':'Admin'} · ${fmt$(o.adv)} advance · ${o.years} years`;if(o.type==='brand')return `${o.cat} campaign · ${fmt$(o.fee)} · ${o.days} shoot day${o.days>1?'s':''}`;
  if(o.type==='sync')return `“${o.song}” in ${o.show} · ${fmt$(o.fee)} all-in`;if(o.type==='fest')return `${o.slot} · ${fmt$(o.fee)} · ${dateOf(o.fwk,5)}`;if(o.type==='tv')return `Live performance · ${dateOf(o.wk2,3)}`;return ''}
function offerSheet(o){const a=art(o.aid);const op=opinion(a,o);const cm=commOn(a,o);
  return `<div class="x"><div class="row grow">${face(a)}<div class="stack"><h2>${esc(o.from)}</h2><span class="small muted">for ${esc(a.name)} · expires ${dateOf(o.exp)}</span></div></div><button class="iconbtn" data-a="close" aria-label="Close">${ico('close')}</button></div>
  <section class="card">${offerRows(o)}<div class="dealrow total"><span>Your ${a.contract.rate}% of it</span><b class="money hue">${full$(cm)}</b></div></section>
  <section class="card"><div class="sec"><h3>${esc(a.name)}: ${op.word.toLowerCase()}</h3></div>${op.r.map(t=>`<p class="small soft">${esc(t)}</p>`).join('')}${op.s<-10?'<p class="hint neg">They will sign if you push, and resent you for it.</p>':''}</section>
  <div class="row"><button class="btn ghost" data-a="decline" data-v="${o.id}">Decline</button>${['label','pub','brand','fest','sync'].includes(o.type)?`<button class="btn sec2" data-a="counter" data-v="${o.id}" ${!S.staff.law&&blocksLeft()<1?'disabled':''}>Counter${S.staff.law?'':' · 1 block'}</button>`:''}<button class="btn grow" data-a="accept" data-v="${o.id}">Accept</button></div>`}
function offerRows(o){const R=(k,v)=>`<div class="dealrow"><span>${k}</span><b>${v}</b></div>`;
  if(o.type==='label')return R('Type',o.kind==='major'?'Major label, royalty deal':'Independent, 50/50 net profit split')+R('Advance (recoupable)',full$(o.adv))+R('Recording fund (recoupable)',full$(o.rec))+(o.kind==='major'?R('Royalty',o.pts+' points of master revenue'):R('Split','50% of net after costs'))+R('360 on live, merch, brand',o.p360?o.p360+'%':'none')+R('Albums',o.albums+' (label options)')+R('Marketing commitment',full$(o.mkt))+
    `<p class="hint">At ${o.kind==='major'?o.pts+' points':'a 50% split'}, they recoup ${full$(o.adv+o.rec)} after about ${fmtN((o.adv+o.rec)/(PER_STREAM*(o.kind==='major'?o.pts/100:.5)))} streams. Until then, record royalties pay you nothing.</p>`;
  if(o.type==='pub')return R('Deal',o.kind==='copub'?'Co-publishing: publisher keeps 50% of the publisher share':'Administration: 15% fee, artist keeps ownership')+R('Advance (recoupable)',full$(o.adv))+R('Term',o.years+' years');
  if(o.type==='brand')return R('Brand',`${o.from}, ${o.cat}`)+R('Fee',full$(o.fee))+R('Shoot days',o.days)+R('Credibility risk',o.cred>=1?'high':'moderate');
  if(o.type==='sync')return R('Placement',`“${esc(o.song)}” in ${o.show}`)+R('Total fee',full$(o.fee))+R('Master side (via label)',full$(o.fee/2))+R('Publishing side',full$(o.fee/2));
  if(o.type==='fest')return R('Slot',o.slot)+R('Date',dateOf(o.fwk,5)+' '+yearOf(o.fwk))+R('Fee',full$(o.fee))+R('Travel and crew','about 18% of the fee');
  if(o.type==='tv')return R('Show',o.from)+R('Date',dateOf(o.wk2,3));return ''}
function feedTab(){const unread=S.mail.filter(m=>!m.read).length;const c=S.chart||[];
  return `<div class="seg">${[['news','News'],['social','Social'],['chart','Pulse 40'],['inbox','Inbox'+(unread?' '+unread:'')]].map(([k,n])=>`<button class="${UI.feed===k?'on':''}" data-a="feed" data-v="${k}">${n}</button>`).join('')}</div>
  ${UI.feed==='news'?`<section class="list">${S.news.map(n=>`<article class="news"><span class="src">${esc(n.src)} · ${dateOf(n.w)} ${yearOf(n.w)}${n.mine?' · <span class="hue">your roster</span>':''}</span><b>${esc(n.t)}</b><p>${esc(n.d)}</p></article>`).join('')}</section>`:
   UI.feed==='social'?`<section class="list">${S.social.map(p=>{const a=art(p.aid);return `<article class="post">${a?face(a,'sm'):''}<div class="body"><span class="h"><b>@${esc(p.h)}</b> · ${dateOf(p.w)}</span><p>${esc(p.t)}</p><span class="stats">${fmtN(p.likes)} likes</span></div></article>`}).join('')||'<p class="empty">Quiet.</p>'}</section>`:
   UI.feed==='chart'?`<p class="small muted">Weekly streams. Your artists are marked in blue.</p><section class="list">${c.slice(0,40).map(r=>`<div class="chartrow ${r.mine?'mine':''}"><span class="p">${r.pos}</span><div class="s"><b>${esc(r.t)}</b><span>${esc(r.ar)}</span></div><span class="n">${fmtN(r.s)}<br><small class="${r.prev==null?'':r.prev>r.pos?'pos':r.prev<r.pos?'neg':'muted'}">${r.prev==null?'new':r.prev>r.pos?'▲'+(r.prev-r.pos):r.prev<r.pos?'▼'+(r.pos-r.prev):'–'}</small></span></div>`).join('')}</section>${c.filter(r=>r.mine&&r.pos>40).map(r=>`<p class="small"><span class="hue">${esc(r.ar)}</span> “${esc(r.t)}” is at #${r.pos}.</p>`).join('')}`:
   `<section class="list">${S.mail.map(m=>`<button class="offer" data-a="mail" data-v="${m.id}"><div class="h"><span>${esc(m.from)}</span><span>${dateOf(m.w)}</span></div><b>${m.read?'':'<span class="pill neg" style="margin-right:6px">New</span>'}${esc(m.subj)}</b><p>${esc(m.body.length>110?m.body.slice(0,108)+'…':m.body)}</p></button>`).join('')||'<p class="empty">Inbox zero.</p>'}</section>`}`}
function companyTab(){const H=S.hist.slice(-26);const qs=S.hist.filter(h=>qOf(h.w)===qOf(S.wk)&&yearOf(h.w)===yearOf(S.wk));const by=k=>sum(qs.map(h=>h.L[k]||0));const inc=sum(qs.map(h=>h.inc)),cost=sum(qs.map(h=>h.cost));
  const staffCost=sum(Object.entries(S.staff).filter(([,v])=>v).map(([k])=>STAFF[k].cost));
  return `<div class="sec"><h1>${esc(S.co)}</h1><span class="aside">${esc(S.you)}, founder</span></div>
  <div class="stage tall" data-stage="office"><div class="fb">Your office</div><div class="cap"><span>The office</span><span>Drag to spin</span></div></div>
  <div class="kpis"><div class="lead"><span>What the company is worth</span><b>${full$(valuation())}</b><small>2.5 × a year of commission at the current run rate, plus cash</small></div><div><span>Weekly overheads</span><b>${fmt$(staffCost+2400)}</b></div><div><span>Reputation</span><b>${Math.round(S.rep)}</b></div></div>
  <section class="card"><div class="sec"><h2>Commission in, by week</h2><span class="aside">dashed line: costs</span></div>${barChart(H.map(h=>h.inc),{startWk:H.length?H[0].w:S.wk,line:H.map(h=>h.cost)})}</section>
  <section class="card"><div class="sec"><h2>Q${qOf(S.wk)} ledger</h2><span class="aside">to date</span></div>
    ${[['live','Touring fees'],['merch','Merch'],['rec','Record royalties'],['pub','Publishing'],['brand','Brand deals'],['sync','Sync'],['adv','Advances'],['sunset','Sunset clauses']].map(([k,n])=>`<div class="dealrow"><span>${n}</span><b>${full$(by(k))}</b></div>`).join('')}
    <div class="dealrow total"><span>Commission</span><b class="money">${full$(inc)}</b></div><div class="dealrow"><span>Rent, your draw, staff</span><b>${full$(-cost)}</b></div><div class="dealrow"><span>Profit</span><b class="money ${inc-cost<0?'neg':'pos'}">${full$(inc-cost)}</b></div></section>
  <section class="card"><div class="sec"><h2>Staff</h2><span class="aside">hire and fire any week</span></div><div class="list">${Object.entries(STAFF).map(([k,s])=>`<div class="row" style="padding:10px 0"><div class="stack grow"><b style="font-weight:500">${s.n}</b><span class="small muted">${s.d}</span><span class="small num">${s.cost?full$(s.cost)+' a week':'paid by artists'}</span></div><button class="btn sm ${S.staff[k]?'ghost':''}" data-a="staff" data-v="${k}">${S.staff[k]?'Let go':'Hire'}</button></div>`).join('')}</div></section>
  <div class="opts"><button class="opt" data-a="how"><b>How to play</b><small>Rules and the money</small></button><button class="opt" data-a="three"><b>3D ${S.three?'on':'off'}</b><small>Stages and office</small></button><button class="opt" data-a="quit"><b>Save and exit</b><small>Back to the title</small></button></div>`}
function overScreen(){const why={broke:'The bank calls in the loan.',empty:'Nobody left to manage.',done:'Five years in.'}[S.over];
  return `<section class="hero"><h1 style="font-size:36px">${why}</h1><p>${S.over==='done'?`${esc(S.co)} is worth ${full$(valuation())}. The calls keep coming.`:'The office furniture goes back to the leasing company.'}</p></section>
  <div class="stage tall" data-stage="office"><div class="fb">Your office</div></div>
  <div class="kpis"><div class="lead"><span>Company value</span><b>${full$(valuation())}</b></div><div><span>Reputation</span><b>${Math.round(S.rep)}</b></div><div><span>Goals reached</span><b>${sum(S.artists.map(a=>a.goals.filter(g=>g.done).length))}</b></div></div>
  <section class="card"><div class="sec"><h2>Everyone you managed</h2></div><div class="list">${S.artists.map(a=>`<div class="dealrow"><span>${esc(a.name)}<br><small class="muted">${stageOf(a)} · ${a.status==='active'?'still with you':'left'}</small></span><b class="money">${fmt$(a.comm)}</b></div>`).join('')}</div></section>
  <button class="btn block" data-a="totitle">Back to the title</button>`}
</script>
<script>
'use strict';
/* ---------- sheets ---------- */
const sheetKey=sh=>sh.k+(sh.id||'');
function renderSheet(){const el=$('#sheet');const sh=UI.sheet;if(!sh){el.innerHTML='';document.body.style.overflow='';return}
  const prev=el.querySelector('.sheet');const st=prev&&prev.dataset.k===sheetKey(sh)?prev.scrollTop:0;let h='';
  if(sh.k==='art'){const a=art(sh.id);if(!a){UI.sheet=null;return renderSheet()}h=artistSheet(a)}
  else if(sh.k==='pro'){const p=S.prospects.find(x=>x.id===sh.id);if(!p){UI.sheet=null;return renderSheet()}h=proSheet(p)}
  else if(sh.k==='tour')h=tourSheet();
  else if(sh.k==='offer'){const o=S.offers.find(x=>x.id===sh.id);if(!o){UI.sheet=null;return renderSheet()}h=offerSheet(o)}
  else if(sh.k==='mail'){const m=S.mail.find(x=>x.id===sh.id);const a=m.aid&&art(m.aid);h=`<div class="x"><h2>${esc(m.subj)}</h2><button class="iconbtn" data-a="close" aria-label="Close">${ico('close')}</button></div><p class="small muted">${esc(m.from)} · ${dateOf(m.w)} ${yearOf(m.w)}</p><p class="soft">${esc(m.body)}</p>${a&&a.status==='active'?`<button class="btn sec2 block" data-a="openart" data-v="${a.id}">Open ${esc(a.name)}</button>`:''}`}
  else if(sh.k==='recap')h=recapSheet();
  else if(sh.k==='dec')h=decSheet();
  else if(sh.k==='how')h=howSheet();
  const modal=['recap','dec'].includes(sh.k);
  el.innerHTML=`<div class="scrim" ${modal?'':'data-a="scrim"'}><div class="sheet" data-k="${sheetKey(sh)}" role="dialog" aria-modal="true">${modal?'':'<div class="grab"></div>'}${h}</div></div>`;document.body.style.overflow='hidden';const ns=el.querySelector('.sheet');if(ns)ns.scrollTop=st;hydrate()}
function recapSheet(){const r=S.recap;const top=S.news.filter(n=>n.w>=r.w).slice(0,3);
  return `<div class="x"><h2>Week ${wOfY(r.w)} wrap</h2><span class="small muted">${dateOf(r.w)} to ${dateOf(r.w,6)}</span></div>
  <div class="kpis"><div><span>Commission in</span><b class="money">${full$(r.inc)}</b></div><div><span>Overheads out</span><b>${full$(-r.cost)}</b></div></div>
  ${r.log.length?`<div class="list">${r.log.map(t=>`<p class="small soft" style="padding:7px 0">${esc(t)}</p>`).join('')}</div>`:''}
  ${top.length?`<section class="list">${top.map(n=>`<article class="news"><span class="src">${esc(n.src)}</span><b>${esc(n.t)}</b><p>${esc(n.d)}</p></article>`).join('')}</section>`:''}
  <button class="btn block" data-a="recapok">${S.dec.length?`Next: ${S.dec.length} thing${S.dec.length>1?'s':''} to decide`:'On to the new week'}</button>`}
function decSheet(){const d=S.dec[0];const a=art(d.aid);if(!a||a.status!=='active'||((d.t==='release'||d.k==='shelve')&&(!a.ready||(a.ready.wait&&a.ready.wait>S.wk)))){S.dec.shift();return S.dec.length?decSheet():(UI.sheet=null,'')}
  if(d.t==='release'){UI.rel=UI.rel||{lead:'radio',mkt:0};const r=a.ready;const dist=a.label.kind==='dist';
    return `<div class="x"><div class="row grow">${face(a)}<h2>${esc(a.name)}: the ${r.kind} is done</h2></div></div>
    <p class="soft">Quality <b class="num">${r.q}</b> of 100. ${dist?'You are releasing it yourselves through Tunebridge.':`${esc(a.label.n)} has ${full$(a.label.mkt)} of marketing for it.`}</p>
    <div class="sec"><h3>Lead single</h3></div><div class="opts one">${[['radio','The radio one','Safest; leans on quality.'],['fan','The fan favourite','Rides their current hype.'],['weird','The left-field one','High risk, high ceiling.']].map(([k,n,dd])=>`<button class="opt ${UI.rel.lead===k?'on':''}" data-a="rellead" data-v="${k}"><b>${n}</b><small>${dd}</small></button>`).join('')}</div>
    ${dist?`<div class="sec"><h3>Marketing from their own pocket</h3><span class="aside">they have ${fmt$(a.cash)}</span></div><div class="opts">${[0,10000,30000,80000].map(m=>`<button class="opt ${UI.rel.mkt===m?'on':''}" data-a="relmkt" data-v="${m}" ${m>Math.max(0,a.cash)?'disabled':''}><b>${m?fmt$(m):'Nothing'}</b><small>${m?'Playlists pitch and ads':'Post it and pray'}</small></button>`).join('')}</div>`:''}
    <button class="btn block" data-a="relok">Release the single next week</button>`}
  const E=EVT[d.k];const b=d.aid2&&art(d.aid2);
  if(UI.evtRes)return `<div class="x"><h2>${esc(E.t(a,b,d))}</h2></div><p class="soft">${esc(UI.evtRes)}</p><button class="btn block" data-a="evtok">Continue</button>`;
  return `<div class="x"><div class="row grow">${face(a)}<h2>${esc(E.t(a,b,d))}</h2></div></div><p class="soft">${esc(E.b(a,b,d))}</p>
  <div class="opts one">${E.c.map((c,i)=>`<button class="opt" data-a="evtpick" data-v="${i}"><b>${esc(c.label?c.label(a,b,d):c.n)}</b><small>${esc(c.d)}</small></button>`).join('')}</div>`}
function howSheet(){return `<div class="x"><h2>How to play</h2><button class="iconbtn" data-a="close" aria-label="Close">${ico('close')}</button></div>
  <p class="soft"><b>You are the manager.</b> You take ${'15–20%'} of what your artists earn: live fees, merch, royalties, publishing, brand deals, sync and advances. Your company pays rent, your draw and your staff out of that.</p>
  <p class="soft"><b>Time is the game.</b> You get ten blocks of attention a week. Every block goes to one artist. Artists you ignore lose trust; artists who see you favour someone else get jealous. Trust at zero and they fire you.</p>
  <p class="soft"><b>The calendar.</b> Each artist is writing, recording, promoting, resting or touring. Tours make the most money and burn the most health. Book rooms the artist can fill: an empty arena loses the artist money even when you still collect your commission on the gross.</p>
  <p class="soft"><b>Deals.</b> Labels advance money that the artist pays back from royalties before seeing more. Majors take a 360 cut of touring and merch. Publishers advance against songwriting. Brands pay well and cost credibility. Festivals book in February to April for the summer. A lawyer counters for free.</p>
  <p class="soft"><b>Contracts end.</b> Big artists ask for a lower rate. When someone leaves, the sunset clause keeps paying you a stepped-down share for a few years.</p>
  <p class="soft"><b>Five years.</b> Grow the company's value. Go below ${full$(-100000)} and the bank closes you down.</p>`}

/* ---------- actions ---------- */
function setAct(a,k,need){a.act={k,t:0,need}}
const ACT={
  tab:v=>{UI.tab=v;window.scrollTo(0,0)},
  cont:()=>{const s=readSlot(lastSlot());if(s){S=s;UI.scr='game';UI.tab='week'}},
  load:v=>{const s=readSlot(+v);if(s){S=s;UI.scr='game';UI.tab='week';try{localStorage.setItem('mgr_last',v)}catch(e){}}},
  del:v=>{if(confirm('Delete this company? This cannot be undone.'))delSlot(+v)},
  newslot:v=>{UI.ng={slot:+v,co:'',you:'',roster:rollRoster()};UI.scr='new'},
  reroll:()=>{UI.ng.roster=rollRoster()},back:()=>{UI.scr='title'},
  start:()=>{const d=UI.ng;newGame({slot:d.slot,co:(d.co||'').trim()||'North Star Management',you:(d.you||'').trim()||'Alex',roster:d.roster});UI.scr='game';UI.tab='week';save();UI.sheet={k:'how'}},
  how:()=>{UI.sheet={k:'how'}},close:()=>{UI.sheet=null},scrim:()=>{UI.sheet=null},
  openart:v=>{if(art(v))UI.sheet={k:'art',id:v}},openpro:v=>{UI.sheet={k:'pro',id:v}},openoffer:v=>{UI.sheet={k:'offer',id:v}},
  checkin:v=>{const a=art(v);useBlocks(1,v,'Check-in');a.trust=clamp(a.trust+2,0,100);a.morale=clamp(a.morale+3,0,100);a.jeal=clamp(a.jeal-10,0,100);
    if(a.flags.promised&&S.wk-a.flags.promised>10){a.trust-=6;a.flags.promised=null;toast(`${a.name} remind${a.kind==='solo'?'s':''} you of the promise you made.`)}else toast(pick([`${a.name}: "Good to actually see you."`,`${a.name} play${a.kind==='solo'?'s':''} you three new demos.`,`${a.name} talk${a.kind==='solo'?'s':''} about ${GOALS[a.goals[0].k].split(':')[0].toLowerCase()}.`,`A long coffee with ${a.name}.`]))},
  dowrite:v=>{const a=art(v);useBlocks(1,v,'Writing plan');setAct(a,'write',0);toast(`${a.name}: writing weeks booked.`)},
  dorecord:v=>{const a=art(v);useBlocks(1,v,'Studio booking');startRecording(a);toast(`${a.name} ${vb(a,'go','goes')} into the studio for ${a.act.need} weeks.`)},
  dopromo:v=>{const a=art(v);useBlocks(1,v,'Promo plan');setAct(a,'promo',3)},
  dorest:v=>{const a=art(v);useBlocks(1,v,'Rest');setAct(a,'rest',2)},
  dotour:v=>{const a=art(v);const d=demand(a);const tier=d>9000?'arena':d>900?'theatre':'club';const T=TIERS.find(t=>t.k===tier);UI.tour={aid:v,tier,region:'home',dates:tier==='arena'?16:20,price:T.price,guar:0};UI.sheet={k:'tour',id:v}},
  ttier:v=>{UI.tour.tier=v;UI.tour.price=TIERS.find(t=>t.k===v).price},treg:v=>{UI.tour.region=v},

  desks.forEach(([k],i)=>{const gx=(i%3)*3.2-2.4,gz=Math.floor(i/3)*2.6-1.2;mesh(T,new T.BoxGeometry(2,.1,1),'#ffffff',gx,1.3,gz,root);for(const [dx,dz] of [[-.9,-.4],[.9,-.4],[-.9,.4],[.9,.4]])mesh(T,new T.BoxGeometry(.06,1.3,.06),'#9aa0a8',gx+dx,.65,gz+dz,root);
    mesh(T,new T.BoxGeometry(.9,.55,.05),'#0a0a0a',gx,1.68,gz-.3,root);const scr=mesh(T,new T.PlaneGeometry(.82,.47),new T.MeshBasicMaterial({color:new T.Color(k==='you'?'#1d5fbf':'#e6eefa')}),gx,1.68,gz-.27,root);
    const f=figure(T,genLook(hsh(k+S.co)),'desk',.62);f.position.set(gx,0,gz+.75);f.rotation.y=Math.PI;root.add(f)});
  mesh(T,new T.CylinderGeometry(.3,.24,.6,12),'#e2e4e9',4.6,.3,-3.6,root);for(let i=0;i<6;i++){const l=mesh(T,new T.SphereGeometry(.32,10,8),'#4f8a5b',4.6+Math.cos(i)*.25,.95+i*.12,-3.6+Math.sin(i)*.25,root);l.scale.set(1,.6,1)}
  const cam=new T.PerspectiveCamera(42,1,.1,60);cam.position.set(2.2,4.6,7.6);cam.lookAt(-.4,1.8,-1.4);V3.anim=[];return {sc,cam,root}}
function hydrate(){const els=[...document.querySelectorAll('[data-stage]')];const el=els[els.length-1];if(!el||!S||S.three===false||V3.failed)return;loadThree().then(T=>{if(el.isConnected)mount(T,el)}).catch(()=>{})}
function mount(T,el){
  if(!V3.r){try{V3.r=new T.WebGLRenderer({antialias:true});V3.r.setPixelRatio(Math.min(2,window.devicePixelRatio||1));const c=V3.r.domElement;c.setAttribute('aria-label','3D scene. Drag to spin.');
    c.addEventListener('pointerdown',e=>{V3.drag={x:e.clientX,r:V3.rotY};try{c.setPointerCapture(e.pointerId)}catch(_){}});c.addEventListener('pointermove',e=>{if(V3.drag)V3.rotY=V3.drag.r+(e.clientX-V3.drag.x)*.011});['pointerup','pointercancel'].forEach(k=>c.addEventListener(k,()=>{V3.drag=null}))}catch(e){V3.failed=true;return}}
  const sid=el.dataset.stage;const key=sid+'|'+(sid==='office'?S.wk+'|'+JSON.stringify(S.staff)+roster().length:'');
  if(key!==V3.key){dispose();const [k,id]=sid.split(':');try{const a=k==='art'?(art(id)||S.prospects.find(p=>p.id===id)):null;const b=k==='art'?buildArt(T,a):buildOffice(T);V3.sc=b.sc;V3.cam=b.cam;V3.root=b.root}catch(e){console.warn(e);return}V3.key=key;V3.rotY=0}
  const w=el.clientWidth||320,h=el.clientHeight||240;V3.r.setSize(w,h,false);V3.cam.aspect=w/h;V3.cam.updateProjectionMatrix();if(V3.r.domElement.parentNode!==el)el.insertBefore(V3.r.domElement,el.firstChild);
  if(!V3.raf){V3.t0=performance.now();V3.raf=requestAnimationFrame(loop3)}}
function loop3(){V3.raf=0;const c=V3.r&&V3.r.domElement;if(!c||!c.isConnected||!V3.sc||document.hidden)return;const t=V3.still?0:(performance.now()-V3.t0)/1000;V3.root.rotation.y=V3.rotY+(V3.drag||V3.still?0:Math.sin(t*.25)*.12);for(const f of V3.anim)f(t);V3.r.render(V3.sc,V3.cam);if(!V3.still)V3.raf=requestAnimationFrame(loop3)}
function dispose(){if(!V3.sc)return;V3.sc.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material.map&&o.material.map!==V3.dot)o.material.map.dispose()});V3.sc=null;V3.key=''}
function stop3D(){if(V3.raf)cancelAnimationFrame(V3.raf);V3.raf=0;dispose();if(V3.r&&V3.r.domElement.parentNode)V3.r.domElement.remove()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&V3.sc&&!V3.raf)V3.raf=requestAnimationFrame(loop3)});
window.addEventListener('resize',()=>{const c=V3.r&&V3.r.domElement;const el=c&&c.parentNode;if(el&&V3.cam){V3.r.setSize(el.clientWidth,el.clientHeight,false);V3.cam.aspect=el.clientWidth/el.clientHeight;V3.cam.updateProjectionMatrix()}});

// Same live-update approach as the other games in this repo.
function checkUpdate(){if(!/^https?:/.test(location.protocol))return;fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/const APP_VER='(\d+)'/);if(m&&m[1]!==APP_VER){try{save()}catch(e){}location.replace(location.pathname+'?v='+m[1])}}).catch(()=>{})}
setTimeout(checkUpdate,1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
render();
</script>
