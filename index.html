<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Headliner">
<meta name="theme-color" content="#0a0910">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Headliner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  /* Layout: backstage console. A sticky HUD and tab rail sit over a responsive grid of cards, like a mixing desk under stage lights */
  --bg:#0f0c15; --bg2:#151120; --panel:#1b1626; --panel2:#262035; --line:#362e4a;
  --fg:#f4eff9; --muted:#a79cbb; --dim:#716789;
  --glass:rgba(14,11,20,.74);
  --gold:#ffb627; --gold-ink:#1d1405; --pink:#ff4f8b; --cyan:#4fd6e8; --good:#62dd94; --bad:#ff6b6b; --white:#ffffff;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.45;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.05}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.good{color:var(--good)} .bad{color:var(--bad)} .goldc{color:var(--gold)} .pinkc{color:var(--pink)}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* buttons */
.btn{background:var(--gold);color:var(--gold-ink);border:0;border-radius:6px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible,.choice:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.pink{background:var(--pink);color:var(--white)}
.btn.cyan{background:var(--cyan);color:var(--gold-ink)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.big{padding:14px 26px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

input[type=text],select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:60px}
input[type=text]{width:100%}

/* cards */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card.span{grid-column:1/-1}
.card h2{font-size:20px}
.section{display:flex;flex-direction:column;gap:14px;padding-block:18px 8px}
.section > h2{font-size:26px}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.pill.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.pill.pink{background:var(--pink);color:var(--white);border-color:var(--pink)}
.pill.good{color:var(--good);border-color:var(--good);background:transparent}
.pill.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.pill.cyan{color:var(--cyan);border-color:var(--cyan);background:transparent}
.meter{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:4px}
.meter.pink i{background:var(--pink)} .meter.good i{background:var(--good)} .meter.cyan i{background:var(--cyan)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.kv div b{display:block;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.list > *{padding-block:10px;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.empty{color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:8px;text-align:center}

/* HUD */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
.hud{display:grid;grid-template-columns:auto 1fr auto auto;gap:18px;align-items:center;padding-block:10px}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.stage{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.sub{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.stats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.stat span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.energy{width:150px}
.energy .label{display:flex;justify-content:space-between}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.badge{display:inline-block;min-width:18px;padding:1px 5px;border-radius:999px;background:var(--pink);color:var(--white);font-family:var(--body);font-size:10px;font-weight:800;margin-left:4px;vertical-align:2px}
main.wrap{padding-block:6px 60px}

/* avatar */
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;font-family:var(--display);color:var(--white);border:2px solid var(--gold)}

/* setup */
.hero{padding-block:40px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hero h1{font-size:clamp(56px,13vw,132px);line-height:.88;letter-spacing:.01em;background:linear-gradient(100deg,var(--gold) 0%,var(--pink) 55%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:60ch;color:var(--muted);font-size:16px}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr))}
.choice{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.choice:hover{border-color:var(--muted)}
.choice.on{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 1px var(--gold) inset}
.choice b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;font-weight:400}
.choice small{color:var(--muted);font-size:12px}
.choice .perk{color:var(--gold);font-size:12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;color:var(--fg)}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.row > .field{flex:1 1 200px}
.upload{display:flex;gap:14px;align-items:center}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* songs */
.song{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.grade{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--panel2);border:1px solid var(--line)}
.g-S{color:var(--gold);border-color:var(--gold)} .g-A{color:var(--pink);border-color:var(--pink)} .g-B{color:var(--cyan)} .g-C{color:var(--good)} .g-D,.g-F{color:var(--dim)}
.song-title{font-weight:800}
.feat{color:var(--pink);font-weight:700}
.song-meta{font-size:12px;color:var(--muted)}
.song-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cover{aspect-ratio:1;max-width:100%;border-radius:6px;display:flex;align-items:flex-end;padding:10px;font-family:var(--display);text-transform:uppercase;font-size:18px;line-height:1;color:var(--white);text-shadow:0 1px 6px rgba(0,0,0,.4)}
.albums{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr))}
.chk{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--bg2);color:var(--fg);text-align:left}
.chk.on{border-color:var(--gold)}
.chk .box{width:16px;height:16px;border-radius:3px;border:2px solid var(--muted);flex:none}
.chk.on .box{background:var(--gold);border-color:var(--gold)}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.me td{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.pos{font-family:var(--display);font-size:18px;width:34px}
.mv-up{color:var(--good)} .mv-dn{color:var(--bad)} .mv-new{color:var(--cyan);font-weight:800;font-size:10px}


/* phone */
.phonewrap{display:flex;justify-content:center}
.phone{width:100%;max-width:420px;background:#050407;border:1px solid var(--line);border-radius:38px;padding:9px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.pscreen{border-radius:30px;overflow:hidden;height:min(760px,calc(100svh - 120px));min-height:560px;display:flex;flex-direction:column;position:relative;color:#fff;background:radial-gradient(120% 70% at 20% 0%,#5a2a8a 0%,transparent 60%),radial-gradient(90% 60% at 100% 100%,#0b5563 0%,transparent 60%),#0d0a14}
.pscreen.in-app{background:#000}
.pscreen.app-streamify{background:#121212}.pscreen.app-tunes{background:#1c1c1e}.pscreen.app-tube{background:#0f0f0f}.pscreen.app-chirp{background:#000}.pscreen.app-buzz{background:#14110a}
.psb{display:flex;justify-content:space-between;align-items:center;padding:9px 22px 4px;font-size:12px;font-weight:800;font-family:var(--mono)}
.psb .notch{width:90px;height:22px;background:#000;border-radius:14px;border:1px solid #222}
.pclock{text-align:center;padding:14px 0 4px;display:flex;flex-direction:column}
.pclock b{font-size:56px;font-weight:300;letter-spacing:-.02em;line-height:1}
.pclock span{font-size:13px;opacity:.8}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:18px 12px}
.appic{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;cursor:pointer;font-size:11px;font-weight:700;position:relative;font-family:var(--body)}
.appic i{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-style:normal;font-size:26px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.appic:active i{transform:scale(.92)}
.appic .bdg{position:absolute;top:-5px;right:calc(50% - 36px);background:#ff3b30;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:800;min-width:18px}
.phone-on #app>.top{position:relative;top:auto}
.pthumb{width:44px;height:44px;object-fit:cover;border-radius:8px}
.ptile img,.thumb img,.tokcard img{object-fit:cover}
.thumb{overflow:hidden}.thumb img{position:absolute;inset:0;width:100%;height:100%}.thumb>span{position:relative;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cimg{width:100%;border-radius:12px;max-height:420px;object-fit:cover}
.artsel{max-width:120px;font-size:12px}
.crow .art{width:34px;height:34px}
.pwidget{margin:auto 14px 16px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.abar{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.abar b{font-size:17px;flex:1}
.abar .back{background:none;border:0;color:#0a84ff;font-weight:700;cursor:pointer;font-size:14px;padding:4px 2px;font-family:var(--body)}
.dlogo{font-size:22px;font-weight:900}
.abody{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.abody>*{flex-shrink:0}
.abody h3{font-size:17px;margin-top:4px}
.anav{display:flex;justify-content:space-around;border-top:1px solid rgba(255,255,255,.1);padding:8px 4px 12px;background:rgba(0,0,0,.6)}
.anav button{background:none;border:0;color:#fff;opacity:.5;font-size:10px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--body)}
.anav button span{font-size:19px;line-height:1}
.anav button.on{opacity:1}
.app-tunes .anav button.on{color:#fc3c5f}.app-streamify .anav button.on{color:#1ed760}.app-tube .anav button.on{color:#ff0033}.app-chirp .anav button.on{color:#1d9bf0}.app-tok .anav button.on{color:#25f4ee}
.pcard{background:rgba(255,255,255,.06);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.abody .post{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
.abody .post[data-a]{cursor:pointer}
.abody input[type=text],.abody textarea,.abody select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#fff}
.abody .kv{grid-template-columns:1fr 1fr}
.vbadge{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:10px;font-weight:900;vertical-align:middle}
/* insta */
.stories{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:#fff;font-size:11px;cursor:pointer;flex:none}
.ring{display:inline-block;padding:2px;border-radius:50%;background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4)}
.ring>*{display:block;border:2px solid #000;border-radius:50%}
.iprof{display:flex;align-items:center;gap:16px}
.iprof .pstats{display:flex;gap:14px;flex:1;justify-content:space-around;text-align:center}
.iprof .pstats b{display:block;font-size:17px}
.iprof .pstats span{font-size:11px;opacity:.7}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.gt{aspect-ratio:1/1;border:0;position:relative;overflow:hidden;cursor:pointer;color:#fff;font-family:var(--display);text-transform:uppercase;font-size:12px;display:flex;align-items:flex-end;padding:6px;text-align:left}
.igrid.tall .gt{aspect-ratio:3/4}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gt span{position:relative;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.gt em{position:absolute;top:5px;right:6px;font-style:normal;font-family:var(--body);font-size:11px;font-weight:800}
.act-i{background:none;border:0;border-bottom:1px solid rgba(255,255,255,.06);color:#fff;text-align:left;padding:8px 2px;cursor:pointer;font-size:13px;font-family:var(--body)}
/* chirp */
.trend{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
/* tok */
.tokcard{position:relative;aspect-ratio:9/14;border-radius:14px;overflow:hidden;display:flex;align-items:flex-end}
.tokcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.tokside{position:absolute;right:8px;bottom:90px;display:flex;flex-direction:column;gap:14px;font-size:22px;text-align:center}
.tokside b{display:block;font-size:11px}
.tokcap{position:relative;padding:14px 60px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));width:100%;font-size:13px;display:flex;flex-direction:column;gap:3px}
/* tube */
.yt{background:none;border:0;color:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:0;font-family:var(--body)}
.thumb{aspect-ratio:16/9;border-radius:12px;display:flex;align-items:flex-end;padding:10px;font-family:var(--display);text-transform:uppercase;font-size:20px;position:relative;width:100%}
.thumb em{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);font-style:normal;font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px}
.ytm{display:flex;gap:10px;align-items:flex-start}
.ytm>span{display:flex;flex-direction:column;gap:2px;font-size:13px}
.ytban{height:80px;border-radius:12px}
/* streaming */
.dban{margin:-12px -12px 0;height:230px;position:relative;display:flex;align-items:flex-end;overflow:hidden}
.dban>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.dban .dfig{position:absolute;top:24px;left:50%;transform:translateX(-50%)}
.dname{position:relative;padding:14px;display:flex;flex-direction:column;background:linear-gradient(transparent,rgba(0,0,0,.7));width:100%}
.dname b{font-size:40px;font-weight:900;line-height:1.05;letter-spacing:-.02em;font-family:var(--body)}
.dname span,.dname small{font-size:13px;opacity:.85}
.dplay{margin-left:auto;width:52px;height:52px;border-radius:50%;border:0;font-size:20px;cursor:pointer;font-weight:900}
.trk{display:flex;align-items:center;gap:10px;font-size:13px}
.trk .n{width:20px;text-align:right;opacity:.6;font-family:var(--mono)}
.trk .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.trk .tt b,.trk .tt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .tt small{opacity:.65}
.trk.me{background:rgba(255,255,255,.08);border-radius:8px;padding:4px;border-left:3px solid var(--c)}
.art{border-radius:4px;flex:none;display:inline-block;object-fit:cover}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.disc{flex:none;width:120px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.disc img,.disc>span,.disc .art{width:120px;height:120px;border-radius:6px;object-fit:cover;display:flex;align-items:flex-end;padding:6px;font-family:var(--display);text-transform:uppercase;font-size:13px}
.disc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.disc small{opacity:.65}
.plc{flex:none;width:130px;background:none;border:0;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;font-family:var(--body);font-size:12px}
.plc span{height:130px;border-radius:6px;display:flex;align-items:flex-end;padding:8px;font-weight:900;font-size:15px}
.plrow{display:flex;gap:10px;align-items:center;background:none;border:0;color:#fff;text-align:left;cursor:pointer;padding:6px;border-radius:8px;font-family:var(--body)}

function releaseOutcome(q,kind,title){

function npcWeek(){
  S.npcs.forEach(n=>{
    if(Math.random()<.07){n.single=songTitle();n.age=0}else n.age++;
    if(Math.random()<.025){n.album=albumTitle();n.albAge=0}else n.albAge++;
    n.power=Math.max(80000,Math.round(n.power*rnd(.97,1.035)));
    n.week=Math.round(n.power*(.45+.55*Math.pow(.9,n.age))*rnd(.85,1.15));
    n.alb=Math.round(n.power*.006*(.35+.65*Math.pow(.82,n.albAge))*rnd(.8,1.2));
  });
}
function computeCharts(){
  const prevS={},prevA={};
  (S.charts.s||[]).forEach((e,i)=>prevS[e.key]=i+1);(S.charts.a||[]).forEach((e,i)=>prevA[e.key]=i+1);
  const es=S.npcs.map(n=>({key:n.name+'|'+n.single,title:n.single,artist:n.name,v:n.week}));
  (S.rivals||[]).forEach(r=>es.push({key:'r'+r.id+'|'+r.single,title:r.single,artist:r.name,v:r.week,rival:r.id}));
  S.songs.filter(s=>s.status==='released'&&s.week>0).forEach(s=>es.push({key:'me|'+s.id,title:s.title,artist:S.stage+(s.feat?' ft. '+s.feat:''),v:s.week,me:s.id}));
  es.sort((a,b)=>b.v-a.v);
  S.charts.s=es.slice(0,20).map((e,i)=>({...e,last:prevS[e.key]||null}));
  const ea=S.npcs.map(n=>({key:n.name+'|'+n.album,title:n.album,artist:n.name,v:n.alb}));
  S.albums.filter(a=>a.week>0).forEach(a=>ea.push({key:'me|'+a.id,title:a.title,artist:S.stage,v:a.week,me:a.id}));
  ea.sort((a,b)=>b.v-a.v);
  S.charts.a=ea.slice(0,10).map((e,i)=>({...e,last:prevA[e.key]||null}));
  S.charts.s.forEach((e,i)=>{if(!e.me)return;const s=S.songs.find(x=>x.id===e.me);const p=i+1;
    if(!s.peak||p<s.peak)s.peak=p;
    if(S.stats.maxPeak===null||p<S.stats.maxPeak)S.stats.maxPeak=p;
    if(p===1&&!s.wasOne){s.wasOne=true;S.stats.ones++;log(`"${s.title}" hits #1 on the Hot 20!`,'big');setMood('grin',6);S.hype=clamp(S.hype+25,0,100);addFans(S.fans*.03)}
    else if(!e.last&&s.peak===p)log(`"${s.title}" debuts on the Hot 20 at #${p}.`,'good');
  });
  S.charts.a.forEach((e,i)=>{if(!e.me)return;const a=S.albums.find(x=>x.id===e.me);const p=i+1;
    if(!a.peak||p<a.peak)a.peak=p;
    if(p===1&&!a.wasOne){a.wasOne=true;S.stats.albumOnes++;log(`"${a.title}" is the #1 album in the world.`,'big')}
  });
}

function awards(){
  const y=year()-1,from=S.t-52;

  if(!S.stats.bna&&S.fans>=50000&&y<=3)noms.push({cat:'Best New Artist',ch:clamp(S.fans/2e6,.2,.8),bna:true});
  const best=rel.filter(s=>s.peak).sort((a,b)=>a.peak-b.peak)[0];
  if(best&&best.peak<=10)noms.push({cat:'Song of the Year',work:best.title,ch:clamp((11-best.peak)/10*.55+best.q/400,.1,.85)});
  const alb=S.albums.filter(a=>a.rel>=from).sort((a,b)=>b.sales-a.sales)[0];
  if(alb&&(alb.sales>=150000||(alb.critic||0)>=85))noms.push({cat:'Album of the Year',work:alb.title,ch:clamp(alb.sales/3e6+alb.q/300+(alb.critic||0)/400,.1,.9)});
  if(S.stats.yearTour>=1e6)noms.push({cat:'Best Live Act',ch:clamp(S.stats.yearTour/5e7,.15,.85)});
  const g=rel.filter(s=>s.q>=70&&s.peak&&s.peak<=20).sort((a,b)=>b.q-a.q)[0];
  if(g)noms.push({cat:`Best ${S.genre} Performance`,work:g.title,ch:clamp(g.q/120,.2,.8)});
  {const bmv=rel.filter(s=>s.mv>=70).sort((a,b)=>b.mv-a.mv)[0];if(bmv)noms.push({cat:'Best Music Video',work:bmv.title,ch:clamp(bmv.mv/130,.2,.8)});const fb=fycBonus();noms.forEach(n=>n.ch=clamp(n.ch+fb,0,.95));S.fyc=0}
  S.stats.yearTour=0;
  if(!noms.length){log(`Golden Mic Awards (Year ${y}): no nominations this time.`);return}
  let wins=0;
  noms.forEach(n=>{n.won=Math.random()<n.ch;if(!n.won){const rv=S.rivals.filter(r=>r.fans>S.fans*.4).sort((a,b)=>b.fans-a.fans)[0];if(rv&&Math.random()<.6){n.to=rv.name;rv.heat=clamp(rv.heat+10,0,100);rv.l++}else n.to=pick(S.npcs.slice(0,8)).name}if(n.bna)S.stats.bna=true;if(n.won){wins++;S.stats.awards.push({y,cat:n.cat,work:n.work||''});addFans(S.fans*.03);S.hype=clamp(S.hype+20,0,100)}});
  UI.scene={k:'awards',cap:'Golden Mic Awards · Year '+y,pose:wins?'trophy':'idle'};setMood(wins?'grin':'sad',6);
  log(`Golden Mic Awards (Year ${y}): ${noms.length} nomination${noms.length>1?'s':''}, ${wins} win${wins===1?'':'s'}.`,wins?'big':'');
  openModal(`Golden Mic Awards · Year ${y}`,`<p class="muted">The envelopes are open. Here is how ${esc(S.stage)} did.</p><div class="list">${noms.map(n=>`<div class="between"><div><b>${esc(n.cat)}</b>${n.work?`<div class="muted">"${esc(n.work)}"</div>`:''}</div>${n.won?'<span class="pill gold">Winner</span>':`<span class="pill">Lost to ${esc(n.to||'')}</span>`}</div>`).join('')}</div><button class="btn" data-a="closeModal">${wins?'Thank everyone in your speech':'Clap politely'}</button>`);
}

function writeSong(bonus=0,feat=null){
  const theme=$('#song-theme')?.value||pick(THEMES);
  let title=($('#song-title')?.value||'').trim()||songTitle();
  const tempo=$('#song-tempo')?.value||pick(TEMPOS),inst=$('#song-inst')?.value||pick(INSTS),fit=GFIT[S.genre]||[];if(fit[0]===tempo)bonus+=3;if(fit[1]===inst)bonus+=3;if(S.breakupBoost&&!feat){bonus+=8;S.breakupBoost=0}if(S.mentor&&S.mentor.until>S.t)bonus+=3;
  const s={id:S.nextId++,title,theme,tempo,inst,lyric:pick(LYR[theme]||LYR.Love),q:songQuality(bonus+(feat?0:(()=>{const b=S.oppBonus||0;S.oppBonus=0;return b})())),status:'demo',streams:0,week:0,peak:null,mv:0,mvViews:0,mvWeek:0,album:null};
  S.songs.unshift(s);S.stats.written++;

}
function releaseSingle(s){

}

/* ============ live ============ */
function merchAtShow(att){
  let total=0,n=0;
  const items=MERCH.filter(m=>S.merch[m.id]&&S.merch[m.id].stock>0);
  if(!items.length)return {total:0,n:0};
  const buyers=att*.12;const w=sum(items,m=>m.appeal);
  items.forEach(m=>{const st=S.merch[m.id];const k=Math.min(st.stock,Math.round(buyers*m.appeal/w));st.stock-=k;st.sold+=k;total+=k*m.price;n+=k});
  S.stats.merch+=n;return {total,n};
}
function playVenue(v){
  const sc=showScore();
  const gm=(S.staff.manager?1.15:1)*(S.origin==='garage'?1.25:1);
  if(v.id==='openmic'){const g=addFans(ri(5,30)*(sc/40)+S.fans*.002);S.skills.performance=Math.min(100,S.skills.performance+.5);return {att:ri(15,60),cap:0,gross:0,net:0,fans:g,sc,merch:0}}
  const demand=S.fans*.25*(1+S.hype/100)*popFactor()/(1+S.recentGigs*.3)*rnd(.75,1.25)*(eraFx().demand||1)*TIX[S.ticket||'fair'].d;
  const att=Math.min(v.cap,Math.round(demand));
  const gross=Math.round(att*v.price*TIX[S.ticket||'fair'].p);
  const m=merchAtShow(att);
  const net=Math.round(gross*.65*gm-v.fixed+m.total);
  const g=addFans(att*(.05+sc/400)+ri(1,8));
  S.recentGigs++;
  return {att,cap:v.cap,gross,net,fans:g,sc,merch:m.total};
}
function review(sc){return sc>=85?'Show of the year':sc>=70?'Electric':sc>=55?'Solid set':sc>=40?'Shaky but charming':'Rough night'}
function runTour(T){
  const pf=popFactor(),hm=1+S.hype/100,sc=showScore();const OF=T.id==='busk'?{dm:1,cost:0}:openerFx();
  let costM=1;if(S.staff.tourmgr)costM*=.8;if(has('bus'))costM*=.8;else if(has('van')&&(T.id==='club'||T.id==='theater'))costM*=.85;if(has('jet')&&T.id==='world')costM*=.7;
  const cost=Math.round(T.cost*costM)+(OF.cost||0);
  if(S.energy<40){toast('You need at least 40 energy to start a tour.');return}
  if(S.money<cost){toast(`You need ${cash(cost)} to book this tour.`);return}
  S.money-=cost;S.energy=0;S.lastGig=S.t+T.weeks;
  const pool=T.id==='busk'?BUSK_TOWNS:T.id==='world'?CITIES.world:T.id==='arena'?CITIES.na.slice(0,12).concat(CITIES.world.slice(0,10)):CITIES.na;
  const start=ri(0,pool.length-1);
  const shows=[];let gross=0,fans=0,merch=0,sold=0;
  for(let i=0;i<T.shows;i++){
    const city=pool[(start+i)%pool.length];
    if(T.id==='busk'){
      const tips=Math.round(rnd(30,120)*(1+S.skills.performance/50)*(S.origin==='busker'?1.5:1)*(1+Math.min(S.fans,20000)/4000));
      const f=Math.round(ri(10,60)*(1+S.skills.performance/40));
      shows.push({city,att:ri(20,140),cap:0,gross:tips});gross+=tips;fans+=f;continue;
    }
    const demand=S.fans*1.4*hm*pf/T.shows*rnd(.7,1.3)*(S.staff.tourmgr?1.1:1)*(eraFx().demand||1)*OF.dm*TIX[S.ticket||'fair'].d*cityLoyalty(city)*(S.farewell?1.5:1);
    const att=Math.min(T.cap,Math.round(demand));const g=Math.round(att*T.price*TIX[S.ticket||'fair'].p);
    const m=merchAtShow(att);
    if(att>=T.cap)sold++;
    shows.push({city,att,cap:T.cap,gross:g});gross+=g;merch+=m.total;fans+=att*(.04+sc/500);
  }
  const gm=(S.staff.manager?1.15:1)*(S.origin==='garage'?1.25:1);
  if(T.id!=='busk'){const seen={};S.lastRoute=shows.filter(x=>CITY[x.city]&&!seen[x.city]&&(seen[x.city]=1)).map(x=>({city:x.city,att:x.att,cap:x.cap}));S.lastRoute=orderRoute(S.lastRoute);S.lastRouteName=T.name;shows.forEach(x=>{if(CITY[x.city])cityPlay(x.city,x.att)})}
  const take=Math.round(T.id==='busk'?gross:gross*.7*gm);
  for(let w=0;w<T.weeks;w++){nextWeek(true);S.health=clamp(S.health-(has('bus')?2.5:5),0,100);S.members.forEach(m=>m.morale=clamp(m.morale-2,0,100))}
  S.money+=Math.round((take+merch)*(1-cut360()));
  const gained=addFans(fans);
  S.hype=clamp(S.hype+(sold===T.shows?30:15),0,100);
  if(sold===T.shows&&T.id!=='busk'){S.members.forEach(m=>m.morale=clamp(m.morale+12,0,100));S.happy=clamp(S.happy+10,0,100)}
  S.stats.tours++;S.stats.gigs+=T.shows;if(OF.after)OF.after();if(S.kids)S.happy=clamp(S.happy-6*S.kids,0,100);S.stress=clamp((S.stress||0)+T.weeks*4,0,100);noteShow(T.shows);if(['theater','arena','world'].includes(T.id))S.stats.bigTours++;S.stats.tourGross+=gross;S.stats.yearTour+=gross;S.lastGig=S.t;
  if(T.id==='arena'&&sold>0)S.stats.soldOutArena+=sold;
  if(T.id==='world')S.stats.worldTours++;
  S.energy=Math.round(maxEnergy()*.4);
  S.shows.unshift({t:S.t,name:T.name,att:sum(shows,s=>s.att),cap:T.cap*T.shows,net:take+merch-cost});S.shows=S.shows.slice(0,15);
  log(`${T.name} wrapped: ${T.shows} shows, ${T.id==='busk'?'':sold+' sold out, '}${cash(gross)} gross, +${fmt(gained)} fans.`,'big');
  checkAch();save();
  const rows=shows.map(s=>`<tr><td>${esc(s.city)}</td><td class="n">${fmt(s.att)}${s.cap?' / '+fmt(s.cap):''}</td><td>${s.cap?(s.att>=s.cap?'<span class="pill gold">Sold out</span>':Math.round(s.att/s.cap*100)+'%'):'<span class="muted">tips</span>'}</td><td class="n">${cash(s.gross)}</td></tr>`).join('');
  openModal(`${T.name} wrapped`,`<div class="kv"><div><span class="label">Gross</span><b>${cash(gross)}</b></div><div><span class="label">Your take</span><b class="good">${cash(take)}</b></div><div><span class="label">Merch</span><b>${cash(merch)}</b></div><div><span class="label">Costs</span><b class="bad">-${cash(cost)}</b></div><div><span class="label">New fans</span><b class="goldc">+${fmt(gained)}</b></div>${T.id!=='busk'?`<div><span class="label">Sellouts</span><b>${sold}/${T.shows}</b></div>`:''}</div>${T.id!=='busk'?`<div class="mapwrap">${mapSVG({route:S.lastRoute,fests:false})}</div>`:''}<div class="tbl-wrap"><table><thead><tr><th>City</th><th class="n">Crowd</th><th></th><th class="n">Gross</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted">${T.weeks} weeks passed on the road. Health took a hit.</p><button class="btn" data-a="closeModal">Home sweet home</button>`);
  if(S.farewell){S.farewell=0;retireCareer()}
}

  if(type.beef){const n=pick(S.npcs.slice(4));cap=`@${n.name.replace(/\s+/g,'')} ${cap}`;if(Math.random()<.42+S.skills.charisma/300){addFans(S.fans*.04);S.hype=clamp(S.hype+20,0,100);extra=`The internet sided with you over ${n.name}.`}else{S.fans-=S.fans*.02*(S.staff.publicist?.5:1);S.happy=clamp(S.happy-10,0,100);extra=`${n.name} clapped back hard. You lost some fans.`;if(S.era.id!=='hate'&&Math.random()<.6)setEra('hate',`You lost a public beef with ${n.name}.`)}}
  const likes=Math.round(reach*rnd(.25,.55));const newF=Math.round(reach*rnd(.03,.08));
  const sat=clamp(1-acc.f/(S.fans*P.ratio*4+5000),.05,1);acc.f+=Math.round(newF*sat);addFans(reach*rnd(.005,.015));S.hype=clamp(S.hype+type.h*(viral?3:1),0,100);
  if(k==='tube')S.money+=Math.round(reach*2*.0015);
  const ncom=viral?4:ri(1,3);const comments=[];for(let i=0;i<ncom;i++)comments.push({u:'@'+pick(HANDLES)+pick(HANDLE2)+ri(1,99),x:pick(COMMENTS).replace('{stage}',S.stage).replace('{fandom}',S.fandom)});
  acc.posts.unshift({id:S.nextId++,type:type.id,label:type.l,cap,likes,views:Math.round(reach*rnd(1.5,3)),shares:Math.round(likes*rnd(.02,.1)),comments,t:S.t,viral,song:song?song.title:'',songId:song?song.id:null,img:UI.postImg||null,hue:ri(0,359)});UI.postImg=null;
  acc.posts=acc.posts.slice(0,40);
  S.stats.posts++;S.era.prog.posts=(S.era.prog.posts||0)+1;
  if(type.apology&&S.era.id==='hate'){S.era.prog.apology=1;extra='The apology is landing better than expected.'}
  else if(S.era.id==='hate'&&Math.random()<.35){const l=S.fans*.012;S.fans-=l;extra+=` The hate train flooded your replies (-${fmt(l)} fans).`}
  if(capIn)capIn.value='';
  if(viral)log(`Your ${P.name} post went viral (+${fmt(newF)} followers).`,'big');
  toast(viral?`VIRAL! +${fmt(newF)} followers on ${P.name}.`:`Posted. ${fmt(likes)} likes, +${fmt(newF)} followers.`+(extra?' '+extra:''));
  if(extra&&viral)toast(extra);
  if(bigBreak)breakout(`Your ${P.name} post`,song);
}

function spark(){
  const h=S.history.slice(-104);if(h.length<2)return '<div class="empty">Your fan graph starts after your first week.</div>';
  const max=Math.max(...h.map(x=>x.fans),1);const W=300,H=70;
  const pts=h.map((x,i)=>[i/(h.length-1)*W,H-4-(x.fans/max)*(H-10)]);
  const line=pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Fans over time"><line x1="0" y1="${H-4}" x2="${W}" y2="${H-4}" stroke="var(--line)" stroke-width="1"/><polygon points="0,${H-4} ${line} ${W},${H-4}" fill="var(--gold)" fill-opacity=".14"/><polyline points="${line}" fill="none" stroke="var(--gold)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--gold)"/></svg>`;
}

  if(s.status==='released'&&!s.remixed)acts+=`<button class="btn sm ghost" data-a="remix" data-id="${s.id}">Remix</button>`;

function postHTML(p,k,mine){
  const P=PLAT[k];
  const head=`<div class="ph">${mine?avatar(34,S):npcAv(p.who,34)}<div><b>${esc(mine?S.stage:p.who)}</b> <small>@${esc((mine?S.stage:p.who).replace(/\s+/g,'').toLowerCase())} · ${S.t-p.t<=0?'this week':(S.t-p.t)+'w ago'}</small></div></div>`;
  if(!mine)return `<div class="post">${head}<div>${esc(p.text)}</div><div class="acts"><button class="likebtn ${p.liked?'on':''}" data-a="like" data-id="${p.id}">♥ ${fmt(p.likes)}</button><span>${PLAT[p.plat].name}</span></div></div>`;
  let media='';
  const tileBg=`background:linear-gradient(150deg,hsl(${p.hue||S.hue} 75% 50%),hsl(${(p.hue||S.hue)+80} 70% 22%))`;
  const pimg=postImg(p);
  if(k==='chirp'&&pimg)media=`<img class="cimg" src="${pimg}" alt="">`;
  if(k!=='chirp'){
    const useAv=!pimg&&S.avatar&&(p.type==='selfie'||p.type==='flex'||p.type==='vlog');
    const song=p.mvSong?S.songs.find(s=>s.id===p.mvSong):null;
    const txt=p.type==='mv'?(song?song.title:'Music video'):p.song||p.label;
    media=`<div class="ptile ${P.shape}" style="${tileBg}">${pimg?`<img src="${pimg}" alt="">`:useAv?`<img src="${S.avatar}" alt="">`:''}${p.img&&pimg?'':`<span>${esc(txt)}</span>`}</div>`;
  }
  const song=p.mvSong?S.songs.find(s=>s.id===p.mvSong):null;
  const views=song?song.mvViews:p.views;
  const stats=k==='chirp'?`<span>♥ ${fmt(p.likes)}</span><span>↻ ${fmt(p.shares)}</span><span>${fmt(p.views)} views</span>`:k==='tube'?`<span>${fmt(views)} views</span>${song?'':`<span>♥ ${fmt(p.likes)}</span>`}`:k==='tok'?`<span>▶ ${fmt(p.views)}</span><span>♥ ${fmt(p.likes)}</span><span>↗ ${fmt(p.shares)}</span>`:`<span>♥ ${fmt(p.likes)}</span><span>${p.comments.length} comments</span>`;
  return `<div class="post">${head}${p.viral?'<span class="viral">Viral</span>':''}${media}<div>${esc(p.cap)}</div><div class="acts">${stats}<span class="dim">${esc(p.label)}</span></div>${p.comments&&p.comments.length?`<div class="cmts">${p.comments.map(c=>`<div><b>${esc(c.u)}</b> ${esc(c.x)}</div>`).join('')}</div>`:''}</div>`;
}

      openModal(won?'Chart battle won':'Chart battle lost',`<p>${esc(txt)}</p><button class="btn" data-a="closeModal">${won?'Victory lap':'Next time'}</button>`)}
  }
  let done=false;
  S.rivals.forEach(rv=>{
    rv.q=Math.min(92,rv.q+.22);
    const ratio=rv.fans/(S.fans+200);let g=ratio>2.5?rv.fans*rnd(-.012,.002):rv.fans*rnd(.003,.014);if(rv.fans<S.fans*.6)g+=(S.fans*.6-rv.fans)*.06;
    rv.fans=Math.min(4e8,rv.fans+g);rv.age++;
    if(Math.random()<.14){rv.single=songTitle();rv.age=0;if(Math.random()<rv.q/130)rv.fans*=1.06;
      if(S.t-S.lastRelease<=1&&!S.battle&&Math.random()<.5){const last=S.songs.filter(x=>x.status==='released').sort((a,b)=>b.rel-a.rel)[0];if(last){S.battle={rid:rv.id,sid:last.id,t:S.t};const t=`${rv.name} dropped "${rv.single}" the same week as your "${last.title}". Chart battle! Results next week.`;log(t,'big');rep.ev.push(t)}}}
    rv.week=Math.round(rv.fans*rnd(2,3.6)*(.4+.6*Math.pow(.85,rv.age)));
    if(!rv.truce)rv.heat=clamp(rv.heat-1.5,0,100);
    if(!done&&Math.random()<(rv.truce?.025:.04+rv.heat/900)){done=true;rivalEvent(rv,rep)}
  });
}
function rivalEvent(rv,rep){

    ()=>{S.hype=clamp(S.hype-6,0,100);rv.heat=clamp(rv.heat+5,0,100);return `${rv.name} grabbed the festival slot you were in talks for. Hype -6.`},
    ()=>{const l=rv.fans*.08;rv.fans-=l;const g=addFans(Math.min(S.fans*.02,l*.2)+20);return `${rv.name} is caught up in a scandal. Some of their fans switched to you (+${fmt(g)}).`},
    ()=>{const k=Object.keys(S.staff);if(!k.length)return null;const id=pick(k);delete S.staff[id];rv.heat=clamp(rv.heat+12,0,100);return `${rv.name} poached your ${STAFF.find(x=>x.id===id).name.toLowerCase()} with a bigger paycheck.`},
    ()=>{rv.fans*=1.05;return `${rv.name}'s new video is everywhere. They had a big week.`},
    ()=>{if(rv.heat>25)return null;choice('rivaltruce',rv.id);return `${rv.name} reached out about burying the hatchet.`},
  ];
  let t=null;for(let i=0;i<6&&!t;i++)t=pick(opts)();

}
function shadeRival(r){
  S.stats.posts++;

  const l=S.fans*.015*(S.staff.publicist?.5:1);S.fans-=l;r.l++;r.heat=clamp(r.heat+12,0,100);S.happy=clamp(S.happy-6,0,100);
  if(S.era.id!=='hate'&&Math.random()<.35)setEra('hate',`You lost a public feud with ${r.name}.`);
  log(`${r.name} won the Chirp war.`,'bad');setMood('sad',4);return `${r.name} clapped back harder. -${fmt(l)} fans.`;
}
function makeDiss(r){const s={id:S.nextId++,title:`${pick(['Snake','Receipts','Fraud','Copycat','Smoke','Paper Crown','Last Word'])} (${r.name} Diss)`,theme:'Rebellion',q:songQuality(4),status:'recorded',streams:0,week:0,peak:null,mv:0,mvViews:0,mvWeek:0,album:null,diss:r.id};S.songs.unshift(s);S.stats.written++;r.heat=clamp(r.heat+10,0,100);return s}
function dissResult(s,rc){const r=RV(s.diss);if(!r)return;

function choice(key,x){const D=DRAMA[key];if(D.label&&!S.contract)return false;if(D.ok&&!D.ok(x))return false;openModal(D.t,`<p>${D.b(x)}</p><div class="stack">${D.opts.map((o,i)=>`<button class="btn ${o.cls||'ghost'}" data-a="choose" data-k="${key}" data-o="${i}" data-x="${x??''}">${o.l}</button>`).join('')}</div>`);return true}
const cr=(v)=>{if(S.contract)S.contract.rel=clamp(S.contract.rel+v,0,100)};
const DRAMA={

    {l:'Ignore it',f:x=>{const r=RV(x);r.heat=clamp(r.heat-8,0,100);S.happy=clamp(S.happy-4,0,100);return 'You stayed quiet. Some fans called it classy, some called it weak.'}}]},
  rivaltruce:{t:'Peace offering',b:x=>`${esc(RV(x).name)}'s team says they want to bury the hatchet.`,opts:[

    {l:'Decline',f:x=>{const r=RV(x);r.heat=clamp(r.heat+10,0,100);return 'You turned them down. The rivalry continues.'}}]},
  rivalcollab:{t:'Collab with a former rival?',b:x=>`${esc(RV(x).name)} wants you on their next single. The internet would lose it.`,opts:[

    {l:'Fight it',cls:'',f:()=>{if(Math.random()<.4+S.skills.charisma/250+(S.staff.manager?.15:0)){cr(-5);return 'You fought it and won. No delay.'}S.contract.shelf=S.t+12;cr(-15);S.hype=clamp(S.hype-10,0,100);return 'You lost. Now albums are shelved for 12 weeks and the label is annoyed.'}},

  rebrand:{label:1,t:'Image makeover',b:()=>`${esc(S.contract.name)} wants a total image makeover. New look, new sound, new you.`,opts:[

function labelWeek(rep){
  const c=S.contract;if(!c)return;c.rel??=60;
  if(c.rel<15){log(`${c.name} dropped you from the label.`,'bad');rep.ev.push(`Dropped by ${c.name}`);S.contract=null;S.hype=clamp(S.hype-10,0,100);S.happy=clamp(S.happy-15,0,100);openModal('Dropped',`<p>${esc(c.name)} ended your contract. You keep what you earned, but you are on your own again.</p><button class="btn" data-a="closeModal">Go independent</button>`);return}
  if(c.rel>85&&Math.random()<.1)c.promo=+(c.promo+.05).toFixed(2);
  if(Math.random()>.09)return;
  const keys=['shelve','hitmaker','favorite','rebrand','royalty','exec','leak','crossover'];
  for(let i=0;i<6;i++){const k=pick(keys);let x=null;if(k==='favorite'||k==='crossover')x=pick(S.rivals).id;if(k==='leak'){const u=S.songs.filter(s=>s.status==='recorded');if(!u.length)continue;x=pick(u).id}
    if(choice(k,x)){rep.ev.push('Label drama: '+DRAMA[k].t);log('Label drama: '+DRAMA[k].t+'.','bad');return}}
}

  S.vice=clamp((S.vice||0)-2,0,100);
  if(ds)bump('loyalty',Math.max(-6,Math.min(4,ds*TIX[S.ticket||'fair'].l*.5)));
  if(S.era.id!=='hiatus'&&!S.retired){if(S.stress>=90)choice('burnout');else if(S.vice>=70)choice('vice')}

  if(S.ownLabel){const L=S.ownLabel;L.roster.forEach(a=>{a.fans=Math.round(a.fans*rnd(1,1.02));a.q=Math.min(95,a.q+.1);if(Math.random()<.1)labelActRelease(a);const inc=a.fans*.006;earn(r,'Your label',inc);L.earned+=inc})}
  Object.keys(S.biz).forEach(id=>{const b=BIZ.find(x=>x.id===id);const v=S.fans*b.rate*rnd(.4,1.6)*((S.loyalty||50)/60)-b.cost*.002;S.biz[id].total+=v;earn(r,b.n,v)});

  else if(S.level>=2&&S.level<=5&&!S.mentored&&Math.random()<.03)choice('mentor',S.npcs.slice().sort((a,b)=>b.power-a.power)[ri(0,4)].name);
  if(S.protege){const P=S.protege;P.fans=Math.round(P.fans*rnd(1.01,1.06)+50);if(!P.thanked&&P.fans>1e6){P.thanked=1;S.hype=clamp(S.hype+12,0,100);bump('loyalty',5);log(`${P.name} passed 1M fans and thanked you in every interview.`,'good')}}
  if(!S.retired){
    const rel=S.songs.filter(s=>s.status==='released'),hot=S.rivals.filter(x=>x.heat>40&&!x.truce),roll=Math.random();
    if(hot.length&&roll<.04)choice('fanwar',pick(hot).id);
    else if(roll<.06&&S.level>=2)choice('hack');
    else if(roll<.08&&S.level>=2)choice('rumor');
    else if(roll<.095&&rel.length>3)choice('copyright',pick(rel).id);
    else if(roll<.105&&ds>0&&S.level>=3)choice('injury');
    else if(roll<.12&&S.level>=4)choice('celebRumor',pick(CELEBS));
    else if(roll<.135){const u=S.songs.filter(s=>s.status==='recorded');if(u.length)choice('hackleak',pick(u).id)}
    else if(roll<.15&&S.ticket==='low'&&ds>0){bump('loyalty',-2);S.hype=clamp(S.hype+2,0,100);const t='Scalpers resold your cheap tickets for five times the price. Fans are annoyed.';log(t,'bad');r.ev.push(t)}
  }
  forumWeek(r);goalsWeek(r);
}

const HELP=[
  {id:'start',n:'Getting started',h:()=>`
    <div class="card"><h3>Your first weeks</h3><ol class="hl">
      <li><b>Studio:</b> write a song (25 energy), then record it at your home setup for free.</li>
      <li><b>Live:</b> busk or play an open mic with the energy you have left. These are your first fans.</li>

    <div class="card"><h3>The calendar</h3><p>Your career starts on Monday, Jan 4, 2027. The current date sits next to the Style tab. Festival season runs June to August, and the Golden Mic Awards happen at the end of each year.</p></div>`},
  {id:'studio',n:'Studio',h:()=>`
    <div class="card"><h3>Making songs</h3><ul class="hl"><li>Song quality comes from your genre's key skills, songwriting, your producer, your mood and any bonuses.</li><li>Matching your genre's favorite tempo and instrument gives +3 each.</li><li>Record at better studios for bigger quality boosts. Bigger homes come with a home studio.</li><li>The <b>▶</b> button plays a short preview of any song.</li></ul></div>
    <div class="card"><h3>How releases land</h3><div class="tbl-wrap"><table><thead><tr><th>Result</th><th>What happens</th></tr></thead><tbody><tr><td class="goldc">Smash Hit</td><td>Big fan jump, streams boosted</td></tr><tr><td class="good">Hit</td><td>Solid fan jump, counts toward goals and eras</td></tr><tr><td>Solid</td><td>A few new fans</td></tr><tr><td class="bad">Flop</td><td>You lose fans and happiness</td></tr></tbody></table></div><p class="muted">Results compare your song to what people expect at your level, so you need to keep improving. Hype, a label's promo push and good eras help.</p></div>
    <div class="card"><h3>Albums & extras</h3><ul class="hl"><li>3 to 6 songs make an EP, 7 or more make an album. Only albums count toward label contracts.</li><li>Critics score albums out of 100. A concept that matches your song themes, a strong opener and closer, a lead single that already hit, and 10 to 14 tracks all help.</li><li>Remixes triple a song's streams for 3 weeks. A deluxe edition gives an older album a second sales spike.</li><li>Music videos grow your fans and MeTube views. Concept, location and cameo all matter.</li><li>Write songs for other artists for a fee, plus royalties if they release them as singles.</li><li>Switching genres starts an Experimental Era.</li></ul></div>`},
  {id:'live',n:'Live & tours',h:()=>`
    <div class="card"><h3>Shows</h3><ul class="hl"><li>Busking and open mics are always available. Venues unlock by level and need enough recorded songs.</li><li>Ticket demand depends on fans, hype, your best songs, your era and your ticket prices. Playing too often in a row lowers turnout.</li><li>Show scores come from stage presence, charisma, dance or instrument, rehearsal, your band, style, setlist and production.</li><li>Every show and busking set has a small chance of becoming a viral clip.</li></ul></div>

  {id:'business',n:'Business',h:()=>`

    <div class="card"><h3>Money makers</h3><ul class="hl"><li>Your team: managers, publicists, producers, coaches and more. They are paid weekly.</li><li>Merch: design an item once, then order stock. It sells online and at shows.</li><li>Sponsorships come in three tiers: luxury (good for your image), mainstream, and fast food (big pay, but fans may call it selling out).</li><li>Later: your own record label, side businesses, and awards campaigns before the Golden Mics.</li></ul></div>`},

  {id:'style',n:'Style',h:()=>`

  {id:'personal',n:'Personal life',h:()=>`

  {id:'prod',n:'Production & art',h:()=>`
    <div class="card"><h3>Tour production</h3><ul class="hl"><li>Buy stage shapes, a video wall, effects and set pieces in the Production tab. Use <b>Preview</b> to see anything on the stage before you buy it.</li><li>Pick two lighting colors. They recolor beams, lasers, confetti, drones and the neon sign.</li><li>Everything you switch on shows up at your own gigs and tours, not at festivals, and adds up to +28 to every show score.</li></ul></div>
    <div class="card"><h3>Dancers</h3><ul class="hl"><li>Hold auditions to meet four dancers. Tap <b>Watch</b> to see them dance on the stage before you hire.</li><li>Higher skill, and a style that suits your genre, add up to +14 to show scores. Rehearse choreography to improve them.</li><li>Dancers are paid every week and appear behind you at your shows.</li></ul></div>

    <div class="card"><h3>Common questions</h3><ul class="hl"><li><b>My fans are dropping.</b> You may be Dormant (12 weeks without music or shows), in a Flop Era, or on the Hate Train. Check the era card on Home.</li><li><b>A button is greyed out.</b> It is locked by level. The text under it says which level unlocks it.</li><li><b>I am broke.</b> Busk, play shows, sell merch and take sponsorships. Fire expensive staff or move somewhere cheaper.</li><li><b>How do I retire?</b> Use the Retirement card on Home. Your heir can start a legacy career with some of your fans and money.</li></ul></div>

/* ============ live week ============ */
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAYMS=3000;let LIVE_T=null;
function gameDate(){return new Date(2027,0,4+(S.t-1)*7+(UI.live.day||0))}
function fmtDate(){return gameDate().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function dateChip(){return `<span class="datechip" title="Today's date in your career">${fmtDate()}</span>`}
function tickerHTML(){const L=UI.live;return `<div class="ticker" id="ticker">${L.last?`<b>${DAYS[L.lastDay||0].slice(0,3)}</b>${esc(L.last)}`:''}</div>`}
function panelHTML(){
  const me=maxEnergy(),L=UI.live;
  const pips=DAYS.map((d,i)=>`<span class="pip ${i<L.day?'done':(i===L.day&&L.on?'now':'')}">${d.slice(0,2)}</span>`).join('');
  const ctl=L.on?`<button class="btn sm ghost" data-a="pauseWeek">${L.paused?'Resume':'Pause'}</button><button class="btn sm ghost" data-a="speed" aria-label="Change speed">${L.speed}x</button><button class="btn sm" data-a="next">Skip</button>`:`<button class="btn grow" data-a="startWeek">${L.day?'Resume week':'Start week'} ›</button><button class="btn sm ghost" data-a="next" title="End the week instantly">Skip</button>`;
  return `<div class="panel ${UI.tut!=null&&TUT[UI.tut].hl==='panel'?'tut-hl':''}" id="panel"><div><div class="pname">${esc(S.stage)}</div><div class="pills"><span class="pill gold">Lv ${S.level+1} · ${LEVELS[S.level].n}</span><span class="pill ${eraCls()}">${ERAS[S.era.id].n}</span>${inSeason()?'<span class="pill pink hm">Festival season</span>':''}</div></div>
    <div class="pgrid"><div><span>Cash</span><b class="${S.money<0?'bad':'goldc'}">${cash(S.money)}</b></div><div><span>Fans</span><b>${fmt(S.fans)}</b></div><div><span>Hype</span><b class="pinkc">${Math.round(S.hype)}</b></div><div class="hm"><span>Streams/wk</span><b>${fmt(sum(S.songs,s=>s.week||0))}</b></div><div class="hm"><span>Style</span><b>${styleScore()}</b></div><div><span>Yr ${year()} · Wk ${wkOfYear()}</span><b>Age ${S.age}</b></div></div>
    <div><div class="label between"><span>Energy</span><span class="num">${Math.round(S.energy)}/${me}</span></div>${meter(S.energy,me,'cyan')}</div>
    <div><div class="label between"><span>${DAYS[L.day]}${L.on?(L.paused?' · paused':' · live'):''}</span><span class="num">Day ${L.day+1}/7</span></div><div class="pips">${pips}</div></div>
    <div class="row ctl">${ctl}</div></div>`;
}
function liveRefresh(){const p=$('#panel');if(p)p.outerHTML=panelHTML();const t=$('#ticker');if(t)t.outerHTML=tickerHTML();document.querySelectorAll('.datechip').forEach(e=>e.textContent=fmtDate())}
function ensureTimer(){if(!LIVE_T)LIVE_T=setInterval(liveTick,200)}
function liveTick(){const L=UI.live;if(!S||!L.on||L.paused||UI.modal||UI.tut!=null||document.hidden)return;L.acc+=200*L.speed;if(L.acc<DAYMS)return;L.acc=0;dayPass()}
function dayPass(){
  const L=UI.live,had=!!UI.modal;
  L.day++;
  if(L.day>=7){UI.scene=null;nextWeek(false,true);render();return}
  if(L.day===5)festCheck();
  const t=dailyEvent();
  if(t){L.last=t;L.lastDay=L.day;log(t)}
  S.energy=Math.min(S.energy,maxEnergy());
  eraCheck();levelCheck();checkAch();save();
  if(UI.modal&&!had)render();else liveRefresh();
}
function dailyEvent(){
  if(Math.random()>.55)return null;
  const rel=S.songs.filter(s=>s.status==='released');
  const D=[
    [3,()=>{inbox({kind:'fan',from:'@'+pick(HANDLES)+pick(HANDLE2),text:pick(['Your song got me through my exams. Thank you.','Please come to my city, we are waiting!!',`Proud member of the ${S.fandom} since day one.`,'I learned guitar because of you.','Your last post made my whole week.'])});return 'New fan mail landed in your inbox.'}],
    [3,()=>{if(!rel.length)return null;const s=pick(rel);const g=addFans(S.fans*rnd(.002,.008)+ri(2,20));return `"${s.title}" was added to a ${pick(['study','gym','late-night drive','heartbreak','summer road trip','coffee shop'])} playlist. +${fmt(g)} fans.`}],
    [2,()=>{if(S.fans<200)return null;S.happy=clamp(S.happy+3,0,100);return `A fan recognized you at the ${pick(['coffee shop','grocery store','gas station','record store','laundromat'])}. Happiness +3.`}],
    [2,()=>{const r=pick(S.rivals);const txt=pick([`New music soon. ${S.stage} should be nervous.`,'Studio all week. Something big is coming.','Thank you for all the love on the new single.',`Who's better live, me or ${S.stage}? Be honest.`]);S.feed.unshift({id:S.nextId++,who:r.name,plat:'chirp',text:txt,likes:Math.round(r.fans*.01),liked:false,t:S.t});return `${r.name} on Chirp: "${txt}"`}],
    [2,()=>{const n=pick(S.npcs.slice(0,10));return `Industry news: ${n.name} ${pick(['announced a world tour','dropped a surprise single','canceled a show','broke a streaming record','is rumored to be leaving their label'])}.`}],
    [2,()=>{if(!S.stats.posts)return null;const k=pick(Object.keys(PLAT));const a=S.social[k];const g=Math.round(a.f*rnd(.004,.015)+ri(3,30));a.f+=g;if(a.posts[0])a.posts[0].likes+=Math.round(g*rnd(2,5));return `Your latest ${PLAT[k].name} post is still climbing. +${fmt(g)} followers.`}],
    [1,()=>{if(S.level<1)return null;S.hype=clamp(S.hype+4,0,100);return `A ${pick(['blog','zine','radio DJ','playlist curator'])} gave you a shout-out. Hype +4.`}],
    [1,()=>{if(S.money<300)return null;const c=ri(20,120);S.money-=c;return `${pick(['Your phone screen cracked','Your guitar strings snapped','You got a parking ticket','Late-night food delivery, again'])}. -${cash(c)}.`}],
    [1,()=>{if(!S.stats.shows||S.t-S.lastBreakout<40||Math.random()>.06)return null;const g=breakout('A clip from one of your shows');return `A clip from one of your shows is going viral. +${fmt(g)} fans.`}],
    [2,()=>{const ok=EVENTS.filter(e=>e.c());return ok.length?pick(ok).f():null}],
  ];
  D.push(...EXTRA_DAILY);const tot=sum(D,x=>x[0]);
  for(let i=0;i<4;i++){let r=Math.random()*tot;const e=D.find(x=>(r-=x[0])<0)||D[0];const t=e[1]();if(t)return t}
  return null;
}

const C3=c=>new THREE.Color(c);
function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:.85,metalness:0},o||{}))}
function MB(c,o){return new THREE.MeshBasicMaterial(Object.assign({color:c},o||{}))}
function add(p,geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);p.add(m);return m}
const BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CY=(a,b,h,s=8,o=false,ts=0,tl=Math.PI*2)=>new THREE.CylinderGeometry(a,b,h,s,1,o,ts,tl);

function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
function disposeTree(o){o.traverse(n=>{if(n.geometry)n.geometry.dispose();const ms=n.material?(Array.isArray(n.material)?n.material:[n.material]):[];ms.forEach(m=>{if(m.userData&&m.userData.keep)return;if(m.map)m.map.dispose();m.dispose()})})}

function g3init(){
  if(!window.THREE)return;
  try{
    const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});
    r.setPixelRatio(Math.min(1.5,window.devicePixelRatio||1));r.domElement.className='g3';
    const s=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});s.setPixelRatio(1);s.setClearColor(0x000000,0);
    G3.r=r;G3.snapR=s;G3.scene=new THREE.Scene();G3.cam=new THREE.PerspectiveCamera(32,2,.1,400);G3.clock=new THREE.Clock();G3.ok=true;
    requestAnimationFrame(g3loop);
  }catch(e){G3.ok=false}
}

/* ---- textures ---- */
const TX={
  brick:rep=>ctex(256,128,(x,w,h)=>{x.fillStyle='#3a1d18';x.fillRect(0,0,w,h);for(let r=0;r<8;r++)for(let c=-1;c<9;c++){x.fillStyle=['#6b3226','#5a2e26','#7a3a2c','#64302a'][(r*7+c*3)&3];x.fillRect(c*32+(r%2?16:0)+2,r*16+2,28,12)}},rep),
  wood:rep=>ctex(256,256,(x,w,h)=>{for(let i=0;i<16;i++){x.fillStyle=i%2?'#4a2c1c':'#55331f';x.fillRect(i*16,0,16,h);x.fillStyle='rgba(0,0,0,.28)';x.fillRect(i*16,0,2,h)}},rep),
  text:(txt,o={})=>ctex(o.w||512,o.h||128,(x,w,h)=>{if(o.bg){x.fillStyle=o.bg;x.fillRect(0,0,w,h)}x.font=`${o.size||84}px Anton, Impact, 'Arial Narrow', sans-serif`;x.textAlign='center';x.textBaseline='middle';if(o.glow){x.shadowColor=o.glow;x.shadowBlur=26}if(o.grad){const g=x.createLinearGradient(0,0,w,0);o.grad.forEach((c,i)=>g.addColorStop(i/(o.grad.length-1),c));x.fillStyle=g}else x.fillStyle=o.col||'#fff';x.fillText(txt,w/2,h/2+4);if(o.glow)x.fillText(txt,w/2,h/2+4)}),
  grad:(stops,w=4,h=256)=>ctex(w,h,(x)=>{const g=x.createLinearGradient(0,0,0,h);stops.forEach(([o,c])=>g.addColorStop(o,c));x.fillStyle=g;x.fillRect(0,0,w,h)}),
  skyline:(sun)=>ctex(512,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);(sun?[[0,'#2b1a4f'],[.6,'#ff7a59'],[1,'#ffc36b']]:[[0,'#0b1430'],[1,'#25306a']]).forEach(([o,c])=>g.addColorStop(o,c));x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<22;i++){const bw=w/22,bh=60+prn(i+3)*150;x.fillStyle=sun?'#1a1030':'#0c1226';x.fillRect(i*bw,h-bh,bw-3,bh);x.fillStyle='rgba(255,210,122,.7)';for(let j=0;j<8;j++)if(prn(i*13+j)<.45)x.fillRect(i*bw+4+(j%2)*10,h-bh+10+j*16,5,7)}}),
  dots:(rep)=>ctex(256,256,(x,w,h)=>{x.fillStyle='#120e1e';x.fillRect(0,0,w,h);for(let i=0;i<520;i++){x.fillStyle=['#3a3050','#2a2440','#4a3a5c','#fff6c8','#ff4f8b','#4fd6e8'][i%17===0?3+(i%3):i%3];x.beginPath();x.arc(prn(i)*w,prn(i+999)*h,2.6,0,7);x.fill()}},rep),
  logo:(name,rep)=>ctex(512,256,(x,w,h)=>{x.fillStyle='#ece7f2';x.fillRect(0,0,w,h);x.font='34px Anton, Impact, sans-serif';x.textAlign='center';for(let r=0;r<4;r++)for(let c=0;c<3;c++){x.fillStyle=(r+c)%2?'#ff4f8b':'#9c92b0';x.fillText((r+c)%2?name:'HEADLINER',c*180+(r%2?90:0)+60,r*64+44)}},rep),
  rays:()=>ctex(512,256,(x,w,h)=>{x.fillStyle='#1c1206';x.fillRect(0,0,w,h);for(let i=0;i<18;i++){const a=Math.PI+i*Math.PI/17;x.fillStyle=i%2?'rgba(255,182,39,.22)':'rgba(255,182,39,.08)';x.beginPath();x.moveTo(w/2,h+20);x.lineTo(w/2+Math.cos(a)*900,h+20+Math.sin(a)*900);x.lineTo(w/2+Math.cos(a+.1)*900,h+20+Math.sin(a+.1)*900);x.fill()}}),
  foam:rep=>ctex(128,128,(x,w,h)=>{for(let r=0;r<4;r++)for(let c=0;c<4;c++){x.fillStyle=(r+c)%2?'#2e2440':'#1c1528';x.fillRect(c*32,r*32,32,32);x.fillStyle='rgba(255,255,255,.05)';x.fillRect(c*32+4,r*32+4,24,4)}},rep),
  curtain:rep=>ctex(256,64,(x,w,h)=>{for(let i=0;i<16;i++){const g=x.createLinearGradient(i*16,0,i*16+16,0);g.addColorStop(0,'#5e0a16');g.addColorStop(.5,'#b4182e');g.addColorStop(1,'#5e0a16');x.fillStyle=g;x.fillRect(i*16,0,16,h)}},rep),
};
function bg(c){(G3.bs||G3.scene).background=C3(c)}
function lights(g,o={}){const{sky='#b9b0ff',ground='#2a2030',hemi=.65,key=.85,keyC='#ffffff',rim='#ff8fd0'}=o;g.add(new THREE.HemisphereLight(sky,ground,hemi));const d=new THREE.DirectionalLight(keyC,key);d.position.set(2.5,5,7);g.add(d);const r=new THREE.DirectionalLight(rim,.35);r.position.set(-4,3,-5);g.add(r);const f=new THREE.DirectionalLight('#ffffff',.35);f.position.set(0,.5,8);g.add(f)}

function stars(g,n=260){const p=new Float32Array(n*3);for(let i=0;i<n;i++){const a=Math.random()*Math.PI,b=rnd(.15,1.2),r=140;p[i*3]=Math.cos(a)*r*Math.cos(b)*-1;p[i*3+1]=Math.sin(b)*r*.8;p[i*3+2]=-Math.abs(Math.sin(a))*r}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(p,3));g.add(new THREE.Points(geo,new THREE.PointsMaterial({color:'#ffffff',size:.9,fog:false})))}
function deck(g,{w=9,d=4.2,h=1,col='#2a2230',edge='#ffb627'}={}){add(g,BX(w,h,d),M(col,{roughness:.6}),0,-h/2,1-d/2);add(g,BX(w,.05,.05),MB(edge),0,.01,1.01);add(g,BX(80,.1,40),M('#0c0a12'),0,-h-.05,8)}

function lamp(g,x,y,z,col='#ffd27a',i=1.1,d=9){add(g,SP(.12,8,6),MB(col),x,y,z);const l=new THREE.PointLight(col,i,d);l.position.set(x,y-.1,z);g.add(l);return l}

function animChar(c,t,k){
  const p=c.pose,b=c.base;let y=0,hx=0,hz=0,dL=null,dR=null;
  if(p==='perform'){y=Math.abs(Math.sin(t*4.2))*.07;dL=[0,0,Math.sin(t*2.1)*.3,0,0,Math.sin(t*2.1)*.2];hz=Math.sin(t*2.1)*.08}
  else if(p==='busk'){y=Math.abs(Math.sin(t*3))*.02;dL=[0,0,0,Math.sin(t*9)*.22,0,0];hx=Math.sin(t*3)*.06}
  else if(p==='cheer'){y=Math.abs(Math.sin(t*3.4))*.12;dL=[0,0,Math.sin(t*3.4)*.2,0,0,0];dR=[0,0,-Math.sin(t*3.4)*.2,0,0,0]}
  else if(p==='press'){dR=[0,0,Math.sin(t*5)*.25,0,0,Math.sin(t*5)*.3];y=Math.sin(t*2)*.01}
  else if(p==='trophy'){y=Math.abs(Math.sin(t*2.6))*.06;dR=[0,0,Math.sin(t*2.6)*.12,0,0,0]}
  else if(p==='studio'){hx=Math.sin(t*3.6)*.07}
  else if(p==='dance'){const b4=t*4.2;y=Math.abs(Math.sin(b4))*.1;dL=[Math.sin(b4)*.9,0,-Math.abs(Math.sin(b4*.5))*1.3,0,0,-Math.sin(b4)*.6];dR=[-Math.sin(b4)*.9,0,Math.abs(Math.cos(b4*.5))*1.3,0,0,Math.sin(b4)*.6];hz=Math.sin(b4)*.1;c.g.rotation.y=(c.ry0||0)+Math.sin(t*2.1)*.35*k}
  else{y=Math.sin(t*1.8)*.012;hz=Math.sin(t*.7)*.04}
  const set=(A,v,d)=>{A.sh.rotation.set(v[0]+(d?d[0]*k:0),v[1],v[2]+(d?d[2]*k:0));A.el.rotation.set(v[3]+(d?d[3]*k:0),v[4],v[5]+(d?d[5]*k:0))};
  c.g.position.y=c.y0+y*k;c.head.rotation.set(hx*k,Math.sin(t*.5)*.08*k,hz*k);set(c.AL,b.L,dL);set(c.AR,b.R,dR);
  if(!c.face)return;
  if(c.nb==null)c.nb=t+rnd(1.5,4);
  let e;const now=performance.now()/1000;
  if(t>c.nb){e='blink';if(t>c.nb+.13)c.nb=t+rnd(2.4,5.5)}
  else if(c.main&&G3.mood&&now<G3.mood.until)e=G3.mood.expr;
  else if(p==='perform'||p==='busk'){const v=Math.sin(t*8.3)+Math.sin(t*5.1+1);e=v>.7?'singB':v>-.4?'sing':'smile'}
  else if(p==='dance')e=Math.sin(t*1.3+c.phase)>.6?'wink':'grin';
  else if(p==='cheer'||p==='trophy')e='grin';
  else if(p==='studio')e='focus';
  else e=c.main?(S&&S.happy<30?'sad':S&&S.hype>55?'smile':Math.sin(t*.3)>.5?'smile':'neutral'):'smile';
  if(e!==c.expr){c.expr=e;c.face.material=faceMat(c.L,e)}
}

function stage3dMount(){
  if(!G3.ok||!S)return;const host=document.getElementById('scene3d');if(!host)return;
  if(G3.r.domElement.parentNode!==host)host.appendChild(G3.r.domElement);
  const w=host.clientWidth,h=host.clientHeight;if(w&&h&&(w!==G3.w||h!==G3.h)){G3.w=w;G3.h=h;G3.r.setSize(w,h);frameCam()}

function g3loop(){
  requestAnimationFrame(g3loop);
  if(!G3.ok||document.hidden||!G3.world)return;
  const host=G3.r.domElement.parentNode;if(!host||!host.isConnected)return;
  if(host.clientWidth!==G3.w||host.clientHeight!==G3.h){stage3dMount();if(!host.clientWidth)return}
  const t=G3.clock.getElapsedTime(),k=reduceMotion()?0:1,A3=G3.anim;
  A3.chars.forEach(c=>animChar(c,t+(c.phase||0),k));
  animCrowds(t,k);
  A3.beams.forEach((b,i)=>{b.rotation.z=Math.sin(t*.6+i*1.7)*.45*k;b.rotation.x=Math.cos(t*.5+i)*.2*k});
  A3.spin.forEach(s=>{s.o.rotation[s.ax]=t*s.v*k});
  A3.flash.forEach(f=>{const on=k&&((t*1.2+f.ph)%1.7)<.07;f.s.visible=!!on;f.l.intensity=on?2.2:0});
  if(A3.sea)A3.sea.position.y=-.12+Math.sin(t*1.2)*.03*k;
  (A3.fx||[]).forEach(f=>f(t,k));
  animFireworks(t,k);
  G3.r.render(G3.scene,G3.cam);
}

  S.songs.forEach(s=>{const lvl=PLAQ.filter(x=>s.streams>=x).length;if(lvl>(D.plaq[s.id]||0)){D.plaq[s.id]=lvl;const m=['1 million','10 million','100 million','1 billion'][lvl-1];log(`"${s.title}" passed ${m} streams. A plaque is on its way.`,'big');r.ev.push(`"${s.title}" hit ${m} streams`);D.news.unshift({t:S.t,src:pick(NEWS_SRC),text:`${S.stage}'s "${s.title}" crosses ${m} streams`})}});
  // DMs
  const n=ri(1,S.fans>5e4?3:2);
  for(let i=0;i<n;i++){
    const roll=Math.random(),pp=S.people.filter(p=>p.kind!=='ex');
    if(roll<.25&&pp.length){const p=pick(pp);D.dms.unshift({id:S.nextId++,from:p.name,kind:'person',pid:p.id,text:pick(DM_PERSON),t:S.t})}
    else if(roll<.38&&S.fans>3e4){const a=pick(S.npcs);D.dms.unshift({id:S.nextId++,from:a.name,kind:'ind',text:pick(DM_IND),t:S.t})}
    else D.dms.unshift({id:S.nextId++,from:'@'+pick(HANDLES)+pick(HANDLE2)+ri(1,99),kind:'fan',text:pick(DM_FAN).replace('{city}',pick(CITIES.na)),t:S.t});
  }
  D.dms=D.dms.slice(0,30);
  // gossip
  if(Math.random()<.5){const rv=S.rivals&&S.rivals.length?pick(S.rivals):null,a=pick(S.npcs);
    D.news.unshift({t:S.t,src:pick(NEWS_SRC),text:pick([`${a.name} spotted in the studio with a mystery producer`,`${a.name}'s "${a.single}" is still everywhere`,rv?`${rv.name} fans and the ${S.fandom} are at war again`:`Who will win Song of the Year?`,`Is ${S.stage} the next big thing? Fans think so`,`${a.name} teases a world tour`])})}
  D.news=D.news.slice(0,40);
  // year end
  if((S.t-1)%52===0&&S.t>1)makeWrapped();
}
function makeWrapped(){

const PHOTOS={};let _mdb=null;
function mdb(){return _mdb||(_mdb=new Promise((res,rej)=>{try{const r=indexedDB.open('headliner_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
function mediaPut(id,url){PHOTOS[id]=url;mdb().then(db=>db.transaction('m','readwrite').objectStore('m').put(url,id)).catch(()=>{})}
function mediaLoadAll(){mdb().then(db=>{const rq=db.transaction('m').objectStore('m').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){PHOTOS[c.key]=c.value;c.continue()}else if(S&&UI.tab==='social')render()}}).catch(()=>{})}

  if(['cover','announce','snippet','acoustic','dance','mv'].includes(p.type)){const s=S.songs.find(x=>x.id===(p.songId||p.mvSong))||S.songs.find(x=>x.title===p.song);const u=songArtURL(s);if(u)return u}
  return null}
function readImage(file,max,square,done){const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),g=c.getContext('2d');
  if(square){const m=Math.min(img.width,img.height);c.width=c.height=max;g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,max,max)}
  else{const k=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);g.drawImage(img,0,0,c.width,c.height)}
  done(c.toDataURL('image/jpeg',.82))};img.onerror=()=>toast('That file could not be read as an image.');img.src=rd.result};rd.readAsDataURL(file)}
function mediaUpload(t){const f=t.files[0];
  if(t.dataset.upload==='post')readImage(f,1000,false,url=>{const id='m'+Date.now().toString(36)+ri(100,999);mediaPut(id,url);UI.postImg=id;render()});
  else readImage(f,500,true,url=>{S.covers.unshift({id:S.nextId++,title:(t.dataset.title||'Uploaded cover'),img:url});S.covers=S.covers.slice(0,12);save();toast('Cover added to your library. Apply it to a release below.');render()})}

    const pos=(nb.left+nb.width/2-bar.left)/bar.width*100,dist=Math.abs(pos-W.zone.c);
    const s=dist<=W.zone.w*.2?'Perfect':dist<=W.zone.w/2?'Great':'Miss';W.taps.push({s,pos});
    if(s==='Perfect')sfx('ach');if(W.taps.length<3)wsNewZone();wsSet()},
  wsFinish:()=>{const W=UI.ws;const inp=$('#ws-title');const title=((inp&&inp.value.trim())||W.title||songTitle()).slice(0,40);const fit=GFIT[S.genre]||[];
    let bonus=W.hooks[W.hook].v+sum(W.taps,t=>t.s==='Perfect'?4:t.s==='Great'?2:0)+(easy()?2:0);
    let extra=0;if(fit[0]===W.tempo)extra+=3;if(fit[1]===W.inst)extra+=3;if(S.breakupBoost){extra+=8;S.breakupBoost=0}if(S.mentor&&S.mentor.until>S.t)extra+=3;if(S.oppBonus){extra+=S.oppBonus;S.oppBonus=0}
    const s={id:S.nextId++,title,theme:W.theme,tempo:W.tempo,inst:W.inst,lyric:W.hooks[W.hook].t,q:songQuality(bonus+extra),status:'demo',streams:0,week:0,peak:null,mv:0,mvViews:0,mvWeek:0,album:null};
    S.songs.unshift(s);S.stats.written++;S.skills.songwriting=Math.min(100,S.skills.songwriting+.9*(1-S.skills.songwriting/130));
    W.song=s.id;W.bonus=bonus+extra;W.step=4;log(`Wrote "${s.title}" in a writing session (${grade(s.q)}).`,'good');setMood('grin',4);
    if(grade(s.q)==='S'||grade(s.q)==='A')setTimeout(()=>confetti(),80);sfx('release');wsSet()},
  wsRecord:()=>{UI.ws=null;UI.modal=UI.queue.shift()||null;UI.tab='studio';UI.sub=UI.sub||{};UI.sub.studio='Song library';window.scrollTo(0,0)},
  wsAgain:()=>{UI.ws=null;UI.modal=null;A.wsStart()},
  wsClose:()=>{UI.ws=null;UI.modal=UI.queue.shift()||null},
});
document.addEventListener('input',e=>{if(e.target.id==='ws-title'&&UI.ws){UI.ws.custom=e.target.value;UI.ws.title='';UI.modal.html=wsHTML()}});

/* ---- avatar: drag to spin, emotes, people in press scenes ---- */
G3.spinY=0;G3.spinAt=0;let _drag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('#scene3d');if(!h)return;_drag={x:e.clientX,y:e.clientY,s:G3.spinY,on:false}});
document.addEventListener('pointermove',e=>{if(!_drag)return;const dx=e.clientX-_drag.x;if(!_drag.on&&Math.abs(dx)>6&&Math.abs(dx)>Math.abs(e.clientY-_drag.y))_drag.on=true;if(_drag.on){G3.spinY=_drag.s+dx*.012;G3.spinAt=performance.now()}});
document.addEventListener('pointerup',()=>{_drag=null});document.addEventListener('pointercancel',()=>{_drag=null});
{const _ac=animChar;animChar=function(c,t,k){_ac(c,t,k);if(c.main){if(!_drag&&performance.now()-G3.spinAt>5000)G3.spinY*=.94;if(Math.abs(G3.spinY)<.002)G3.spinY=0;c.g.rotation.y=(c.pose==='dance'?c.g.rotation.y:(c.ry0||0))+G3.spinY}}}
const EMOTES=[['wave','👋','press','wink'],['dance','💃','dance','grin'],['sing','🎤','perform','sing'],['hype','🙌','cheer','grin'],['pose','✨','trophy','smile']];
function emoteBar(){return G3.ok?`<div class="emotes">${EMOTES.map(([k,ic])=>`<button class="emo ${UI.emote&&UI.emote.k===k?'on':''}" data-a="emote" data-v="${k}" aria-label="${k}">${ic}</button>`).join('')}<button class="emo" data-a="spin" aria-label="Spin around">⟳</button></div>`:''}
Object.assign(A,{
  emote:d=>{const e=EMOTES.find(x=>x[0]===d.v);UI.emote={k:e[0],p:e[2],until:Date.now()+4500};setMood(e[3],4.5);setTimeout(()=>{if(UI.emote&&Date.now()>=UI.emote.until-50){UI.emote=null;if(S)render()}},4600)},
  spin:()=>{const s0=G3.spinY,t0=performance.now();const step=()=>{const f=Math.min(1,(performance.now()-t0)/900);G3.spinY=s0+f*Math.PI*2;G3.spinAt=performance.now();if(f<1)requestAnimationFrame(step);else G3.spinY=s0};requestAnimationFrame(step);return false},
});
{const _cs=curScene;curScene=function(){const sc=_cs();if(UI.emote&&Date.now()<UI.emote.until)return {...sc,pose:UI.emote.p};return sc}}
function npc3(g,x,z,ry,pose,o={}){if(typeof charBuild!=='function')return null;const c=charBuild(o.look||dancerLook(),pose,{});c.g.position.set(x,0,z);c.g.rotation.y=ry;c.ry0=ry;c.g.scale.setScalar(o.s||.92);c.phase=rnd(0,6);g.add(c.g);G3.anim.chars.push(c);blob(g,x,z,.34);return c}
function camProp(c,ph){const cam=new THREE.Group();cam.position.set(0,1.86,.26);c.g.add(cam);add(cam,BX(.26,.17,.14),M('#141414'),0,0,0);add(cam,CY(.05,.05,.12,10),M('#2a2a2a'),0,0,.11).rotation.x=Math.PI/2;
  const fl=add(cam,SP(.1,8,6),MB('#ffffff',{transparent:true,opacity:.95}),0,.02,.2);const li=new THREE.PointLight('#ffffff',0,7);li.position.set(0,0,.3);cam.add(li);G3.anim.flash.push({s:fl,l:li,ph})}
function micProp(c){const m=new THREE.Group();m.position.set(.32,1.45,.3);c.g.add(m);add(m,CY(.022,.02,.26,8),M('#1a1a1a'),0,0,0).rotation.x=.5;add(m,SP(.05,8,6),M('#555'),0,.11,.06)}
for(const k of ['press','tv','radio','awards']){if(!ENV[k])continue;const _e=ENV[k];ENV[k]=function(c,sc){_e.call(this,c,sc);try{const g=c.w,nar=G3.w<640;
  if(k==='press'){const iv=npc3(g,nar?-.75:1.15,nar?-.95:.55,nar?.75:-1.1,'press');if(iv)micProp(iv);(nar?[[-1.05,-2.4,.3],[.35,-2.6,-.2]]:[[-1.25,-1.3,.25],[1.9,-1.7,-.35],[-2.2,-2.1,.15]]).forEach(([x,z,r],i)=>{const p=npc3(g,x,z,r,'idle',{s:.86});if(p)camProp(p,i*.61+.2)})}
  else if(k==='tv'){const h=npc3(g,nar?-.75:1.2,nar?-.9:.3,nar?.7:-1.0,'press');if(h)micProp(h)}
  else if(k==='radio'){npc3(g,nar?-.75:1.2,nar?-.9:.2,nar?.7:-1.0,'studio')}
  else if(k==='awards'){npc3(g,nar?-.8:1.25,nar?-1:.4,nar?.7:-.9,'cheer')}
}catch(e){}}}

/* ---- difficulty card ---- */
function diffCard(){return `<div class="card" style="margin-bottom:16px"><div class="between"><h3>Difficulty</h3><div class="row"><button class="chip ${easy()?'on':''}" data-a="setEasy" data-v="1">Easy</button><button class="chip ${easy()?'':'on'}" data-a="setEasy" data-v="0">Normal</button></div></div><small class="muted">Easy: 30% more fans from everything, 20% more income, 20% more energy, kinder critics, smaller flops, slower fan loss, an extra weekly opportunity and easier writing sessions.</small></div>`}
{const _hv=helpView;helpView=function(){return `<div class="section">${diffCard()}</div>`+_hv()}}


/* ---- auto-update: reload when a newer version is published ---- */
const APP_VER='202610232213';
function checkUpdate(){if(!/^https?:/.test(location.protocol))return;fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/const APP_VER='(\d+)'/);if(m&&m[1]!==APP_VER){try{save()}catch(e){}location.replace(location.pathname+'?v='+m[1])}}).catch(()=>{})}
setTimeout(checkUpdate,1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
function render(){
  const app=$('#app');
  if(!S){app.innerHTML=setupView()+modalHTML()+setupTipHTML();return}
  const views={production:prodView,artwork:artView,help:helpView,style:styleView,home:()=>planCard()+(S.retired?`<div class="section">${retireCard()}</div>`:'')+homeView()+homeExtras(),studio:()=>studioView()+studioExtras(),live:()=>liveView()+liveExtras(),business:()=>businessView()+bizExtras(),charts:chartsView,social:phoneView,personal:()=>personalView()+personalExtras()};
  app.innerHTML=hud()+`<main class="wrap">${(views[UI.tab]||homeView)()}</main>`+modalHTML()+tutHTML();
  compartments();
  const tb=document.querySelector('.tabs .tut-hl')||document.querySelector('.tabs .tab.on');if(tb)tb.parentElement.scrollLeft=Math.max(0,tb.offsetLeft-40);
  stage3dMount();
  document.body.classList.toggle('phone-on',!!S&&UI.tab==='social');
}
function modalHTML(){if(!UI.modal)return '';return `<div class="scrim" data-a="scrim"><div class="modal" role="dialog" aria-modal="true"><h2>${esc(UI.modal.title)}</h2>${UI.modal.html}</div></div>`}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;
  if(a==='scrim'){if(e.target===b){UI.modal=UI.queue.shift()||null;render()}return}
  const f=A[a];if(!f)return;
  const sig=S?S.energy+'|'+S.money+'|'+S.t:'';
  const res=f(b.dataset,b);
  if(res===false)return;
  if(S){if(SCENE_ON[a]&&sig!==S.energy+'|'+S.money+'|'+S.t){const sc=SCENE_ON[a](b.dataset);if(sc)UI.scene=sc}eraCheck();levelCheck();checkAch()}
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='art-title'&&S){artOpts().title=t.value;render();return}
  if(t.dataset.s&&S&&t.tagName==='SELECT'){S[t.dataset.s]=t.value;save();render();return}
  if(t.dataset.ui){UI[t.dataset.ui]=t.value;if(t.dataset.ui==='postType')UI.postSong='';render();return}
  if((t.dataset.upload==='post'||t.dataset.upload==='cover')&&t.files&&t.files[0]){mediaUpload(t);t.value='';return}
  if(t.dataset.upload&&t.files&&t.files[0]){
    const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const n=256;c.width=n;c.height=n;const g=c.getContext('2d');const m=Math.min(img.width,img.height);g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,n,n);const url=c.toDataURL('image/jpeg',.85);
      if(t.dataset.upload==='draft'){UI.draft.name=$('#f-name')?.value??UI.draft.name;UI.draft.stage=$('#f-stage')?.value??UI.draft.stage;UI.draft.fandom=$('#f-fandom')?.value??UI.draft.fandom;UI.draft.avatar=url}else{S.avatar=url;save();toast('Profile picture updated everywhere.')}render()};img.onerror=()=>toast('That file could not be read as an image.');img.src=rd.result};rd.readAsDataURL(t.files[0]);
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.draft){UI.draft[t.dataset.draft]=t.value}
  if(t.dataset.s&&S){S[t.dataset.s]=t.value;save()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal){UI.modal=UI.queue.shift()||null;render()}});

function boot(data){
  if(data&&data.S){S=migrate(data.S);if(data.UI)UI=Object.assign(UI,data.UI)}
  else{const s=loadSave();if(s&&s.stage){S=migrate(s);levelCheck(true)}}
  if(!tutSeen()&&UI.tut==null){if(S)UI.tut=0;else UI.setupTip=true}
  ensureTimer();
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,UI}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
