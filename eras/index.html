<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Eras Life">
<meta name="theme-color" content="#0c0910">
<meta name="color-scheme" content="dark">

<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>The Eras Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&display=swap">
<style>
/* Look: a backstage pass. Deep stage black, glassy panels, and the current era's colour as the light. */
:root{--ground:#0c0910;--surface:#16121d;--raised:#201a29;--rule:#2d253a;--text:#f8f3fc;--muted:#c4bad2;--faint:#8e85a1;
 --era:#2f8f7c;--era-ink:#effaf6;--era-2:#8fd3c3;--ok:#5fd39a;--bad:#ff6b7a;--warn:#ffc35a;
 --serif:"Fraunces",Georgia,serif;--sans:"Plus Jakarta Sans","DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--r:20px;
 --glass:color-mix(in srgb,var(--ground) 78%,transparent);--nav-h:64px;--shadow:0 12px 32px #0007}
*{box-sizing:border-box}
html{background:var(--ground);-webkit-text-size-adjust:100%;scroll-padding-top:120px}
html.hi-contrast{--ground:#000;--surface:#0b0b0b;--raised:#161616;--rule:#7a7a7a;--text:#fff;--muted:#e6e6e6;--faint:#cfcfcf}
html.hi-contrast .btn:not(.ghost),html.hi-contrast .chip.on,html.hi-contrast .tab.on{outline:2px solid #fff}
html.big-text body{font-size:16px}html.big-text .small{font-size:14px}html.huge-text body{font-size:18px}html.huge-text .small{font-size:15.5px}
body{margin:0;color:var(--text);font:14px/1.55 var(--sans);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
 background:radial-gradient(900px 520px at 85% -120px,color-mix(in srgb,var(--era) 34%,transparent),transparent 70%),radial-gradient(700px 500px at -10% 30%,color-mix(in srgb,var(--era-2) 12%,transparent),transparent 70%),var(--ground);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:not-allowed}
h1,h2,h3{margin:0 0 6px;line-height:1.2;text-wrap:balance}h1{font:800 30px/1.08 var(--serif);letter-spacing:-.01em}h2{font:700 17px/1.3 var(--sans);letter-spacing:-.01em}
h3{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
p{margin:0 0 8px}.small{font-size:12.5px}.muted{color:var(--muted)}.faint{color:var(--faint)}.pos{color:var(--ok)}.neg{color:var(--bad)}.spot{color:var(--era-2);font-weight:700}
.eyebrow{display:block;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--era-2);margin-bottom:4px}
:focus-visible{outline:2px solid var(--era-2);outline-offset:2px}
#app{margin:0 auto;padding:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}.stack.tight{gap:8px}
.ic{width:20px;height:20px;flex:none}
/* cards */
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 88%,var(--era) 12%),var(--surface) 140px);border:1px solid var(--rule);border-radius:var(--r);padding:16px;margin:12px 14px;box-shadow:inset 0 1px 0 #ffffff0a,var(--shadow)}
.card.world{border-color:color-mix(in srgb,var(--era-2) 45%,var(--rule));background:color-mix(in srgb,var(--era) 14%,var(--surface))}
.card.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.card.focus{border-color:color-mix(in srgb,var(--era) 55%,var(--rule))}
details.card>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2{margin:0}details.card>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .2s}details.card[open]>summary::after{transform:rotate(-135deg);margin-top:4px}details.card[open]>summary{margin-bottom:8px}
/* buttons and inputs */
.btn{background:var(--era);color:var(--era-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:800;display:inline-flex;align-items:center;gap:6px;justify-content:center;box-shadow:inset 0 1px 0 #ffffff40,0 6px 18px color-mix(in srgb,var(--era) 35%,transparent);transition:transform .12s,filter .12s}
.btn:active:not(:disabled){transform:scale(.97)}.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:color-mix(in srgb,var(--raised) 80%,transparent);color:var(--text);border:1px solid var(--rule);box-shadow:none}.btn.ghost.on{background:var(--era);color:var(--era-ink);border-color:var(--era)}
.btn.sm{padding:6px 13px;font-size:12.5px;font-weight:700}.btn.big{padding:14px 22px;font-size:15.5px;width:100%;border-radius:16px}
.icon{background:var(--raised);border:1px solid var(--rule);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--rule);white-space:nowrap}.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--rule))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{background:var(--raised);border:1px solid var(--rule);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.chip.sm{padding:5px 10px;font-size:11.5px}.chip.on{background:var(--era);color:var(--era-ink);border-color:var(--era)}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #0004}
.setl .chip{font-size:11.5px;padding:4px 9px}
.choice{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--rule);border-radius:16px;padding:13px 15px;font-weight:700;transition:border-color .15s,transform .12s}
.choice:hover:not(:disabled){border-color:var(--era)}.choice:active:not(:disabled){transform:scale(.99)}.choice.on{border-color:var(--era);background:color-mix(in srgb,var(--era) 18%,var(--raised))}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field span{font-size:12px;font-weight:600;color:var(--muted)}
.field select,.field input:not([type=range]),select{background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:9px 11px;width:100%}
.field input[type=range]{width:100%;accent-color:var(--era)}
.bar{flex:1;height:8px;background:var(--raised);border-radius:99px;overflow:hidden;min-width:60px;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--era),var(--era-2));border-radius:99px}.bar.warn i{background:var(--warn)}
.statrow{display:flex;align-items:center;gap:10px;margin:6px 0}.statrow>span{width:130px;font-size:12.5px;color:var(--muted)}.statrow>b{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.genre{flex:1;height:8px;border-radius:99px;background:linear-gradient(90deg,#c58a3c,#e88fb4,#7d8a99);position:relative}.genre i{position:absolute;top:-4px;width:4px;height:16px;background:#fff;border-radius:2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.grid3>div{background:var(--raised);border-radius:14px;padding:10px}.grid3 b{font-size:18px;font-variant-numeric:tabular-nums}.grid3 b.big{font-size:32px;font-family:var(--serif)}
/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid var(--rule)}
.topbar{display:flex;align-items:center;gap:10px}.when{flex:1;min-width:0}
.date{font:700 19px/1.15 var(--serif)}.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erachip{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--text)}.erachip i{width:8px;height:8px;border-radius:50%}
.blk{display:flex;flex-direction:column;align-items:flex-end;gap:3px}.blk>span{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.blocks{display:flex;gap:4px;align-items:center}.blocks i{width:11px;height:11px;border-radius:4px;background:var(--era);display:block;box-shadow:0 0 8px color-mix(in srgb,var(--era) 60%,transparent)}.blocks i.used{background:var(--raised);border:1px solid var(--rule);box-shadow:none}.blocks .over{color:var(--warn);font-size:12px}
.statline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:10px}
.st{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:5px 2px;min-width:0}.st .ic{width:14px;height:14px;color:var(--era-2)}
.st b{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.st span{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;border:1px solid var(--rule);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;position:relative;white-space:nowrap;color:var(--muted)}
.tab.on{background:var(--text);color:var(--ground);border-color:var(--text)}.badge{position:absolute;top:-6px;right:-5px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px;line-height:1.4}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--rule)}
.bn{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--faint);padding:6px 0;position:relative;border-radius:14px;max-width:96px}
.bn .ic{width:22px;height:22px;padding:3px 14px;box-sizing:content-box;border-radius:99px;transition:background .2s}.bn.on{color:var(--text)}.bn.on .ic{background:color-mix(in srgb,var(--era) 45%,transparent);color:var(--text)}.bn .badge{top:0;right:18%}
#main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.side,.rail{display:none}
.side .brand{font:800 22px/1.1 var(--serif);padding:22px 18px 10px;background:linear-gradient(90deg,#f6d38a,#e88fb4,#8fb8e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sg{padding:6px 10px}.sgh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:10px 8px 6px}.sgh .ic{width:16px;height:16px}
.sl{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:9px 12px;font-weight:600;color:var(--muted);position:relative}.sl:hover:not(:disabled){background:var(--raised);color:var(--text)}.sl.on{background:color-mix(in srgb,var(--era) 30%,var(--raised));color:var(--text)}.sl .badge{position:static}
.rail{padding:18px 16px}.rail h3:first-child{margin-top:4px}.rs{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}.rs>span{width:92px;color:var(--muted);flex:none}.rs>b{margin-left:auto;font-variant-numeric:tabular-nums}.rs .bar{margin:0}
.rc{display:flex;flex-direction:column;padding:7px 0;border-top:1px solid var(--rule);font-size:12.5px}.rc small{color:var(--faint)}
@media(min-width:980px){
 .shell{display:grid;grid-template-columns:232px minmax(0,1fr) 270px;max-width:1380px;margin:0 auto}
 .side,.rail{display:block;position:sticky;top:0;height:100dvh;overflow:auto;border-right:1px solid var(--rule);background:color-mix(in srgb,var(--ground) 60%,transparent)}
 .rail{border-right:0;border-left:1px solid var(--rule)}
 .bottomnav{display:none}.tabs{display:none}#main{padding-bottom:40px}
 .mainwrap{min-width:0}.top .statline{display:none}
 .card{margin:14px 22px}.stagewrap{margin:14px 22px 0}.actions{margin:14px 22px}
}
/* 3D */
.stagewrap{position:relative;margin:12px 14px 0}
.stage3d{width:100%;height:230px;border-radius:var(--r);overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--era) 25%,transparent),transparent 70%),linear-gradient(#0003,#0007),var(--surface);border:1px solid var(--rule);position:relative}
.stagewrap.hero .stage3d{height:270px;border-radius:24px;box-shadow:var(--shadow)}
.stage3d.tall{height:300px;margin:12px 0}.stage3d.short{height:180px;margin:8px 0}
.stage3d canvas{display:block;cursor:grab}.stage3d canvas.t3{touch-action:pan-y}
.stage3d.off3d{height:60px}.stage3d.off3d::after{content:"3D is off (turn it on in the menu)";position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.stage3d.no3d::after{content:"3D view needs WebGL";position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.caption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000c 55%);border-radius:0 0 24px 24px;padding:28px 14px 12px;font-size:13px;pointer-events:none}.caption b{font-size:15px}
/* title */
.title{padding:0 0 30px;max-width:1100px;margin:0 auto}
.thero{position:relative;margin:0 0 4px}.thero .stage3d.tall{height:min(62vh,520px);margin:0;border-radius:0 0 32px 32px;border:0;border-bottom:1px solid var(--rule)}
.tov{position:absolute;left:0;right:0;bottom:0;padding:70px 18px 18px;background:linear-gradient(transparent,#0c0910f0 60%);border-radius:0 0 32px 32px}
.tov p{color:var(--muted);max-width:520px}.tov .btn.big{max-width:420px;margin-top:6px}
.logo-t{font-size:48px;margin:2px 0 6px;background:linear-gradient(90deg,#f6d38a,#e88fb4,#8fb8e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.tgrid{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:900px){.tgrid{grid-template-columns:repeat(3,1fr);padding:0 8px}.tgrid .card{margin:12px 8px}.logo-t{font-size:64px}.tov{padding:90px 40px 34px}}
.tfoot{margin:16px 18px}
.title>h1,.title>.between,.title>.eyebrow,.title>p,.title>.stage3d,.title>.btn{margin-left:16px;margin-right:16px;width:auto}.title>.btn.big{width:calc(100% - 32px)}
.title>.between{margin-top:calc(env(safe-area-inset-top,0px) + 18px)}
.slot,.artist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}.slot:last-child,.artist:last-child{border:0}
.artist{justify-content:flex-start}.artist>div:nth-child(2){flex:1}.artist .sw{width:38px;height:38px;border-radius:12px}.artist.soon{opacity:.8}
.ver-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 14px 0;padding:10px 14px;border:1px solid var(--rule);border-radius:16px;background:var(--surface);font-size:12.5px;color:var(--muted);min-height:46px}
.ver-line .ok{color:#6fcf97}.ver-line .btn{margin-left:auto}.ver-line .dot-new{width:9px;height:9px;border-radius:50%;background:#f2c94c;box-shadow:0 0 0 4px #f2c94c33;flex:none}
.dhist{display:flex;gap:4px;margin:10px 0 2px}.dhist i{flex:1;max-width:18px;aspect-ratio:1;border-radius:5px;border:1px solid var(--rule);background:transparent}.dhist i.won{background:#3fa66b;border-color:#3fa66b}
/* tasks and lists */
.task{display:flex;align-items:center;gap:10px;padding:11px 12px;margin:8px 0;border:1px solid var(--rule);border-radius:16px;background:color-mix(in srgb,var(--raised) 70%,transparent)}
.task .tl{flex:1;min-width:0}.task .cost{color:var(--era-2);font-size:9px;width:26px;letter-spacing:1px;flex:none}.task.done{opacity:.5}
.task.req{border-color:color-mix(in srgb,var(--warn) 55%,var(--rule));box-shadow:inset 3px 0 0 var(--warn)}
.task .row{flex-wrap:wrap;justify-content:flex-end}
.actions{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:15;display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:12px 14px;padding:8px;border-radius:22px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--rule);box-shadow:var(--shadow)}
.actions .btn.big{width:auto;white-space:nowrap;padding-left:12px;padding-right:12px}
@media(min-width:980px){.actions{bottom:14px}}
.actions+.row{margin:0 14px}
.songs{display:flex;flex-direction:column}.song{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--rule)}.song.has b{color:var(--muted)}
.logrow{padding:9px 0;border-top:1px solid var(--rule)}.logrow.sens{opacity:.85}
.msg{padding:10px 12px;margin:6px 0;border-radius:14px;background:var(--raised);cursor:pointer}.msg.unread{box-shadow:inset 3px 0 0 var(--era-2)}.msg.unread b::before{content:"● ";color:var(--era-2)}
.post{padding:8px 0;border-top:1px solid var(--rule)}
.chart{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 6px;border-top:1px solid var(--rule)}.chart>b{font:700 16px var(--serif);text-align:center}.chart.you{background:color-mix(in srgb,var(--era) 16%,transparent);border-radius:10px}.chart.rival>div b::after{content:" · rival";font-weight:400;color:var(--faint);font-size:11px}
.past{opacity:.55}
.coverwrap{display:flex;gap:14px;align-items:center;margin:10px 0;flex-wrap:wrap}.cv{border-radius:8px;box-shadow:0 10px 26px #000a;display:block;max-width:100%;height:auto}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}.sh{display:flex;flex-direction:column;gap:4px}
.spark{width:100%;height:70px;margin-top:8px}
.obj{border-left:3px solid var(--warn);padding-left:10px;margin:8px 0}
.truth{background:color-mix(in srgb,var(--era) 14%,var(--raised));border-radius:14px;padding:11px 13px;margin:8px 0}
.groups{display:none}
.bracelets{display:flex;flex-direction:column;gap:6px;margin-top:8px}.bracelet{display:flex;gap:2px;flex-wrap:wrap}.bracelet i{font-style:normal;font-weight:800;font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#1a1a1a;box-shadow:inset 0 -2px 0 #0002}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}.tcard{border:2px solid;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--raised);font-size:12px;min-height:110px}.tcard .ti{font-size:20px}.tcard .tr{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-top:auto}
.newlist{padding-left:18px;margin:8px 0 14px}.newlist li{margin:6px 0}
.review{font-size:26px;color:#ffd166;letter-spacing:2px;margin:6px 0}
/* freedom tools */
.secline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;padding:10px;border:1px dashed var(--rule);border-radius:14px;min-height:48px;align-items:center;background:#0002}
.sec{border:0;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:800;color:#14111c;background:#bfb6cf;min-height:32px}.sec.s-verse{background:#8ec5ff}.sec.s-chorus{background:#ffd166}.sec.s-pre{background:#b8e0a0}.sec.s-bridge{background:#ff9bb3}.sec.s-post{background:#ffe7a3}.sec.s-key{background:#f7a072}.sec.s-intro,.sec.s-outro{background:#d6cdea}.sec.s-break,.sec.s-solo{background:#9fd8d0}
.crscore{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 4px;padding:9px 12px;border-radius:12px;background:var(--raised);font-size:13px}
.tlist{list-style:none;margin:8px 0;padding:0}.tlist li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--rule)}.tlist .tn{width:22px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right;flex:none}.tlist .tt{flex:1;min-width:0;display:flex;flex-direction:column}.tlist .tt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkt{display:flex;flex-direction:column;gap:6px;padding:9px 0;border-top:1px solid var(--rule)}.eracontrol{padding:9px 0;border-top:1px solid var(--rule)}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin:8px 0}.city{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;border-bottom:1px solid var(--rule)}.city b{width:22px;text-align:center}
.sw-row{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}.swb{width:32px;height:32px;border-radius:50%;border:2px solid var(--rule)}.swb.on{border-color:var(--text);box-shadow:0 0 0 2px var(--era)}
.recap{display:flex;align-items:flex-start;gap:10px;margin:12px 14px 0;padding:12px 14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--era) 45%,var(--rule));background:color-mix(in srgb,var(--era) 14%,var(--surface))}.recap>div{flex:1;min-width:0}.recap .icon{width:32px;height:32px}
@media(min-width:980px){.recap{margin:14px 22px 0}}
.rhbox{margin:10px 0;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--era) 14%,var(--raised))}
#rhythm{position:fixed;inset:0;z-index:90;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--era) 30%,#000),#05040a);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);gap:10px;touch-action:none;user-select:none}
.rh-top{display:flex;justify-content:space-between;align-items:center;font-size:14px}.rh-top span{font:800 22px var(--serif)}
#rh-c{flex:1;width:100%;min-height:0;border-radius:18px;background:#0006}
.rh-lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rh-l{height:84px;border-radius:18px;border:1px solid var(--rule);background:var(--raised);font-size:24px;color:var(--text)}.rh-l:active{background:var(--era);color:var(--era-ink)}
.rh-skip{align-self:center}
.actrow{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}.actrow b{grid-column:1/-1;font-size:13px}.actrow select{width:100%}
.merchwrap{display:flex;gap:14px;align-items:center;margin:8px 0}.merchwrap svg{background:var(--raised);border-radius:16px;padding:8px;flex:none}
.shelf .sh svg{background:var(--raised);border-radius:12px;padding:4px}
.bar.rv i{background:linear-gradient(90deg,#ff6b7a,#ffc35a,#5fd39a)}
.opp{padding:11px 0;border-top:1px solid var(--rule)}.opp:first-of-type{border-top:0}
/* modals and toasts */
.modal{position:fixed;inset:0;z-index:50;background:#000a;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .18s ease}
.sheet{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 85%,var(--era) 15%),var(--surface) 160px);border:1px solid var(--rule);border-radius:26px 26px 0 0;width:100%;max-width:640px;max-height:92dvh;overflow:auto;padding:26px 18px calc(env(safe-area-inset-bottom,0px) + 20px);position:relative;box-shadow:0 -10px 40px #0009;animation:rise .22s ease}
.sheet::before{content:"";position:absolute;top:9px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:9px;background:var(--rule)}
.modal.sens .sheet{background:#18161f}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:26px}.sheet::before{display:none}}
@keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%) translateY(200px);background:var(--raised);border:1px solid var(--era);border-radius:14px;padding:11px 15px;max-width:calc(100% - 32px);transition:transform .25s;z-index:60;font-size:13px;font-weight:600;box-shadow:var(--shadow)}.toast.on{transform:translateX(-50%) translateY(0)}
#upd-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:70;display:flex;gap:8px;align-items:center;background:var(--raised);border:1px solid var(--era);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);width:calc(100% - 24px);max-width:520px;font-size:13px}#upd-banner>span{flex:1;min-width:0}#upd-banner button{flex:none;white-space:nowrap}
#upd-banner button{border:0;border-radius:999px;padding:7px 13px;font-weight:800;background:var(--era);color:var(--era-ink)}#upd-banner button[data-upd=later]{background:transparent;color:var(--muted);border:1px solid var(--rule)}
@media(max-width:380px){.statrow>span{width:96px}}
