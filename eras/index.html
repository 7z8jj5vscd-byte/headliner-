<!doctype html>

<style>
/* Look: a ticket stub and a liner-note booklet. A dark velvet ground, with the current era's colour as the accent. */
:root{--ground:#14111c;--surface:#1d1928;--raised:#272236;--rule:#352e47;--text:#f5f0fa;--muted:#bfb6cf;--faint:#8c839e;
 --era:#2f8f7c;--era-ink:#effaf6;--era-2:#8fd3c3;--ok:#5fd39a;--bad:#ff6b7a;--warn:#ffc35a;
 --serif:"Fraunces",Georgia,serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--r:14px}
*{box-sizing:border-box}
html{background:var(--ground);-webkit-text-size-adjust:100%}
html.hi-contrast{--ground:#000;--surface:#0b0b0b;--raised:#161616;--rule:#7a7a7a;--text:#fff;--muted:#e6e6e6;--faint:#cfcfcf}
html.hi-contrast .btn:not(.ghost),html.hi-contrast .chip.on,html.hi-contrast .tab.on{outline:2px solid #fff}
html.big-text body{font-size:16px}html.big-text .small{font-size:14px}html.huge-text body{font-size:18px}html.huge-text .small{font-size:15.5px}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,color-mix(in srgb,var(--era) 28%,transparent),transparent 70%),var(--ground);color:var(--text);font:14px/1.5 var(--sans);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:not-allowed}
h1,h2,h3{margin:0 0 6px;line-height:1.2;text-wrap:balance}h1{font:800 30px/1.1 var(--serif)}h2{font:600 19px/1.25 var(--serif)}h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:12px}
p{margin:0 0 8px}.small{font-size:12.5px}.muted{color:var(--muted)}.faint{color:var(--faint)}.pos{color:var(--ok)}.neg{color:var(--bad)}.spot{color:var(--era-2)}
.eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--era-2);margin-bottom:4px}
:focus-visible{outline:2px solid var(--era-2);outline-offset:2px}
#app{max-width:720px;margin:0 auto;padding:0 0 40px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}.stack.tight{gap:8px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;margin:12px 16px}
.card.world{border-color:color-mix(in srgb,var(--era-2) 60%,var(--rule));background:color-mix(in srgb,var(--era) 10%,var(--surface))}
.card.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.btn{background:var(--era);color:var(--era-ink);border:0;border-radius:999px;padding:9px 16px;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--rule)}.btn.sm{padding:5px 12px;font-size:12.5px}.btn.big{padding:13px 20px;font-size:15px;width:100%}
.icon{background:var(--raised);border:1px solid var(--rule);border-radius:10px;width:36px;height:36px}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--raised);border:1px solid var(--rule);white-space:nowrap}.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--rule))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{background:var(--raised);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--era);color:var(--era-ink);border-color:var(--era)}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #0004}
.setl .chip{font-size:11.5px;padding:4px 9px}
.choice{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;font-weight:600}
.choice:hover{border-color:var(--era)}
.groups{display:none;gap:6px;padding:10px 16px 0}.grp{flex:1;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:8px 4px;font-weight:700;font-size:13px;position:relative}.grp.on{background:var(--era);color:var(--era-ink);border-color:var(--era)}
@media(max-width:560px){.groups{display:flex}}
.bracelets{display:flex;flex-direction:column;gap:6px;margin-top:8px}.bracelet{display:flex;gap:2px;flex-wrap:wrap}.bracelet i{font-style:normal;font-weight:800;font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#1a1a1a;box-shadow:inset 0 -2px 0 #0002}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}.tcard{border:2px solid;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--raised);font-size:12px;min-height:110px}.tcard .ti{font-size:20px}.tcard .tr{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-top:auto}
#upd-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:70;display:flex;gap:8px;align-items:center;background:var(--raised);border:1px solid var(--era);border-radius:14px;padding:10px 12px;box-shadow:0 8px 30px #0009;width:calc(100% - 24px);max-width:520px;font-size:13px}#upd-banner>span{flex:1;min-width:0}#upd-banner button{flex:none;white-space:nowrap}
#upd-banner button{border:0;border-radius:999px;padding:6px 12px;font-weight:700;background:var(--era);color:var(--era-ink)}#upd-banner button[data-upd=later]{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.newlist{padding-left:18px;margin:8px 0 14px}.newlist li{margin:6px 0}
.review{font-size:26px;color:#ffd166;letter-spacing:2px;margin:6px 0}
.choice.on{border-color:var(--era);background:color-mix(in srgb,var(--era) 18%,var(--raised))}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}.field span{font-size:12px;color:var(--muted)}
.field select,.field input:not([type=range]){background:var(--raised);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;width:100%}
.field input[type=range]{width:100%;accent-color:var(--era)}
.bar{flex:1;height:7px;background:var(--raised);border-radius:99px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--era);border-radius:99px}.bar.warn i{background:var(--warn)}
.statrow{display:flex;align-items:center;gap:10px;margin:6px 0}.statrow>span{width:130px;font-size:12.5px;color:var(--muted)}.statrow>b{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.genre{flex:1;height:8px;border-radius:99px;background:linear-gradient(90deg,#c58a3c,#e88fb4,#7d8a99);position:relative}.genre i{position:absolute;top:-4px;width:4px;height:16px;background:#fff;border-radius:2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.grid3 b{font-size:18px;font-variant-numeric:tabular-nums}.grid3 b.big{font-size:32px;font-family:var(--serif)}
/* top */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;border-bottom:1px solid var(--rule)}
.date{font:600 18px var(--serif)}
.blocks{display:flex;gap:4px;align-items:center}.blocks i{width:12px;height:12px;border-radius:3px;background:var(--era);display:block}.blocks i.used{background:var(--raised);border:1px solid var(--rule)}.blocks .over{color:var(--warn);font-size:12px}
.statline{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}.st{text-align:center;background:var(--surface);border-radius:8px;padding:4px 2px}.st b{display:block;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st span{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;position:sticky;top:0}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;position:relative;white-space:nowrap}
.tab.on{background:var(--era);color:var(--era-ink);border-color:var(--era)}.badge{position:absolute;top:-5px;right:-4px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:0 5px}
/* 3D */
.stagewrap{position:relative;margin:4px 16px 0}
.stage3d{width:100%;height:230px;border-radius:var(--r);overflow:hidden;background:linear-gradient(#0003,#0006),var(--surface);border:1px solid var(--rule);position:relative}
.stage3d.tall{height:300px;margin:12px 0}.stage3d.short{height:170px;margin:8px 0}
.stage3d canvas{display:block;cursor:grab}
.secline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;padding:8px;border:1px dashed var(--rule);border-radius:12px;min-height:44px;align-items:center}
.sec{border:0;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;color:#14111c;background:#bfb6cf;min-height:32px}.sec.s-verse{background:#8ec5ff}.sec.s-chorus{background:#ffd166}.sec.s-pre{background:#b8e0a0}.sec.s-bridge{background:#ff9bb3}.sec.s-post{background:#ffe7a3}.sec.s-key{background:#f7a072}.sec.s-intro,.sec.s-outro{background:#d6cdea}.sec.s-break,.sec.s-solo{background:#9fd8d0}
.crscore{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 4px;padding:8px 10px;border-radius:10px;background:var(--raised);font-size:13px}
.tlist{list-style:none;margin:8px 0;padding:0}.tlist li{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--rule)}.tlist .tn{width:22px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}.tlist .tt{flex:1;min-width:0;display:flex;flex-direction:column}.tlist .tt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkt{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--rule)}.eracontrol{padding:8px 0;border-top:1px solid var(--rule)}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin:8px 0}.city{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;border-bottom:1px solid var(--rule)}.city b{width:22px;text-align:center}
.btn.ghost.on{background:var(--era);color:var(--era-ink)}
.sw-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.swb{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule)}.swb.on{border-color:var(--text);box-shadow:0 0 0 2px var(--era)}
.opp{padding:10px 0;border-top:1px solid var(--rule)}.opp:first-of-type{border-top:0}
.ver-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 16px 0;padding:8px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);font-size:12.5px;color:var(--muted);min-height:44px}
.ver-line .ok{color:#6fcf97}.ver-line .btn{margin-left:auto}.ver-line .dot-new{width:9px;height:9px;border-radius:50%;background:#f2c94c;box-shadow:0 0 0 4px #f2c94c33;flex:none}
.dhist{display:flex;gap:4px;margin:10px 0 2px}.dhist i{flex:1;max-width:18px;aspect-ratio:1;border-radius:4px;border:1px solid var(--rule);background:transparent}.dhist i.won{background:#3fa66b;border-color:#3fa66b}
.stage3d canvas.t3{touch-action:pan-y}

.stage3d.off3d{height:60px}.stage3d.off3d::after{content:"3D is off (turn it on in the menu)";position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.stage3d.no3d::after{content:"3D view needs WebGL";position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.caption{position:absolute;left:10px;bottom:10px;right:10px;background:#000a;border-radius:10px;padding:7px 10px;font-size:13px;pointer-events:none}
.title{padding:calc(env(safe-area-inset-top,0px) + 20px) 0 20px}.title>h1,.title>.between,.title>.eyebrow,.title>.logo,.title>p,.title>.stage3d,.title>.btn{margin-left:16px;margin-right:16px;width:auto}
.title>.btn.big{width:calc(100% - 32px)}
.logo h1{font-size:44px;background:linear-gradient(90deg,#f6d38a,#e88fb4,#8fb8e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.slot,.artist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}.slot:last-child,.artist:last-child{border:0}
.artist{justify-content:flex-start}.artist>div:nth-child(2){flex:1}.artist .sw{width:34px;height:34px;border-radius:8px}.artist.soon{opacity:.8}
/* tasks */
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}.task:first-of-type{border-top:0}
.task .tl{flex:1;min-width:0}.task .cost{color:var(--era-2);font-size:10px;width:30px;letter-spacing:1px}.task.done{opacity:.55}.task.req .tl b::before{content:"● ";color:var(--warn);font-size:10px}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:12px 16px}.actions .btn.big{width:auto}
.actions+.row{margin:0 16px}
.songs{display:flex;flex-direction:column}.song{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--rule)}.song.has b{color:var(--muted)}
.logrow{padding:8px 0;border-top:1px solid var(--rule)}.logrow.sens{opacity:.85}
.msg{padding:9px 0;border-top:1px solid var(--rule);cursor:pointer}.msg.unread b::before{content:"● ";color:var(--era-2)}
.post{padding:6px 0;border-top:1px solid var(--rule)}
.chart{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--rule)}.chart>b{font:700 16px var(--serif);text-align:center}.chart.you{background:color-mix(in srgb,var(--era) 14%,transparent)}.chart.rival>div b::after{content:" · rival";font-weight:400;color:var(--faint);font-size:11px}
.past{opacity:.55}
.coverwrap{display:flex;gap:14px;align-items:center;margin:10px 0;flex-wrap:wrap}.cv{border-radius:6px;box-shadow:0 6px 20px #0008;display:block;max-width:100%;height:auto}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}.sh{display:flex;flex-direction:column;gap:4px}
.spark{width:100%;height:70px;margin-top:8px}
.obj{border-left:3px solid var(--warn);padding-left:10px;margin:8px 0}
.truth{background:color-mix(in srgb,var(--era) 14%,var(--raised));border-radius:10px;padding:10px 12px;margin:8px 0}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92dvh;overflow:auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.modal.sens .sheet{background:#1a1a22}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(120px);background:var(--raised);border:1px solid var(--era);border-radius:12px;padding:10px 14px;max-width:calc(100% - 32px);transition:transform .25s;z-index:60;font-size:13px}.toast.on{transform:translateX(-50%) translateY(0)}
@media(max-width:380px){.statline{grid-template-columns:repeat(3,1fr)}.statrow>span{width:96px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
