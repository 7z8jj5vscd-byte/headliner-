<!doctype html>
<html lang="en" data-theme="modern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Decades">
<meta name="theme-color" content="#2b0b3f">
<meta name="description" content="Start a band in 1965 and survive sixty years of a changing music industry.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Decades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Quicksand:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Audiowide&family=Exo+2:ital,wght@0,400;0,600;0,800;1,800&family=Special+Elite&family=Inter:wght@400;600;800&display=swap">
<style>
/* Each decade re-skins the whole app through these tokens */
html[data-theme=sixties]{
  --bg:#2b0b3f;--hud:#3a0f55;--ink:#fff4e0;--muted:#e3c1ff;--card:rgba(58,14,84,.9);--chip:rgba(255,255,255,.07);--line:#ff8a2a;
  --accent:#ffcc00;--accent-ink:#3a0a4a;--accent2:#ff2e93;--good:#b6ff3b;--bad:#ff6b6b;
  --head:'Shrikhand','Georgia',serif;--body:'Quicksand',system-ui,sans-serif;--r:22px;--rb:999px;
  --bgimg:radial-gradient(circle at 15% 8%,rgba(255,122,24,.55) 0 7%,transparent 26%),radial-gradient(circle at 88% 26%,rgba(255,46,147,.5) 0 6%,transparent 24%),radial-gradient(circle at 25% 78%,rgba(182,255,59,.32) 0 5%,transparent 22%),repeating-radial-gradient(circle at 50% 115%,#3d1060 0 22px,#2b0b3f 22px 44px);
}
html[data-theme=seventies]{
  --bg:#efdcb6;--hud:#5a3418;--ink:#3b2412;--muted:#7a5636;--card:#fbefd6;--chip:#f3e2bf;--line:#c99e62;
  --accent:#d9631e;--accent-ink:#fff7e6;--accent2:#e0a526;--good:#5f7a1e;--bad:#b3261e;
  --head:'Fraunces','Georgia',serif;--body:'Fraunces','Georgia',serif;--r:16px;--rb:12px;
  --bgimg:linear-gradient(180deg,rgba(217,99,30,.10),transparent 40%);
}
html[data-theme=eighties]{
  --bg:#0a0616;--hud:#120a26;--ink:#f6eaff;--muted:#b59ad8;--card:rgba(18,8,38,.92);--chip:rgba(39,232,255,.06);--line:#ff2fd0;
  --accent:#27e8ff;--accent-ink:#0a0616;--accent2:#ff2fd0;--good:#4dffb0;--bad:#ff4d6d;
  --head:'Audiowide','Arial Black',sans-serif;--body:'Exo 2',system-ui,sans-serif;--r:4px;--rb:3px;
  --bgimg:linear-gradient(rgba(255,47,208,.16) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,rgba(39,232,255,.12) 1px,transparent 1px) 0 0/34px 100%,radial-gradient(ellipse at 50% 0%,rgba(255,47,208,.35),transparent 60%);
}
html[data-theme=nineties]{
  --bg:#211f1a;--hud:#2a2721;--ink:#ebe5d3;--muted:#a59e88;--card:#2e2b24;--chip:#36332a;--line:#5d584a;
  --accent:#c9a227;--accent-ink:#1a1812;--accent2:#b5322b;--good:#8fb35a;--bad:#d9534a;
  --head:'Special Elite','Courier New',monospace;--body:'Inter',system-ui,sans-serif;--r:2px;--rb:2px;
  --bgimg:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),repeating-linear-gradient(-30deg,rgba(0,0,0,.25) 0 1px,transparent 1px 7px),linear-gradient(90deg,rgba(181,50,43,.10) 0 18%,transparent 18% 36%,rgba(181,50,43,.08) 36% 54%,transparent 54%);
}
html[data-theme=noughties]{
  --bg:#d9e6f4;--hud:#f4f9ff;--ink:#12304d;--muted:#56708c;--card:linear-gradient(#ffffff,#e9f1fb);--chip:linear-gradient(#ffffff,#e2ecf8);--line:#a7c1de;
  --accent:#1ba1e2;--accent-ink:#ffffff;--accent2:#7cbf2f;--good:#3d9a12;--bad:#d42c2c;
  --head:'Exo 2',system-ui,sans-serif;--body:'Exo 2',system-ui,sans-serif;--r:16px;--rb:999px;
  --bgimg:radial-gradient(ellipse at 50% -10%,#ffffff,transparent 60%),linear-gradient(180deg,#eef5fd,#c9dbef);
}
html[data-theme=modern]{
  --bg:#f5f5f2;--hud:#f5f5f2;--ink:#111111;--muted:#6b6b6b;--card:#ffffff;--chip:#ffffff;--line:#e2e2dd;
  --accent:#111111;--accent-ink:#ffffff;--accent2:#ff4d2e;--good:#11804a;--bad:#d1302b;
  --head:'Inter',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--r:12px;--rb:10px;
  --bgimg:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.1;font-weight:400;text-wrap:balance}
h2{font-size:21px}h3{font-size:17px}
p{margin:0}
html[data-theme=seventies] h1,html[data-theme=seventies] h2,html[data-theme=seventies] h3{font-weight:900;font-style:italic;letter-spacing:-.01em}
html[data-theme=noughties] h1,html[data-theme=noughties] h2,html[data-theme=noughties] h3{font-weight:800;font-style:italic}
html[data-theme=modern] h1,html[data-theme=modern] h2,html[data-theme=modern] h3{font-weight:800;letter-spacing:-.02em}
html[data-theme=sixties] h1,html[data-theme=sixties] h2{color:var(--accent);text-shadow:2px 2px 0 var(--accent2)}
html[data-theme=eighties] h1,html[data-theme=eighties] h2{color:var(--accent);text-shadow:0 0 10px rgba(39,232,255,.6);text-transform:uppercase;letter-spacing:.04em}
html[data-theme=nineties] h1,html[data-theme=nineties] h2{text-transform:lowercase}

.app{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.app.notabs{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}
.small{font-size:13px}
.good{color:var(--good)}.bad{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.view{display:flex;flex-direction:column;gap:14px;padding-top:14px}

/* HUD */
.hud{position:sticky;top:0;z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--hud);border-bottom:1px solid var(--line)}
html[data-theme=seventies] .hud{color:#fbefd6;border-bottom:0}
html[data-theme=seventies] .hud::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(#d9631e 0 33%,#e0a526 33% 66%,#8a4f22 66%)}
html[data-theme=seventies] .hud .muted{color:#e8cfa4}
html[data-theme=noughties] .hud{box-shadow:0 2px 10px rgba(18,48,77,.12)}
.hud-top{display:flex;align-items:center;gap:10px}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:var(--rb);width:40px;height:40px;display:grid;place-items:center;font-size:18px;flex:none}
html[data-theme=seventies] .hud .iconbtn{border-color:#c99e62;color:#fbefd6}
.bandname{font-family:var(--head);font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.year{font-family:var(--head);font-size:30px;line-height:1;color:var(--accent)}
html[data-theme=seventies] .hud .year{color:#e0a526}
.hud-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.hud-stats div{text-align:center;min-width:0}
.hud-stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-stats i{font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.timebar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;position:relative;background:rgba(127,127,127,.25)}
.timebar span{height:100%}
.timebar em{position:absolute;top:-3px;width:3px;height:12px;background:var(--ink);border-radius:2px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--hud);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;letter-spacing:.04em;opacity:.62;min-height:56px}
.tab .ic{font-size:19px;line-height:1}
.tab.on{opacity:1;color:var(--accent)}
html[data-theme=seventies] .tab{color:#fbefd6}
html[data-theme=seventies] .tab.on{color:#e0a526}
.tab .dot{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:var(--accent2);color:#fff;font-size:10px;line-height:16px;padding:0 4px;margin-left:2px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
html[data-theme=sixties] .card{border-width:2px}
html[data-theme=eighties] .card{box-shadow:0 0 0 1px rgba(255,47,208,.25),0 0 18px rgba(255,47,208,.15)}
html[data-theme=nineties] .card{border-style:dashed;transform:rotate(-.25deg)}
html[data-theme=nineties] .card:nth-child(even){transform:rotate(.3deg)}
html[data-theme=noughties] .card{box-shadow:0 1px 0 #fff inset,0 6px 16px rgba(18,48,77,.12)}
html[data-theme=modern] .card{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card.hl{border-color:var(--accent2);border-width:2px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.acc2{background:var(--accent2);border-color:var(--accent2);color:#fff}
.pill.good{border-color:var(--good);color:var(--good)}
.pill.bad{border-color:var(--bad);color:var(--bad)}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--rb);padding:12px 18px;font-weight:800;min-height:46px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:18px;font-family:var(--head)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
html[data-theme=eighties] .btn:not(.ghost):not(.danger){box-shadow:0 0 14px rgba(39,232,255,.55);text-transform:uppercase;letter-spacing:.06em}
html[data-theme=noughties] .btn:not(.ghost):not(.danger){background:linear-gradient(#6fd0f7,#1ba1e2 50%,#0b86c4 51%,#2fb0ea);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 2px 6px rgba(11,134,196,.4);text-shadow:0 -1px 0 rgba(0,0,0,.2)}
html[data-theme=sixties] .btn:not(.ghost):not(.danger){box-shadow:3px 3px 0 var(--accent2)}
html[data-theme=nineties] .btn{text-transform:lowercase;font-family:'Special Elite',monospace;font-weight:400}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips.three{grid-template-columns:1fr 1fr 1fr}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:var(--rb);padding:10px 12px;text-align:left;min-height:48px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
html[data-theme=sixties] .chip,html[data-theme=noughties] .chip{border-radius:16px}
.chip b{font-size:14px;line-height:1.2}
.chip small{font-size:12px;color:var(--muted);line-height:1.25}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:inherit;opacity:.85}
.chip:disabled{opacity:.38;cursor:not-allowed}
.choice{background:var(--chip);border:1px solid var(--line);border-radius:var(--rb);padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:2px;width:100%;min-height:48px}
html[data-theme=sixties] .choice{border-radius:18px}
.choice small{color:var(--muted);font-size:12.5px}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice:active,.chip:active,.btn:active{transform:translateY(1px)}
.ev{border-left-width:5px;border-left-color:var(--accent2)}
.ev .kick{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2)}

.meter{height:6px;background:rgba(127,127,127,.22);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.a2 i{background:var(--accent2)}
.meter.good i{background:var(--good)}.meter.bad i{background:var(--bad)}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.mstats div{font-size:12px}
.mstats .between{font-size:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{min-width:0}
.kv b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.list{display:flex;flex-direction:column}
.list>*{padding:9px 0;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.genre-row{display:grid;grid-template-columns:1fr 90px 46px;gap:10px;align-items:center;font-size:14px}
.genre-row.me b{color:var(--accent2)}
.trend{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:700;list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾";color:var(--muted)}
details[open] summary::after{content:" ▴"}
input[type=text]{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:var(--rb);padding:12px 14px;min-height:46px;font-size:16px}

/* era banner */
.era{position:relative;overflow:hidden}
.era .yr{font-family:var(--head);font-size:52px;line-height:.9;color:var(--accent2)}
.era-rules{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px}
.dots{letter-spacing:2px;color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 4px}
.rline{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.rline .i{flex:none;width:22px;text-align:center}
.delta{font-size:12px;font-weight:700}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;width:min(560px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* title */
.title-hero{padding:calc(env(safe-area-inset-top,0px) + 36px) 0 8px;text-align:center}
.title-hero h1{font-size:58px;letter-spacing:.02em}
.stripes{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px auto 10px;max-width:320px}
.stripes span{flex:1}
.card.slot{flex-direction:row;justify-content:space-between;gap:10px;align-items:center}

/* stage, faces, covers, documentary */
.stage{position:relative;height:230px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--hud);touch-action:pan-y}
.stage canvas{display:block;width:100%!important;height:100%!important}
.stage-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px}
.stage canvas+.stage-fb{display:none}
.stage-cap{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;pointer-events:none}
.portrait{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--chip);border:2px solid var(--line);display:block}
.portrait.lg{width:96px;height:96px}.portrait.sm{width:42px;height:42px}.portrait.xs{width:30px;height:30px;border-width:1px}
.pbtn{background:none;border:0;padding:0;border-radius:50%;flex:none}
.memhead{display:flex;gap:12px;align-items:center;min-width:0}
.faces{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.choice.withimg{flex-direction:row;align-items:center;gap:12px}
.stack0{display:flex;flex-direction:column;gap:2px;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.cover{width:64px;height:64px;border-radius:4px;flex:none;display:block;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.cover.sm{width:56px;height:56px}.cover.lg{width:120px;height:120px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.wall .cover{width:100%;height:auto;aspect-ratio:1}
#doc{position:fixed;inset:0;z-index:80;background:var(--bg)}
#doc::before{content:"";position:absolute;inset:0;background:var(--bgimg);pointer-events:none}
.doc{position:relative;height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.doc-stage{height:min(46vh,380px);flex:none}
.doc-year{font-family:var(--head);font-size:56px;line-height:1;color:var(--accent2)}
.doc-cap{flex:1;overflow:auto;min-height:0}
.doc-cap p{margin:6px 0;font-size:15px}
.doc-ctl{display:flex;gap:8px;justify-content:center}
.doc-bar{height:4px;background:rgba(127,127,127,.25);border-radius:2px;overflow:hidden}
.doc-bar i{display:block;height:100%;background:var(--accent)}
/* guide, tour, manager, trophies */
.feat{display:flex;gap:10px;align-items:center}
.fic{font-size:22px;width:30px;text-align:center;flex:none}
.feat small{font-size:12.5px;line-height:1.3}
.flash{animation:flash .6s ease 4;border-radius:var(--r)}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px var(--accent2)}}
.coach-hl{outline:3px solid var(--accent2)!important;outline-offset:3px;animation:flash 1s ease infinite}
#coach{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
#coach.top{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 110px)}
.coach{pointer-events:auto;width:100%;max-width:520px;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.coach .label{color:inherit;opacity:.7}.coach .row{justify-content:flex-end}
.coach .btn.ghost{color:var(--bg);border-color:currentColor}
.mgr-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--chip);border:2px solid var(--line);flex:none}
.linkbtn{background:none;border:0;padding:4px 0;font-size:12px;color:var(--muted);text-decoration:underline}
.songbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot.new{min-width:8px;width:8px;height:8px;padding:0;vertical-align:top}
.trophies{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trophy{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;opacity:.55;background:var(--chip)}
.trophy.got{opacity:1;border-color:var(--accent)}
.tic{font-size:26px;line-height:1.1}
.trophy small{font-size:12px;color:var(--muted);line-height:1.3}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-dec{font-family:var(--head);font-size:22px;margin:14px 0 6px -22px;color:var(--accent2)}
.tl-item{position:relative;padding:5px 0;font-size:14px}
.tl-item::before{content:"";position:absolute;left:-19px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--muted)}
.tl-item.k-album::before{background:var(--accent)}
.tl-item.k-hit::before{background:var(--accent2)}
.tl-item.k-join::before,.tl-item.k-leave::before,.tl-item.k-lead::before{background:var(--good)}
.tl-item.k-leave::before{background:var(--bad)}
.tl-item.k-split::before,.tl-item.k-reunion::before{width:14px;height:14px;left:-21px;top:9px;background:var(--ink)}
.tl-item .y{font-weight:800;font-variant-numeric:tabular-nums;margin-right:6px}
.tl-item.peak{font-weight:700}
.spark{width:100%;height:auto;display:block}
.hof{text-align:center;padding:22px 16px}
.hof .medal{font-size:56px;line-height:1}
.track{font-size:13px;display:flex;justify-content:space-between;gap:8px;padding:3px 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toasts" id="toasts"></div>
<div id="sheet"></div>
<script>
'use strict';
const START=1965, END=2026, HOF_NEED=160;
const $=(s,r=document)=>r.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const sum=a=>a.reduce((s,x)=>s+x,0);
const chance=p=>Math.random()<p;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const infl=y=>Math.pow(1.045,y-START);
const cost=(base,y=S.year)=>Math.round(base*infl(y)/50)*50;
function fmtN(n){n=Math.round(n);const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(1)+'B';if(a>=1e6)return (n/1e6).toFixed(a>=1e8?0:1)+'M';if(a>=1e4)return Math.round(n/1e3)+'K';if(a>=1e3)return (n/1e3).toFixed(1)+'K';return String(n)}
const fmt$=n=>(n<0?'−$':'$')+fmtN(Math.abs(n));
const sgn=n=>(n>=0?'+':'−')+fmtN(Math.abs(n));
const ord=n=>'#'+n;

/* ---------------- world data ---------------- */
const GENRES={
  folk:{n:'Folk Rock',from:1965,xy:[0,0],base:.08,b:[[1966,4,.85],[2011,4,.3]],c:'#c9a46b'},
  psych:{n:'Psychedelia',from:1966,xy:[2,1.5],base:.04,b:[[1968,2.5,.95],[2014,4,.22]],c:'#b44cff'},
  rock:{n:'Rock',from:1965,xy:[3,0],base:.3,b:[[1972,6,.75],[2003,4,.25]],c:'#d9631e'},
  soul:{n:'Soul & Funk',from:1965,xy:[1,3.5],base:.14,b:[[1970,5,.8],[1997,4,.3]],c:'#e0a526'},
  pop:{n:'Pop',from:1965,xy:[2,3],base:.42,b:[[1985,8,.18],[2012,6,.22]],c:'#ff7eb6'},
  disco:{n:'Disco',from:1974,xy:[2,5.5],base:.02,b:[[1978,1.6,1.05],[2020,2.5,.35]],c:'#ffd23f'},
  punk:{n:'Punk',from:1975,xy:[4.5,1],base:.04,b:[[1977.5,1.8,.8],[2001,3,.5]],c:'#e5383b'},
  newwave:{n:'New Wave & Synth',from:1978,xy:[3,4.5],base:.05,b:[[1983,3,.95],[2008,3,.35]],c:'#27e8ff'},
  metal:{n:'Hair Metal',from:1980,xy:[5.5,.5],base:.03,b:[[1987,2.6,1],[2019,3,.12]],c:'#ff2fd0'},
  grunge:{n:'Grunge',from:1988,xy:[4.5,-.5],base:.04,b:[[1993,2.2,1],[2023,3,.18]],c:'#8a8f5a'},
  indie:{n:'Indie & Alt',from:1984,xy:[3,1.5],base:.08,b:[[1996,3.5,.55],[2008,4,.7]],c:'#7cbf2f'},
  hiphop:{n:'Hip-Hop',from:1979,xy:[.5,6],base:.03,b:[[1990,4,.5],[2002,5,.8],[2019,7,1]],c:'#9b5de5'},
  edm:{n:'EDM',from:1988,xy:[3.5,7],base:.02,b:[[1998,3,.3],[2013,3,1]],c:'#00f5d4'},
};
const GK=Object.keys(GENRES);
function gpop(g,y){const G=GENRES[g];if(!G||y<G.from)return 0;let v=G.base;for(const[p,w,a] of G.b)v+=a*Math.exp(-(((y-p)/w)**2));if(S&&S.noise&&y===S.year)v+=S.noise[g]||0;return clamp(v,.03,1)}
function gdist(a,b){const A=GENRES[a].xy,B=GENRES[b].xy;return clamp(Math.hypot(A[0]-B[0],A[1]-B[1])/7,0,1)}
const avail=y=>GK.filter(g=>GENRES[g].from<=y);

const ERAS=[
  {k:'vinyl',from:1965,to:1974,n:'The Vinyl Age',fmt:'Vinyl LPs & 45s',units:1,roy:1,tour:1.2,merch:0,cat:.5,promo:'radio',d:'Radio and 45s make stars. Records are king; tours mostly sell the records.'},
  {k:'cassette',from:1975,to:1981,n:'The Cassette Era',fmt:'Vinyl & cassette',units:1.15,roy:1,tour:1.4,merch:.3,cat:.6,promo:'radio',d:'Arena rock and home taping. Tapes put music in every car and pocket.'},
  {k:'video',from:1982,to:1990,n:'The Video Age',fmt:'Cassettes, vinyl & videos',units:1.3,roy:1,tour:1.6,merch:.6,cat:.7,promo:'video',d:'VidStar TV plays videos around the clock. Looks matter now, and a great video can make a hit.'},
  {k:'cd',from:1991,to:1999,n:'The CD Boom',fmt:'Compact disc',units:1.8,roy:1.3,tour:1.8,merch:.8,cat:1.6,promo:'video',d:'Everyone is rebuying their record collection on CD. Old hits pay like never before.'},
  {k:'piracy',from:2000,to:2007,n:'The Swapster Years',fmt:'CDs, burned CDs & MP3s',units:.6,roy:.9,tour:2.6,merch:1.2,cat:.5,promo:'web',d:'File-sharing guts record sales. Touring and merch pay the bills now.'},
  {k:'stream',from:2008,to:2015,n:'The Streaming Shift',fmt:'Downloads & streams',units:.35,roy:.5,tour:3.2,merch:1.4,cat:1,promo:'playlist',d:'Fractions of a cent per play. Playlists pick the hits; the road pays the rent.'},
  {k:'viral',from:2016,to:2099,n:'The Loopr Era',fmt:'Streams & short videos',units:.35,roy:.5,tour:3.8,merch:1.6,cat:1.2,promo:'viral',d:'Fifteen seconds on Loopr can turn any song, of any age, into a smash.'},
];
const eraOf=y=>ERAS.find(e=>y>=e.from&&y<=e.to);
const PROMO={
  radio:{n:'Radio plugging',d:'Get DJs spinning the single',cost:1500,chart:6,hype:8},
  video:{n:'Shoot a music video',d:'VidStar TV airplay. Charisma counts',cost:20000,chart:9,hype:12},
  web:{n:'Band website & forums',d:'Build a fan community online',cost:8000,chart:3,hype:6,fans:.06},
  playlist:{n:'Pitch to playlists',d:'Land on the big curated playlists',cost:12000,chart:8,hype:8},
  viral:{n:'Post on Loopr',d:'Gamble on a clip going viral',cost:4000,chart:3,hype:5,viral:.22},
};
const SCALES={
  clubs:{n:'Clubs & bars',cap:25000,cost:3000,walk:8000,need:0,tired:4},
  theaters:{n:'Theaters',cap:200000,cost:45000,walk:15000,need:15000,tired:7},
  arenas:{n:'Arenas',cap:1200000,cost:450000,walk:30000,need:150000,tired:10},
  stadiums:{n:'Stadiums',cap:4000000,cost:3000000,walk:60000,need:800000,tired:13},
};
const SCK=Object.keys(SCALES);
const SETLISTS={new:{n:'New material',d:'Band & critics happier, smaller crowds',fans:1.25,rep:2},mix:{n:'Balanced',d:'A bit of everything',fans:1,rep:0},hits:{n:'Greatest hits',d:'Packed rooms, bored band',fans:.75,rep:-1}};
const setlistMult=k=>k==='new'?.9:k==='hits'?1.05+Math.min(.3,.04*classics()+.015*S.songs.filter(s=>s.peak&&s.peak<=10).length):1;
const BUDGETS=[{n:'Shoestring',cost:0,b:0},{n:'Proper studio',cost:4000,b:6},{n:'Star producer',cost:20000,b:12}];
const FOCUS={
  write:{n:'Write & rehearse',d:'Stockpile songs, get tighter'},
  album:{n:'Record an album',d:'Make and release a record'},
  albumtour:{n:'Album + tour',d:'Release it, then hit the road'},
  tour:{n:'Tour',d:'Play the hits. Hard on the band'},
  rest:{n:'Take a year off',d:'Recharge. Hype fades'},
  split:{n:'Split up',d:'Call it a day. Reunite later?'},
};
const SPLITFOCUS={
  apart:{n:'Stay apart',d:'Let time heal. Nostalgia grows'},
  reunite:{n:'Attempt a reunion',d:'Call everyone. Big tour if it works'},
  retire:{n:'End the story',d:'Close the book on the band'},
};
const TRAITS={Hothead:'Volatile, clashes easily',Perfectionist:'Better records, hates rushing',Peacemaker:'Keeps the peace',
  'Party Animal':'Loves the road, burns out',Visionary:'Always wants to change',Loner:'Drawn to solo work',Showboat:'Wants the spotlight',Steady:'Rarely rattled, loyal'};
const ROLES4=['Vocals','Guitar','Bass','Drums'];
const F40=['Ray','Terry','Dennis','Clive','Neil','Gordon','Alan','Barry','Colin','Eddie','Frankie','Gil','Howie','Ivan','Jasper','Ken','Lenny','Marty','Nate','Ollie','Percy','Rudy','Stan','Vic','Wes','Linda','Carol','Joan','Maggie','Rosie','Sandra','Dot','Gloria','Judy','Peggy','Suzie','Vera','Wanda','Della','Fay'];
const F60=['Kevin','Scott','Darren','Lisa','Tina','Kim','Troy','Shane','Dana','Jodi','Rick','Stacey','Mark','Wendy','Brett','Tony','Dawn','Gary','Lori','Duane','Carla','Mitch','Robin','Nikki'];
const F80=['Jason','Nicole','Chad','Amber','Ryan','Heather','Justin','Kelly','Travis','Jenna','Derek','Misty','Corey','Tara','Josh','Brandy','Kyle','Erin','Marcus','Jade'];
const F00=['Tyler','Madison','Kai','Zoe','Jalen','Ava','Liam','Nova','Mason','Harper','Ezra','Luna','Theo','Riley','Milo','Isla','Jaden','Sky','Rowan','Mila'];
const LAST=['Pike','Dunmore','Hollis','Varga','Quill','Ashby','Brannigan','Cole','Delgado','Esterly','Fenn','Garrow','Hatch','Kowal','Lark','Mercer','Novak','Orr','Pruitt','Rourke','Sable','Tully','Vance','Whitlow','Yarrow','Zell','Okafor','Moreau','Lindqvist','Castellano','Bright','Crane','Doyle','Finch','Gale','Harlow','Ives','Keene','Lowell','Marsh','North','Price','Reyes','Stroud','Thorne','Underhill','Vale','Wilder','Szabo','Achebe','Navarro','Petrakis'];
const INDIES=['Paisley Records','Tin Shed Records','Bluebird Sound','Static Age','Corner Store Records','Lowlight Recordings'];
const MIDS=['Velvet Torch','Harbor Light Music','Sundial Records','Red Kite Records'];
const MAJORS=['Monolith Music Group','Crown & Anchor Records','Goldline Records','Northstar Entertainment','Imperial Wax'];
const W_ADJ=['Electric','Velvet','Silver','Hollow','Golden','Midnight','Paper','Neon','Crimson','Broken','Wild','Quiet','Burning','Distant','Static','Sugar','Lonesome','Restless','Faded','Plastic','Cosmic','Northern','Concrete','Gentle','Strange','Sweet','Endless','Lucky'];
const W_NOUN=['Heart','Highway','River','Summer','Radio','Mirror','Garden','Engine','Weather','Lantern','Satellite','Harbor','Kingdom','Echo','Daydream','Window','Thunder','Diamond','Ocean','Ghost','Paradise','Signal','Fever','Motel','Carousel','Avenue','Horizon','Machine','Telephone','Lighthouse','Comet','Wildfire'];
const W_VERB=['Hold','Chase','Light','Leave','Dance','Burn','Call','Wake','Shake','Follow','Hide','Save','Run','Take','Turn','Catch','Kiss','Find'];
const songTitle=()=>pick([
  ()=>`${pick(W_ADJ)} ${pick(W_NOUN)}`,()=>`${pick(W_VERB)} Me ${pick(['Home','Tonight','Slowly','Under','Again','Down','Gently'])}`,
  ()=>`${pick(W_NOUN)} of ${pick(W_NOUN)}s`,()=>`Don't ${pick(W_VERB).toLowerCase()} the ${pick(W_NOUN)}`,
  ()=>`${pick(W_NOUN)} ${pick(['Song','Blues','Girl','Boy','Baby','Lights','Nights','Talk','Love','Child'])}`,
  ()=>`${pick(W_ADJ)} ${pick(['Nights','Days','Hearts','Lies','Wheels','Dreams','Years','Feelings'])}`,()=>`Last ${pick(W_NOUN)}`,
  ()=>`${pick(W_VERB)} the ${pick(W_NOUN)}`,()=>`${pick(W_NOUN)} (${pick(W_VERB)} It ${pick(['Up','Out','Back','Over'])})`])();
const albumTitle=()=>pick([()=>`${pick(W_ADJ)} ${pick(W_NOUN)}`,()=>`${pick(W_NOUN)}s`,()=>`${pick(W_ADJ)} ${pick(W_NOUN)}s`,()=>`The ${pick(W_NOUN)} Sessions`,
  ()=>`${pick(W_NOUN)} & ${pick(W_NOUN)}`,()=>`Songs from the ${pick(W_NOUN)}`,()=>`${pick(W_ADJ)}`,()=>`Year of the ${pick(W_NOUN)}`])();
const BADJ=['Velvet','Crimson','Paper','Copper','Lonesome','Painted','Hollow','Satin','Wandering','Electric','Midnight','Northern','Glass','Amber','Quiet','Gilded','Tangerine'];
const BNOUN=['Harbors','Lanterns','Sparrows','Engines','Mirrors','Comets','Foxes','Saints','Valleys','Tides','Ravens','Kites','Signals','Orchards','Pilots','Arrows','Weathervanes'];
const bandName=()=>chance(.7)?`The ${pick(BADJ)} ${pick(BNOUN)}`:`${pick(W_NOUN)} ${pick(['Parade','Society','Union','Assembly','Club','Express','Theory','Circus'])}`;
const DEC_COLORS=['#b44cff','#d9631e','#ff2fd0','#8a8f5a','#1ba1e2','#111111'];
const decTheme=y=>y<1970?'sixties':y<1980?'seventies':y<1990?'eighties':y<2000?'nineties':y<2010?'noughties':'modern';

/* ---------------- state helpers ---------------- */
let S=null;
let UI={tab:'year',sheet:null,report:null,setup:null};
const active=()=>S.members.filter(m=>m.status==='active');
const M=id=>S.members.find(m=>m.id===id);
const mn=id=>{const m=M(id);return m?esc(m.name):'Someone'};
const age=m=>S.year-m.born;
const first=m=>esc(m.name.split(' ')[0]);
const classics=()=>S.songs.filter(s=>s.classic).length;
const oldFansTotal=()=>sum(Object.values(S.oldFans||{}));
function tl(kind,text,y=S.year){S.timeline.push({y,kind,text})}
function cohesion(){const a=active();if(!a.length)return 0;let c=avg(a.map(m=>m.mood));if(a.some(m=>m.trait==='Peacemaker'))c+=6;
  c-=S.feuds.filter(f=>M(f[0])?.status==='active'&&M(f[1])?.status==='active').length*8;return clamp(Math.round(c),0,100)}
const feuding=(a,b)=>S.feuds.some(f=>(f[0]===a&&f[1]===b)||(f[0]===b&&f[1]===a));
function addFeud(a,b){if(!feuding(a,b))S.feuds.push([a,b])}
function pickTaste(y){const gs=avail(y+3);const w=gs.map(g=>gpop(g,y+3)+.12);let r=Math.random()*sum(w);for(let i=0;i<gs.length;i++){r-=w[i];if(r<=0)return gs[i]}return gs[0]}
function genMember(...args){const m=genMember0(...args);m.look=genLook(m.id);return m}
function genMember0(role,born,joined,taken=[]){
  const pool=born<1955?F40:born<1970?F60:born<1985?F80:F00;let name;
  do{name=pick(pool)+' '+pick(LAST)}while(taken.includes(name));
  const trait=pick(Object.keys(TRAITS));
  return {id:'m'+Math.random().toString(36).slice(2,9),name,role,born,writing:ri(20,85),chops:ri(30,88),charisma:ri(25,88),
    ego:ri(10,90),loyalty:clamp(ri(35,88)+(trait==='Steady'?12:0),0,100),mood:ri(62,82),trait,taste:pickTaste(joined),
    status:'active',joined,left:null,writer:false,soloY:0,soloHit:0,fame:0,stay:0,promised:null}
}
function genLineup(size){const roles=ROLES4.slice();if(size===5)roles.push(pick(['Keys','Guitar']));const out=[];
  for(const r of roles){out.push(genMember(r,ri(1942,1947),START,out.map(m=>m.name)))}
  out.forEach(m=>m.founder=true);
  const lead=out.slice().sort((a,b)=>b.charisma-a.charisma)[0];
  const ws=out.slice().sort((a,b)=>b.writing-a.writing);ws[0].writer=true;if(ws[1].writing>55)ws[1].writer=true;
  return {members:out,leader:lead.id}}
function ensureLeader(){const a=active();if(!a.length)return;
  if(!a.some(m=>m.id===S.leader)){const n=a.slice().sort((x,y)=>y.charisma-x.charisma)[0];if(S.leader)tl('lead',`${n.name} steps up to front the band`);S.leader=n.id}
  if(!a.some(m=>m.writer)){a.slice().sort((x,y)=>y.writing-x.writing)[0].writer=true}}
function writers(){const a=active();const w=a.filter(m=>m.writer);return w.length?w:a.filter(m=>m.id===S.leader)}
function leave(m,status,why){
  m.status=status;m.left=S.year;m.writer=false;
  const verb={left:'quit the band',fired:'was fired',retired:'retired from music',solo:'left to go solo'}[status]||'left';
  tl('leave',`${m.name} (${m.role.toLowerCase()}) ${verb}${why?': '+why:''}`);
  S.feuds=S.feuds.filter(f=>!(f.includes(m.id)&&status==='retired'));
  if(m.id===S.leader){S.leader=null}
  ensureLeader();
  if(!S.split){const ev={t:'recruit',d:{role:m.role,cands:recruitCands(m.role)}};(S._yearEnd?S.carry:S.pending).push(ev)}
}
function recruitCands(role){const y=S.year;const out=[];for(let i=0;i<3;i++){const c=genMember(role,y-ri(19,31),y,S.members.map(m=>m.name).concat(out.map(o=>o.name)));if(i===0)c.chops=clamp(c.chops+12,0,95);if(i===1)c.writing=clamp(c.writing+12,0,95);out.push(c)}return out}
function hire(c){c.status='active';c.joined=S.year;c.mood=70;S.members.push(c);tl('join',`${c.name} joins on ${c.role.toLowerCase()}`)}

/* ---------------- labels ---------------- */
function labelOffers(){const y=S.year,f=S.fans,inf=infl(y),big=f>300000;const pickNot=(a,used)=>pick(a.filter(x=>!used.includes(x)&&x!==S.label?.name))||pick(a);
  const o=[{name:pickNot(INDIES,[]),type:'indie',roy:1.35,clout:0,adv:0,yrs:4},
    {name:pickNot(MIDS,[]),type:'mid',roy:1.05,clout:3,adv:Math.round(Math.max(1200*inf,f*.25)/100)*100,yrs:5},
    {name:pickNot(MAJORS,[]),type:'major',roy:.8,clout:big?9:6,adv:Math.round(Math.max(3000*inf,f*(big?1.1:.6))/100)*100,yrs:6}];
  if(y>=2005)o.push({name:'Self-release',type:'self',roy:2.6,clout:-4,adv:0,yrs:60});
  if(S.label&&S.label.type!=='self'&&chance(.7))o.push({...S.label,adv:Math.round(Math.max(1000*inf,f*.3)/100)*100,renew:true,name:S.label.name});
  return o}
const labelHint=o=>`${o.type==='self'?'Your own label':o.type==='major'?'Major label':o.type==='mid'?'Mid-size label':'Indie label'} · ${o.adv?fmt$(o.adv)+' advance · ':''}royalties ×${o.roy} · chart push ${o.clout>=0?'+':''}${o.clout}${o.yrs<50?' · '+o.yrs+' yrs':''}`;

/* ---------------- events ---------------- */
const EV={
  label:{kick:'Business',title:d=>d.renew?'Your contract is up':'Record labels are calling',
    text:d=>d.renew?`The deal with ${esc(S.label.name)} has run its course. Re-sign, or take your songs elsewhere.`:`You've been packing out a few local rooms and people are noticing. Pick a home for your records.`,
    choices:d=>d.offers.map((o,i)=>({k:i,label:o.renew?`Re-sign with ${esc(o.name)}`:o.type==='self'?'Go independent':`Sign with ${esc(o.name)}`,hint:labelHint(o)})),
    res(d,k){const o=d.offers[k];S.label={name:o.name,type:o.type,roy:o.roy,clout:o.clout,until:S.year+o.yrs};S.money+=o.adv;
      tl('label',o.type==='self'?'Went independent, releasing records themselves':`Signed to ${o.name}`);return o.type==='self'?'You own your masters now.':`Signed with ${esc(o.name)}${o.adv?' for a '+fmt$(o.adv)+' advance':''}.`}},
  festival:{kick:'Scene',title:()=>'The Meadowlark Festival',text:()=>'Half a million people in a muddy field upstate. The promoters want you on the bill at dawn on Sunday. No pay, no showers, total chaos.',
    choices:()=>[{k:'go',label:'Play the dawn slot',hint:'Hype, fans and cred. Costs travel'},{k:'no',label:'Pass',hint:'Stay home and dry'}],
    res(d,k){if(k==='go'){S.hype+=22;S.fans=Math.round(S.fans*1.3+15000);S.rep+=6;active().forEach(m=>m.mood+=6);S.money-=cost(800);tl('milestone','Played the Meadowlark Festival at dawn');award('mud');return 'A legendary set as the sun came up.'}return 'You stayed home. Everyone else is talking about it.'}},
  vidstar:{kick:'Industry',title:()=>'VidStar TV goes on the air',text:()=>'A new cable channel will play music videos all day, every day. Most bands think it\'s a fad.',

  swapster:{kick:'Industry',title:()=>'Swapster',text:()=>'A file-sharing app lets anyone download your records for free. Your label wants to sue fans. Other bands are posting songs online themselves.',

  loopr:{kick:'Viral',title:d=>`"${esc(d.t)}" is blowing up`,text:d=>`A clip of your ${d.y} song is everywhere on Loopr. Kids who weren't born when you cut it are doing a dance to it.`,

  labelpush:{kick:'Label',title:d=>`${esc(S.label.name)} wants ${GENRES[d.g].n}`,text:d=>`"Nobody's buying ${GENRES[S.genre].n} anymore. Everyone wants ${GENRES[d.g].n}. Give us that or we'll drop you."`,

  offer:{kick:'Offer',title:d=>({ad:'A soda company wants your hit',film:'A film wants your music',tv:'Late-night TV is calling'})[d.kind],

const adMoney=()=>Math.round(cost(15000)*clamp(Math.sqrt(S.fans/100000),.3,6)/100)*100;
function evValid(e){const E=EV[e.t];if(!E)return false;if(E.ok&&!E.ok(e.d))return false;if(S.split&&e.t!=='reunionoffer')return false;
  for(const key of ['m','a','b'])if(e.d&&e.d[key]&&M(e.d[key])?.status!=='active')return false;return true}

/* ---------------- year start ---------------- */
function startYear(){
  const y=S.year,era=eraOf(y);S.news=[];S.yearLog=[];S.flags.viralBoost=0;
  for(const g of GK){S.noise[g]=clamp((S.noise[g]||0)*.7+rnd(-.05,.05),-.12,.12)}
  if(y===START)S.news.push(`You've got a van, a few amps and a name. It's ${y} and records are king.`);
  else if(y===era.from)S.news.push(`<b>${era.n} begins.</b> ${era.d}`);
  for(const g of GK){const p=gpop(g,y),p0=gpop(g,y-1);const n=GENRES[g].n;
    if(y===GENRES[g].from&&y>START)S.news.push(`A new sound is coming out of the underground: <b>${n}</b>.`);
    else if(p>=.6&&p0<.6)S.news.push(`<b>${n}</b> is exploding. Everyone wants it.`);
    else if(p<.4&&p0>=.55)S.news.push(`The <b>${n}</b> bubble has burst.`);}
  S.rumor=GK.filter(g=>GENRES[g].from<=y+2&&gpop(g,y+2)-gpop(g,y)>.25).sort((a,b)=>(gpop(b,y+2)-gpop(b,y))-(gpop(a,y+2)-gpop(a,y)))[0]||null;
  if(S.rival&&!S.rival.split&&y>START+2&&chance(.12))S.news.push(`${esc(S.rival.name)} called your last record "${pick(['dad rock','beige','a cry for help','background music','very brave'])}" in an interview.`);
  const P=[];
  if(S.split){S.plan={focus:'apart'};const ya=y-S.split.y;
    if(ya>=4&&!S.flags.offerY&&chance(.3)||(ya>=4&&S.flags.offerY&&y-S.flags.offerY>=5&&chance(.3))){S.flags.offerY=y;P.push({t:'reunionoffer',d:{amt:Math.round(cost(30000)+S.fans*.8*(1+classics()*.2))}})}
    S.pending=P;S.carry=[];return}
  ensureLeader();
  const pl=S.plan||{};const fo=['split','apart','reunite','retire'].includes(pl.focus)||!pl.focus?'write':pl.focus;
  S.plan={focus:fo,genre:S.genre,setlist:pl.setlist||'mix',single:pl.single||'catchy',budget:pl.budget||0,promo:false,scale:SCK.includes(pl.scale)&&S.fans>=SCALES[pl.scale].need?pl.scale:'clubs'};
  P.push(...(S.carry||[]));S.carry=[];
  if(!S.label||y>=S.label.until)P.push({t:'label',d:{offers:labelOffers(),renew:!!S.label}});
  if(y===1969)P.push({t:'festival',d:{}});
  if(y===1981)P.push({t:'vidstar',d:{}});
  if(y===1985&&S.fans>25000)P.push({t:'charity',d:{}});
  if(y>=1993&&y<=1998&&!S.flags.stripped&&S.fans>60000&&chance(.35))P.push({t:'stripped',d:{}});
  if(y===2000)P.push({t:'swapster',d:{}});

function genRival(st){let name;const w=x=>x.split(' ').filter(t=>t!=='The');do{name=bandName()}while(w(name).some(t=>w(st.name).includes(t)));
  return {name,genre:pick(['rock','pop','soul','folk'].filter(g=>g!==st.genre)),fans:2500,peakFans:2500,albums:[],hits:0,n1:0,split:null,reunions:0}}
function rivalYear(R){const r=S.rival;if(!r)return;const y=S.year;
  if(r.split){r.fans=Math.round(r.fans*.95);if(y-r.split>=5&&chance(.18)){r.split=null;r.reunions++;r.fans=Math.round(r.fans*1.3);R.lines.push({i:'🥊',t:`Your old rivals ${esc(r.name)} have reunited.`});tl('rival',`Rivals ${r.name} reunited`)}return}
  r.fans=Math.round(r.fans*.93)+Math.round(1500+r.fans*.04);
  const hot=avail(y).sort((a,b)=>gpop(b,y)-gpop(a,y))[0];
  if(hot!==r.genre&&gpop(r.genre,y)<.4&&chance(.45)){r.genre=hot;R.lines.push({i:'🥊',t:`Rivals ${esc(r.name)} jumped on the ${GENRES[hot].n} bandwagon.`})}
  if(chance(.55)){const deb=r.albums.length?r.albums[0].y:y;const q=ri(40,86);
    const sc=q*.45+10+gpop(r.genre,y)*22+rnd(0,10)+Math.max(0,Math.log10(r.fans+1)-3)*3+5-Math.max(0,y-deb-18)*.45+rnd(-8,8);
    const pk=chartPeak(sc);let t;do{t=albumTitle()}while(S.albums.some(a=>a.t===t));const al={y,t,peak:pk,g:r.genre};r.albums.push(al);
    if(pk)r.fans+=Math.round(2.5e6/Math.pow(pk,1.1)*.25);if(pk&&pk<=10)r.hits++;if(pk===1)r.n1++;
    if(R.album){const a=R.album.peak||999,b=pk||999;
      if(a<b){S.rivalW=(S.rivalW||0)+1;if(S.rivalW>=3)award('warrior');S.hype+=6;active().forEach(m=>m.mood+=3);R.lines.push({i:'🥊',t:`<b>Chart battle won.</b> "${esc(R.album.t)}" (${ord(a)}) beat ${esc(r.name)}'s "${esc(t)}" (${pk?ord(pk):'no chart'}).`});tl('rival',`Won a chart battle against ${r.name}`)}
      else if(b<a){S.rivalL=(S.rivalL||0)+1;S.hype-=3;active().forEach(m=>m.mood-=m.ego>60?7:3);R.lines.push({i:'🥊',t:`<b>Chart battle lost.</b> ${esc(r.name)}'s "${esc(t)}" (${ord(b)}) beat "${esc(R.album.t)}" (${a<999?ord(a):'no chart'}).`});tl('rival',`Lost a chart battle to ${r.name}`)}}
    else if(pk&&pk<=10)R.lines.push({i:'🥊',t:`Rivals ${esc(r.name)} hit ${ord(pk)} with "${esc(t)}".`})}
  if(y-START>8&&chance(.025)){r.split=y;R.lines.push({i:'🥊',t:`Your rivals ${esc(r.name)} have split up.`});tl('rival',`Rivals ${r.name} split up`)}
  r.peakFans=Math.max(r.peakFans||0,r.fans)}

  const items=S.timeline.filter(t=>t.y===y&&order.includes(t.kind)).sort((a,b)=>order.indexOf(a.kind)-order.indexOf(b.kind)).slice(0,3);
  const al=S.albums.find(a=>a.y===y);const filler=h.split?['Apart. The phones stay quiet.','Solo records and side projects.','Nobody is saying the word "reunion".'][y%3]:['On the road again.','Another year in the van.','Writing, rehearsing, arguing.','Business as usual.'][y%4];

  <div class="doc-ctl"><button class="btn ghost sm" data-a="docprev" aria-label="Previous year">◀</button><button class="btn sm" data-a="docplay">${D.play?'Pause':D.i>=S.hist.length-1?'Replay':'Play'}</button><button class="btn ghost sm" data-a="docnext" aria-label="Next year">▶</button><button class="btn ghost sm" data-a="docspeed">${D.speed}×</button><button class="btn ghost sm" data-a="docsound" aria-label="Sound">${D.sound?'🔊':'🔇'}</button></div></div>`;
  hydrate(el);clearTimeout(AV.docT);const withSong=D.sound&&al&&D.play;if(withSong&&AU.playing!=='doc'+y)playSong('doc'+y,{t:al.t,y,g:al.g},7);
  if(D.play)AV.docT=setTimeout(()=>{if(!UI.doc)return;if(UI.doc.i<S.hist.length-1)UI.doc.i++;else UI.doc.play=false;renderDoc()},(withSong?6500:items.length?1900:900)/D.speed)}

/* ---------------- your songs, as sound ---------------- */
const MODES={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],mix:[0,2,4,5,7,9,10],phr:[0,1,3,5,7,8,10]};
const GSOUND={

  psych:{bpm:108,mode:'dor',drums:'rock',bass:'tri',chord:'pad',wave:'sawtooth',lead:'sawtooth',vib:1,cut:1800},
  rock:{bpm:128,mode:'mix',drums:'rock',bass:'saw',chord:'power',wave:'sawtooth',dist:1,lead:'square',cut:2600},
  soul:{bpm:98,mode:'dor',drums:'soul',bass:'busy',chord:'stab',wave:'square',lead:'triangle',cut:2000,swing:.18},
  pop:{bpm:116,mode:'maj',drums:'pop',bass:'saw',chord:'stab',wave:'square',lead:'square',cut:3000},
  disco:{bpm:120,mode:'min',drums:'disco',bass:'oct',chord:'stab',wave:'sawtooth',lead:'square',cut:3200},
  punk:{bpm:172,mode:'maj',drums:'punk',bass:'saw',chord:'power',wave:'sawtooth',dist:1,lead:null,cut:3000},
  newwave:{bpm:124,mode:'min',drums:'pop',bass:'oct',chord:'arp',wave:'square',lead:'square',cut:3500},
  metal:{bpm:140,mode:'phr',drums:'metal',bass:'saw',chord:'power',wave:'sawtooth',dist:2,lead:'sawtooth',cut:3000},
  grunge:{bpm:90,mode:'min',drums:'rock',bass:'saw',chord:'power',wave:'sawtooth',dist:2,lead:null,cut:1400},
  indie:{bpm:122,mode:'maj',drums:'pop',bass:'saw',chord:'arp',wave:'triangle',lead:'square',cut:2800},
  hiphop:{bpm:90,mode:'min',drums:'boom',bass:'sub',chord:'pad',wave:'triangle',lead:null,cut:1600,swing:.12},
  edm:{bpm:128,mode:'min',drums:'four',bass:'oct',chord:'pad',wave:'sawtooth',lead:'square',cut:4000},
};
// kick / snare / hat, 16 steps per bar
const DRUMS={rock:['x.......x.x.....','....x.......x...','x.x.x.x.x.x.x.x.'],light:['x.......x.......','................','....x.......x...'],
  soul:['x..x......x.....','....x.......x..x','x.xxx.xxx.xxx.x.'],pop:['x.....x.x.......','....x.......x...','x.x.x.x.x.x.x.x.'],
  disco:['x...x...x...x...','....x.......x...','..x...x...x...x.'],four:['x...x...x...x...','....x.......x...','..x...x...x...x.'],
  punk:['x...x...x...x...','..x...x...x...x.','x.x.x.x.x.x.x.x.'],metal:['xx.xxx.xxx.xxx.x','....x.......x...','x.x.x.x.x.x.x.x.'],
  boom:['x.....x...x.....','....x.......x...','x.x.x.x.x.x.x.x.']};
const PROGS=[[0,4,5,3],[0,5,3,4],[0,3,4,4],[5,3,0,4],[0,6,3,4],[0,3,0,4],[0,5,2,3]];
const AU={ctx:null,master:null,playing:null,t:0,noise:null};
function audioCtx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!AU.ctx)AU.ctx=new C();if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx}
function noiseBuf(ctx){if(AU.noise)return AU.noise;const b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return AU.noise=b}
function stopSong(){clearTimeout(AU.t);if(AU.master&&AU.ctx){const m=AU.master;try{m.gain.cancelScheduledValues(AU.ctx.currentTime);m.gain.setTargetAtTime(0,AU.ctx.currentTime,.04)}catch(e){}setTimeout(()=>{try{m.disconnect()}catch(e){}},400)}AU.master=null;AU.playing=null;syncSongButtons()}
function syncSongButtons(){document.querySelectorAll('[data-a=song]').forEach(b=>{const on=b.dataset.v===AU.playing;b.textContent=on?'■ Stop':'▶ Play';b.classList.toggle('on',on)})}
function songSpec(v){if(!S)return null;if(v[0]==='a'){const a=S.albums[+v.slice(1)];return a&&{t:a.t,y:a.y,g:a.g}}
  if(v[0]==='s'){const s=S.songs[+v.slice(1)];if(!s)return null;const a=S.albums.find(x=>x.y===s.y&&x.tracks.includes(s.t));return {t:s.t,y:s.y,g:a?a.g:S.genre}}return null}
const songBtn=v=>`<button class="btn sm ghost songbtn ${AU.playing===v?'on':''}" data-a="song" data-v="${v}">${AU.playing===v?'■ Stop':'▶ Play'}</button>`;
// Every song gets its own short tune: the genre sets tempo, drums and instruments; the decade sets the tone
function playSong(v,spec,maxSec){
  if(AU.playing===v){stopSong();return}stopSong();const ctx=audioCtx();if(!ctx){toast('This device can\'t play audio.');return}spec=spec||songSpec(v);if(!spec)return;
  const G=GSOUND[spec.g]||GSOUND.pop,r=srand(hsh(spec.t+'|'+spec.y)),mode=MODES[G.mode],root=45+Math.floor(r()*10),prog=PROGS[Math.floor(r()*PROGS.length)];
  const bpm=G.bpm+Math.floor(r()*8)-4,st=60/bpm/4,bars=clamp(Math.floor((maxSec||16)/(st*16)),2,8),t0=ctx.currentTime+.08,d=decTheme(spec.y);
  const master=ctx.createGain();master.gain.setValueAtTime(.0001,ctx.currentTime);master.gain.setTargetAtTime(.5,t0,.02);AU.master=master;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value={sixties:3200,seventies:5200,eighties:9000,nineties:7000,noughties:12000,modern:16000}[d];master.connect(lp);lp.connect(ctx.destination);
  if(d==='eighties'||d==='noughties'){const dl=ctx.createDelay();dl.delayTime.value=st*3;const fb=ctx.createGain();fb.gain.value=.28;master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(lp)}
  const drum=ctx.createGain();drum.gain.value=.9;drum.connect(master);const mus=ctx.createGain();mus.connect(master);
  let inst=mus;if(G.dist){const ws=ctx.createWaveShaper(),k=G.dist*40,c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}ws.curve=c;const g=ctx.createGain();g.gain.value=.35;ws.connect(g);g.connect(mus);inst=ws}
  const hz=n=>440*Math.pow(2,(n-69)/12);
  const deg=(dg,oct=0)=>root+mode[((dg%7)+7)%7]+12*(Math.floor(dg/7)+oct);
  const tone=(type,f,t,dur,vol,dest,cut)=>{const o=ctx.createOscillator();o.type=type;o.frequency.value=f;const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let n=o;if(cut){const f2=ctx.createBiquadFilter();f2.type='lowpass';f2.frequency.value=cut;o.connect(f2);n=f2}n.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);
    if(G.vib&&dur>.3){const l=ctx.createOscillator();l.frequency.value=5.5;const lg=ctx.createGain();lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur)}};
  const nz=(t,dur,vol,type,freq)=>{const s=ctx.createBufferSource();s.buffer=noiseBuf(ctx);const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(drum);s.start(t,Math.random()*.5);s.stop(t+dur+.02)};
  const kick=t=>{const o=ctx.createOscillator();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);const g=ctx.createGain();g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(drum);o.start(t);o.stop(t+.32)};
  const pat=DRUMS[G.drums],open=G.drums==='disco'||G.drums==='four';
  for(let b=0;b<bars;b++){const ch=prog[b%4],tri=[deg(ch),deg(ch+2),deg(ch+4)],bn=deg(ch,-1);
    for(let s=0;s<16;s++){const t=t0+(b*16+s)*st+(s%2?(G.swing||0)*st:0);
      if(pat[0][s]==='x')kick(t);if(pat[1][s]==='x')nz(t,.16,.45,'bandpass',1900);if(pat[2][s]==='x')nz(t,open?.12:.04,.12,'highpass',7000);
      if(G.bass==='oct'){if(s%2===0)tone('sawtooth',hz(s%4?bn+12:bn),t,st*1.6,.16,mus,900)}
      else if(G.bass==='sub'){if(s===0||s===10)tone('sine',hz(bn-12),t,st*5,.35,mus)}
      else if(G.bass==='busy'){if(s%8===0||r()<.4)tone('triangle',hz(bn+(r()<.3?7:0)),t,st*1.5,.3,mus)}
      else if(s%(G.drums==='punk'?2:4)===0)tone(G.bass==='tri'?'triangle':'sawtooth',hz(bn),t,st*(G.drums==='punk'?1.8:3.5),G.bass==='tri'?.3:.16,mus,700);
      if(G.chord==='power'){if(s%2===0)for(const n of [deg(ch),deg(ch)+7,deg(ch)+12])tone(G.wave,hz(n),t,st*1.7,.06,inst,G.cut)}
      else if(G.chord==='stab'){if(s%4===2)for(const n of tri)tone(G.wave,hz(n+12),t,st*1.2,.045,inst,G.cut)}
      else if(G.chord==='arp'){if(s%2===0)tone(G.wave,hz(tri[(s/2)%3]+12),t,st*2.5,.08,inst,G.cut)}
      else if(G.chord==='pad'&&s===0)for(const n of tri)tone(G.wave,hz(n+12),t,st*16,.035,inst,G.cut)}
    if(G.lead&&b>=bars/2){let x=Math.floor(r()*5);for(let s=0;s<16;s+=2)if(r()<.55){x=clamp(x+Math.floor(r()*5)-2,-2,9);tone(G.lead,hz(deg(ch+x,1)),t0+(b*16+s)*st,st*(r()<.3?4:2),.07,mus,G.cut*1.5)}}}
  if(d==='sixties'||d==='seventies')for(let i=0;i<bars*6;i++)nz(t0+r()*bars*16*st,.01,.05,'highpass',3000);
  const total=bars*16*st;master.gain.setTargetAtTime(.0001,t0+total-.1,.15);
  AU.playing=v;AU.t=setTimeout(()=>{if(AU.playing===v)stopSong()},(total+.6)*1000);syncSongButtons();
  award('listen');if(S&&S.tried)S.tried.listen=1}

function managerTip(){const T=S.tried||{},y=S.year,hits=S.songs.some(s=>s.peak);
  if(S.split)return {t:y-S.split.y<4?'Give it a few years. Nostalgia builds, and so does the reunion money.':'It might be time. See who is likely to come back below, then try a reunion.'};
  const L=[[!S.label,'First things first: pick a label from the offers above.'],
    [y===START,'Write and rehearse this year to bank songs, then record. Or let me plan it for you.','plan'],
    [!T.restyle&&y>START,"Tap anyone on the stage to change their look. They'll keep it through the decades.",'stage'],
    [!T.music&&S.albums.length>0,'Your album has a cover and its own sound. Have a listen in the Music tab.','listen'],
    [!T.single&&S.material>=20,'When you record, choose what kind of lead single to push.','single'],
    [cohesion()<35,'The band is fraying. A year off, or giving people what they want, will help.','chem'],
    [gpop(S.genre,y)<.22,`${GENRES[S.genre].n} is out of fashion. Reinvent, or stay the course and wait for a revival.`,'sound'],
    [!T.scene&&y>=START+3,`Keep an eye on the Scene tab: trends, era rules and your rivals, ${S.rival?esc(S.rival.name):''}.`,'rival'],
    [!T.setlist&&hits,'On tour, a greatest-hits setlist sells more tickets. The band may get bored.','setlist'],
    [!T.doc&&S.hist.length>=12,'You have a story worth telling. Watch the documentary in the History tab.','doc'],
    [!T.guide,'Tap ? at the top any time to see every feature in the game.','guide'],
    [!T.trophies&&y>=START+8,'Check the trophy room for ideas. Locked trophies hint at things to try.','trophies']];
  const hit=L.find(x=>x[0]);if(hit)return {t:hit[1],k:hit[2]};
  const e=eraOf(y);return {t:['piracy','stream','viral'].includes(e.k)?'Records barely pay now. The road is where the money is.':e.k==='cd'?'Everyone is rebuying old records on CD. Hits from your past pay well right now.':e.k==='video'?'Looks sell records now. A video with a charismatic frontperson goes a long way.':'Records are king in this era. A strong album with a radio push is the way up.',k:'era'}}
function managerPlan(){const P=S.plan;let why;
  if(cohesion()<35){P.focus='rest';why='Morale is low. Everyone needs a break.'}
  else if(S.material<18){P.focus='write';why='You need more songs before the next record.'}
  else{P.focus=S.fans>=12000?'albumtour':'album';why=P.focus==='album'?'You have the songs. Record them.':'You have the songs. Record them and take them on the road.'}
  let best='clubs';for(const k of SCK){if(S.fans>=SCALES[k].need&&tourDemand(k)/SCALES[k].cap>=.65)best=k}P.scale=best;
  P.budget=0;for(let i=2;i>0;i--)if(cost(BUDGETS[i].cost)<=Math.max(0,S.money)*.35){P.budget=i;break}
  P.promo=['album','albumtour'].includes(P.focus)&&promoCost()<=Math.max(0,S.money)*.25;
  P.setlist=classics()>=2?'hits':'mix';P.single=gpop(S.genre,S.year)<.3?'trend':'catchy';P.genre=S.genre;
  if(planSpend()>Math.max(0,S.money)){P.promo=false;P.budget=0}
  if(S.tried)S.tried.manager=1;award('manager');return why}
