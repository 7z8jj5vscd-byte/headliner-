<!doctype html>
<html lang="en" data-theme="modern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Decades</title>

<style>
/* Each decade re-skins the whole app through these tokens */
html[data-theme=sixties]{
  --bg:#2b0b3f;--hud:#3a0f55;--ink:#fff4e0;--muted:#e3c1ff;--card:rgba(58,14,84,.9);--chip:rgba(255,255,255,.07);--line:#ff8a2a;
  --accent:#ffcc00;--accent-ink:#3a0a4a;--accent2:#ff2e93;--good:#b6ff3b;--bad:#ff6b6b;
  --head:'Shrikhand','Georgia',serif;--body:'Quicksand',system-ui,sans-serif;--r:22px;--rb:999px;
  --bgimg:radial-gradient(circle at 15% 8%,rgba(255,122,24,.55) 0 7%,transparent 26%),radial-gradient(circle at 88% 26%,rgba(255,46,147,.5) 0 6%,transparent 24%),radial-gradient(circle at 25% 78%,rgba(182,255,59,.32) 0 5%,transparent 22%),repeating-radial-gradient(circle at 50% 115%,#3d1060 0 22px,#2b0b3f 22px 44px);
}
html[data-theme=seventies]{
  --bg:#efdcb6;--hud:#5a3418;--ink:#3b2412;--muted:#7a5636;--card:#fbefd6;--chip:#f3e2bf;--line:#c99e62;
  --accent:#d9631e;--accent-ink:#fff7e6;--accent2:#e0a526;--good:#5f7a1e;--bad:#b3261e;
  --head:'Fraunces','Georgia',serif;--body:'Fraunces','Georgia',serif;--r:16px;--rb:12px;
  --bgimg:linear-gradient(180deg,rgba(217,99,30,.10),transparent 40%);
}
html[data-theme=eighties]{
  --bg:#0a0616;--hud:#120a26;--ink:#f6eaff;--muted:#b59ad8;--card:rgba(18,8,38,.92);--chip:rgba(39,232,255,.06);--line:#ff2fd0;
  --accent:#27e8ff;--accent-ink:#0a0616;--accent2:#ff2fd0;--good:#4dffb0;--bad:#ff4d6d;
  --head:'Audiowide','Arial Black',sans-serif;--body:'Exo 2',system-ui,sans-serif;--r:4px;--rb:3px;
  --bgimg:linear-gradient(rgba(255,47,208,.16) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,rgba(39,232,255,.12) 1px,transparent 1px) 0 0/34px 100%,radial-gradient(ellipse at 50% 0%,rgba(255,47,208,.35),transparent 60%);
}
html[data-theme=nineties]{
  --bg:#211f1a;--hud:#2a2721;--ink:#ebe5d3;--muted:#a59e88;--card:#2e2b24;--chip:#36332a;--line:#5d584a;
  --accent:#c9a227;--accent-ink:#1a1812;--accent2:#b5322b;--good:#8fb35a;--bad:#d9534a;
  --head:'Special Elite','Courier New',monospace;--body:'Inter',system-ui,sans-serif;--r:2px;--rb:2px;
  --bgimg:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),repeating-linear-gradient(-30deg,rgba(0,0,0,.25) 0 1px,transparent 1px 7px),linear-gradient(90deg,rgba(181,50,43,.10) 0 18%,transparent 18% 36%,rgba(181,50,43,.08) 36% 54%,transparent 54%);
}
html[data-theme=noughties]{
  --bg:#d9e6f4;--hud:#f4f9ff;--ink:#12304d;--muted:#56708c;--card:linear-gradient(#ffffff,#e9f1fb);--chip:linear-gradient(#ffffff,#e2ecf8);--line:#a7c1de;
  --accent:#1ba1e2;--accent-ink:#ffffff;--accent2:#7cbf2f;--good:#3d9a12;--bad:#d42c2c;
  --head:'Exo 2',system-ui,sans-serif;--body:'Exo 2',system-ui,sans-serif;--r:16px;--rb:999px;
  --bgimg:radial-gradient(ellipse at 50% -10%,#ffffff,transparent 60%),linear-gradient(180deg,#eef5fd,#c9dbef);
}
html[data-theme=modern]{
  --bg:#f5f5f2;--hud:#f5f5f2;--ink:#111111;--muted:#6b6b6b;--card:#ffffff;--chip:#ffffff;--line:#e2e2dd;
  --accent:#111111;--accent-ink:#ffffff;--accent2:#ff4d2e;--good:#11804a;--bad:#d1302b;
  --head:'Inter',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--r:12px;--rb:10px;
  --bgimg:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.1;font-weight:400;text-wrap:balance}
h2{font-size:21px}h3{font-size:17px}
p{margin:0}
html[data-theme=seventies] h1,html[data-theme=seventies] h2,html[data-theme=seventies] h3{font-weight:900;font-style:italic;letter-spacing:-.01em}
html[data-theme=noughties] h1,html[data-theme=noughties] h2,html[data-theme=noughties] h3{font-weight:800;font-style:italic}
html[data-theme=modern] h1,html[data-theme=modern] h2,html[data-theme=modern] h3{font-weight:800;letter-spacing:-.02em}
html[data-theme=sixties] h1,html[data-theme=sixties] h2{color:var(--accent);text-shadow:2px 2px 0 var(--accent2)}
html[data-theme=eighties] h1,html[data-theme=eighties] h2{color:var(--accent);text-shadow:0 0 10px rgba(39,232,255,.6);text-transform:uppercase;letter-spacing:.04em}
html[data-theme=nineties] h1,html[data-theme=nineties] h2{text-transform:lowercase}

.app{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.app.notabs{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}
.small{font-size:13px}
.good{color:var(--good)}.bad{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.view{display:flex;flex-direction:column;gap:14px;padding-top:14px}

/* HUD */
.hud{position:sticky;top:0;z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--hud);border-bottom:1px solid var(--line)}
html[data-theme=seventies] .hud{color:#fbefd6;border-bottom:0}
html[data-theme=seventies] .hud::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(#d9631e 0 33%,#e0a526 33% 66%,#8a4f22 66%)}
html[data-theme=seventies] .hud .muted{color:#e8cfa4}
html[data-theme=noughties] .hud{box-shadow:0 2px 10px rgba(18,48,77,.12)}
.hud-top{display:flex;align-items:center;gap:10px}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:var(--rb);width:40px;height:40px;display:grid;place-items:center;font-size:18px;flex:none}
html[data-theme=seventies] .hud .iconbtn{border-color:#c99e62;color:#fbefd6}
.bandname{font-family:var(--head);font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.year{font-family:var(--head);font-size:30px;line-height:1;color:var(--accent)}
html[data-theme=seventies] .hud .year{color:#e0a526}
.hud-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.hud-stats div{text-align:center;min-width:0}
.hud-stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-stats i{font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.timebar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;position:relative;background:rgba(127,127,127,.25)}
.timebar span{height:100%}
.timebar em{position:absolute;top:-3px;width:3px;height:12px;background:var(--ink);border-radius:2px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--hud);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;letter-spacing:.04em;opacity:.62;min-height:56px}
.tab .ic{font-size:19px;line-height:1}
.tab.on{opacity:1;color:var(--accent)}
html[data-theme=seventies] .tab{color:#fbefd6}
html[data-theme=seventies] .tab.on{color:#e0a526}
.tab .dot{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:var(--accent2);color:#fff;font-size:10px;line-height:16px;padding:0 4px;margin-left:2px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
html[data-theme=sixties] .card{border-width:2px}
html[data-theme=eighties] .card{box-shadow:0 0 0 1px rgba(255,47,208,.25),0 0 18px rgba(255,47,208,.15)}
html[data-theme=nineties] .card{border-style:dashed;transform:rotate(-.25deg)}
html[data-theme=nineties] .card:nth-child(even){transform:rotate(.3deg)}
html[data-theme=noughties] .card{box-shadow:0 1px 0 #fff inset,0 6px 16px rgba(18,48,77,.12)}
html[data-theme=modern] .card{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card.hl{border-color:var(--accent2);border-width:2px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.acc2{background:var(--accent2);border-color:var(--accent2);color:#fff}
.pill.good{border-color:var(--good);color:var(--good)}
.pill.bad{border-color:var(--bad);color:var(--bad)}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--rb);padding:12px 18px;font-weight:800;min-height:46px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:18px;font-family:var(--head)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
html[data-theme=eighties] .btn:not(.ghost):not(.danger){box-shadow:0 0 14px rgba(39,232,255,.55);text-transform:uppercase;letter-spacing:.06em}
html[data-theme=noughties] .btn:not(.ghost):not(.danger){background:linear-gradient(#6fd0f7,#1ba1e2 50%,#0b86c4 51%,#2fb0ea);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 2px 6px rgba(11,134,196,.4);text-shadow:0 -1px 0 rgba(0,0,0,.2)}
html[data-theme=sixties] .btn:not(.ghost):not(.danger){box-shadow:3px 3px 0 var(--accent2)}
html[data-theme=nineties] .btn{text-transform:lowercase;font-family:'Special Elite',monospace;font-weight:400}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips.three{grid-template-columns:1fr 1fr 1fr}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:var(--rb);padding:10px 12px;text-align:left;min-height:48px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
html[data-theme=sixties] .chip,html[data-theme=noughties] .chip{border-radius:16px}
.chip b{font-size:14px;line-height:1.2}
.chip small{font-size:12px;color:var(--muted);line-height:1.25}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:inherit;opacity:.85}
.chip:disabled{opacity:.38;cursor:not-allowed}
.choice{background:var(--chip);border:1px solid var(--line);border-radius:var(--rb);padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:2px;width:100%;min-height:48px}
html[data-theme=sixties] .choice{border-radius:18px}
.choice small{color:var(--muted);font-size:12.5px}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice:active,.chip:active,.btn:active{transform:translateY(1px)}
.ev{border-left-width:5px;border-left-color:var(--accent2)}
.ev .kick{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2)}

.meter{height:6px;background:rgba(127,127,127,.22);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.a2 i{background:var(--accent2)}
.meter.good i{background:var(--good)}.meter.bad i{background:var(--bad)}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.mstats div{font-size:12px}
.mstats .between{font-size:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{min-width:0}
.kv b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.list{display:flex;flex-direction:column}
.list>*{padding:9px 0;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.genre-row{display:grid;grid-template-columns:1fr 90px 46px;gap:10px;align-items:center;font-size:14px}
.genre-row.me b{color:var(--accent2)}
.trend{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:700;list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾";color:var(--muted)}
details[open] summary::after{content:" ▴"}
input[type=text]{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:var(--rb);padding:12px 14px;min-height:46px;font-size:16px}

/* era banner */
.era{position:relative;overflow:hidden}
.era .yr{font-family:var(--head);font-size:52px;line-height:.9;color:var(--accent2)}
.era-rules{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px}
.dots{letter-spacing:2px;color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 4px}
.rline{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.rline .i{flex:none;width:22px;text-align:center}
.delta{font-size:12px;font-weight:700}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;width:min(560px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* title */
.title-hero{padding:calc(env(safe-area-inset-top,0px) + 36px) 0 8px;text-align:center}
.title-hero h1{font-size:58px;letter-spacing:.02em}
.stripes{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px auto 10px;max-width:320px}
.stripes span{flex:1}
.card.slot{flex-direction:row;justify-content:space-between;gap:10px;align-items:center}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-dec{font-family:var(--head);font-size:22px;margin:14px 0 6px -22px;color:var(--accent2)}
.tl-item{position:relative;padding:5px 0;font-size:14px}
.tl-item::before{content:"";position:absolute;left:-19px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--muted)}
.tl-item.k-album::before{background:var(--accent)}
.tl-item.k-hit::before{background:var(--accent2)}
.tl-item.k-join::before,.tl-item.k-leave::before,.tl-item.k-lead::before{background:var(--good)}
.tl-item.k-leave::before{background:var(--bad)}
.tl-item.k-split::before,.tl-item.k-reunion::before{width:14px;height:14px;left:-21px;top:9px;background:var(--ink)}
.tl-item .y{font-weight:800;font-variant-numeric:tabular-nums;margin-right:6px}
.tl-item.peak{font-weight:700}
.spark{width:100%;height:auto;display:block}
.hof{text-align:center;padding:22px 16px}
.hof .medal{font-size:56px;line-height:1}
.track{font-size:13px;display:flex;justify-content:space-between;gap:8px;padding:3px 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toasts" id="toasts"></div>
<div id="sheet"></div>
<script>
'use strict';
const START=1965, END=2026, HOF_NEED=160;
const $=(s,r=document)=>r.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const sum=a=>a.reduce((s,x)=>s+x,0);
const chance=p=>Math.random()<p;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const infl=y=>Math.pow(1.045,y-START);
const cost=(base,y=S.year)=>Math.round(base*infl(y)/50)*50;
function fmtN(n){n=Math.round(n);const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(1)+'B';if(a>=1e6)return (n/1e6).toFixed(a>=1e8?0:1)+'M';if(a>=1e4)return Math.round(n/1e3)+'K';if(a>=1e3)return (n/1e3).toFixed(1)+'K';return String(n)}
const fmt$=n=>(n<0?'−$':'$')+fmtN(Math.abs(n));
const sgn=n=>(n>=0?'+':'−')+fmtN(Math.abs(n));
const ord=n=>'#'+n;

/* ---------------- world data ---------------- */
const GENRES={
  folk:{n:'Folk Rock',from:1965,xy:[0,0],base:.08,b:[[1966,4,.85],[2011,4,.3]],c:'#c9a46b'},
  psych:{n:'Psychedelia',from:1966,xy:[2,1.5],base:.04,b:[[1968,2.5,.95],[2014,4,.22]],c:'#b44cff'},
  rock:{n:'Rock',from:1965,xy:[3,0],base:.3,b:[[1972,6,.75],[2003,4,.25]],c:'#d9631e'},
  soul:{n:'Soul & Funk',from:1965,xy:[1,3.5],base:.14,b:[[1970,5,.8],[1997,4,.3]],c:'#e0a526'},
  pop:{n:'Pop',from:1965,xy:[2,3],base:.42,b:[[1985,8,.18],[2012,6,.22]],c:'#ff7eb6'},
  disco:{n:'Disco',from:1974,xy:[2,5.5],base:.02,b:[[1978,1.6,1.05],[2020,2.5,.35]],c:'#ffd23f'},

  direction:{kick:'Band',title:d=>`${mn(d.m)} wants to go ${GENRES[M(d.m).taste].n}`,text:d=>{const m=M(d.m);return `${first(m)} has been playing ${GENRES[m.taste].n} records on the bus for months. "We sound like yesterday. That's where it's going."`},

const adMoney=()=>Math.round(cost(15000)*clamp(Math.sqrt(S.fans/100000),.3,6)/100)*100;
function evValid(e){const E=EV[e.t];if(!E)return false;if(E.ok&&!E.ok(e.d))return false;if(S.split&&e.t!=='reunionoffer')return false;
  for(const key of ['m','a','b'])if(e.d&&e.d[key]&&M(e.d[key])?.status!=='active')return false;return true}

/* ---------------- year start ---------------- */
function startYear(){
  const y=S.year,era=eraOf(y);S.news=[];S.yearLog=[];S.flags.viralBoost=0;
  for(const g of GK){S.noise[g]=clamp((S.noise[g]||0)*.7+rnd(-.05,.05),-.12,.12)}
  if(y===START)S.news.push(`You've got a van, a few amps and a name. It's ${y} and records are king.`);
  else if(y===era.from)S.news.push(`<b>${era.n} begins.</b> ${era.d}`);
  for(const g of GK){const p=gpop(g,y),p0=gpop(g,y-1);const n=GENRES[g].n;
    if(y===GENRES[g].from&&y>START)S.news.push(`A new sound is coming out of the underground: <b>${n}</b>.`);
    else if(p>=.6&&p0<.6)S.news.push(`<b>${n}</b> is exploding. Everyone wants it.`);
    else if(p<.4&&p0>=.55)S.news.push(`The <b>${n}</b> bubble has burst.`);}
  S.rumor=GK.filter(g=>GENRES[g].from<=y+2&&gpop(g,y+2)-gpop(g,y)>.25).sort((a,b)=>(gpop(b,y+2)-gpop(b,y))-(gpop(a,y+2)-gpop(a,y)))[0]||null;
  const P=[];
  if(S.split){S.plan={focus:'apart'};const ya=y-S.split.y;
    if(ya>=4&&!S.flags.offerY&&chance(.3)||(ya>=4&&S.flags.offerY&&y-S.flags.offerY>=5&&chance(.3))){S.flags.offerY=y;P.push({t:'reunionoffer',d:{amt:Math.round(cost(30000)+S.fans*.8*(1+classics()*.2))}})}
    S.pending=P;S.carry=[];return}
  ensureLeader();
  const pl=S.plan||{};const fo=['split','apart','reunite','retire'].includes(pl.focus)||!pl.focus?'write':pl.focus;
  S.plan={focus:fo,genre:S.genre,budget:pl.budget||0,promo:false,scale:SCK.includes(pl.scale)&&S.fans>=SCALES[pl.scale].need?pl.scale:'clubs'};
  P.push(...(S.carry||[]));S.carry=[];
  if(!S.label||y>=S.label.until)P.push({t:'label',d:{offers:labelOffers(),renew:!!S.label}});
  if(y===1969)P.push({t:'festival',d:{}});
  if(y===1981)P.push({t:'vidstar',d:{}});
  if(y===1985&&S.fans>25000)P.push({t:'charity',d:{}});
  if(y>=1993&&y<=1998&&!S.flags.stripped&&S.fans>60000&&chance(.35))P.push({t:'stripped',d:{}});
  if(y===2000)P.push({t:'swapster',d:{}});
  if(y===2008||(S.licensed===false&&(y===2012||y===2017||y===2022)))P.push({t:'wavely',d:{}});
  if(y>=2016&&chance(.2)){const cands=[];S.albums.forEach(a=>a.tracks.forEach(t=>{if(y-a.y>=8)cands.push({t,y:a.y})}));if(cands.length){const old=cands.filter(c=>y-c.y>=20);const c=pick(old.length&&chance(.7)?old:cands);P.push({t:'loopr',d:c})}}
  if(S.money<0)P.push({t:'debt',d:{}});
  const a=active();const used=new Set();
  if(a.length>=2&&cohesion()<22)P.push({t:'breaking',d:{}});
  for(const m of a){if(age(m)>=64&&m.stay<y&&chance(.1+(age(m)-64)*.035)){P.push({t:'retire',d:{m:m.id}});used.add(m.id)}}
  for(const m of a){if(used.has(m.id))continue;if(m.mood<28&&chance(.45+(60-m.loyalty)/120)){P.push({t:'quit',d:{m:m.id}});used.add(m.id)}}
  for(const m of a){if(used.has(m.id))continue;if(m.soloHit===y-1&&chance(.65)){P.push({t:'solohit',d:{m:m.id}});used.add(m.id)}}
  if(S.label&&S.label.type==='major'&&y<S.label.until){const hot=avail(y).sort((p,q)=>gpop(q,y)-gpop(p,y))[0];if(hot!==S.genre&&gpop(S.genre,y)<.32&&gpop(hot,y)>.7&&chance(.4))P.push({t:'labelpush',d:{g:hot}})}
  const egoAvg=avg(a.map(m=>m.ego));let n=(chance(.8)?1:0)+(chance(.25+egoAvg/250)?1:0);
  const free=()=>a.filter(m=>!used.has(m.id));
  const DR=[
    ['direction',3,()=>{const c=free().filter(m=>m.taste!==S.genre&&GENRES[m.taste].from<=y&&(m.ego>30||m.trait==='Visionary'));return c.length&&{m:pick(c).id}}],
    ['solo',2,()=>{const c=free().filter(m=>(!m.soloY||y-m.soloY>4)&&(m.ego>55||m.trait==='Loner')&&S.fans>5000);return c.length&&{m:pick(c).id}}],
    ['clash',3,()=>{const c=free().filter(m=>m.ego>50||m.trait==='Hothead');if(c.length<2)return null;const x=pick(c);const ys=c.filter(q=>q!==x&&!feuding(q.id,x.id));return ys.length&&{a:x.id,b:pick(ys).id}}],
    ['credits',2,()=>{const c=free().filter(m=>!m.writer&&m.writing>=56&&m.ego>=40);return c.length&&{m:pick(c).id}}],
    ['lead',2,()=>{const c=free().filter(m=>m.id!==S.leader&&(m.trait==='Showboat'||m.ego>74)&&m.charisma>45);return c.length&&{m:pick(c).id}}],
    ['burnout',2,()=>{if(!['tour','albumtour'].includes(S.lastFocus))return null;const c=free().filter(m=>m.trait==='Party Animal'||age(m)>50||m.mood<50);return c.length&&{m:pick(c).id}}],
    ['offer',2,()=>S.fans>20000&&{kind:pick(S.songs.some(s=>s.peak&&s.peak<=20)?['ad','film','tv']:['film','tv'])}],
  ];
  const usedT=new Set();
  for(let i=0;i<n&&P.length<4;i++){const opts=DR.filter(r=>!usedT.has(r[0])).map(r=>[r,r[2]()]).filter(x=>x[1]);if(!opts.length)break;
    const tw=sum(opts.map(o=>o[0][1]));let r=Math.random()*tw,ch=opts[0];for(const o of opts){r-=o[0][1];if(r<=0){ch=o;break}}
    usedT.add(ch[0][0]);const d=ch[1];['m','a','b'].forEach(k=>d[k]&&used.add(d[k]));P.push({t:ch[0][0],d})}
  if(a.length<2&&!P.some(e=>e.t==='recruit'))P.push({t:'recruit',d:{role:a.some(m=>m.role==='Vocals')?'Guitar':'Vocals',cands:recruitCands(a.some(m=>m.role==='Vocals')?'Guitar':'Vocals')}});
  S.pending=P;
}
function doSplit(why){
  for(const m of active()){m.status='split'}
  S.split={y:S.year,why};S.splits++;S.pending=[];S.carry=[];S.plan={focus:'apart'};
  tl('split',`${S.name} broke up${why?' ('+why+')':''}`);
}

/* ---------------- economics ---------------- */
function perUnit(y=S.year){const e=eraOf(y);return .35*infl(y)*e.roy*(S.label?S.label.roy:1)}
function chartPeak(score){const p=Math.round(Math.pow(10,(100-score)/20));return p<=100?Math.max(1,p):null}
function tourDemand(scale,nost=1){const sc=SCALES[scale];const a=active();
  return (S.fans*.35+oldFansTotal()*.03)*(.5+clamp(S.hype,0,100)/100)*(1+.06*classics())*nost+sc.walk*(.6+avg(a.map(m=>m.chops))/100)}
function promoKey(){return eraOf(S.year).promo}
function promoCost(){return cost(PROMO[promoKey()].cost)}
function planSpend(){const p=S.plan;let c=0;if(['album','albumtour'].includes(p.focus))c+=cost(BUDGETS[p.budget].cost);if(p.promo&&['album','albumtour','tour'].includes(p.focus))c+=promoCost();return c}
function livingCost(){return active().length*cost(1500)}

/* ---------------- playing a year ---------------- */
function playYear(){
  const y=S.year;const R={y,pre:S.yearLog.slice(),lines:[],album:null,tour:null,money0:S.money,fans0:S.fans,hype0:S.hype,chem0:cohesion(),focus:S.plan.focus,reinvent:null,events:[]};
  S.yearRes=R;
  if(S.split)playSplitYear(R);else playBandYear(R);
  if(S.over)return;
  endOfYear(R);
}
function catalogIncome(R){const e=eraOf(S.year);let c=0;const lic=(e.k==='stream'||e.k==='viral')?(S.licensed===false?.25:1):1;
  for(const s of S.songs){if(!s.peak||s.peak>40)continue;let v=(41-s.peak)*90*infl(S.year)*e.cat*lic;if(s.classic)v*=3;if(s.viral===S.year)v*=6;c+=v}
  for(const a of S.albums){c+=a.units*.012*perUnit()*e.cat*lic*(S.year-a.y<3?0:1)}
  if(S.pubSold)c*=.45;c=Math.round(c);if(c>0){S.money+=c;R.lines.push({i:'💿',t:`Back catalog earned ${fmt$(c)}${e.k==='cd'?' (CD reissues!)':''}.`})}R.catalog=c;return c}
function reinvent(g,R){
  const from=S.genre,d=gdist(from,g);const keep=clamp(classics()*.02,0,.15);const lost=Math.round(S.fans*(0.08+.45*d)*(1-keep));
  S.fans-=lost;S.oldFans[from]=(S.oldFans[from]||0)+lost;const back=Math.round((S.oldFans[g]||0)*.5);S.fans+=back;S.oldFans[g]=(S.oldFans[g]||0)-back;
  S.genre=g;S.genreSince=S.year;S.reinvents++;if(!S.fam[g])S.fam[g]=15;

function vSetup(){const u=UI.setup;const g0=['rock','folk','soul','pop'];
  return `<div class="title-hero" style="padding-bottom:0"><div class="label">Slot ${u.slot} · ${START}</div><h1 style="font-size:40px">Form a band</h1></div><div class="view">
  <div class="card"><div class="label">Band name</div><div class="row" style="flex-wrap:nowrap"><input type="text" id="bandname" maxlength="40" value="${esc(u.name)}" autocomplete="off"><button class="btn ghost" data-a="rname" aria-label="Random name">🎲</button></div></div>
  <div class="card"><div class="label">Starting sound</div><div class="chips">${g0.map(g=>`<button class="chip ${u.genre===g?'on':''}" data-a="sgenre" data-v="${g}"><b>${GENRES[g].n}</b><small>${Math.round(gpop(g,START)*100)}% popular in ${START}</small></button>`).join('')}</div></div>
  <div class="card"><div class="between"><div class="label">The lineup</div><div class="row"><button class="chip ${u.size===4?'on':''}" data-a="ssize" data-v="4" style="min-height:36px"><b>4-piece</b></button><button class="chip ${u.size===5?'on':''}" data-a="ssize" data-v="5" style="min-height:36px"><b>5-piece</b></button></div></div>
  <div class="list">${u.members.map(m=>`<div><div class="between"><b>${esc(m.name)}</b><span class="small">${m.id===u.leader?'<span class="pill acc2">Leader</span> ':''}${m.writer?'<span class="pill acc">Writer</span>':''}</span></div><div class="small muted">${m.role} · age ${START-m.born} · ${m.trait} · writing ${m.writing} · chops ${m.chops} · ego ${m.ego} · into ${GENRES[m.taste].n}</div></div>`).join('')}</div>
  <button class="btn ghost" data-a="reroll">🎲 Different people</button></div>
  <button class="btn big wide" data-a="start">Start in ${START}</button><button class="btn ghost wide" data-a="totitle">Back</button></div>`}
function renderSheet(){const el=$('#sheet');
  if(UI.report&&S){const R=UI.report;const dm=R.money1-R.money0,df=R.fans1-R.fans0;const over=S.over;
    el.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-label="Year in review"><div class="between"><div><div class="label">Year in review</div><h2>${R.y}</h2></div><span class="pill">${esc(eraOf(R.y).n)}</span></div>
    <div class="kv"><div><b class="${dm>=0?'good':'bad'}">${dm>=0?'+':'−'}${fmt$(Math.abs(dm)).replace('$','$')}</b><span>money</span></div><div><b class="${df>=0?'good':'bad'}">${sgn(df)}</b><span>fans</span></div><div><b>${Math.round(R.hype1)}</b><span>hype</span></div></div>
    ${R.pre.length?`<div class="stack" style="gap:6px">${R.pre.map(t=>`<div class="rline"><span class="i">✔︎</span><span>${t}</span></div>`).join('')}</div>`:''}
    <div class="stack" style="gap:8px">${R.lines.map(l=>`<div class="rline"><span class="i">${l.i}</span><span>${l.t}</span></div>`).join('')}</div>
    <button class="btn big wide" data-a="closereport">${over?'See the legacy':'On to '+(R.y+1)+' ▸'}</button></div></div>`;return}
  if(UI.sheet){el.innerHTML=`<div class="scrim" data-a="closesheet"><div class="sheet" data-stop="1">${UI.sheet}</div></div>`;return}
  el.innerHTML=''}
function toast(t){const box=$('#toasts');box.innerHTML='';const el=document.createElement('div');el.className='toast';el.innerHTML=t;box.appendChild(el);setTimeout(()=>el.remove(),2600)}

/* ---------------- actions ---------------- */
const ACT={
  tab(v){UI.tab=v;render();window.scrollTo(0,0)},
  focus(v){S.plan.focus=v;if(v==='rest'||v==='split')S.plan.genre=S.genre;if(v!=='album'&&v!=='albumtour'&&v!=='tour')S.plan.promo=false;render()},
  genre(v){S.plan.genre=v;render()},
  budget(v){S.plan.budget=+v;render()},
  scale(v){S.plan.scale=v;render()},
  promo(){S.plan.promo=!S.plan.promo;render()},
  choose(v){const [i,k]=v.split('|');const e=S.pending[+i];if(!e)return;const E=EV[e.t];const key=isNaN(+k)?k:+k;
    S.pending.splice(+i,1);const msg=E.res(e.d,key);if(msg)S.yearLog.push(msg);save();render()},
  play(){if(S.pending.filter(evValid).length)return;playYear();render()},
  closereport(){UI.report=null;render();window.scrollTo(0,0)},
  leader(id){const m=M(id),old=M(S.leader);if(old&&old.ego>50)old.mood-=10;m.mood+=8;S.leader=id;S.flags.leadY=S.year;tl('lead',`${m.name} becomes the face of the band`);toast(`${first(m)} now leads the band.`);save();render()},
  writer(id){const m=M(id);if(m.writer&&active().filter(x=>x.writer).length<=1){toast('Someone has to write the songs.');return}m.writer=!m.writer;save();render()},
  fire(id){const m=M(id);UI.sheet=`<h2>Fire ${esc(m.name)}?</h2><p class="small">They'll be gone for good (unless a reunion brings them back). Loyal members won't like it.</p><div class="row"><button class="btn danger" data-a="firey" data-v="${id}">Fire them</button><button class="btn ghost" data-a="closesheet">Cancel</button></div>`;render()},
  firey(id){const m=M(id);UI.sheet=null;active().filter(x=>x!==m).forEach(x=>{if(feuding(x.id,m.id))x.mood+=8;else if(x.trait==='Peacemaker'||x.loyalty>70)x.mood-=5});leave(m,'fired');toast(`${first(m)} is out.`);save();render()},
  closesheet(){UI.sheet=null;render()},
  menu(){UI.sheet=`<h2>${esc(S.name)}</h2><p class="small muted">Slot ${S.slot} · saved automatically every year.</p><button class="btn wide" data-a="totitle">Save & exit to title</button><button class="btn ghost wide" data-a="closesheet">Back to ${S.year}</button>`;render()},
  endnow(){UI.sheet=`<h2>End the career now?</h2><p class="small">The band's story ends in ${S.year} and you'll see the full history and whether you make the Hall of Sound.</p><div class="row"><button class="btn danger" data-a="endy">End it</button><button class="btn ghost" data-a="closesheet">Keep playing</button></div>`;render()},
  endy(){UI.sheet=null;finish('retired');render();window.scrollTo(0,0)},
  totitle(){save();S=null;UI.sheet=null;UI.report=null;UI.setup=null;render();window.scrollTo(0,0)},
  new(v){newSetup(+v);render();window.scrollTo(0,0)},
  load(v){const s=readSlot(+v);if(!s){toast('That save could not be read.');return}S=s;S.slot=+v;UI.tab='year';UI.report=null;render();window.scrollTo(0,0)},
  del(v){const s=readSlot(+v);UI.sheet=`<h2>Delete ${esc(s?s.name:'this save')}?</h2><p class="small">This can't be undone.</p><div class="row"><button class="btn danger" data-a="dely" data-v="${v}">Delete</button><button class="btn ghost" data-a="closesheet">Cancel</button></div>`;render()},
  dely(v){delSlot(+v);UI.sheet=null;render()},
  rname(){UI.setup.name=bandName();render()},
  sgenre(v){UI.setup.name=$('#bandname')?.value||UI.setup.name;UI.setup.genre=v;render()},
  ssize(v){UI.setup.name=$('#bandname')?.value||UI.setup.name;UI.setup.size=+v;Object.assign(UI.setup,genLineup(+v));render()},
  reroll(){UI.setup.name=$('#bandname')?.value||UI.setup.name;Object.assign(UI.setup,genLineup(UI.setup.size));render()},
  start(){startGame()},
};
document.addEventListener('click',e=>{if(e.target.closest('[data-stop]')&&!e.target.closest('[data-a]'))return;const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(b.classList.contains('scrim')&&e.target!==b)return;const f=ACT[b.dataset.a];if(f)f(b.dataset.v,b)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet){UI.sheet=null;render()}});
window.DECADES={get S(){return S},set S(v){S=v},playYear,startYear,render,UI,EV,legacy,gpop};
(function boot(){render()})();
</script>
</body>
</html>
