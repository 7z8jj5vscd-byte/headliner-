<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Festival Tycoon">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Found and run a music festival: build the site, book the acts, sell the tickets and survive the weekend.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Festival Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style>
/* True-black flat: elevation by lightness alone, hi-vis lime only on data */
:root{
  --ground:#000;--surface:#111;--raised:#1d1d1d;--raised2:#2a2a2a;--border:#1a1a1a;--rule:#1c1c1c;--control:#444;
  --text:#fff;--muted:#b4b4b4;--faint:#949494;
  --accent:#c6f24e;--accent-dim:#222a10;--positive:#c6f24e;--negative:#ff6369;--warning:#e5a93b;
  --pill-pos-bg:#222a10;--pill-pos:#c6f24e;--pill-neg-bg:#2c1a1c;--pill-neg:#ff7a7f;--pill-warn-bg:#2b2414;--pill-warn:#e5a93b;--pill-n-bg:#222;--pill-n:#fff;
  --chart-2:#e6e6e6;--chart-3:#6b6b6b;
  --r-card:18px;--r-in:12px;--r-ctl:999px;
  --gap:12px;--pad:16px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --top:calc(52px + env(safe-area-inset-top,0px));--tabs:calc(58px + env(safe-area-inset-bottom,0px));
  --sl:max(16px,env(safe-area-inset-left,0px));--sr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:dark}
html,body{margin:0;background:var(--ground);color:var(--text);-webkit-text-size-adjust:100%;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2;text-wrap:balance}
h1{font-size:20px;letter-spacing:-.01em}h2{font-size:16px}h3{font-size:14px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.pos{color:var(--positive)}.neg{color:var(--negative)}.warn{color:var(--warning)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);padding:env(safe-area-inset-top,0px) var(--sr) 0 var(--sl);display:flex;align-items:center;gap:10px;background:var(--ground);border-bottom:1px solid var(--rule);z-index:30}
.mark{width:26px;height:26px;flex:none}
.tb-name{min-width:0;flex:1}
.tb-name b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-name span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-cash{text-align:right;padding-left:10px;border-left:1px solid var(--rule);height:34px;display:flex;flex-direction:column;justify-content:center}
.tb-cash b{font-size:15px;font-weight:600}
.tb-cash span{font-size:12px;color:var(--muted)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:999px;margin-right:-10px;color:var(--muted)}
.iconbtn:active{background:var(--raised)}
.tabs{position:fixed;left:0;right:0;bottom:0;height:var(--tabs);padding:0 var(--sr) env(safe-area-inset-bottom,0px) var(--sl);display:grid;grid-template-columns:repeat(6,1fr);background:var(--ground);border-top:1px solid var(--rule);z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#bbb;min-height:48px;position:relative}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab[aria-current=page]{color:#fff}
.tab[aria-current=page]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:#fff;border-radius:2px}
.tab .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--negative);color:#000;font-size:11px;font-weight:600;line-height:16px;padding:0 4px}
main{padding:calc(var(--top) + 16px) var(--sr) calc(var(--tabs) + 24px) var(--sl);max-width:720px;margin:0 auto}
main.full{padding:0;max-width:none}
main.notabs{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}

/* blocks */
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
.title-row h1{flex:1;min-width:0}
.sub{color:var(--muted);margin-bottom:16px}
.finding{background:var(--surface);border-radius:var(--r-in);padding:12px 14px;margin-bottom:var(--gap);display:flex;gap:10px;align-items:flex-start}
.finding .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--warning);flex:none}
.finding.bad .bar{background:var(--negative)}.finding.good .bar{background:var(--accent)}
.card{background:var(--surface);border-radius:var(--r-card);padding:var(--pad);margin-bottom:var(--gap)}
.card>h2{margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card>h2 small{font-size:12px;font-weight:400;color:var(--muted)}
.sec{font-size:14px;font-weight:600;margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-weight:400;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:var(--r-card);margin-bottom:var(--gap);overflow:hidden}
.kpi{padding:12px 16px;min-width:0}
.kpi:nth-child(odd){border-right:1px solid var(--rule)}
.kpi:nth-child(n+3){border-top:1px solid var(--rule)}
.kpi label{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gate{margin:4px 0 2px}
.gate .track{height:14px;border-radius:7px;background:var(--raised2);position:relative;overflow:hidden}
.gate .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:7px}
.gate .fill2{position:absolute;top:0;bottom:0;background:#e6e6e6;opacity:.85}
.gate .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
.gate .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list{margin:0;padding:0;list-style:none}
.list>li,.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);min-height:48px}
.list>li:first-child{border-top:0}
.li .grow,.list .grow{flex:1;min-width:0}
.li b,.list b{font-weight:500}
.li .meta,.list .meta{font-size:12px;color:var(--muted)}
.right{text-align:right;flex:none}
.meta.neg{color:var(--negative)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;background:var(--pill-n-bg);color:var(--pill-n);white-space:nowrap;vertical-align:1px}
.pill.pos{background:var(--pill-pos-bg);color:var(--pill-pos)}.pill.neg{background:var(--pill-neg-bg);color:var(--pill-neg)}.pill.warn{background:var(--pill-warn-bg);color:var(--pill-warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:999px;background:#fff;color:#000;font-weight:600;white-space:nowrap;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px var(--control)}
.btn.ghost:active{background:var(--raised)}
.btn.quiet{background:var(--raised2);color:#fff}
.btn.danger{background:var(--negative);color:#000}
.btn.wide{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px;gap:2px;margin-bottom:var(--gap);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;height:36px;padding:0 12px;border-radius:999px;color:#bbb;font-size:13px;font-weight:500;white-space:nowrap;min-width:max-content}
.seg button[aria-pressed=true]{background:var(--raised2);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 13px;border-radius:999px;background:var(--surface);color:#bbb;font-size:13px;white-space:nowrap;flex:none}
.chip[aria-pressed=true]{background:#fff;color:#000;font-weight:500}
.stepper{display:inline-flex;align-items:center;background:var(--raised2);border-radius:999px;height:36px}
.stepper button{width:36px;height:36px;border-radius:999px;font-size:18px;line-height:1}
.stepper button:active{background:#3a3a3a}
.stepper output{min-width:60px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-weight:400;color:var(--muted);font-size:12px;text-align:left;padding:6px 0;border-bottom:1px solid var(--rule)}
.t td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.t tr.total td{font-weight:600;border-bottom:0;padding-top:10px}
.t tr.grp td{color:var(--muted);font-size:12px;padding-top:14px}
.meter{height:6px;border-radius:3px;background:var(--raised2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.warn i{background:var(--warning)}.meter.neg i{background:var(--negative)}
.empty{border:1px dashed #333;border-radius:var(--r-in);padding:12px 14px;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--raised);border-radius:var(--r-in);padding:12px;min-width:0;text-align:left}
.tile[aria-pressed=true]{box-shadow:inset 0 0 0 2px #fff}
.tile b{display:block;font-weight:600}
.tile small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.input{width:100%;height:44px;border-radius:var(--r-in);border:1px solid var(--control);background:var(--ground);padding:0 14px;font-size:16px}
.slider{width:100%;accent-color:#fff;height:32px}
.feed{max-height:none}
.feed li{align-items:flex-start}
.feed time{font-size:12px;color:var(--faint);width:44px;flex:none;padding-top:1px;font-variant-numeric:tabular-nums}
.avatar{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:600;font-size:13px;color:#000}
.stars{color:var(--accent);letter-spacing:1px}
.tag-new{color:var(--accent);font-size:12px}

/* site screen */
#stage3d{position:fixed;left:0;right:0;top:var(--top);bottom:var(--tabs);touch-action:none;background:#0b0f08;overflow:hidden}
#stage3d canvas{display:block;width:100%;height:100%;touch-action:none}
.site-hud{position:fixed;left:var(--sl);right:var(--sr);top:calc(var(--top) + 10px);z-index:12;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.site-hud>*{pointer-events:auto}
.hudbar{display:flex;gap:0;background:rgba(17,17,17,.94);border-radius:14px;overflow:hidden}
.hudbar div{flex:1;padding:7px 10px;min-width:0;border-left:1px solid #222}
.hudbar div:first-child{border-left:0}
.hudbar label{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.hudbar b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.overlays{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.overlays::-webkit-scrollbar{display:none}
.overlays .chip{background:rgba(17,17,17,.94);height:32px}
.overlays .chip[aria-pressed=true]{background:#fff}
.palette{position:fixed;left:0;right:0;bottom:var(--tabs);z-index:12;background:var(--ground);border-top:1px solid var(--rule);padding:10px 0 10px}
.pal-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 var(--sr) 8px var(--sl)}
.pal-cats::-webkit-scrollbar,.pal-items::-webkit-scrollbar{display:none}
.pal-cats .chip{height:30px;font-size:12px}
.pal-items{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 var(--sr) 0 var(--sl);scroll-snap-type:x proximity}
.pal{flex:none;width:118px;background:var(--surface);border-radius:14px;padding:9px 10px;text-align:left;scroll-snap-align:start;min-height:72px}
.pal[aria-pressed=true]{box-shadow:inset 0 0 0 2px #fff;background:var(--raised)}
.pal b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.pal small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pal .sw{width:12px;height:12px;border-radius:3px;margin:0 0 6px 0;display:block}
.inspect{position:fixed;left:var(--sl);right:var(--sr);bottom:calc(var(--tabs) + 12px);z-index:14;background:var(--raised);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.inspect h3{font-size:15px;margin-bottom:2px}
.inspect .row{margin-top:10px;flex-wrap:nowrap}
.inspect .row .btn{flex:1;padding:0 10px}
.inspect .warnline{font-size:12px;margin-top:6px}
.legend3d{position:fixed;right:var(--sr);z-index:12;background:rgba(17,17,17,.94);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--muted);max-width:180px}
.ramp{height:8px;border-radius:4px;margin:4px 0 2px}

/* live weekend */
.live-hud{position:fixed;left:var(--sl);right:var(--sr);top:calc(var(--top) + 10px);z-index:12;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.live-hud>*{pointer-events:auto}
.clock{display:flex;align-items:center;gap:10px;background:rgba(17,17,17,.95);border-radius:14px;padding:8px 12px}
.clock .t{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock .d{font-size:12px;color:var(--muted);line-height:1.25;flex:1;min-width:0}
.clock .d b{color:#fff;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-panel{position:fixed;left:0;right:0;bottom:0;z-index:14;background:var(--ground);border-top:1px solid var(--rule);padding:10px var(--sr) calc(10px + env(safe-area-inset-bottom,0px)) var(--sl);max-height:46vh;display:flex;flex-direction:column}
.live-panel .chips{flex:none;margin-bottom:8px}
.live-panel .feed{overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.live-controls{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.live-controls .seg{margin:0;flex:1}
.decision{background:var(--raised);border-radius:18px;padding:14px;margin-bottom:8px}
.decision h3{font-size:15px;margin-bottom:4px}
.decision p{color:var(--muted);font-size:13px;margin-bottom:10px}
.decision .opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--raised2);border-radius:12px;padding:10px 12px;min-height:48px}
.opt:active{background:#383838}
.opt b{font-weight:500;font-size:14px}
.opt small{display:block;color:var(--muted);font-size:12px}
.mini-kpis{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(17,17,17,.95);border-radius:14px}
.mini-kpis div{padding:6px 8px;border-left:1px solid #222;min-width:0}
.mini-kpis div:first-child{border-left:0}
.mini-kpis label{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-kpis b{display:block;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px var(--sr) calc(20px + env(safe-area-inset-bottom,0px)) var(--sl);animation:up .22s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:#3a3a3a;margin:2px auto 12px}
.sheet h2{font-size:18px;margin-bottom:4px}
.sheet .sub{margin-bottom:14px}
.sheet .card{background:var(--raised)}
.sheet .chip{background:var(--raised2)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabs) + 16px);transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-weight:500;z-index:80;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fade .2s;text-align:center;font-size:13px}

/* title */
.title-screen{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 28px) var(--sr) calc(28px + env(safe-area-inset-bottom,0px)) var(--sl);max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.hero3d{height:280px;border-radius:22px;overflow:hidden;margin:18px 0 18px;background:#0b0f08;position:relative}
.hero3d canvas{width:100%!important;height:100%!important;display:block}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:26px;letter-spacing:-.02em}
.brand p{color:var(--muted);font-size:13px}
.slot{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px;min-height:64px}
.slot .grow{flex:1;min-width:0}
.slot b{display:block;font-weight:600}
.slot span{display:block;color:var(--muted);font-size:12px}
.sitepick{display:flex;flex-direction:column;gap:8px}
.sitepick .tile{display:flex;gap:12px;align-items:flex-start;padding:12px}
.sitepick .tile .mapthumb{width:56px;height:74px;border-radius:8px;flex:none}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--faint);font-size:11px;font-family:var(--font)}
.lineup-day{margin-bottom:var(--gap)}
.slotrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule);min-height:52px;width:100%;text-align:left}
.slotrow:first-of-type{border-top:0}
.slotrow .time{width:44px;flex:none;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.slotrow .who{flex:1;min-width:0}
.slotrow .who b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotrow .who span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotrow.open .who b{color:var(--faint);font-weight:400}
.fame{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--raised2);vertical-align:middle;overflow:hidden}
.fame i{display:block;height:100%;background:#e6e6e6}
.tr-up{color:var(--accent)}.tr-down{color:var(--faint)}
.doc{white-space:pre-line}
.coach{position:fixed;left:var(--sl);right:var(--sr);bottom:calc(var(--tabs) + 12px);z-index:40;background:#fff;color:#000;border-radius:18px;padding:14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.coach p{font-size:14px;margin-bottom:10px}
.coach .row .btn{background:#000;color:#fff}
.coach .row .btn.ghost{background:transparent;color:#000;box-shadow:inset 0 0 0 1px #bbb}
@media (min-width:700px){
  .kpis{grid-template-columns:repeat(4,1fr)}

function feeOf(a,S,extra=1){
  const infl=Math.pow(1.04,(S?S.year:1)-1);
  let f=600*Math.exp(.075*a.fame)*infl*(1+Math.max(0,a.fame-90)*.25);
  if(a.genre==='electronic')f*=.88;if(a.genre==='jazz'||a.genre==='folk')f*=.8;if(a.genre==='pop'||a.genre==='hiphop')f*=1.1;
  f*=routing(a).m;
  return Math.round(f*extra/250)*250}
function routing(a){if(a.home==='UK')return{m:1,t:'UK act'};if(a.tour)return{m:.9,t:'On a European run'};return{m:1.35,t:'Fly-in from '+a.home}}

function tierOf(f){return f>=80?'Headline':f>=62?'Major':f>=42?'Mid':f>=22?'Rising':'New'}

/* ---------- festival identity ---------- */
const IDENT={

/* ---------- decision inbox (shared with the story) ---------- */

/* ---------- discovery stage: unsigned acts (names invented) ---------- */

function bookDemo(s,id){const d=(s.demos||[]).find(x=>x.id===id);const st=discStage(s);if(!d||!st)return 'Build a Discovery stage first.';
  for(let day=0;day<3;day++)for(let i=0;i<SLOTS.disc.length;i++){if(slotAt(s,st.id,day,i))continue;
    const a={id:d.id,name:d.name,genre:d.genre,fame:ri(2,9),pot:d.pot,mom:d.pot>65?rnd(6,10):rnd(1,4),live:clamp(Math.round(50+d.pot*.4+rnd(-8,8)),40,95),rel:.97,diva:0,age:0,ag:pick(AGENCIES).k,agent:'(unsigned)',home:'UK',size:pick([3,4,5]),tour:0,hist:[2],first:s.year,unsigned:1,disc:s.year};

    return a.name+' will open the Discovery stage on '+DAYL[day]+'.'}
  return 'The Discovery stage is full.'}

/* ---------- clashes and moving sets ---------- */
function clashes(s){const out=[];const st=stagesOf(s);for(let d=0;d<3;d++){const sets=[];for(const p of st)SLOTS[p.t].forEach((sd,i)=>{const b=slotAt(s,p.id,d,i);if(!b||b.st!=='signed')return;const a=act(b.actId);if(a.fame<58)return;const t=slotTime(s,p,i,d);sets.push({b,a,p,t,en:t+sd[1]})});
  for(let i=0;i<sets.length;i++)for(let j=i+1;j<sets.length;j++){const x=sets[i],y=sets[j];if(x.p===y.p)continue;const ov=Math.min(x.en,y.en)-Math.max(x.t,y.t);if(ov>=.5)out.push({d,x,y})}}return out}
function freeSlots(s,day){const out=[];for(const p of stagesOf(s))SLOTS[p.t].forEach((sd,i)=>{if(!slotAt(s,p.id,day,i))out.push({p,i,t:slotTime(s,p,i,day)})});return out}

  const rank=(t,i)=>(isMain(t)?0:t==='tent'?10:t==='dance'?12:20)+i;const old=s.pl.find(q=>q.id===b.stage);const down=rank(p.t,slot)>rank(old?old.t:'small',b.slot);
  b.stage=stageId;b.slot=slot;if(down){b.mood=(b.mood||0)-2;s.agRel[a.ag]=clamp((s.agRel[a.ag]||50)-2,0,100);return a.name+'’s team aren’t thrilled about the new slot.'}return a.name+' moved.'}

/* ---------- artist mood, legacy, duets ---------- */
function perfBonus(s,x){let p=((x.b.mood||0)*.05);p+=identGenre(s,x.a)>1?.05:0;return p}
function liveExtras(s,ctx){const L=s.live,{A,d,h,wx,play,P}=ctx;const I=identOf(s);
  for(const x of play){const key='seen'+x.b.id;if(L[key])continue;L[key]=1;
    if(x.b.secret){L.boost=(L.boost||0)+4;s.hype=clamp(s.hype+6,0,100);logL(s,'SECRET SET: '+x.a.name+' walk out on the '+stageName(s,x.p)+'. The field goes wild.','good');x.b.mood=(x.b.mood||0)+1;if(!L.viral&&chance(.3)){L.viral='The secret '+x.a.name+' set went viral ('+ri(4,16)+'m views)';L.moment=L.viral}}
    if(x.a.first&&x.a.first<s.year&&x.a.fame>=55){L.boost=(L.boost||0)+2;logL(s,x.a.name+' on stage: “We played the '+(x.a.disc?'Discovery stage':'small stage')+' here in '+(START_YEAR+x.a.first-1)+'. Thank you for taking a chance on us.”','good')}
    if(x.a.unsigned&&x.slot===0&&x.p.t==='disc'&&L.played[x.b.id]>.5)logL(s,x.a.name+' (unsigned) leave the Discovery stage tent rammed. Two A&Rs swap numbers at the bar.','good')}

  if(h>=19&&!L.usedEv['duet'+d]){const now=play.filter(x=>x.a.fame>=45&&!L.stopped[x.p.id]);for(const x of now){const mate=signed(s).find(b=>b.day===d&&b.id!==x.b.id&&act(b.actId).genre===x.a.genre&&act(b.actId).fame>=45&&L.played[b.id]!=null);
      if(mate&&chance(.18+(x.b.mood||0)*.04)){L.usedEv['duet'+d]=1;const m=act(mate.actId);L.boost=(L.boost||0)+3;logL(s,x.a.name+' bring out '+m.name+' for a surprise duet!','good');if(!L.viral&&chance(.3)){L.viral=x.a.name+' and '+m.name+'’s surprise duet went viral ('+ri(3,14)+'m views)';L.moment=L.viral}break}}}
  // clashes split the crowd
  if(play.filter(x=>x.a.fame>=62&&!L.stopped[x.p.id]).length>=2&&!L.usedEv['clash'+d]&&h>=18){L.usedEv['clash'+d]=1;L.boost=(L.boost||0)-2;fanPostRaw(s,pick(HANDLES),'who decided '+play.filter(x=>x.a.fame>=62).slice(0,2).map(x=>x.a.name).join(' and ')+' should clash?? running between stages')}

function overnightExtras(s,A,d){const L=s.live;const camp=SITES[s.site].camping;if(!camp)return;const N=L.onsite;
  const late=s.pl.filter(p=>p.t==='late').length,sil=s.pl.filter(p=>p.t==='silent').length;

  if(sil){const v=Math.round(N*.15*6*Math.min(1,sil*.8));L.inc['Silent disco']=(L.inc['Silent disco']||0)+v/1.2;logL(s,'Silent disco: '+fmtK(N*.15)+' people singing along to headphones in a silent field.','')}}

/* ---------- regular fans ---------- */
const REG_NAMES=[['Dot','retired teacher who has never missed a front row'],['Kemi','nurse who books the same pitch every year'],['Big Steve','builder with a flag on a fishing pole'],['Ffion','student who saved all year for her ticket'],['Raj & Lou','couple who met in your campsite queue']];

  if(ctx.wx.rain>2)t=pick(['year '+(r.yrs+1)+' and the mud never wins','brought spare socks for the whole row']);

  else t=pick(['same spot as always, best view on site','back for year '+(r.yrs+1)+'. home.','the steward remembered my name!!',r.n==='Dot'?'front row again. knees are 64, heart is 19':'already crying and it’s only '+hhmm(ctx.h)]);

  if(ctx.h<13)t=r.n+' is putting up the tent and arguing with a guy rope.';else if(ctx.bq>1.4&&chance(.5))t=r.n+' has been in the bar queue for '+Math.round(Math.min(60,ctx.bq*14))+' minutes.';else if(ctx.loo>1.3&&chance(.5))t=r.n+' gave up on the toilet queue.';

const MENU={craft:{n:'Craft beer bar',spend:1.08,serve:.95,d:'+8% spend, a little slower'},cocktails:{n:'Cocktail bus',spend:1.1,serve:.9,d:'+10% spend, slower service'},cider:{n:'Cider tent',spend:1.03,serve:1,d:'+3% spend'},water:{n:'Free water refills',spend:.98,serve:1,mood:2,d:'Mood up, fewer heat cases'}};

  pushCard(s,'poach','Victor is poaching '+a.name,VICTOR+' has offered '+a.name+' double to play '+s.rival.n+' instead. Their agent says they’ll stay for a '+fmt$(cost)+' “loyalty bonus”.',[{l:'Pay '+fmt$(cost),d:'Keep your headliner',v:'pay'},{l:'Let them go',d:'Get the deposit back, find someone else',v:'go'}],{ref:b.id,cost})}
function rivalYearEnd(s){if(s.rival.rep<20&&!s.flags.rivalFolded){s.flags.rivalFolded=1;addNews(s,s.rival.n+' has collapsed. '+VICTOR+' blames “the weather”. Their acts are looking for a new home.','rival');const r=RIVALS[1];s.rival={n:r.n,owner:r.owner,rep:35,budget:1200000,bk:[],clash:false,hist:[]};s.flags.cheapAfterRival=s.year+1}}
CARD_FX.doc=(s,v)=>{if(v==='yes'){s.doc={y:s.year};const f=Math.round(40000*scaleOf(s)/5000)*5000;cash(s,f);ledger(s,'Documentary fee',f);return 'The crew start filming tomorrow. '+fmt$(f)+' paid.'}return 'Maybe next year.'};
function docOffer(s){if(s.doc&&s.doc.y===s.year)return;if(s.rep<22||chance(.6))return;pushCard(s,'doc','A documentary crew wants in','A streaming service wants to follow you for the whole year: booking, build, the weekend, everything. Great years make great films. So do disasters.',[{l:'Let them film',d:'They pay a fee, and the film comes out next year',v:'yes'},{l:'No cameras',v:'no'}],{ref:'d'+s.year})}
function docResult(s,w){if(!s.doc||s.doc.y!==s.year)return null;const good=w.rec.stars>=3.5,bad=!!w.rec.disaster||w.rec.stars<2.3;
  const title=good?'“'+s.name+': '+pick(['Field of Dreams','Three Days in August','Build It and They Will Come'])+'”':bad?'“'+s.name+': '+pick(['Mud, Lies and Portaloos','The Weekend That Wasn’t','Trouble in the Fields'])+'”':'“'+s.name+': '+pick(['A Year in the Life','Behind the Fence'])+'”';
  if(good){s.hype=clamp(s.hype+12,0,100);s.rep=clamp(s.rep+2,1,100)}else if(bad){s.hype=clamp(s.hype+15,0,100);s.rep=clamp(s.rep-3,1,100)}else s.hype=clamp(s.hype+5,0,100);
  s.flags.docs=(s.flags.docs||0)+1;return {title,tone:good?'a love letter':bad?'a cult disaster classic':'a quiet hit'}}
CARD_FX.reunion=(s,v,c)=>{if(v!=='yes')return 'Maybe they’ll call again.';const a=act(c.ref);const main=stagesOf(s).find(p=>isMain(p.t));if(!main)return 'You need a main stage.';
  let day=[0,1,2].find(d=>!slotAt(s,main.id,d,0));if(day==null)return 'Free up a headline slot first, then ask again.';
  const fee=Math.round(feeOf(a,s)*1.8/1000)*1000;const b={id:uid(),actId:a.id,stage:main.id,day,slot:0,fee,excl:true,opt:false,st:'pending',ask:fee,r:s.round};s.bk.push(b);signAct(s,b,a);a.hiatus=0;s.hype=clamp(s.hype+25,0,100);
  addNews(s,'REUNION: '+a.name+' will play their only show of the year at '+s.name+'. The internet melts.','book');return a.name+' signed for '+fmt$(fee)+'!'};
function reunionRumour(s){if(s.flags.reunionY===s.year||chance(.55))return;const c=s.acts.filter(a=>(a.hiatusRisk||a.hiatus)&&a.fame>=78&&!bkOf(s,a.id)&&!rivalHas(s,a.id)).sort(()=>Math.random()-.5)[0];if(!c)return;s.flags.reunionY=s.year;
  pushCard(s,'reunion','Rumour: '+c.name+' might do a one-off','An agent tells you off the record that '+c.name+' are considering one exclusive show this summer. It would cost about '+fmt$(feeOf(c,s)*1.8)+' and need a free headline slot.',[{l:'Make it happen',d:'Book them as a headliner',v:'yes'},{l:'Too rich for us',v:'no'}],{ref:c.id})}
CARD_FX.war=(s,v,c)=>{const b=s.bk.find(x=>x.id===c.ref);if(!b)return '';const a=act(b.actId);
  if(v==='walk'){b.st='lost';s.rival.bk.push({actId:a.id,fee:c.rival,excl:true,day:ri(0,2)});return 'You walked away. '+a.name+' go to '+s.rival.n+'.'}
  const mine=Math.round(b.fee*(v==='r25'?1.25:1.1)/250)*250;b.fee=mine;const myScore=mine*(1+s.rep/150),theirs=c.rival*(1+s.rival.rep/150);
  const fold=myScore>theirs&&(c.round>=3||chance(c.round===1?.45:.65));
  if(fold||myScore>theirs*1.25){signAct(s,b,a);return VICTOR+' folds. '+a.name+' sign for '+fmt$(mine)+'!'}
  if(c.round>=3){b.st='lost';s.rival.bk.push({actId:a.id,fee:c.rival,excl:true,day:ri(0,2)});return a.name+'’s agent ran out of patience and chose '+s.rival.n+'.'}
  const nr=Math.round(Math.max(c.rival,mine)*rnd(1.06,1.15)/250)*250;pushCard(s,'war','Bidding war: '+a.name+' (round '+(c.round+1)+')',s.rival.n+' came back at '+fmt$(nr)+'. You’re on '+fmt$(mine)+'. The agent wants a final answer soon.',warOpts(mine),{ref:b.id,rival:nr,round:c.round+1});return 'They came back with more.'};
function warOpts(f){return [{l:'Raise 10% to '+fmt$(f*1.1),v:'r10'},{l:'Raise 25% to '+fmt$(f*1.25),d:'Likely to end it',v:'r25'},{l:'Walk away',v:'walk'}]}
function startWar(s,b,rb){const a=act(b.actId);b.st='war';pushCard(s,'war','Bidding war: '+a.name,s.rival.n+' have offered '+fmt$(rb)+' for '+a.name+'. Your offer is '+fmt$(b.fee)+'. Their agent wants to see who blinks.',warOpts(b.fee),{ref:b.id,rival:rb,round:1})}

/* ---------- radar & moving the headliner ---------- */
function radarSheet(){const L=S.live;const st=STEPS[Math.min(L.i,STEPS.length-1)];if(st.h>=24)return '<h2>Weather radar</h2><p class="sub">Quiet night.</p><button class="btn ghost wide" data-a="closesheet">Close</button>';
  const rows=[];for(let h=st.h;h<=Math.min(23,st.h+5);h++){const w=weatherAt(S,st.d,h);rows.push('<li><span class="num" style="width:48px">'+hhmm(h)+'</span><div class="grow">'+w.temp+'°C · '+(w.light?'lightning':w.rain>3?'heavy rain':w.rain>0?'showers':'dry')+' · gusts '+w.gust+' m/s</div>'+(w.light||w.gust>=18?'<span class="pill neg">Danger</span>':w.rain>2?'<span class="pill warn">Wet</span>':'')+'</li>')}
  const main=stagesOf(S).find(p=>isMain(p.t));const hb=main&&slotAt(S,main.id,st.d,0),sb=main&&slotAt(S,main.id,st.d,1);const canSwap=hb&&sb&&hb.st==='signed'&&sb.st==='signed'&&slotTime(S,main,1,st.d)>st.h&&!L.usedEv['swap'+st.d];
  return '<h2>Weather radar</h2><p class="sub">Met Office radar for the next few hours.</p><ul class="list">'+rows.join('')+'</ul>'+(canSwap?'<p class="small muted" style="margin:12px 0 8px">Storm due at headline time? Swap tonight’s headliner and special guest so the big set happens earlier. The headliner’s agent won’t love it.</p><button class="btn wide" data-a="swaphead">Swap '+esc(act(hb.actId).name)+' to '+hhmm(slotTime(S,main,1,st.d))+'</button>':'')+'<button class="btn ghost wide" style="margin-top:8px" data-a="closesheet">Close</button>'}
function swapHead(s){const L=s.live;const st=STEPS[Math.min(L.i,STEPS.length-1)];const main=stagesOf(s).find(p=>isMain(p.t));const hb=slotAt(s,main.id,st.d,0),sb=slotAt(s,main.id,st.d,1);if(!hb||!sb)return;hb.slot=1;sb.slot=0;L.usedEv['swap'+st.d]=1;hb.mood=(hb.mood||0)-1;s.agRel[act(hb.actId).ag]-=3;logL(s,act(hb.actId).name+' moved earlier to dodge the weather. '+act(sb.actId).name+' close the night.','warn')}

/* ---------- site memory, scrapbook, wristbands, spin-off ---------- */
function wristband(s,w){const hue=hash(s.name+s.year)%360;const v=w.rec.soldOut?'gold':w.rec.weather.some(x=>/rain|storm/i.test(x))?'mud':w.rec.stars>=4?'holo':'plain';
  return {c1:'hsl('+hue+',70%,55%)',c2:'hsl('+((hue+40)%360)+',70%,40%)',v,pat:hash(s.name+s.year+'p')%3}}
function bandHtml(b,label){const bg=b.v==='gold'?'linear-gradient(90deg,#b8902f,#f5d77a,#b8902f)':b.v==='holo'?'linear-gradient(90deg,#ff8fc6,#5ec4e8,#c6f24e,#ff8fc6)':'repeating-linear-gradient('+[45,90,135][b.pat]+'deg,'+b.c1+' 0 8px,'+b.c2+' 8px 16px)';
  return '<div style="height:22px;border-radius:4px;background:'+bg+';position:relative;'+(b.v==='mud'?'filter:sepia(.6) saturate(.7)':'')+'"><span style="position:absolute;left:8px;top:3px;font-size:11px;font-weight:600;color:#000;mix-blend-mode:hard-light">'+esc(label)+'</span></div>'}
function scrapEntry(s,w,docR){const top=w.rec.top;const best=w.R.rv.slice().sort((a,b)=>b.s-a.s)[0];
  return {y:s.year,cal:w.rec.cal,site:SITES[s.site].n,top,moment:w.rec.moment||w.rec.disaster||'',quote:best?'“'+best.line+'” · '+best.o:'',stars:w.rec.stars,att:w.rec.att,band:wristband(s,w),merch:s.merch?s.merch.n+(s.merch.q>1.3?' (now a collectible)':''):'',doc:docR?docR.title:'',awards:(w.awards||[]).filter(a=>a.won).map(a=>a.n)}}
function scrapbookSheet(){const E=S.scrap||[];if(!E.length)return '<h2>Scrapbook</h2><p class="sub">Your first page fills in after your first festival.</p><button class="btn ghost wide" data-a="closesheet">Close</button>';
  return '<h2>Scrapbook</h2><p class="sub">'+E.length+' year'+(E.length>1?'s':'')+' of '+esc(S.name)+'.</p>'+E.slice().reverse().map(e=>'<section class="card"><h2>'+e.cal+'<small>'+e.stars.toFixed(1)+'★ · '+fmtN(e.att)+' people</small></h2>'+bandHtml(e.band,S.name.toUpperCase()+' '+e.cal)+
    '<p style="margin-top:10px;font-weight:600">'+e.top.map(esc).join(' · ')+'</p>'+(e.moment?'<p class="muted" style="margin-top:6px">'+esc(e.moment)+'</p>':'')+(e.quote?'<p class="small" style="margin-top:6px">'+esc(e.quote)+'</p>':'')+
    (e.awards&&e.awards.length?'<p class="small pos" style="margin-top:6px">Won: '+e.awards.map(esc).join(', ')+'</p>':'')+(e.merch?'<p class="small faint" style="margin-top:6px">Merch: '+esc(e.merch)+'</p>':'')+(e.doc?'<p class="small faint">Film: '+esc(e.doc)+'</p>':'')+'</section>').join('')+'<button class="btn ghost wide" data-a="closesheet">Close</button>'}
function spinOffYear(s){const sp=s.spin;if(!sp)return null;const fill=clamp(.45+s.rep/200+gauss()*.1,.25,1);const att=Math.round(sp.cap*fill);const rev=att*72/1.2+att*22/1.2*.7;const cost=sp.cap*58+380000;const net=Math.round(rev-cost);
  sp.yrs++;sp.last={att,net,fill};return sp.last}

/* ---------- year hooks ---------- */
function yearExtras(s,first){if(first){s.regulars=makeRegulars();s.scrap=[];s.inbox=[];s.board=60;s.social=newSocial(s)}
  discoveryDemos(s);merchOptions(s);s.flags.bluff=0;if(s.social){s.social.left=SOCIAL_PER;s.social.week=0}
  if(s.scar){s.flags.scarNote=1}}
function roundExtras(s){if(s.round===1)docOffer(s);if(s.round===3){boardMeeting(s);reunionRumour(s)}if(s.round===5&&!first5(s))rivalTaunt(s,'sale');if(s.social)s.social.left=SOCIAL_PER}
const first5=s=>false;
function weekExtras(s){if(s.week===2)rivalTaunt(s,'sale');if(s.social){s.social.left=SOCIAL_PER;if(s.social.pushWeek&&s.social.pushWeek<s.week)s.social.pushWeek=0}}
function buildExtras(s){poachAttempt(s)}
function wrapExtras(s,L,w){boardCheck(s);ageRegulars(s,w);s.scar=Math.round(clamp((L.mud||0)*.6,0,60));const docR=docResult(s,w);w.doc=docR;w.spin=spinOffYear(s);if(w.spin)s.money+=w.spin.net;
  if(s.flags.bluff&&!signed(s).some(b=>b.secret)){s.rep=clamp(s.rep-3,1,100);w.bluff=1;addNews(s,'Fans worked out there never was a secret set. The replies are brutal.','fans')}

  // discovered acts that are taking off
  for(const a of s.acts)if(a.unsigned&&a.disc===s.year){if(a.pot>65){a.unsigned=0;a.agent=pick(AGENTS);a.fame=ri(14,24);a.hist.push(a.fame);addNews(s,a.name+', from your Discovery stage, just signed a record deal.','book')}}
  s.scrap=s.scrap||[];s.scrap.push(scrapEntry(s,w,docR));rivalYearEnd(s)}

/* ---------- live crowd ---------- */
function g3crowd(s,dist){
  if(!dist){if(G3.ok){G3.crowdN=0;G3.crowd.count=0}FB.crowd=null;return}
  const A=analyse(s);const total=dist.stages.reduce((a,x)=>a+x.n,0)+dist.camp+dist.bars+dist.roam;const MAX=G3.ok?2500:900;const per=Math.max(1,total/MAX);

  const addN=(n,fn)=>{const k=Math.round(n/per);for(let i=0;i<k&&pts.length<MAX;i++){const p=fn();if(p)pts.push(p)}};
  for(const x of dist.stages){const ar=A.arenas.find(a=>a.p===x.p);if(!ar||!ar.cells.length)continue;const cells=ar.cells;const front=cells.filter(c=>c.k<=2);
    addN(ar.tent?x.n*.15:x.n,()=>{const c=(!ar.tent&&rr()<.45&&front.length)?front[Math.floor(rr()*front.length)]:cells[Math.floor(rr()*cells.length)];return[wx_(c.x)+(rr()-.5)*.95,wz_(c.y)+(rr()-.5)*.95,1]})}

  if(walkCells.length)addN(dist.roam,()=>{const i=(hotW.length&&rr()<.6)?hotW[Math.floor(rr()*hotW.length)]:walkCells[Math.floor(rr()*walkCells.length)];return[wx_(i%W)+(rr()-.5)*.9,wz_((i/W)|0)+(rr()-.5)*.9,0]});

      if(G3.ok){G3.cam0.d=clamp(G3.cam0.d*k,8,Math.max(W,H)*2.6);G3.cam0.az-=(ang-pinch.ang)}else{FB.z=clamp(FB.z/k,.5,4);fbDraw()}

/* ---------- show effects: fireworks, confetti, drones ---------- */
function g3burst(k,p){if(!G3.ok)return;const T=G3.T;const f=fp(p);const d0=DIRS[p.r];const sx=wx_(f.x)+(f.w-1)/2,sz=wz_(f.y)+(f.h-1)/2;const cx=sx+d0[0]*3,cz=sz+d0[1]*3;G3.fx=G3.fx||[];
  G3.cam0.tx=cx;G3.cam0.tz=cz-3;G3.cam0.d=Math.min(G3.cam0.d,34);G3.idle=0;if(G3.reduced)return;
  const n=k==='drone'?420:k==='conf'?500:k==='flare'?600:360;const pos=new Float32Array(n*3),col=new Float32Array(n*3),vel=new Float32Array(n*3);const c=new T.Color();
  const pal=k==='fire'?['#ffd166','#ff6fb1','#c6f24e','#5ec4e8','#ffffff']:k==='conf'?['#ff6fb1','#c6f24e','#5ec4e8','#ffd166','#ffffff']:k==='flare'?['#fff3c4']:['#ffffff','#9fe3ff'];
  const d=DIRS[p.r];
  for(let i=0;i<n;i++){let x=cx,y=2,z=cz,vx=0,vy=0,vz=0;
    if(k==='fire'){const burst=i%4;x=cx+(burst-1.5)*2.4;z=cz;y=6+(burst%2)*1.8;const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),sp=2.4+Math.random()*1.5;vx=Math.sin(ph)*Math.cos(th)*sp;vy=Math.cos(ph)*sp;vz=Math.sin(ph)*Math.sin(th)*sp}
    else if(k==='conf'){x=cx+(Math.random()-.5)*3;z=cz+d[1]*1.5;y=2.4;vx=(Math.random()-.5)*3+d[0]*3;vz=(Math.random()-.5)*3+d[1]*4;vy=3+Math.random()*3}
    else if(k==='flare'){const cells=coneCells(p,B[p.t].cone||4);const cc=cells[Math.floor(Math.random()*cells.length)]||{x:f.x,y:f.y};x=wx_(cc.x)+(Math.random()-.5);z=wz_(cc.y)+(Math.random()-.5);y=.25}
    else{const a=i/n*Math.PI*2;const r=3+Math.sin(a*5)*1.2;x=cx+Math.cos(a)*r;y=7+Math.sin(a)*r*.7;z=cz+d[1]*2}
    pos.set([x,y,z],i*3);vel.set([vx,vy,vz],i*3);c.set(pal[i%pal.length]);col.set([c.r,c.g,c.b],i*3)}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(pos,3));g.setAttribute('color',new T.BufferAttribute(col,3));
  const m=new T.PointsMaterial({size:k==='conf'?.16:k==='flare'?.12:k==='drone'?.22:.32,vertexColors:true,transparent:true,opacity:1,depthWrite:false,blending:k==='conf'?T.NormalBlending:T.AdditiveBlending});
  const pts=new T.Points(g,m);G3.scene.add(pts);G3.fx.push({pts,vel,k,t:0,life:k==='drone'?7:k==='flare'?6:4});G3.idle=0}
function fxTick(dt){for(let j=G3.fx.length-1;j>=0;j--){const e=G3.fx[j];e.t+=dt;const P=e.pts.geometry.attributes.position;const v=e.vel;
    for(let i=0;i<P.count;i++){if(e.k==='fire'||e.k==='conf'){v[i*3+1]-=(e.k==='conf'?3:1.6)*dt;if(e.k==='conf'){v[i*3]*=.98;v[i*3+2]*=.98}}
      if(e.k==='drone'){P.setY(i,P.getY(i)+Math.sin(e.t*2+i)*.004)}else if(e.k==='flare'){}else{P.setX(i,P.getX(i)+v[i*3]*dt);P.setY(i,Math.max(.02,P.getY(i)+v[i*3+1]*dt));P.setZ(i,P.getZ(i)+v[i*3+2]*dt)}}
    P.needsUpdate=true;e.pts.material.opacity=Math.max(0,1-Math.max(0,e.t-e.life*.6)/(e.life*.4));if(e.k==='flare')e.pts.material.opacity*=.6+Math.sin(e.t*9)*.4;
    if(e.t>e.life){G3.scene.remove(e.pts);e.pts.geometry.dispose();e.pts.material.dispose();G3.fx.splice(j,1)}}}

function fmtSub(){const y=START_YEAR+S.year-1;if(S.phase==='booking')return 'Year '+S.year+' · '+y+' · Round '+S.round+' of '+BOOK_ROUNDS+'. Agents reply at the end of each round.';if(S.phase==='onsale')return 'Year '+S.year+' · Week '+S.week+' of '+SALE_WEEKS+' before build week.';if(S.phase==='build')return 'Year '+S.year+' · The festival opens on Friday.';return ''}
function startGuide(){const A=analyse(S);const st=[

function offersCard(){const open=S.bk.filter(b=>b.st==='pending'||b.st==='counter');const cancels=S.events.filter(e=>e.k==='cancel'&&!e.done);
  if(!open.length&&!cancels.length)return '<section class="card"><h2>Offers</h2><div class="empty">No offers out. Book acts from the Line-up tab.</div></section>';
  return '<section class="card"><h2>Offers<small>'+open.length+' open</small></h2><ul class="list">'+cancels.map(e=>{const a=act(e.actId);return '<li><div class="grow"><b>'+esc(a.name)+'</b><div class="meta">Cancelled · '+DAYS[e.day]+' · '+esc(stageName(S,S.pl.find(p=>p.id===e.stage)))+'</div></div><button class="btn sm" data-a="slot" data-v="'+e.stage+'|'+e.day+'|'+e.slot+'">Replace</button></li>'}).join('')+
    open.map(b=>{const a=act(b.actId);return '<li>'+avatar(a)+'<div class="grow"><b>'+esc(a.name)+'</b><div class="meta">'+DAYS[b.day]+' · '+esc(stageName(S,S.pl.find(p=>p.id===b.stage)))+' · offered '+fmt$(b.fee)+'</div></div>'+(b.st==='counter'?'<div class="right stack" style="gap:6px"><button class="btn sm" data-a="acceptc" data-v="'+b.id+'">Pay '+fmt$(b.counter)+'</button><button class="btn ghost sm" data-a="walk" data-v="'+b.id+'">Walk away</button></div>':'<span class="pill">Waiting</span>')+'</li>'}).join('')+'</ul></section>'}
function salesCard(){const sl=S.sales;const wk=sl.weeks.filter(w=>w.w>0);const cap=capWeekend(S);
  const last=sl.weeks[sl.weeks.length-1];
  return '<section class="card"><h2>Weekly sales<small>'+(last?'Last week '+fmtN(last.soldW+last.vipN)+' weekend · '+fmtN(last.dayN)+' day':'Line-up announced next week')+'</small></h2>'+salesChart(sl,cap)+
    '<div class="grid2" style="margin-top:12px"><div class="tile"><small>Current tier</small><b class="num">'+esc(curTier(S).n)+' · '+fmt$(curTier(S).p)+'</b></div><div class="tile"><small>Resale price</small><b class="num">'+(sl.resale?fmt$(sl.resale):'—')+'</b></div></div></section>'}
function salesChart(sl,cap){const W0=320,H0=150,pl=30,pb=20;const n=SALE_WEEKS;const xs=i=>pl+(W0-pl-6)*(i/n);const ys=v=>H0-pb-(H0-pb-8)*(v/Math.max(cap,1));
  let path='',cum=sl.weeks.length?sl.weeks[0].cum*0:0;const pts=[[0,(sl.weeks.find(w=>w.w===0)||{cum:0}).cum]];sl.weeks.filter(w=>w.w>0).forEach(w=>pts.push([w.w,w.cum]));
  path=pts.map((p,i)=>(i?'L':'M')+xs(p[0]).toFixed(1)+' '+ys(Math.min(cap,p[1])).toFixed(1)).join(' ');
  const grid=[0,.5,1].map(f=>'<line x1="'+pl+'" x2="'+(W0-6)+'" y1="'+ys(cap*f)+'" y2="'+ys(cap*f)+'" stroke="'+(f===1?'#555':'#222')+'" stroke-dasharray="'+(f===1?'4 3':'')+'"/><text x="'+(pl-6)+'" y="'+(ys(cap*f)+4)+'" text-anchor="end">'+fmtK(cap*f)+'</text>').join('');
  const xl=[0,4,8,12].map(i=>'<text x="'+xs(i)+'" y="'+(H0-4)+'" text-anchor="middle">'+(i?'Wk '+i:'Early')+'</text>').join('');
  return '<svg class="chart" viewBox="0 0 '+W0+' '+H0+'" role="img" aria-label="Weekend tickets sold by week against capacity">'+grid+xl+'<path d="'+path+'" fill="none" stroke="#c6f24e" stroke-width="2.2" stroke-linejoin="round"/>'+(pts.length?'<circle cx="'+xs(pts[pts.length-1][0])+'" cy="'+ys(Math.min(cap,pts[pts.length-1][1]))+'" r="3.5" fill="#c6f24e"/>':'')+'</svg>'}
function buildCard(){const ch=sagChecks(S);const fc=S.forecast||[];
  return '<section class="card"><h2>Safety advisory group<small>'+ch.filter(c=>c.ok).length+' of '+ch.length+' passed</small></h2><ul class="list">'+ch.map(c=>'<li><span class="pill '+(c.ok?'pos':c.block?'neg':'warn')+'">'+(c.ok?'Pass':c.block?'Fail':'Risk')+'</span><div class="grow"><b>'+c.n+'</b><div class="meta">'+esc(c.d)+'</div></div></li>').join('')+'</ul>'+
    (ch.some(c=>!c.ok&&c.block)?'<div class="row" style="margin-top:10px"><button class="btn ghost sm" data-a="tab" data-v="site">Fix the site</button><button class="btn ghost sm" data-a="tab" data-v="money">Staffing</button></div>':'')+'</section>'+
    '<section class="card"><h2>Weekend forecast<small>Met Office outlook</small></h2><ul class="list">'+fc.map((f,i)=>{const w=WX.find(x=>x.k===f.k);return '<li><div class="grow"><b>'+DAYL[i]+'</b><div class="meta">'+w.n+' · '+w.t[0]+'–'+w.t[1]+'°C</div></div><span class="faint small">'+f.conf+'% confidence</span></li>'}).join('')+'</ul>'+
    (fc.some(f=>f.k==='wet'||f.k==='storm')?'<p class="small muted" style="margin-top:8px">Rain on the way: trackway on the main routes and weather insurance are worth a look.</p>':fc.some(f=>f.k==='hot')?'<p class="small muted" style="margin-top:8px">Heat on the way: water points and shade matter more than usual.</p>':'')+'</section>'}
function issuesCard(){if(S.phase==='wrap')return '';const A=analyse(S);if(!A.issues.length)return '<section class="card"><h2>Site</h2><p class="muted">No problems found on the site plan.</p></section>';
  return '<section class="card"><h2>Site issues<small>'+A.issues.length+'</small></h2><ul class="list">'+A.issues.slice(0,5).map(i=>'<li><span class="pill '+(i.sev==='bad'?'neg':'warn')+'">'+(i.sev==='bad'?'Fix':'Check')+'</span><div class="grow"><b>'+esc(i.t)+'</b><div class="meta" style="white-space:normal">'+esc(i.fix)+'</div></div></li>').join('')+'</ul><button class="btn ghost sm" style="margin-top:10px" data-a="tab" data-v="site">Open the site</button></section>'}
function rivalCard(){const R=S.rival;const top=R.bk.map(b=>({a:act(b.actId),b})).filter(x=>x.a).sort((x,y)=>y.a.fame-x.a.fame).slice(0,5);

function newsCard(){const n=S.news.slice(0,8);return '<section class="card"><h2>News</h2><ul class="list feed">'+n.map(x=>'<li><div class="grow"><p>'+esc(x.t)+'</p></div></li>').join('')+'</ul></section>'}

function goalsCard(){const G=S.goals;if(!G)return '';return '<section class="card"><h2>This year’s goals<small>'+fmt$(G.reward)+' a goal</small></h2><ul class="list">'+G.list.map(g=>{const d=GOALS[g.k];const p=d.p&&S.sales!==undefined?d.p(S):null;const done=g.done;

function viewWrap(){const w=S.wrap;if(!w)return '<main><p>…</p></main>';const r=w.rec;

  h+=storyCard()+inboxCard()+wrapExtrasHtml(w);
  if(w.firsts.length)h+='<section class="card"><h2>You booked them first</h2><p>'+w.firsts.map(esc).join(', ')+' played your festival when nobody knew them. Now they headline. Your legacy grows.</p></section>';
  if(w.buyout)h+='<section class="card"><h2>An offer from '+esc(S.rival.owner)+'</h2><p class="muted" style="margin-bottom:10px">They want to buy '+esc(S.name)+' outright for '+fmt$(w.buyout)+'. You’d stay on as “creative director” for two years.</p><div class="row"><button class="btn" data-a="sell">Sell for '+fmt$(w.buyout)+'</button><button class="btn ghost" data-a="nosell">Keep it independent</button></div></section>';

  h+=plTable(w.pr,'Profit & loss');

function plTable(pr,title){const grp=(rows)=>{const g={};for(const l of rows){(g[l.g]=g[l.g]||[]).push(l)}return g};
  const row=l=>'<tr><td>'+esc(l.k)+(l.n?'<div class="small faint">'+esc(l.n)+'</div>':'')+'</td><td class="n">'+fmt$(l.v,true)+'</td></tr>';

    '<tr class="grp"><td>Revenue</td><td class="n">'+fmt$(pr.tr,true)+'</td></tr>'+Object.values(gr).flat().map(row).join('')+
    '<tr class="grp"><td>Costs</td><td class="n">'+fmt$(-pr.tc,true)+'</td></tr>'+Object.entries(gc).map(([g,ls])=>'<tr><td colspan="2" class="small faint" style="padding-top:10px;border-bottom:0">'+g+'</td></tr>'+ls.map(l=>row({...l,v:-l.v})).join('')).join('')+
    '<tr class="total"><td>Net</td><td class="n '+(pr.net<0?'neg':'pos')+'">'+fmt$(pr.net,true)+'</td></tr></tbody></table></section>'}

function stepper(a,v,label,txt){return '<span class="stepper" role="group" aria-label="'+esc(label)+'"><button data-a="'+a+'" data-v="'+v+'|-1" aria-label="Lower">−</button><output class="num">'+txt+'</output><button data-a="'+a+'" data-v="'+v+'|1" aria-label="Raise">+</button></span>'}
function viewTickets(){S.flags.tixSeen=1;const sl=S.sales;const A=analyse(S);const pl=pools(S,sl?sl.announced:false);const site=SITES[S.site];

  h+='<section class="card"><h2>Day tickets &amp; upgrades</h2><ul class="list">'+
    '<li><div class="grow"><b>Day ticket</b><div class="meta">'+fmtN(S.tix.day.a)+' per day, held back from the weekend allocation'+(sl?' · sold '+sl.daySold.map(fmtN).join(' / '):'')+'</div></div>'+stepper('dp',0,'Day price',fmt$(S.tix.day.p))+'</li>'+
    '<li><div class="grow"><b>Day allocation</b><div class="meta">Each day ticket is one fewer weekend ticket</div></div>'+stepper('da',0,'Day allocation',fmtK(S.tix.day.a))+'</li>'+

  h+='<section class="card"><h2>Marketing<small>'+fmt$(S.tix.mkt)+'</small></h2><input type="range" class="slider" min="0" max="400000" step="10000" value="'+S.tix.mkt+'" data-in="mkt" aria-label="Marketing budget"><p class="small muted">Posters, socials, radio and festival guides. Most festivals spend 5–8% of revenue.</p></section>';

function licenceCard(){const c=licenceConditions(S);const canVar=S.phase==='booking'&&S.round<4&&!S.lic.varReq;

  panel+='<ul class="list feed" aria-live="polite">'+L.log.slice(0,30).map(x=>'<li><time>'+esc(x.t)+'</time><div class="grow '+(x.k==='bad'?'neg':x.k==='good'?'pos':x.k==='warn'?'warn':x.k==='social'?'muted':'')+'">'+(x.k==='social'?'<b style="color:#fff;font-weight:500">'+esc(x.x.split(': ')[0])+'</b> '+esc(x.x.split(': ').slice(1).join(': ')):esc(x.x))+'</div></li>').join('')+'</ul></div>';

function renderEnding(app){$('#stage3d').hidden=true;const o=S.over;const hs=S.hist;const best=hs.slice().sort((a,b)=>b.stars-a.stars)[0];const tot=hs.reduce((a,h)=>a+h.net,0);

function guideSheet(){const G=[
  ['Getting started','Pick the Relaxed difficulty and a small site for your first go. Your site comes laid out already; “Fix it for me” on the Site tab tops up toilets, water, bars and campsites whenever you change things. On the Line-up tab, “Plan the undercard” can book the whole bill for you, and on Tickets, “Set prices for a fast sell-out” does the maths. Hit the three yearly goals for bonus cash.'],
  ['Story mode','Five years on Hollow Farm with Jess, your co-founder, Ted the farmer and Victor Crane of Monolith Live. Story scenes appear at key moments; your choices change your money, your licence, your rivals and even your site. Everything else plays exactly as in free play.'],
  ['Social','Your festival has its own account on the Social tab. You get three posts each booking round or sale week: teases, announcements, ticket pushes, memes (risky) and secret-set hints. Followers raise ticket demand. Boost posts or pay an influencer for reach.'],
  ['Line-up tricks','The clash finder flags big acts on at the same time; tap a set to move it. Make an act a secret set, hint at it on social, and reveal it on the day. Book unsigned bands on the Discovery stage for £300: the best get signed. Watch out for bidding wars with the rival and rumours of reunions.'],
  ['Running the show','Pick an identity, a bar menu, a merch design and a stock level on the Money tab. Build late-night areas, a silent disco, a healing field, a kids’ field or a signature landmark. During the weekend, check the radar, follow one of your regular fans around the site, grant encores and post clips.'],
  ['The year','Each turn is one festival year: booking season (8 rounds), ticket on-sale (12 weeks), build week, the weekend itself and the wrap-up. Cash moves as it would in real life: artist deposits when you sign, ticket money as it sells, production and staff in build week, the rest in September.'],
  ['The site','Each grid square is 20 m. Stages need an open field in front of them: anything in that field blocks sightlines. Sound falls off about 6 dB each time the distance doubles, and much faster behind a stage, so point stages away from homes. The crowd-flow view shows where people squeeze through at the headliner changeover. Drag to move the map, pinch to zoom, twist to turn it. With a keyboard: arrow keys move the map or the piece you are placing, R rotates, Enter places.'],
  ['Ratios that matter','Toilets: about 1 per 75–100 people (Purple Guide). Water: free, about 1 point per 2,500. Security: 1 SIA guard per 100, usually a licence condition. Bars: one 10 m bar per 1,500–2,000 people. Campsites need 20 m fire breaks.'],
  ['Booking','Fees rise steeply with fame. Big acts want headline billing and ask more from small festivals. Exclusivity (a radius clause) stops your rival booking them; the rival’s clauses lock acts out of your bill. Overseas acts on a European run are cheaper than fly-ins. Book rising acts early and take an option on next year.'],
  ['Tickets','Prices include 20% VAT, so £1 in every £6 goes to HMRC. Underprice and you sell out fast, but touts take the margin. Named tickets and a face-value resale platform fight touts. Day tickets eat into weekend capacity.'],
  ['The weekend','Hour by hour: arrivals through the gates, crowds at the stages, bar and toilet queues, heat, mud, wind and lightning. Over 20 m/s the main stage roof is at risk. Curfew breaches cost about £2,500 a minute and anger the council.'],
  ['Money','Most first-year festivals lose money. Artist fees are usually the biggest cost, then production and site. Bars are the biggest income after tickets. The bank lends against your last year’s revenue; the overdraft charges 14%.'],
  ['Growing','Lease the next field (Tickets tab) for more land and a bigger licence, build a Pyramid stage for 40,000+ crowds, or start again on a bigger site: an old airfield for 40,000 or a whole valley for 70,000.'],
  ['During the weekend','Tap any stage, bar, campsite or the medical centre to see what is happening there. While a headliner plays you can fire show cues: fireworks, confetti, a drone show or lighters up. Fans post as it happens.'],
  ['Reputation','Five outlets review each year: fans, music press, the tabloids, the local paper and the trade. Reputation drives demand and lets you afford bigger acts. A disaster can end everything; a run of great years makes a legend.']];
  return '<h2>How it works</h2><p class="sub">Festival Tycoon uses real UK festival-industry rules of thumb.</p>'+G.map(g=>'<div class="sec">'+g[0]+'</div><p class="muted">'+g[1]+'</p>').join('')+'<button class="btn ghost wide" style="margin-top:16px" data-a="closesheet">Close</button>'}
function menuSheet(){return '<h2>'+esc(S.name)+'</h2><p class="sub">Slot '+S.slot+' · saved automatically.</p><div class="stack"><button class="btn ghost wide" data-a="guide">How it works</button><button class="btn ghost wide" data-a="scrap">Scrapbook</button><button class="btn ghost wide" data-a="trophies">Trophies ('+Object.keys(S.trophies).length+' of '+TROPHIES.length+')</button><button class="btn ghost wide" data-a="licsheet">Licence conditions</button>'+(S.hist.length?'<button class="btn ghost wide" data-a="retire">Retire and hand it on</button>':'')+'<button class="btn wide" data-a="totitle">Save and exit</button><button class="btn quiet wide" data-a="closesheet">Back</button></div>'}

    const ring=box.querySelector('.mg-ring'),fb=box.querySelector('#mgf');

    tap(box.querySelector('#mgbtn'),()=>{if(!alive())return;const t=now();let bi=-1,bd=1e9;beats.forEach((b,i)=>{const d=Math.abs(t-b);if(d<bd&&got[i]==null){bd=d;bi=i}});if(bi<0||bd>380)return;const sc=bd<70?1:bd<160?.6:bd<260?.25:0;got[bi]=sc;fb.textContent=sc>=1?'Perfect':sc>=.6?'Good':sc>0?'Late':'Miss';fb.className=sc>=.6?'pos':'neg';box.querySelector('.mg-pyro').classList.remove('boom');void box.offsetWidth;if(sc>0)box.querySelector('.mg-pyro').classList.add('boom')})}}

/* ---------- a shareable poster image ---------- */
function posterBlob(cb){const st=stagesOf(S);const y=START_YEAR+S.year-1;const days=[0,1,2].map(d=>{const acts=[];for(const p of st)SLOTS[p.t].forEach((sd,i)=>{const b=slotAt(S,p.id,d,i);if(b&&b.st==='signed'&&!b.secret)acts.push({a:act(b.actId),w:(isMain(p.t)?10:p.t==='tent'?6:p.t==='dance'?5:3)-i})});return acts.sort((a,b)=>b.w-a.w)});
  const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');const F='Inter, -apple-system, system-ui, sans-serif';
  x.fillStyle='#0b0f08';x.fillRect(0,0,1080,1350);x.textAlign='center';x.textBaseline='alphabetic';
  x.fillStyle='#b4b4b4';x.font='500 30px '+F;x.fillText((SITES[S.site].n+' · August '+y).toUpperCase(),540,110);
  let fs=96;x.font='700 '+fs+'px '+F;while(x.measureText(S.name).width>960&&fs>40){fs-=4;x.font='700 '+fs+'px '+F}x.fillStyle='#fff';x.fillText(S.name,540,110+fs+20);
  let yy=110+fs+110;const col=['#c6f24e','#ff8fc6','#5ec4e8'];
  days.forEach((acts,d)=>{x.fillStyle=col[d];x.font='700 30px '+F;x.fillText(DAYL[d].toUpperCase(),540,yy);yy+=58;
    const hl=acts.filter(a=>a.w>=9),rest=acts.filter(a=>a.w<9);
    for(const a of hl){let s=a.w>=10?64:46;x.font='700 '+s+'px '+F;while(x.measureText(a.a.name).width>980&&s>26){s-=2;x.font='700 '+s+'px '+F}x.fillStyle='#fff';x.fillText(a.a.name,540,yy);yy+=s+12}
    x.font='500 30px '+F;x.fillStyle='#d8d8d8';let line='';const lines=[];for(const a of rest.slice(0,14)){const t=line?line+'  ·  '+a.a.name:a.a.name;if(x.measureText(t).width>960){lines.push(line);line=a.a.name}else line=t}if(line)lines.push(line);
    for(const l of lines.slice(0,3)){x.fillText(l,540,yy);yy+=42}if(!acts.length){x.fillStyle='#777';x.fillText('To be announced',540,yy);yy+=42}yy+=46});
  x.fillStyle='#949494';x.font='500 26px '+F;x.fillText(handleOf(S)+' · '+fmtN(S.lic.cap)+' capacity',540,1300);
  c.toBlob(cb,'image/png')}
function sharePoster(){posterBlob(b=>{if(!b){toast('Could not draw the poster.');return}const name=S.name.replace(/[^\w]+/g,'-').toLowerCase()+'-'+(START_YEAR+S.year-1)+'.png';let f=null;try{f=new File([b],name,{type:'image/png'})}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:S.name}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Poster saved.')})}

const _renderTitle=renderTitle;renderTitle=function(app){_renderTitle(app);if(UI.setup)return;const g=app.querySelector('.title-screen [data-a="guide"]');if(g)g.parentElement.insertAdjacentHTML('beforebegin',careerHtml())};
const _viewSetup=viewSetup;viewSetup=function(){const u=UI.setup;if(u.chal)return chalSetupHtml(u);let h=_viewSetup();const n=PERKS.filter(p=>legacy().perks[p.k]).length;

const _viewMoney=viewMoney;viewMoney=function(){const h=_viewMoney();const i=h.lastIndexOf('</main>');return i<0?h+crewCard():h.slice(0,i)+crewCard()+h.slice(i)};
const _menuSheet=menuSheet;menuSheet=function(){return _menuSheet().replace('<button class="btn ghost wide" data-a="licsheet">','<button class="btn ghost wide" data-a="ranks">World rankings</button><button class="btn ghost wide" data-a="mgtoggle">Weekend mini-games: '+(legacy().mg?'on':'off')+'</button><button class="btn ghost wide" data-a="licsheet">')};
const _renderEnding=renderEnding;renderEnding=function(app){recordRun(S);save();_renderEnding(app);const r=S.over.res;const b=app.querySelector('[data-a="totitle"]');if(!r||!b)return;const D=chalDef(S);
  b.insertAdjacentHTML('beforebegin','<section class="card"><h2>Final grade<small>Score '+r.sc+'</small></h2><div class="row" style="flex-wrap:nowrap;gap:14px"><span class="grade big g'+r.grade+'">'+r.grade+'</span><div class="grow">'+(D?'<p><b>'+esc(D.n)+'</b> · '+esc(D.goal)+': '+esc(D.fmt(r.dv))+'</p>'+(D.daily?'':'<p style="margin-top:4px">'+medalPill(r.medal)+'</p>'):'<p class="muted">Saved to your hall of fame.</p>')+'</div></div>'+
    (r.stars.length?'<ul class="list" style="margin-top:10px">'+r.stars.map(x=>'<li><span class="pill pos">+'+x.n+' ★</span><div class="grow">'+esc(x.why)+'</div></li>').join('')+'</ul>':'')+'<p class="small faint" style="margin-top:8px">You have '+legacy().stars+' legacy stars to spend.</p></section>')};
const _renderLive=renderLive;renderLive=function(app){_renderLive(app);const L=S.live;if(L&&L.dec&&L.dec.mini&&!(UI.mg&&document.contains($('#mgbox'))&&$('#mgbox').childElementCount))mgMount()};
const _posterSheet=posterSheet;posterSheet=function(){return _posterSheet().replace('<p class="small faint" style="text-align:center;margin-bottom:12px">Screenshot it and share your bill.</p>','<button class="btn wide" style="margin-bottom:8px" data-a="postershare">Share the poster image</button>')};
const _guideSheet=guideSheet;guideSheet=function(){return _guideSheet().replace('<button class="btn ghost wide" style="margin-top:16px" data-a="closesheet">Close</button>',[
  ['Your career','Every festival year earns legacy stars: a profit, a sell-out, four-star reviews, an award, a clean sweep of goals and every new trophy. More come when a festival ends. Stars raise your promoter rank and buy legacy perks for future festivals on the title screen. Finished festivals are graded in the hall of fame.'],
  ['Challenges and the daily festival','Eight fixed scenarios, from a £150k shoestring to clearing a £1.5m debt, each with bronze, silver and gold targets. The daily festival gives everyone the same site, market, weather and twist for the day: play three years for a score and keep your streak going.'],
  ['Crew heads','Hire a production manager, head of security, site manager, marketing lead, head of booking or hospitality boss on the Money tab. Each levels up over the years and makes the festival better at one thing. The rival will try to poach the good ones.'],
  ['The world','Every year has its own news: genre booms, festival fever, a cost-of-living squeeze, fuel crises, heatwaves, washouts and dance crazes. The World Festival Rankings rate you against twenty other festivals each autumn. Every fifth edition is an anniversary. Over winter, pick one off-season event.'],
  ['Weekend mini-games','Lock the mix before each night’s headliner, send stewards to crowd hot spots on Saturday night and fire the Sunday finale pyro on the beat. Good scores mean better shows and a happier crowd. You can let the crew handle them, or turn them off in the menu.']].map(g=>'<div class="sec">'+g[0]+'</div><p class="muted">'+g[1]+'</p>').join('')+'<button class="btn ghost wide" style="margin-top:16px" data-a="closesheet">Close</button>')};
const _start=ACT.start;const _nextyearA=ACT.nextyear;
Object.assign(ACT,{
  start(){const u=UI.setup;if(!u)return;const D=u.chal?(u.chal==='daily'?dailyDef(todayKey()):CHAL[u.chal]):null;
    if(D){u.site=D.site;u.mode='free';u.diff='relaxed';if(D.ident)u.ident=D.ident;if(D.founder)u.founder=D.founder}
    const R0=Math.random;if(D&&D.daily)Math.random=mulberry(D.seed);

  perkbuy(k){const L=legacy();const p=PERKS.find(x=>x.k===k);if(!p||L.perks[k]||L.stars<p.c)return;L.stars-=p.c;L.perks[k]=1;legSave();toast(p.n+' unlocked for future festivals.');renderSheet();if(!S)render()},
  chalfin(){if(!S||!S.wrap||!S.wrap.chalEnd)return;const m=S.wrap.chalEnd.m;const D=chalDef(S);S.over={k:'chal',t:D.daily?'Daily festival: '+fmtN(S.wrap.chalEnd.v):m?MEDALS[m]+' medal':'Challenge over'};save();render();window.scrollTo(0,0)},
