<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Debut Dream">
<meta name="theme-color" content="#ffd9ee">
<meta name="description" content="Debut Dream: a K-pop idol career simulator. Train, debut, chase the first win and become a legend.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Debut Dream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap">
<style>
:root{
  /* Glossy idol-pop look: pastel candy gradient, frosted glass cards, holo accents */
  --ink:#2a1846; --ink2:#5b4a7a; --dim:#8f80ab;
  --pink:#ff4fa3; --violet:#9b5cff; --sky:#3fb6ff; --mint:#22c9a6; --lemon:#ffcf3f; --coral:#ff6b6b;
  --glass:rgba(255,255,255,.72); --glass2:rgba(255,255,255,.88); --edge:rgba(255,255,255,.95);
  --line:rgba(122,84,190,.16);
  --holo:linear-gradient(120deg,#ff7ac6,#b98bff 30%,#7fd4ff 55%,#8ff5d2 75%,#ffe27a);
  --candy:linear-gradient(135deg,#ff5fae,#a45cff);
  --display:'Fredoka','Nunito',system-ui,-apple-system,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tabh:64px;
  color-scheme:light;
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#ffe6f4}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  background:radial-gradient(120% 60% at 0% 0%,#ffd1ea 0%,transparent 60%),radial-gradient(90% 60% at 100% 20%,#d9d0ff 0%,transparent 60%),radial-gradient(100% 70% at 50% 100%,#c9efff 0%,transparent 65%),#fdeefa;
  background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(circle at 12% 18%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 78% 9%,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 63% 41%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 25% 72%,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 88% 80%,#fff 0 1.6px,transparent 2px)}
#app{position:relative;z-index:1}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-weight:700}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
small{font-size:12.5px}
[hidden]{display:none!important}
.muted{color:var(--ink2)} .dim{color:var(--dim)}
.good{color:#0f9e7f} .bad{color:#e0365b}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.center{text-align:center}

.card{position:relative;background:var(--glass);border:1.5px solid var(--edge);border-radius:22px;padding:16px;
  box-shadow:0 10px 30px rgba(155,92,255,.13),inset 0 1px 0 #fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.holo::before{content:"";position:absolute;inset:-1.5px;border-radius:23px;padding:2px;background:var(--holo);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.label{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--violet)}

.btn{position:relative;overflow:hidden;border:0;border-radius:999px;padding:12px 18px;font-weight:900;font-size:15px;cursor:pointer;
  background:var(--candy);color:#fff;box-shadow:0 6px 16px rgba(255,79,163,.35),inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .08s,filter .15s;touch-action:manipulation;min-height:44px}
.btn::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
.btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:0 3px 10px rgba(155,92,255,.15),inset 0 0 0 1.5px var(--line)}
.btn.ghost::after{display:none}
.btn.mint{background:linear-gradient(135deg,#2fe0b8,#1fb4d8);box-shadow:0 6px 16px rgba(34,201,166,.35),inset 0 -3px 0 rgba(0,0,0,.12)}
.btn.sky{background:linear-gradient(135deg,#55c8ff,#6d7bff);box-shadow:0 6px 16px rgba(63,182,255,.35),inset 0 -3px 0 rgba(0,0,0,.12)}
.btn.warn{background:linear-gradient(135deg,#ff8a7a,#ff4f7b)}
.btn.sm{padding:7px 12px;font-size:13px;min-height:34px}
.btn.big{padding:15px 22px;font-size:17px;width:100%}
.btn.block{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

input[type=text],select{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font-size:16px;min-height:44px}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:12px;font-weight:900;color:var(--ink2);letter-spacing:.04em}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:900;padding:3px 9px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.hot{background:var(--candy);color:#fff;border-color:transparent}
.pill.mint{background:#d6fff4;color:#0d7e66;border-color:#a8f0dc}
.pill.sky{background:#def2ff;color:#1569a8;border-color:#b5e0ff}
.pill.lemon{background:#fff5cc;color:#8a6400;border-color:#ffe48a}
.pill.red{background:#ffe1e6;color:#c2224a;border-color:#ffc0cc}

/* option chips / cards */
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr))}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:44px;touch-action:manipulation}
.opt b{font-family:var(--display);font-weight:600;font-size:15px}
.opt small{color:var(--ink2)}
.opt.on{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,var(--holo) border-box;border:2.5px solid transparent;box-shadow:0 6px 18px rgba(155,92,255,.22)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--pink)}

/* bars */
.bar{height:10px;border-radius:999px;background:rgba(122,84,190,.12);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--candy)}
.bar.mint > i{background:linear-gradient(90deg,#2fe0b8,#1fb4d8)}
.bar.red > i{background:linear-gradient(90deg,#ffb36b,#ff4f7b)}
.bar.sky > i{background:linear-gradient(90deg,#7fd4ff,#6d7bff)}
.stat{display:grid;grid-template-columns:26px 1fr 34px;gap:8px;align-items:center}
.stat b{font-size:13px}
.stat .v{font-weight:900;text-align:right;font-variant-numeric:tabular-nums}

/* header */
.hud{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:rgba(255,240,250,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1.5px solid rgba(255,255,255,.9)}
.hud .wrap{display:flex;flex-direction:column;gap:7px;padding-top:8px;padding-bottom:9px}
.hud .who{display:flex;align-items:center;gap:10px}
.hud .who .av{width:42px;height:42px;flex:none}
.hud .name{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .sub{font-size:12px;color:var(--ink2);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-size:11.5px;font-weight:900;color:var(--ink2)}
.meter .bar{height:8px}
.av{border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 2px #fff,0 3px 10px rgba(155,92,255,.25)}
.av svg{display:block;width:100%;height:100%}

main.wrap{padding-top:14px;padding-bottom:calc(var(--tabh) + 92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.title-main{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))!important}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,245,252,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1.5px solid #fff;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(155,92,255,.1)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:900;color:var(--dim);cursor:pointer;touch-action:manipulation}
.tab i{font-style:normal;font-size:21px;line-height:1;filter:grayscale(.7);opacity:.75}
.tab.on{color:var(--pink)}
.tab.on i{filter:none;opacity:1;transform:translateY(-1px)}
.go{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:24;padding:10px 0 10px;pointer-events:none}
.go .wrap{pointer-events:auto}

/* allocation */
.alloc{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:14px;background:rgba(255,255,255,.65)}
.arow .ic{font-size:20px;text-align:center}
.arow b{font-size:14px;display:block}
.arow small{color:var(--ink2);display:block;line-height:1.2}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:19px;font-weight:900;cursor:pointer;color:var(--violet);touch-action:manipulation}
.step button:disabled{opacity:.35}
.step .n{width:22px;text-align:center;font-weight:900;font-size:16px}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(122,84,190,.15)}
.dots i.on{background:var(--candy)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.7)}
.li .av{width:40px;height:40px;flex:none}
.li.me{background:linear-gradient(#fff,#fff) padding-box,var(--holo) border-box;border:2px solid transparent}
.rk{width:28px;font-family:var(--display);font-weight:700;font-size:17px;text-align:center;color:var(--violet);flex:none}
.news{display:flex;flex-direction:column;gap:6px}
.news div{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.65);font-size:13.5px}
.news small{display:block;color:var(--dim);font-weight:800;font-size:11px}

/* sheet (tasks & modals) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(60,30,90,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:linear-gradient(180deg,#fff 0%,#fff6fc 100%);border-radius:28px 28px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 40px rgba(60,30,90,.25);display:flex;flex-direction:column;gap:12px;animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
.sheet h2{font-size:23px}
.sheet .kick{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent}
.sheet .choices{display:flex;flex-direction:column;gap:8px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;gap:6px;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{background:rgba(42,24,70,.92);color:#fff;padding:10px 14px;border-radius:16px;font-weight:800;font-size:13.5px;box-shadow:0 8px 24px rgba(42,24,70,.3);animation:up .25s}

/* title */
.logo{font-family:var(--display);font-weight:700;font-size:clamp(44px,13vw,72px);line-height:.95;text-align:center;letter-spacing:-.01em;
  background:linear-gradient(120deg,#ff3f9e,#a95cff 45%,#3fb6ff 80%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 10px 22px rgba(255,79,163,.35))}
.tag{text-align:center;font-weight:900;color:var(--ink2)}
.hero{display:flex;justify-content:center;gap:-10px;margin:6px 0}
.hero .av{width:86px;height:86px;margin:0 -8px;border:3px solid #fff}
.sparkle{display:inline-block;animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.25) rotate(20deg);opacity:.7}}

/* big portrait */
.portrait{display:flex;gap:14px;align-items:center}
.portrait .av{width:96px;height:96px;flex:none}
.bigav{width:min(200px,55vw);height:min(200px,55vw);margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:rgba(255,255,255,.75);border-radius:16px;padding:9px 8px;text-align:center}
.kpi b{display:block;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1}
.kpi small{color:var(--ink2);font-weight:800;font-size:11px}
.stick{display:flex;justify-content:center}
.stick svg{width:110px;height:170px}

/* mini-games */
.mg{position:fixed;inset:0;z-index:80;background:linear-gradient(180deg,#2a1450 0%,#47207a 55%,#8a2d8f 100%);color:#fff;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));user-select:none;-webkit-user-select:none;touch-action:none}
.mg .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mg .top b{font-family:var(--display);font-size:18px}
.mg .score{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.mg .x{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-weight:900;cursor:pointer}
.field-mg{position:relative;flex:1;margin:10px 0;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.1));display:grid;grid-template-columns:repeat(4,1fr)}
.lane{position:relative;border-right:1px solid rgba(255,255,255,.08)}
.lane:last-child{border-right:0}
.hitline{position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff7ac6,#7fd4ff);box-shadow:0 0 14px #ff7ac6;border-radius:4px}
.note{position:absolute;left:12%;width:76%;height:22px;margin-top:-11px;border-radius:12px;top:0;will-change:transform;box-shadow:0 0 12px currentColor,inset 0 2px 0 rgba(255,255,255,.6)}
.judge{position:absolute;left:0;right:0;text-align:center;font-family:var(--display);font-size:26px;font-weight:700;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;height:92px}
.pad{border:0;border-radius:20px;font-size:26px;color:#fff;cursor:pointer;touch-action:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.35);transition:transform .05s,filter .05s}
.pad.hit{transform:scale(.94);filter:brightness(1.35)}
.cue{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.cue .big{font-size:96px;line-height:1;height:110px;font-family:var(--display);transition:transform .12s}
.cue .seq{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:34px;font-size:24px}
.cpads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cpads .pad{height:72px}
.mgintro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.mgintro h2{font-size:28px}
.mgintro p{color:#f2e6ff}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>{n=Math.round(n);const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(a>=1e10?0:1)+'B';if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1)+'M';if(a>=1e4)return Math.round(n/1e3)+'K';if(a>=1e3)return (n/1e3).toFixed(1)+'K';return String(n)};
const won=n=>'₩'+fmt(n);
const sum=a=>a.reduce((x,y)=>x+y,0);
const avg=a=>a.length?sum(a)/a.length:0;
const sign=n=>(n>=0?'+':'')+Math.round(n);
let _id=1;const uid=()=>'n'+Date.now().toString(36)+(_id++);

/* ============ data ============ */
const SK=['vocal','dance','rap','visual','variety','lang'];
const SKL={vocal:'Vocal',dance:'Dance',rap:'Rap',visual:'Visual',variety:'Variety',lang:'Languages'};
const SKI={vocal:'🎤',dance:'💃',rap:'🎧',visual:'✨',variety:'🎭',lang:'🌏'};
const SKH={vocal:'Breath, pitch, high notes',dance:'Choreo, stamina, sharpness',rap:'Flow, writing, tone',visual:'Skincare, styling, camera',variety:'Talk, wit, reactions',lang:'Japanese, English, Mandarin'};
const BLOCKS=8;
const AGENCIES=[
  {id:'stellar',name:'Stellar Nine Entertainment',short:'Stellar Nine',tier:'Big 3',diff:78,support:1.35,minMonths:14,size:5,cut:.75,fame:40000,mult:1.35,col:'#ff4fa3',desc:'Industry giant. World-class trainers, glossy debuts, brutal monthly cuts.'},
  {id:'aurora',name:'Aurora Pop Co.',short:'Aurora Pop',tier:'Big 3',diff:70,support:1.28,minMonths:12,size:6,cut:.65,fame:32000,mult:1.25,col:'#9b5cff',desc:'Known for synchronized choreography and huge overseas fandoms.'},
  {id:'moonbeam',name:'Moonbeam Music',short:'Moonbeam',tier:'Mid-size',diff:54,support:1.12,minMonths:9,size:5,cut:.5,fame:14000,mult:1.1,col:'#3fb6ff',desc:'Vocal powerhouse label. Smaller budget, tighter team.'},
  {id:'cosmo',name:'Cosmo Pixel Ent.',short:'Cosmo Pixel',tier:'Mid-size',diff:44,support:1.02,minMonths:8,size:4,cut:.45,fame:9000,mult:1,col:'#22c9a6',desc:'Trendy, experimental concepts. Debuts fast, takes risks.'},
  {id:'comet',name:'Little Comet Records',short:'Little Comet',tier:'Small',diff:18,support:.88,minMonths:6,size:5,cut:.3,fame:2500,mult:.85,col:'#ffb020',desc:'A tiny label in a basement studio. Everyone gets a chance.'}
];
const AG=id=>AGENCIES.find(a=>a.id===id)||AGENCIES[4];
const CONCEPTS=[

function nextWeek(){

function growNPCs(list,mult){list.forEach(n=>{SK.forEach(k=>{n.st[k]=clamp(n.st[k]+n.gr*rnd(.2,1.1)*(1-n.st[k]/115)*mult,0,98)})})}

/* ============ evaluations ============ */
const EVALK={vocal:{n:'Vocal & Rap',k:['vocal','rap'],mg:'rhythm'},dance:{n:'Dance & Performance',k:['dance','visual'],mg:'choreo'}};
function evalStat(st,kind){const k=EVALK[kind].k;return st[k[0]]*.65+st[k[1]]*.35}
function finishEval(game){
  const t=curTask();const kind=t.kind;
  const my=clamp(.5*game+.5*evalStat(S.st,kind)+S.buzz*.04+(S.agRel-50)*.05,0,100);
  S.trainees.forEach(n=>{n.last=clamp(evalStat(n.st,kind)+rnd(-6,8),0,100);n.hist.push(n.last);n.hist=n.hist.slice(-4)});
  const all=[...S.trainees.map(n=>({id:n.id,s:n.last})),{id:'me',s:my}].sort((x,y)=>y.s-x.s);
  const rank=all.findIndex(x=>x.id==='me')+1;const prev=S.rank;S.rank=rank;
  S.evals.push({w:S.week,s:my,rank,kind});S.evals=S.evals.slice(-12);
  const N=all.length;let fx='';

  S.trainees.forEach(n=>{if(n.rel<-20&&n.last<my)n.rel-=3;});
  log(`Monthly ${EVALK[kind].n} evaluation: ranked #${rank} of ${N}.`);
  S.tasks[0]={type:'evalRes',kind,rank,prev,my:Math.round(my),game:Math.round(game),rows:all.map(x=>({id:x.id,s:Math.round(x.s)})),fx};
  save();render();
}
function afterEval(){

  if(S.lowStreak>=2){if(Math.random()<a.cut){pushTask({type:'cut'});save();render();return}S.lowStreak=1;info('Final warning','Saved by a thread',`<p>The CEO decides to give you one more month. Don't waste it.</p>`);S.agRel-=5}
  if(!S.flags.debutPlanned&&S.months>=a.minMonths&&Math.random()<.32+(S.months-a.minMonths)*.07){S.flags.debutPlanned=true;pushTask({type:'debutPlan',via:(!S.flags.survDone&&Math.random()<.35)?'survival':'lineup'})}

/* ============ debut selection ============ */
function lineupScore(n){return avg(n.hist.length?n.hist:[evalStat(n.st,'vocal')])*.6+overall(n.st)*.4+rnd(-4,4)}
function computeLineup(game){
  const a=AG(S.agency);const size=a.size;
  S.trainees.forEach(n=>n.ls=lineupScore(n)+n.rel*.06);
  const ranked=S.trainees.slice().sort((x,y)=>y.ls-x.ls);
  const topN=ranked.slice(0,size-1);
  let myScore=avg(S.evals.slice(-3).map(e=>e.s))*.45+(.5*game+.5*myOverall())*.25+myOverall()*.3+(S.agRel-50)*.15+S.buzz*.08;
  const friends=topN.filter(n=>n.rel>=30),rivals=topN.filter(n=>n.rel<=-35);
  myScore+=friends.length*2.5-rivals.length*3;
  const cut=ranked[size-1]?ranked[size-1].ls:0;
  const inGroup=myScore>=cut-2;
  const notes=[];if(friends.length)notes.push(`${friends.map(n=>n.name).join(', ')} vouched for you.`);if(rivals.length)notes.push(`${rivals.map(n=>n.name).join(', ')} badmouthed you to the directors.`);
  if(inGroup){S.tasks.shift();startDebut(topN,'agency',notes);}
  else{
    S.tasks[0]={type:'lineupFail',names:ranked.slice(0,size).map(n=>n.name),notes};
    S.trainees=S.trainees.filter(n=>!ranked.slice(0,size).includes(n));const u=usedNames();while(S.trainees.length<11){const nn=mkNPC(S.idol.gender,24+a.diff*.3,u);nn.age0=npcAge0();S.trainees.push(nn)}
    if(!S.trainees.find(n=>n.id===S.bond))S.bond=S.trainees[0].id;
    S.flags.debutPlanned=false;S.flags.missed++;S.stress+=15;S.months=Math.max(S.months,a.minMonths-4);log('Left out of the debut lineup.');
  }
  save();render();
}
function startDebut(npcs,via,notes){

  S.group={name:'',concept:null,members,size:members.length+1,via,debutW:null,fans:0,pop:10,rep:60,harmony:clamp(50+avg(members.map(m=>m.rel))*.4,20,90),pos:{},lastConcept:null};
  assignPositions();S.trainees=[];S.surv=null;S.bond=members.slice().sort((x,y)=>y.rel-x.rel)[0].id;

function assignPositions(){
  const g=S.group;const all=[{id:'me',st:S.st,age:age(),pop:S.fame+30,rel:avg(g.members.map(m=>m.rel))},...g.members.map(m=>({id:m.id,st:m.st,age:npcAge(m),pop:m.pop,rel:m.rel*.5}))];
  const P={};all.forEach(x=>P[x.id]=[]);

  const v=top(x=>x.st.vocal);P[v[0].id].push('Main Vocal');if(v[1])P[v[1].id].push('Lead Vocal');

}
const myPos=()=>S.group?.pos?.me||[];

/* ============ survival show ============ */
function startSurvival(){

  const mine=S.trainees.slice().sort((x,y)=>lineupScore(y)-lineupScore(x)).slice(0,4).map(n=>Object.assign(n,{agency:a.short}));

  for(let i=0;i<15;i++){const ag=ags[i%ags.length];const n=mkNPC(S.idol.gender,26+ag.diff*.28,u);n.age0=npcAge0();n.agency=ag.short;others.push(n)}

const SURVEP={1:{n:'Level Test',mg:'rhythm',d:'Sing 16 bars in front of the judges. They grade you A to F.',k:'vocal',keep:20},
  2:{n:'Group Battle',mg:'choreo',d:'Teams of five battle with the same song. The crowd votes.',k:'dance',keep:14},
  3:{n:'Position Battle',mg:'rhythm',d:'Pick your best position and prove it.',k:'pos',keep:10},
  4:{n:'Debut Finale',mg:'rhythm',d:'Live broadcast. Only the top 7 debut.',k:'vocal',keep:7}};
function survPerform(game,opt){
  const s=S.surv,ep=SURVEP[s.ep];const k=opt&&SKL[opt]?opt:ep.k==='pos'?'vocal':ep.k;
  const w=[1,1.2,1.5,2.2][s.ep-1];
  let mine=.5*game+.5*S.st[k];let screen=0;
  if(opt==='center'){screen=Math.random()<.65?14:-10}else if(opt==='support'){screen=4;const fr=s.cast.filter(n=>!n.out&&n.rel>0);fr.forEach(n=>n.rel+=5)}
  const vote=x=>Math.max(0,(x.perf*1+x.st.visual*.35+x.st.variety*.25+x.bonus+rnd(0,14))*1000*w);
  s.myVotes+=vote({perf:mine,st:S.st,bonus:S.buzz*.25+screen});
  s.cast.filter(n=>!n.out).forEach(n=>{const kk=ep.k==='pos'?pick(['vocal','dance','rap']):k;n.votes+=vote({perf:n.st[kk]+rnd(-8,8),st:n.st,bonus:n.rel<-30?-4:0})});
  const alive=[...s.cast.filter(n=>!n.out).map(n=>({id:n.id,v:n.votes})),{id:'me',v:s.myVotes}].sort((a,b)=>b.v-a.v);
  const rank=alive.findIndex(x=>x.id==='me')+1;
  const survivors=new Set(alive.slice(0,ep.keep).map(x=>x.id));
  const elim=s.cast.filter(n=>!n.out&&!survivors.has(n.id));elim.forEach(n=>n.out=true);

  S.tasks[0]=res;save();render();
}

  if(t.cut){S.flags.survDone=true;S.buzz=clamp(S.buzz+15,0,100);S.trainees=S.trainees.filter(n=>!n.out);const u=usedNames();const a=AG(S.agency);
    S.surv=null;S.trainees.forEach(n=>{delete n.votes;delete n.out});while(S.trainees.length<11){const nn=mkNPC(S.idol.gender,24+a.diff*.3,u);nn.age0=npcAge0();S.trainees.push(nn)}
    if(!S.trainees.find(n=>n.id===S.bond))S.bond=S.trainees[0].id;S.flags.debutPlanned=false;
    info('Back to the practice room','Eliminated, but not forgotten',`<p>You didn't make the final cut, but viewers loved you. You return to ${esc(AG(S.agency).short)} with a fanbase of your own. Buzz +15.</p>`);

/* ============ songs & promo ============ */
function conceptFit(cid,stList){const w=CN(cid).w;const ws=sum(Object.values(w));return avg(stList.map(st=>sum(Object.keys(w).map(k=>st[k]*w[k]))/ws))}
function teamStats(kind,partner){if(kind==='solo')return [S.st];if(kind==='unit'){const p=npcById(partner);return p?[S.st,p.st]:[S.st]}return [S.st,...S.group.members.map(m=>m.st)]}
function songQuality(p){
  const a=AG(S.agency);const list=teamStats(p.kind,p.partner);
  const skill=avg(list.map(st=>st.vocal*.3+st.dance*.3+st.rap*.15+st.visual*.25));
  const fit=conceptFit(p.concept,list);const R=RELEASES.find(r=>r.id===p.type)||RELEASES[0];const P=PRODUCERS.find(r=>r.id===p.producer)||PRODUCERS[0];
  let q=skill*.48+fit*.25+R.q+P.q+(p.prepQ||0)+a.support*8-4+rnd(-6,6);
  if(P.self)q+=(S.st.rap+S.st.vocal)/2*.15;
  if(S.group&&p.kind==='group'&&S.group.lastConcept===p.concept)q-=6;
  return clamp(Math.round(q),15,99);
}
const FANCAP=25e6;
function fanCap(){const g=S.group;const L=S.songs.filter(x=>x.kind==='group').slice(-3);const q=L.length?avg(L.map(x=>x.q)):55;const aw=S.awards.length;return clamp(3e5*Math.exp((q-50)/13)*AG(S.agency).mult*(1+aw*.03+(S.flags.tours||0)*.05),2e5,FANCAP)}
function addFans(d){const g=S.group;if(!g)return 0;if(d>0)d*=Math.max(0,1-g.fans/fanCap());g.fans=Math.max(0,g.fans+d);return Math.round(d)}
const fanScore=f=>clamp((Math.log10(Math.max(f,1000))-3)*25,0,100);
function startPrep(p){S.prep=Object.assign({left:(RELEASES.find(r=>r.id===p.type)||RELEASES[0]).weeks,prepQ:0},p);log(`Started preparing ${p.kind==='solo'?'your solo debut':p.kind==='unit'?'a sub-unit release':'a comeback'}: "${p.title}".`)}
function prepWeek(){const p=S.prep;p.left--;p.prepQ=Math.min(12,p.prepQ+((S.alloc.vocal||0)+(S.alloc.dance||0)+(S.alloc.rap||0))*.8);if(p.left<=0){const song=makeSong(p);S.prep=null;pushTask({type:'release',song:song.id})}}
function makeSong(p){const s={id:uid(),title:p.title,concept:p.concept,type:p.type,kind:p.kind,producer:p.producer,partner:p.partner||null,q:songQuality(p),w:S.week,peak:101,sales:0,wins:0,shows:0};S.songs.push(s);return s}
const songById=id=>S.songs.find(s=>s.id===id);
function pay(amount){amount=Math.max(0,amount);if(S.debt>0){const d=Math.min(S.debt,amount);S.debt-=d;amount-=d;if(S.debt<=0&&!S.flags.settled){S.flags.settled=true;S.debt=0;pushTask({type:'info',kick:'Payday',title:'Your first settlement!',html:`<p>Trainee debt fully repaid. For the first time, money from your work lands in your own account. You buy your parents dinner.</p>`});log('First settlement! Trainee debt paid off.')}}S.money+=amount;S.flags.earned=(S.flags.earned||0)+amount}
function doRelease(game){
  const t=curTask();const s=songById(t.song);const g=S.group;const a=AG(S.agency);
  s.q=clamp(Math.round(s.q+(game-55)*.08),15,99);
  const first=s.kind==='group'&&!g.debutW;
  const before=g.fans;
  if(first){g.debutW=S.week;const P=myPos();S.fame+=8+(P.includes('Center')?10:0)+(P.includes('Visual')?6:0)+(P.includes('Main Vocal')||P.includes('Main Dancer')?4:0)+(P.includes('Maknae')?3:0);g.fans=Math.round(a.fame*(.6+game/100*.6)*(g.via==='survival'?3:1)+S.buzz*400);g.pop=clamp(25+s.q*.45+(game-50)*.2,10,90)}
  else{g.pop=clamp(g.pop*.4+s.q*.55+(game-50)*.15+12,5,100);addFans(g.fans*rnd(.03,.07)*(s.q/60)+3000*a.mult*(s.q/60))}
  if(s.kind==='solo'){S.fame+=8+s.q/10;g.harmony-=g.harmony<50?8:3}
  if(s.kind==='unit'){S.fame+=4+s.q/20;const p=npcById(s.partner);if(p)p.rel+=12;g.harmony-=2}

  const P=PRODUCERS.find(r=>r.id===s.producer);if(P&&P.self){S.fame+=s.q>=70?8:-2}

  S.tasks[0]={type:'releaseRes',song:s.id,first,game:Math.round(game),gain:g.fans-before,fit};

}
function pickRivals(n){return shuffle(S.rivals).slice(0,n).map(r=>({n:r.n,p:r.p+rnd(-8,8)}))}
function doShow(game,auto){
  const t=curTask();const s=songById(t.song);const g=S.group;

/* ============ career ============ */
const yearsIn=()=>S.group&&S.group.debutW!=null?(S.week-S.group.debutW)/48:0;
function careerWeek(){
  const g=S.group;growNPCs(g.members,.35);
  g.members.forEach(m=>{m.pop=clamp(m.pop+rnd(-1,1.2)+(m.st.visual-60)*.01,0,100)});
  if(!S.promo&&!S.tour)g.pop-=.8+g.pop*.035;
  addFans(g.fans*((g.pop-40)*.0002-(g.rep<30?.005:0)));
  pay(g.fans*40*.25/g.size*(S.flags.betterShare?1.3:1));
  S.stress-=2;if(S.cooldown>0)S.cooldown--;
  if(g.rep<60)g.rep+=.3;
  if(S.prep)prepWeek();
  else if(S.promo)pushTask({type:'show',song:S.promo.song,show:SHOWS[S.promo.wk%SHOWS.length]});
  if(S.tour)tourWeek();
  const since=S.week-g.debutW;
  if(S.week%48===47)pushTask({type:'awards'});
  if(since===3*48&&g.fans<30000)pushTask({type:'agencyDisband'});
  if(since===7*48)pushTask({type:'renewal'});
  if(S.flags.renewed&&since>=10*48&&!S.tasks.some(t=>t.type==='finale'))pushTask({type:'finale'});
  if(S.idol.gender==='boy'&&age()>=28&&!S.flags.enlistDue){S.flags.enlistDue=true;pushTask({type:'enlistDue'})}
  fandomChecks();
  const free=!S.prep&&!S.promo&&!S.tour&&!S.hiatus;
  if(free&&!S.flags.unit&&since>=48&&g.pop>=30&&g.members.length&&Math.random()<.07){S.flags.unit=true;pushTask({type:'unitOffer'})}
  else if(free&&!S.flags.solo&&since>=96&&S.fame>=40&&Math.random()<.06){S.flags.solo=true;pushTask({type:'soloOffer'})}
  if(g.harmony<20&&g.members.length>2&&Math.random()<.05){const m=g.members.slice().sort((a,b)=>a.rel-b.rel)[0];g.members=g.members.filter(x=>x!==m);g.size--;g.pop-=8;g.fans*=.9;assignPositions();if(S.bond===m.id)S.bond=g.members[0].id;
    info('Breaking news',`${m.name} leaves ${g.name}`,`<p>After months of tension, ${esc(m.name)} announces their departure. ${esc(g.name)} continues as ${g.size}.</p>`);log(`${m.name} left the group.`)}
  if(!S.tasks.length&&Math.random()<.32)randomEvent('career');
}
function tourWeek(){
  const T=S.tour,g=S.group;const city=T.cities[T.i%T.cities.length];
  const gross=g.fans*T.rate*rnd(.8,1.1)*(.6+(T.perf||60)/150)*1000/100;
  T.gross+=gross;pay(gross*.12/g.size);addFans(g.fans*(.008+S.st.lang/6000)+800);S.stamina-=10;S.stress+=3;g.pop+=.8;
  log(`${T.n}: sold-out night in ${city}.`);T.i++;
  if(T.i>=T.weeks){S.flags.tours=(S.flags.tours||0)+1;(S.flags.tourList||=[]).push(T.n);S.cooldown=3;
    info('Tour complete',`${T.n} wrapped!`,`<p>${T.weeks} cities, ${won(T.gross)} gross. You cried at the last show in ${esc(city)}.</p>`);S.tour=null}
}
function startTour(id){const t=TOURS.find(x=>x.id===id);S.tour={id,n:t.n,weeks:t.weeks,rate:t.rate,cities:CITIES[id].slice(0,t.weeks),i:0,gross:0,perf:60};pushTask({type:'concert'});log(`Announced the ${t.n}!`)}

/* ============ awards & endings ============ */
function yearScore(){const g=S.group;return Math.min(S.year.wins||0,12)*3+Math.min((S.year.sales||0)/50000,25)+fanScore(g.fans)*.35+g.pop*.15+g.rep*.05}
function runAwards(){
  const g=S.group;const ys=yearScore();const res=[];const y=yr();
  const rookie=g.debutW!=null&&yr(g.debutW)===y;
  if(rookie)res.push({n:'Rookie of the Year',win:ys+rnd(0,12)>=30});
  res.push({n:'Bonsang (Main Prize)',win:ys>=58||(ys>=44&&Math.random()<.4)});
  if(ys>=60)res.push({n:'Best Performance',win:Math.random()<.6});
  if(ys>=85)res.push({n:'Daesang: Artist of the Year',win:ys+rnd(0,15)>=112&&g.fans>=3e6});
  if(ys>=85)res.push({n:'Daesang: Song of the Year',win:ys+rnd(0,15)>=108});
  res.forEach(r=>{if(r.win){S.awards.push({y,n:r.n});log(`Prism Music Awards: won ${r.n}!`);g.pop+=3;S.stress-=5}});
  if(!res.some(r=>r.win))log('Prism Music Awards: went home empty-handed this year.');
  S.year={wins:0,sales:0};S.rivals.forEach(r=>r.p=clamp(r.p+rnd(-2,4),35,92));
  return res;
}
function legacy(){const g=S.group;if(!g)return 0;const aw=S.awards,c=p=>aw.filter(a=>a.n.startsWith(p)).length;return Math.round(Math.min(S.wins,100)*.3+c('Bonsang')*3+c('Daesang')*7+c('Rookie')*3+c('Best')*2+fanScore(g.fans)*.25+Math.min(S.flags.tours||0,6)*3+Math.min(S.songs.length,20)*.5)}

function endGame(id,note){
  S.ending={id,w:S.week,note:note||'',legacy:legacy()};S.act='ended';S.tasks=[];
  log(`Ending: ${ENDINGS[id].t}.`);
  try{const H=JSON.parse(localStorage.getItem(HOF)||'[]');H.unshift({stage:me(),group:gname(),end:id,wins:S.wins,fans:S.group?S.group.fans:0,legacy:S.ending.legacy,y:yr(),t:Date.now()});localStorage.setItem(HOF,JSON.stringify(H.slice(0,20)))}catch(e){}
  save();UI.tab='week';render();
}

function evNPC(need){
  const L=S.act==='trainee'?S.trainees:(S.group?.members||[]);if(!L.length)return null;
  if(need==='friend')return L.slice().sort((a,b)=>b.rel-a.rel)[0];
  if(need==='rival'||need==='memberLow')return L.slice().sort((a,b)=>a.rel-b.rel)[0];
  return pick(L);
}
function randomEvent(act){
  const L=EVENTS.filter(e=>e.act===act&&(!e.cond||e.cond())&&e.id!==S.flags.lastEv);if(!L.length)return;
  const e=pick(L);const n=e.need?evNPC(e.need):null;if(e.need&&!n)return;
  S.flags.lastEv=e.id;pushTask({type:'event',id:e.id,n:n?n.id:null});
}

  const t=curTask();const e=EVENTS.find(x=>x.id===t.id);const n=t.n?npcById(t.n):null;const c=e.ch[i];
  const r=c.f(n);S.tasks=S.tasks.filter(x=>x!==t);
  clampAll();if(n)n.rel=clamp(n.rel,-100,100);
  if(S.act!=='ended'){pushTask({type:'info',kick:'Result',title:c.t,html:`<p>${esc(r)}</p>`},true)}
  log(r);save();render();
}

/* ============ ui helpers ============ */
const B=(l,a,v,cls,dis)=>`<button class="btn ${cls||''}" data-a="${a}"${v!=null?` data-v="${esc(v)}"`:''}${dis?' disabled':''}>${l}</button>`;
const bar=(v,cls)=>`<div class="bar ${cls||''}"><i style="width:${clamp(v,0,100)}%"></i></div>`;
const stars=v=>'★★★★★'.slice(0,clamp(Math.round(v/20),1,5)).padEnd(5,'☆');
function statRows(st){return SK.map(k=>`<div class="stat"><span title="${SKL[k]}">${SKI[k]}</span><div><b>${SKL[k]}</b>${bar(st[k])}</div><span class="v">${Math.round(st[k])}</span></div>`).join('')}
function memberName(id){return id==='me'?me():(npcById(id)?.name||'?')}
function rankRows(rows,limit){return `<div class="list">${rows.slice(0,limit||rows.length).map((r,i)=>{const n=r.id==='me'?null:npcById(r.id);return `<div class="li ${r.id==='me'?'me':''}"><span class="rk">${i+1}</span>${av(r.id==='me'?S.idol.look:n?.look)}<div class="grow"><b>${esc(r.id==='me'?me()+' (you)':n?.name||r.name||'?')}</b>${n&&n.rel!=null?'<br>'+relPill(n.rel):''}</div><b>${r.s??''}</b></div>`}).join('')}</div>`}
function memberCards(){const g=S.group;const all=[{id:'me',name:me()+' (you)',look:S.idol.look,st:S.st,pop:S.fame+30},...g.members];
  return `<div class="list">${all.map(m=>`<div class="li ${m.id==='me'?'me':''}">${av(m.look)}<div class="grow"><b>${esc(m.name)}</b> <small class="muted">${m.id==='me'?age():npcAge(m)} y/o</small><div class="row" style="gap:4px;margin-top:3px">${(g.pos[m.id]||[]).map(p=>`<span class="pill ${p==='Center'||p==='Leader'?'hot':p==='Maknae'?'lemon':'sky'}">${p}</span>`).join('')}</div></div>${m.id!=='me'?relPill(m.rel):''}</div>`).join('')}</div>`}
function bestConcept(list){return CONCEPTS.slice().sort((a,b)=>conceptFit(b.id,list)-conceptFit(a.id,list))[0].id}

/* ============ screens ============ */
function hud(){
  const sub=S.act==='trainee'?`${AG(S.agency).short} trainee · ${dateStr()}`:`${S.group?.name||'Pre-debut'} · ${dateStr()}`;
  return `<header class="hud"><div class="wrap"><div class="who">${av(S.idol.look)}<div class="grow"><div class="name">${esc(me())}</div><div class="sub">${esc(sub)}</div></div><span class="pill ${S.act==='trainee'?'sky':S.act==='debut'?'lemon':'hot'}">${S.act==='trainee'?(S.surv?'Survival':'Act I'):S.act==='debut'?'Act II':'Act III'}</span></div>
  <div class="meters"><div class="meter">⚡${bar(S.stamina,'mint')}<span>${Math.round(Math.max(0,S.stamina))}</span></div><div class="meter">💢${bar(S.stress,'red')}<span>${Math.round(S.stress)}</span></div></div></div></header>`;
}
function allocCard(){

let AC=null;
function audio(){if(!S||S.sound!==false){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}return AC}
function beep(f,d=.08,v=.08,type='triangle'){if(S&&S.sound===false)return;const a=AC;if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d+.02)}catch(e){}}

/* ============ mini-games ============ */
let MG=null;
const autoScore=stat=>clamp(Math.round(stat*.85+rnd(0,15)),5,98);
const LANEC=['#ff5fae','#ffcf3f','#3fd6b5','#6fa8ff'];
const LANEF=[523,659,784,988];
function startMG(kind,o,cb){MG={kind,o,cb,phase:'intro',alive:true};drawMG()}
function closeMG(){if(MG)MG.alive=false;MG=null;const el=$('#mg');if(el)el.remove()}
function mgShell(inner){let el=$('#mg');if(!el){el=document.createElement('div');el.id='mg';el.className='mg';document.body.appendChild(el)}el.innerHTML=inner;return el}
function drawMG(){
  if(!MG)return;const o=MG.o;
  if(MG.phase==='intro'){
    const how=MG.kind==='rhythm'?'Notes fall down four lanes. Tap the matching pad the moment a note crosses the glowing line. Perfect timing scores most.':'Watch the move sequence, then repeat it on the pads in the same order. Sequences get longer each round.';
    mgShell(`<div class="top"><b>${esc(o.title)}</b><button class="x" data-mga="quit">✕</button></div><div class="mgintro"><div style="font-size:64px">${MG.kind==='rhythm'?'🎵':'💃'}</div><h2>${esc(o.title)}</h2>${o.sub?`<p>${esc(o.sub)}</p>`:''}<p>${how}</p><p><small>Your skill (${Math.round(o.stat||0)}) widens the timing window and slows the cues.</small></p><button class="btn big" data-mga="go">Start ✨</button><button class="btn ghost big" data-mga="auto">Quick sim</button></div>`);
    return;
  }
  if(MG.phase==='done'){const s=MG.score;const r=s>=90?'PERFECT STAGE!':s>=75?'Amazing!':s>=55?'Nice!':s>=35?'Shaky...':'Rough night';
    mgShell(`<div class="top"><b>${esc(o.title)}</b><span></span></div><div class="mgintro"><div style="font-size:64px">${s>=75?'🌟':s>=55?'✨':s>=35?'😅':'💦'}</div><h2>${r}</h2><div class="score" style="font-size:54px">${s}</div><p>${MG.detail||''}</p><button class="btn big" data-mga="ok">Continue</button></div>`);return}
}
function finishMG(score){if(!MG)return;MG.alive=false;MG.score=clamp(Math.round(score),0,100);MG.phase='done';beep(MG.score>=55?880:330,.25,.1);drawMG()}
function mgRhythm(){
  const o=MG.o,diff=clamp(o.diff??.4,0,1),stat=o.stat||40;
  const bpm=96+diff*44,beat=60000/bpm,travel=1750-diff*500,pw=55+stat*.35,gw=120+stat*.6,lead=1800,len=13000+diff*6000;
  const notes=[];let t=lead,last=-1;
  while(t<lead+len){let lane=ri(0,3);if(lane===last&&Math.random()<.6)lane=(lane+ri(1,3))%4;notes.push({t,lane});if(diff>.55&&Math.random()<.12)notes.push({t,lane:(lane+2)%4});last=lane;t+=beat*pick(diff>.5?[1,1,.5,.5,1,2]:[1,1,1,2,.5])}
  const el=mgShell(`<div class="top"><b>${esc(o.title)}</b><span class="score" id="mgs">0</span><button class="x" data-mga="quit">✕</button></div>
  <div class="field-mg" id="mgf">${[0,1,2,3].map(i=>`<div class="lane" id="ln${i}"></div>`).join('')}<div class="hitline" id="mgh"></div><div class="judge" id="mgj"></div></div>
  <div class="pads">${[0,1,2,3].map(i=>`<button class="pad" data-pad="${i}" style="background:${LANEC[i]}">${['♥','★','♪','◆'][i]}</button>`).join('')}</div>`);
  const f=$('#mgf');const H=f.clientHeight;const hitY=H-46;$('#mgh').style.top=hitY+'px';$('#mgj').style.top=(hitY-70)+'px';
  notes.forEach(n=>{const d=document.createElement('div');d.className='note';d.style.background=LANEC[n.lane];d.style.color=LANEC[n.lane];d.style.display='none';$('#ln'+n.lane).appendChild(d);n.el=d});
  const R={p:0,g:0,m:0,combo:0,max:0};const t0=performance.now()+120;let lastBeat=-1;MG.notes=notes;MG.t0=t0;
  const judge=(txt,c)=>{const j=$('#mgj');if(!j)return;j.textContent=txt;j.style.color=c;j.style.transform='scale(1.15)';setTimeout(()=>{if(j)j.style.transform=''},90)};
  const score=()=>((R.p+R.g*.6)/notes.length*100+R.max/notes.length*6);
  MG.press=lane=>{const now=performance.now()-t0;const pad=document.querySelector(`[data-pad="${lane}"]`);if(pad){pad.classList.add('hit');setTimeout(()=>pad.classList.remove('hit'),90)}
    let best=null,bd=1e9;for(const n of notes){if(n.j||n.lane!==lane)continue;const d=Math.abs(now-n.t);if(d<bd){bd=d;best=n}}
    if(best&&bd<=gw){best.j=1;best.el.style.display='none';if(bd<=pw){R.p++;judge('PERFECT','#fff36b')}else{R.g++;judge('GOOD','#9ff5d8')}R.combo++;R.max=Math.max(R.max,R.combo);beep(LANEF[lane],.12,.07);$('#mgs').textContent=Math.round(score())}
    else{beep(150,.06,.04,'square')}};
  const loop=()=>{if(!MG||!MG.alive)return;const now=performance.now()-t0;
    const b=Math.floor((now-lead)/beat);if(b>lastBeat&&now>=lead-beat){lastBeat=b;beep(b%4===0?220:180,.05,.03,'sine')}
    for(const n of notes){if(n.j)continue;const dt=n.t-now;if(dt<-gw){n.j=1;n.el.style.display='none';R.m++;R.combo=0;judge('MISS','#ff9aa8');continue}
      if(dt<=travel){n.el.style.display='block';n.el.style.transform=`translateY(${hitY*(1-dt/travel)}px)`}}
    if(now>notes[notes.length-1].t+gw+600){MG.detail=`Perfect ${R.p} · Good ${R.g} · Miss ${R.m} · Max combo ${R.max}`;finishMG(score());return}
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
}
const MOVES=[{k:'L',i:'⬅️'},{k:'U',i:'⬆️'},{k:'R',i:'➡️'},{k:'D',i:'⬇️'},{k:'C',i:'👏'},{k:'S',i:'✨'}];
function mgChoreo(){
  const o=MG.o,diff=clamp(o.diff??.4,0,1),stat=o.stat||40;
  const rounds=diff<.45?[3,4,5,6]:[4,5,6,7];const total=sum(rounds);const on=Math.max(300,600-diff*220+stat*1.4),gap=170;
  mgShell(`<div class="top"><b>${esc(o.title)}</b><span class="score" id="mgs">0/${total}</span><button class="x" data-mga="quit">✕</button></div>
  <div class="cue"><div id="mgr" style="font-weight:900;letter-spacing:.1em"></div><div class="big" id="mgc">🎬</div><div class="seq" id="mgq"></div><div class="bar" style="width:70%;background:rgba(255,255,255,.15)"><i id="mgt" style="width:100%"></i></div></div>
  <div class="cpads">${MOVES.map((m,i)=>`<button class="pad" data-pad="${m.k}" style="background:${['#ff5fae','#a45cff','#3fb6ff','#22c9a6','#ffb020','#ff7b3f'][i]}">${m.i}</button>`).join('')}</div>`);
  let r=0,correct=0,seq=[],pos=0,phase='show',deadline=0;const C=$('#mgc'),Q=$('#mgq'),RR=$('#mgr'),T=$('#mgt');
  const nextRound=()=>{if(!MG||!MG.alive)return;if(r>=rounds.length){MG.detail=`${correct} of ${total} moves hit`;finishMG(correct/total*100);return}
    seq=Array.from({length:rounds[r]},()=>pick(MOVES));MG.seq=seq;pos=0;phase='show';RR.textContent=`ROUND ${r+1} · WATCH`;Q.innerHTML='';C.textContent='👀';
    let i=0;const step=()=>{if(!MG||!MG.alive)return;if(i>=seq.length){phase='input';RR.textContent='YOUR TURN!';C.textContent='💃';deadline=performance.now()+seq.length*1100+1500;tick();return}
      C.textContent=seq[i].i;C.style.transform='scale(1.2)';beep(400+i*60,.1,.06);setTimeout(()=>{if(C){C.style.transform='';C.textContent='·'}},on);i++;setTimeout(step,on+gap)};setTimeout(step,700)};
  const endRound=msg=>{phase='wait';RR.textContent=msg;r++;setTimeout(nextRound,800)};
  const tick=()=>{if(!MG||!MG.alive||phase!=='input')return;const left=deadline-performance.now();T.style.width=clamp(left/(seq.length*1100+1500)*100,0,100)+'%';if(left<=0){endRound('TIME!');return}requestAnimationFrame(tick)};
  MG.press=k=>{if(phase!=='input')return;const pad=document.querySelector(`[data-pad="${k}"]`);if(pad){pad.classList.add('hit');setTimeout(()=>pad.classList.remove('hit'),90)}
    if(seq[pos].k===k){correct++;Q.innerHTML+=`<span>${seq[pos].i}</span>`;pos++;beep(600+pos*50,.08,.07);$('#mgs').textContent=`${correct}/${total}`;if(pos>=seq.length){C.textContent='🌟';endRound('CLEAN!')}}
    else{beep(140,.15,.06,'square');C.textContent='❌';endRound('MISSED!')}};
  nextRound();
}
document.addEventListener('pointerdown',e=>{const p=e.target.closest&&e.target.closest('[data-pad]');if(!p||!MG||!MG.press)return;e.preventDefault();const v=p.dataset.pad;MG.press(MG.kind==='rhythm'?+v:v)});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-mga]');if(!b||!MG)return;const a=b.dataset.mga;
  if(a==='quit'){closeMG();return}
  if(a==='go'){audio();MG.phase='play';if(MG.kind==='rhythm')mgRhythm();else mgChoreo();return}
  if(a==='auto'){MG.detail='Simulated from your skills.';finishMG(autoScore(MG.o.stat||40));return}
  if(a==='ok'){const cb=MG.cb,s=MG.score;closeMG();cb(s)}});
document.addEventListener('keydown',e=>{if(!MG||!MG.press)return;const m=MG.kind==='rhythm'?{d:0,f:1,j:2,k:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3}:{ArrowLeft:'L',ArrowUp:'U',ArrowRight:'R',ArrowDown:'D',c:'C',s:'S'};if(e.key in m){e.preventDefault();MG.press(m[e.key])}});

function mgFor(kind,title,stat,diff,cb,sub){startMG(kind,{title,stat,diff,sub},cb)}
function auditionResult(id,game){
  const a=AG(id);const sc=auditionScore(game,UI.piece||'vocal');
  if(sc>=a.diff||a.id==='comet'){joinAgency(id);UI.tab='week'}
  else{S.tried.push(id);UI.modal={kick:'Audition result',title:'Not this time',html:`<p>${esc(a.short)} thanks you for coming. Your score: <b>${Math.round(sc)}</b> (they wanted ${a.diff}+).</p><p class="muted">Try another agency. Smaller labels are easier to get into.</p>`,btns:[B('OK','closeModal',null,'block')]}}
  save();render();
}
function renewGroup(){
  const g=S.group;S.flags.renewed=true;let left=[];
  if(!(g.harmony>=40&&S.agRel>=30)){left=g.members.filter(m=>m.rel<15);if(left.length>=g.members.length)left=left.slice(0,g.members.length-1);g.members=g.members.filter(m=>!left.includes(m));g.size=g.members.length+1;assignPositions();if(!g.members.find(m=>m.id===S.bond))S.bond=g.members[0].id}
  g.pop+=8;g.harmony+=5;log(`Renewed contracts.${left.length?' '+left.map(m=>m.name).join(', ')+' left.':' All members stay!'}`);
  info('Contract renewal','We are staying together',`<p>${left.length?`${left.map(m=>esc(m.name)).join(', ')} chose not to renew. ${esc(g.name)} continues as ${g.size}.`:'Every member signs. Fans trend "#ForeverTogether" worldwide.'}</p><p class="muted">The group's 10th anniversary will decide its legacy.</p>`);
}

document.addEventListener('input',e=>{const t=e.target;if(t.dataset.d&&UI.draft){UI.draft[t.dataset.d]=t.value;if(t.dataset.d==='stage'){const h=$('main .card.holo h2');if(h)h.textContent=t.value||'Your stage name'}}if(t.dataset.f){UI.form[t.dataset.f]=t.value}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.sel==='bond'&&S){S.bond=t.value;save();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')e.target.blur()});

function boot(){
  UI.form={};
  const n=lastSlot();const s=n?readSlot(n):null;
  if(s&&!s.ending&&s.idol){S=migrate(s);S.slot=n;UI.scr='game'}else UI.scr='title';
  render();
}
boot();
</script>
</body>
</html>
