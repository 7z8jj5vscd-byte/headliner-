<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="One-Hit Wonder">
<meta name="theme-color" content="#f4eee1">
<meta name="description" content="You have the biggest song in the world. Now prove you're not a one-hit wonder.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>One-Hit Wonder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  /* Look: a sun-faded tabloid / CD-single insert. Cream paper, hard ink outlines, sticker colors that drain to grey as you lose relevance */
  --paper:#f4eee1; --paper2:#ebe3d0; --card:#fffaf0; --ink:#16151a; --ink2:#46424f; --mute:#7a7484; --line:#d9cfba;
  --tang:#ff5b14; --blue:#2340ff; --lime:#d4f53c; --bad:#e0263f; --good:#14864f; --sky:#9fd8ff;
  --fade:0;
  --display:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --tabh:62px;
  color-scheme:light;
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(rgba(22,21,26,.06) 1px,transparent 1.2px);background-size:5px 5px}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .good{color:var(--good)} .bad{color:var(--bad)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.fadeable{filter:grayscale(calc(var(--fade)*.92)) contrast(calc(1 - var(--fade)*.15))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px;box-shadow:3px 3px 0 var(--tang);transition:transform .06s,box-shadow .06s;white-space:nowrap;min-height:42px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tang)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.alt:active{box-shadow:1px 1px 0 var(--ink)}
.btn.hot{background:var(--tang);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.lime{background:var(--lime);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:34px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* cards */
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
.card h3{font-size:16px;font-weight:800}
.sec{display:flex;flex-direction:column;gap:16px;padding:16px 0 calc(var(--tabh) + 92px + env(safe-area-inset-bottom,0px))}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);white-space:nowrap}
.pill.t{background:var(--tang)} .pill.l{background:var(--lime)} .pill.b{background:var(--blue);color:#fff} .pill.i{background:var(--ink);color:var(--paper)}
.pill.g{color:var(--good);border-color:var(--good)} .pill.r{color:var(--bad);border-color:var(--bad)}
.sticker{display:inline-block;background:var(--lime);border:2px solid var(--ink);padding:3px 10px;border-radius:6px;font-weight:800;transform:rotate(-2.5deg);box-shadow:2px 2px 0 var(--ink)}
.bar{height:10px;border:2px solid var(--ink);border-radius:99px;background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.t i{background:var(--tang)} .bar.b i{background:var(--blue)} .bar.l i{background:var(--lime)} .bar.g i{background:var(--good)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1.5px solid var(--ink);border-radius:10px;padding:7px 8px;background:var(--paper)}
.stat b{display:block;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.15}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.list{display:flex;flex-direction:column}
.list>*{padding:10px 0;border-top:1.5px dashed var(--line)}
.list>*:first-child{border-top:0;padding-top:2px}
.empty{color:var(--mute);border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;font-size:14px}
small{font-size:12.5px}

/* action rows */
.act{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.act .nm{font-weight:800;font-size:15px}
.act .ds{grid-column:1;font-size:13px;color:var(--ink2)}
.act .go{grid-column:2;align-self:center}
.ap{display:inline-flex;gap:3px;vertical-align:middle}
.ap i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:var(--ink)}
.ap i.off{background:transparent}
.why{font-size:12px;color:var(--bad);grid-column:1}
.act .go{grid-row:1/4}
.tags{grid-column:1;display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;border:1.5px solid currentColor;color:var(--ink2)}
.tag.up{color:var(--good)} .tag.dn{color:var(--bad)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.steps li.done{color:var(--mute);text-decoration:line-through}
.goal{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.goal .bar{height:8px}
.feedmonth{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink2);border-bottom:2px solid var(--ink);padding:8px 0 3px}

/* HUD */
.hud{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);padding-top:env(safe-area-inset-top,0px)}
.hud .wrap{padding-top:8px;padding-bottom:9px;display:flex;flex-direction:column;gap:6px}
.hud .who{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud .menu{border:2px solid var(--ink);background:var(--card);border-radius:10px;width:38px;height:34px;display:grid;place-items:center;flex:none;box-shadow:2px 2px 0 var(--ink)}
.relbox{display:flex;align-items:center;gap:8px}
.relbar{position:relative;flex:1;height:22px;border:2px solid var(--ink);border-radius:99px;background:repeating-linear-gradient(-45deg,var(--paper2) 0 6px,var(--paper) 6px 12px);overflow:hidden}
.relbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#b9b1a3,var(--tang) 45%,var(--lime));transition:width 1.2s cubic-bezier(.3,.7,.2,1);border-right:2px solid var(--ink)}
.relbar span{position:absolute;inset:0;display:flex;align-items:center;padding-left:10px;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.08em;mix-blend-mode:multiply}
.relnum{font-family:var(--mono);font-weight:700;font-size:20px;min-width:52px;text-align:right}
.hudline{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;align-items:center}
.relbar.low{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(224,38,63,.35)}}

/* bottom chrome */
.endbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:19;pointer-events:none}
.endbar .wrap{display:flex;padding-bottom:10px;pointer-events:none}
.endbar .btn{pointer-events:auto;flex:1;min-height:50px;font-size:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{background:none;border:0;color:#a8a2b0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--lime)}
.tab .dot{position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:9px;background:var(--tang);color:var(--ink);font-size:10px;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(22,21,26,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:fadein .15s}
.modal{background:var(--card);border:2px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);width:100%;max-width:520px;max-height:calc(100vh - 40px - env(safe-area-inset-top,0px));max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px));overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;animation:up .2s cubic-bezier(.2,.8,.3,1)}
.modal .kick{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tang);font-weight:700}
.modal h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.02}
.modal .body{display:flex;flex-direction:column;gap:10px;font-size:15px}
.choice{text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:11px 13px;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;gap:2px;width:100%}
.choice:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.choice b{font-size:15px}
.choice small{color:var(--ink2)}
.choice.hot{background:var(--lime)}
.fx{display:flex;flex-wrap:wrap;gap:5px}
.fx span{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;border:1.5px solid currentColor}
.fx .up{color:var(--good)} .fx .dn{color:var(--bad)}
@keyframes up{from{transform:translateY(30px);opacity:.3}}
@keyframes fadein{from{opacity:0}}
.sumline{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;padding:3px 0}
.sumline.tot{border-top:2px solid var(--ink);margin-top:4px;padding-top:6px;font-weight:700}

/* voices */
.voice{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.av{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--sky)}
.bubble{background:var(--paper);border:1.5px solid var(--ink);border-radius:4px 14px 14px 14px;padding:8px 10px;font-size:14px}
.bubble .who{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700;display:block;margin-bottom:2px}

/* hit card */
.hitcard{position:relative;overflow:hidden;background:var(--tang);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:16px;display:grid;grid-template-columns:1fr 88px;gap:12px;align-items:center}
.hitcard h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:.98}
.disc{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle,var(--lime) 0 17%,var(--ink) 18% 22%,#2a2830 23% 30%,var(--ink) 31% 40%,#2a2830 41% 50%,var(--ink) 51% 60%,#2a2830 61% 70%,var(--ink) 71%);border:2px solid var(--ink);animation:spin 6s linear infinite}
.disc.slow{animation-duration:16s}
@keyframes spin{to{transform:rotate(360deg)}}
.legacy{position:relative;height:12px;border:2px solid var(--ink);border-radius:99px;background:linear-gradient(90deg,#ff9fb0,var(--paper) 50%,#b8f0c9)}
.legacy i{position:absolute;top:-6px;width:6px;height:20px;background:var(--ink);border-radius:3px;transform:translateX(-3px);transition:left .8s}

/* feed */
.clip{background:#fff;border:1.5px solid var(--ink);padding:10px 12px;box-shadow:2px 2px 0 rgba(0,0,0,.18);transform:rotate(var(--r,0deg))}
.clip .src{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.clip h3{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.08;margin-top:3px}
.clip.big h3{font-size:24px}

/* title & setup */
.title{min-height:100vh;min-height:100dvh;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:18px}
.logo{position:relative;padding:22px 0 8px}
.logo h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,15vw,76px);letter-spacing:-.04em;line-height:.85;text-transform:uppercase}
.logo h1 em{font-family:var(--serif);font-weight:400;font-style:italic;text-transform:none;letter-spacing:-.02em;color:var(--tang);-webkit-text-stroke:1.5px var(--ink)}
.logo .disc{position:absolute;right:0;top:0;width:110px;height:110px;z-index:-1;opacity:.95}
.logo p{margin-top:12px;font-size:16px;max-width:30ch}
.field{display:flex;flex-direction:column;gap:5px}
.field input{border:2px solid var(--ink);border-radius:12px;padding:11px 12px;background:#fff;font-size:17px;width:100%;min-width:0}
.ends{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.endtile{border:2px solid var(--ink);border-radius:12px;padding:8px 6px;text-align:center;font-size:11px;font-weight:800;background:var(--paper2);min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.endtile.got{background:var(--lime)}
.endtile .ic{font-size:20px}

/* ending */
.front{background:#fff;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:12px}
.front .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--ink);padding-bottom:6px;gap:8px}
.front .mast b{font-family:var(--serif);font-size:24px;font-weight:400}
.front h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,10vw,50px);line-height:.95}
.front .deck{font-size:16px;font-style:italic;font-family:var(--serif)}
.spark{width:100%;height:56px;display:block}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:3px 3px 0 var(--tang);animation:fadein .2s}
.flash{animation:flash .9s}
@keyframes flash{30%{background:var(--lime)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= helpers ================= */
const MONTHS=36,SAVE_PREFIX='ohw_slot_',LAST_KEY='ohw_last',END_KEY='ohw_endings';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=q=>document.querySelector(q);
function cash(n){const s=n<0?'−':'',a=Math.abs(n);return s+'$'+(a>=1e6?(a/1e6).toFixed(a>=1e7?1:2)+'M':a>=1e3?Math.round(a/1e3)+'K':Math.round(a))}
function fmt(n){const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(1)+'B':a>=1e6?(n/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?(n/1e3).toFixed(a>=1e4?0:1)+'K':String(Math.round(n))}
function wpick(list){const t=list.reduce((s,x)=>s+x.w,0);let r=Math.random()*t;for(const x of list){r-=x.w;if(r<=0)return x}return list[list.length-1]}

/* ================= content ================= */
const TA=['Microwave','Banana','Disco','Velvet','Lemonade','Turbo','Cardboard','Sunburn','Laser','Penguin','Bubblegum','Spaghetti','Neon','Tuesday','Glitter','Ketchup','Hologram','Cowboy','Wobble','Pineapple','Jacuzzi','Moped','Lasagna','Karaoke','Flamingo','Trampoline'];
const TB=['Heart','Summer','Telephone','Kiss','Shuffle','Romance','Drama','Party','Paradise','Baby','Fever','Situation','Boogie','Feelings','Weekend','Machine','Heartbreak','Attitude','Lover','Emergency'];
const TITLE_T=[(a,b)=>`${a} ${b}`,(a,b)=>`${a} ${b}`,(a,b)=>`${a} ${b} (Ooh-Ah)`,(a,b)=>`Do the ${a}`,(a,b)=>`My ${b} Is a ${a}`,(a,b)=>`Hey, ${a}!`,(a,b)=>`${b} in a ${a}`];
const HOOKS=['na-na-na-NOPE','put it on my tab, tab, tab','who let the llamas in','baby, I\'m a microwave','spin it like a pizza','beep beep, here comes my heart','ooh-ah, ooh-ah, oh no','I got sand in my feelings','call me on the landline','don\'t touch my snacks','wiggle it, giggle it','turn it up, Grandma','yee-haw, ya\'ll, yee-haw','one more lap around the parking lot'];
const DANCES=['the elbow wiggle','the shopping cart','the sideways shrug','the lawnmower 2.0','the noodle arms','the toaster pop','the dizzy flamingo','the office chair spin','the hokey-hokey','the slow-mo sneeze'];
const ORIGINS=['recorded on your phone in a parked car','made as a joke for your cousin\'s wedding','set to a cat video by a total stranger','written in eleven minutes during a power cut','an old demo someone found and posted','a jingle you wrote for a carpet store','sung into a voice memo on the night bus','your first ever upload, made on a borrowed laptop'];
const GENRES=['bubblegum pop','bedroom pop','country trap','synth-funk','pop-punk','novelty disco','drill-pop','folk stomp','eurodance','yacht soul'];
const TRENDS=['sea shanty revival','hyperpop glitch','slowed + reverb','80s power ballads','sad-girl folk','jersey club','gregorian techno','polka-core','yacht rock revival','amapiano crossover','emo revival','whisper-pop','cowboy disco','lo-fi study beats'];
const NAME_A=['Lil','Big','DJ','Young','Saint','Baby','MC','','','',''];
const NAME_B=['Pickle','Tavi','Jojo Rae','Marlo','Kip','Velvet June','Dmitri','Sunny Vale','Rex Moon','Pip Harlow','Nova Kade','Benny Glass','Lulu Static','Teddy Orbit','Mo Bennett','Ziggy Plum'];
const BANDS=['The Tuesday Club','Cardboard Kings','Mild Panic','The Hot Waters','Sofa Wolves','Gloria Gloria'];
const STARS=['Kayla Vox','Jaylen Prince','Lil Mortgage','Aria Delacroix','Marcus Vale','Ocean Teeth','Nadia Reign','Big Tuna'];
const OUTLETS={spin:'The Daily Spin',gaz:'Vinyl Gazette',loopy:'Trending on Loopy',gut:'Gossip Gutter',chart:'Chart Watch',biz:'MusicBiz Ledger'};

const LABELS={
  titan:{n:'Titan Records',kind:'major',cut:.18,promo:1.45,showCut:.8,masters:true},
  bramble:{n:'Bramble & Co.',kind:'indie',cut:.5,promo:1.22,showCut:1,masters:false}
};
const MGRS={
  vance:{n:'Vance Sterling',cut:.25,init:'VS',color:'#ffd27a',style:'flash'},
  ruth:{n:'Ruth Okafor',cut:.15,init:'RO',color:'#b8f0c9',style:'steady'}
};
const ITEMS=[

function resetMonthBooks(){S.mInc={hit:0,music:0,shows:0,other:0};S.mExp={life:0,crew:0,mgr:0,interest:0,other:0}}

/* ---- saving ---- */
const slotKey=n=>SAVE_PREFIX+n;
function save(){if(!S)return;try{localStorage.setItem(slotKey(S.slot),JSON.stringify(S));localStorage.setItem(LAST_KEY,String(S.slot))}catch(e){}}
function readSlot(n){try{const r=localStorage.getItem(slotKey(n));return r?JSON.parse(r):null}catch(e){return null}}
function delSlot(n){try{localStorage.removeItem(slotKey(n))}catch(e){}}
function endingsFound(){try{return JSON.parse(localStorage.getItem(END_KEY)||'{}')}catch(e){return {}}}
function recordEnding(k){try{const E=endingsFound();E[k]=(E[k]||0)+1;localStorage.setItem(END_KEY,JSON.stringify(E))}catch(e){}}

/* ================= effects ================= */
const FXN={rel:'Relevance',cred:'Cred',legacy:'Legacy',well:'Wellbeing',cash:'',core:'Core fans',heat:'Hit plays',craft:'Craft',patience:'Label patience'};
function eff(o){
  const out=[];
  for(const k in o){let v=o[k];if(!v)continue;
    if(k==='rel'){const b=S.rel;if(v>0)v*=clamp(1.1-S.rel/95,.15,1);S.rel=clamp(S.rel+v,0,100);v=Math.round(S.rel-b);if(!v)continue}
    else if(k==='cred')S.cred=clamp(S.cred+v,0,100);
    else if(k==='legacy')S.legacy=clamp(S.legacy+v,-100,100);
    else if(k==='well')S.well=clamp(S.well+v,0,100);
    else if(k==='craft')S.craft=clamp(S.craft+v,0,100);
    else if(k==='patience'){if(!S.label)continue;S.patience=clamp(S.patience+v,0,100)}
    else if(k==='core'){v=Math.round(v);S.core=Math.max(0,S.core+v)}
    else if(k==='heat')S.hit.heat*=1+v/100;
    else if(k==='cash'){v=Math.round(v);S.cash+=v;if(v>0){S.mInc.other+=v;S.yearInc+=v}else S.mExp.other-=v}
    const up=v>0,label=k==='cash'?(up?'+':'−')+cash(Math.abs(v)).replace('−',''):`${FXN[k]} ${up?'+':'−'}${k==='core'?fmt(Math.abs(v)):k==='heat'?Math.abs(v)+'%':Math.abs(Math.round(v))}`;
    out.push(`<span class="${up?'up':'dn'}">${label}</span>`)}
  return out.length?`<div class="fx">${out.join('')}</div>`:'';
}
const promo=v=>Math.round(v/(1+.32*S.fatigue));
function useFatigue(){S.fatigue+=1}

/* ================= music ================= */
function chartPos(streams){const r=streams/S.hit.peak;if(r>=.8)return 1;const p=Math.round(1+26*Math.pow(Math.log10(.8/r),1.2));return p>100?null:p}
function legacyLabel(v=S.legacy){return v<=-60?'Punchline':v<=-20?'Meme':v<20?'Novelty':v<60?'Fan favorite':'Modern classic'}
function trendLate(){return S.trend.age>=Math.ceil(S.trend.life/2)}
function labelPromo(){return S.label?LABELS[S.label].promo:1}
function newCut(){return S.label?LABELS[S.label].cut:.8}
function seqTitle(){const w=S.hit.title.replace(/\(.*\)/,'').trim();return pick([`${w} 2`,`${w} (Again)`,`Still ${w}`,`${w} Forever`,`Return of the ${w.split(' ').pop()}`,`${w}: The Sequel`])}
function songTitle(){return pick([`${pick(TB)} ${pick(['Season','Weather','Lines','Static','Glow','Ghost','Signal','Road','Echo','Room'])}`,`${pick(['Last','Slow','Paper','Golden','Quiet','Broken','Sunday','Electric','Cold'])} ${pick(TB)}`,`${pick(['Don\'t','Can\'t','Won\'t'])} ${pick(['Forget','Stop','Wait','Leave','Look Back'])}`,`${pick(['Ordinary','Second','Brand New','Late Bloomer','Not Done Yet','Afterglow','Encore','Real Life','Small Town Gold'])}`])}

function release(o){
  // o:{type:'sequel'|'trend'|'demo'|'album'|'collab'|'diss', title, q, mult}
  const relW=o.type==='sequel'?.55:o.type==='demo'?.28:o.type==='album'?.3:.38;
  const base=o.q*(1-relW)+S.rel*relW;
  // the market: label push, fanbase, momentum, critics, and how sick people are of you releasing stuff
  const recent=S.releases.filter(r=>r.month>=S.month-1).length;
  let mult=labelPromo()*(o.mult||1)*(1+.3*S.core/(S.core+150000))*(1+.05*S.momentum)*(.75+S.cred/400)/(1+.45*recent);
  if(S.legacy<=-50)mult*=.88;else if(S.legacy>=50)mult*=1.06;
  if(o.type==='sequel'){mult*=S.seq===0?1.3:Math.pow(.68,S.seq);S.seq++}
  if(o.type==='trend')mult*=trendLate()?.7:1.45;
  if(o.type==='album')mult*=1.25*(S.album&&S.album.lead?1.1:1);
  const noise=rnd(.72,1.3);
  const streams=Math.round(S.hit.peak*Math.pow(base/100,3)*mult*.7*noise);
  const ratio=streams/S.hit.peak,pos=chartPos(streams);
  const decay=o.type==='sequel'?.5:o.type==='trend'?(trendLate()?.4:.55):o.type==='album'?.72+o.q/600:.62+o.q/520;
  const r={title:o.title,type:o.type,q:Math.round(o.q),peak:streams,streams,total:0,month:S.month,pos,decay:Math.min(.9,decay)};
  S.releases.unshift(r);S.lastRel=S.month;
  const fx={};
  fx.rel=ratio<.04?-3:clamp(Math.round(45*ratio),0,22)+1;
  fx.core=streams/1200/(1+S.core/400000)*Math.pow(o.q/100,2)*(o.type==='album'?2.2:1)*(o.dir==='personal'?1.5:1);
  if(o.type==='sequel'){fx.cred=-6;fx.legacy=-4}
  else if(o.type==='trend'){fx.cred=trendLate()?-8:-3}
  else if(o.type==='diss'){fx.cred=-2}
  else fx.cred=Math.min(4,Math.round((o.q-60)/8))+(o.dir==='pivot'&&o.q>65?6:0)+(o.dir==='hitfactory'?-4:0);
  if(ratio>.45&&o.q>65)fx.legacy=(fx.legacy||0)+5;
  if(ratio<.05&&o.type!=='demo')fx.legacy=(fx.legacy||0)-4;
  if(ratio>.25&&o.q>60)S.momentum=Math.min(4,S.momentum+1);else if(ratio<.08)S.momentum=0;
  if(pos&&pos<=10)S.stats.hits10++;
  const fxh=eff(fx);
  if(S.label){eff({patience:ratio>.25?20:ratio>.1?6:-10})}
  let head,src='chart';
  if(pos===1)head=`${S.name} is back at #1 with “${o.title}”`;
  else if(pos&&pos<=10)head=`“${o.title}” crashes into the top 10 at #${pos}`;
  else if(pos&&pos<=40)head=`“${o.title}” debuts at #${pos}. Respectable. Not “${S.hit.title}”.`;
  else if(pos)head=`“${o.title}” limps in at #${pos}`;
  else{head=`${S.name}'s “${o.title}” fails to chart`;src='gut'}
  news(src,head,pos&&pos<=10);
  let surpass='';
  if(streams>S.best.peak)S.best={peak:streams,title:o.title};
  if(streams>=S.hit.peak&&!S.surpassed){S.surpassed=true;eff({legacy:12,cred:6});news('spin',`BIGGER THAN “${S.hit.title.toUpperCase()}”: ${S.name} tops their own monster hit`,true);surpass=`<p class="sticker">Bigger than “${esc(S.hit.title)}”!</p><p>Nobody can call you a one-hit wonder now. Probably.</p>`}
  const verdict=pos===1?'Number one. Again.':pos&&pos<=10?'A genuine hit.':pos&&pos<=40?'A modest hit.':pos?'Barely charted.':'A flop.';
  return `<p><b>“${esc(o.title)}”</b> · quality ${r.q}/100</p><div class="stats"><div class="stat"><span>Chart peak</span><b>${pos?'#'+pos:'—'}</b></div><div class="stat"><span>First month</span><b>${fmt(streams)}</b></div><div class="stat"><span>vs. the hit</span><b>${Math.round(ratio*100)}%</b></div></div><p>${verdict}</p>${surpass}${fxh}`;
}

function own(id){return S.owned.includes(id)}
function albumQ(){const A=S.album;if(!A||!A.qs.length)return 0;const avg=A.qs.reduce((s,x)=>s+x,0)/A.qs.length;const polish=Math.min(9,Math.max(0,(A.prog-100)/12));return Math.round(clamp(avg+polish,5,99))}
function startAlbum(dir){S.album={dir,prog:0,qs:[],title:songTitle(),lead:false};news('gaz',`${S.name} is making an album. A ${dir==='hitfactory'?'big pop':dir==='personal'?'personal':'genre-bending'} one, apparently.`);return `<p>Working title: <b>“${esc(S.album.title)}”</b>. Book album sessions in the Studio tab (2 moves each).</p>`}
function showGross(scale){return (Math.min(S.core,150000)*.12+Math.pow(S.rel,1.5)*7)*24*scale}
function modalR(title,body){openModal({kick:'Result',title,body});return true}

function doAction(id){
  const A=ACTIONS[id];if(!A||S.ending)return;
  if(A.cond&&!A.cond())return;
  if(S.ap<A.ap){toast('Not enough moves left this month.');return}
  S.ap-=A.ap;
  if(S.voiceAct&&S.voiceAct.includes(id)){S.followed++;if(S.label)eff({patience:8})}
  A.run();
  save();
}

function signLabel(id,adv){S.label=id;S.patience=60;if(LABELS[id].masters&&S.hit.owned){S.hit.cut=.18;S.hit.owned=false}news('biz',`${S.name} signs with ${LABELS[id].n}`,true);S.offers=S.offers.filter(o=>OFFERS[o.id].tag!=='label')}
function makeOffers(first){
  S.offers=S.offers.filter(o=>(o.keep=(o.keep||0)-1)>=0);
  if(first){
    S.offers.push(mkOffer('titan',1),mkOffer('bramble',1),mkOffer('vance',1),mkOffer('ruth',1),mkOffer('talk'));return}
  let n=1+(S.mgr?1:0)+(chance(S.rel/140)?1:0)+(S.mgr==='vance'?1:0);
  if(S.rel<15&&!S.mgr)n=chance(.5)?1:0;
  const pool=Object.keys(OFFERS).filter(id=>{const O=OFFERS[id];if(O.tag==='label'||O.tag==='mgr')return false;if(O.once&&S.seen['o_'+id])return false;if(O.cond&&!O.cond())return false;if(S.offers.some(x=>x.id===id))return false;return true});
  const w=pool.map(id=>{const t=OFFERS[id].tag;let x=1;if(S.mgr==='vance'&&t==='trap')x=2.4;if(S.mgr==='ruth'&&t==='good')x=2;if(t==='good')x*=.6+S.rel/120;return {id,w:x}});
  for(let i=0;i<n&&w.length;i++){const c=wpick(w);w.splice(w.indexOf(c),1);S.offers.push(mkOffer(c.id))}
  // independent artists get a second chance at a deal / manager later
  if(!S.label&&S.month%9===0&&S.rel>25)S.offers.push(mkOffer(chance(.5)?'bramble':'titan',1));
  if(!S.mgr&&S.month%7===0)S.offers.push(mkOffer(chance(.5)?'vance':'ruth',1));
}
function mkOffer(id,keep){const O=OFFERS[id];return Object.assign({id,keep:keep?2:0},O.gen?O.gen():{})}
function acceptOffer(i){
  const o=S.offers[i];if(!o)return;const O=OFFERS[o.id];const ap=O.ap||0;
  if(S.ap<ap){toast(`Needs ${ap} move${ap>1?'s':''}.`);return}
  S.ap-=ap;S.offers.splice(i,1);S.seen['o_'+o.id]=1;
  if(S.voiceAct&&S.voiceAct.includes('offer:'+o.id)){S.followed++}
  const res=O.accept(o);
  if(res)openModal({kick:'Deal done',title:O.title(o),body:res});
  save();
}
function declineOffer(i){const o=S.offers[i];if(!o)return;S.offers.splice(i,1);if(OFFERS[o.id].once)S.seen['o_'+o.id]=1;save()}

/* ================= voices ================= */
function makeVoices(){
  const V=[];const acts=[];
  if(S.label==='titan'){
    if(S.album&&S.album.prog>=100)V.push(['BR','Brad · Titan A&R','#ffb3a1','The album\'s done? Drop it. Yesterday.',['albumRelease']]);
    else if(S.month-S.lastRel>=3)V.push(['BR','Brad · Titan A&R','#ffb3a1',`Kid, it's been ${S.month-S.lastRel||S.month} months. Give me another “${S.hit.title}”. Same tempo. Same vibe. Done.`,['sequel']]);
    else V.push(['BR','Brad · Titan A&R','#ffb3a1',`Did you see what's trending? ${S.trend.n}. Jump on it.`,['trend']]);
  }else if(S.label==='bramble'){
    V.push(['MJ','Maya · Bramble','#c9e7ff',S.album?'Keep going on the record. Don\'t let anyone rush you.':'Write. Start the album when it feels right. We\'re not in a hurry.',S.album?['albumWork']:['write','albumStart']]);
  }
  if(S.mgr==='vance'){
    const trap=S.offers.find(o=>OFFERS[o.id].tag==='trap');
    if(trap)V.push(['VS','Vance Sterling','#ffd27a',`Take the ${OFFERS[trap.id].title(trap).replace(/ wants.*/,'')} money! Money is relevance, baby!`,['offer:'+trap.id]]);
    else V.push(['VS','Vance Sterling','#ffd27a','We need a stunt. Something big. Something with a helicopter.',['stunt']]);
  }else if(S.mgr==='ruth'){
    if(S.well<35)V.push(['RO','Ruth Okafor','#b8f0c9','You look exhausted. Take time off. That\'s not a request.',['rest']]);
    else if(S.cash<0)V.push(['RO','Ruth Okafor','#b8f0c9','We\'re in the red. Play shows, cut the crew, stop buying things.',['shows']]);
    else if(S.core<30000)V.push(['RO','Ruth Okafor','#b8f0c9','Build a real fanbase. Play shows. Those people stay when the hit fades.',['shows','tour']]);
    else V.push(['RO','Ruth Okafor','#b8f0c9',S.album?'Finish the record properly. Polish beats speed.':'You\'re ready for a real album.',S.album?['albumWork']:['albumStart','write']]);
  }
  if(S.crew.length){const c=S.crew[0];V.push([c.init,c.n,'#f6c6ff',pick(['Bro. Supercar. Think about it.','Big night out tonight. Everyone who matters will be there.','Honestly? Just do the hit again. People love the hit.',`Post a meme about “${S.hit.title}”. Trust me.`]),['party','sequel','post']])}
  // the honest inner voice
  let inner;
  if(S.well<25)inner=['You are running on fumes. Burnout is close.',['rest']];
  else if(S.rel<30)inner=['People are forgetting your name. You need something big, now.',['press','single','tour']];
  else if(S.cash<-50000)inner=['The money is gone. How did the money go?',['shows','tour']];
  else if(!S.album&&S.month>5)inner=['Singles fade. A great album is how careers last.',['albumStart']];
  else if(S.craft<50)inner=['You only really know how to write one song. Get better.',['write']];
  else inner=['Your core fans are your safety net when the spotlight moves on.',['shows','tour']];
  V.push(['ME','Your gut','#ffffff',inner[0],inner[1]]);
  S.voices=V.map(v=>({init:v[0],who:v[1],color:v[2],line:v[3],acts:v[4]}));
  S.voiceAct=S.label&&S.voices[0]?S.voices[0].acts:null;
}

function latest(){return S.releases[0]}
function hire(id){const c=CREW_POOL.find(x=>x.id===id);if(c&&!S.crew.some(x=>x.id===id))S.crew.push(Object.assign({},c))}
function pickEvent(){
  const pool=EVENTS.filter(e=>{if(e.once&&S.seen[e.id])return false;if((S.cool[e.id]||0)>S.month)return false;if(e.cond&&!e.cond())return false;return true});
  if(!pool.length)return null;
  return wpick(pool.map(e=>({e,w:(typeof e.w==='function'?e.w():(e.w||1))*(e.tone==='good'?1.3:1)}))).e;
}
function fireEvent(e){
  S.seen[e.id]=1;S.cool[e.id]=S.month+6;
  openModal({kick:`Month ${S.month} · ${e.tone==='good'?'Good news':e.tone==='bad'?'Trouble':'Something happened'}`,kc:e.tone==='good'?'var(--good)':e.tone==='bad'?'var(--bad)':'',title:e.title(),body:e.text(),choices:e.ch.map(c=>({t:c.t,d:typeof c.d==='function'?c.d():c.d,dis:c.dis,fn:c.fx}))});
}

/* ================= month end ================= */
function endMonth(){
  if(S.ending)return;
  const relFrom=S.rel;resetBooksKeep();
  const inc=S.mInc,exp=S.mExp;
  // streams & royalties
  const hitStreams=S.hit.heat;S.hit.total+=hitStreams;
  inc.hit=hitStreams*.0035*S.hit.cut;
  let mine=0;for(const r of S.releases){mine+=r.streams;r.total+=r.streams;S.newTotal+=r.streams}
  inc.music=mine*.0035*newCut();
  const gross=inc.hit+inc.music;
  // hit decay: classics hold, punchlines fade
  const dec=.87+S.legacy/1000+(S.stats.memes>3?-.01:0);
  const floor=S.hit.peak*(.015+Math.max(0,S.legacy)/2500);
  S.hit.heat=Math.max(floor,S.hit.heat*dec);
  for(const r of S.releases)r.streams*=r.decay;
  // expenses
  exp.life=S.owned.reduce((s,id)=>s+(ITEMS.find(x=>x.id===id)||{up:0}).up,0)+4000;
  exp.crew=S.crew.reduce((s,c)=>s+c.cost,0);
  exp.mgr=S.mgr?(gross+inc.shows)*MGRS[S.mgr].cut:0;
  exp.interest=S.cash<0?-S.cash*.04:0;
  S.cash+=gross-exp.life-exp.crew-exp.mgr-exp.interest;
  S.yearInc+=gross;
  // year end taxes
  const taxDue=S.month%12===0?Math.round(S.yearInc*(own('accountant')?.18:.3)):0;
  exp.tax=taxDue;S.cash-=taxDue;if(taxDue>0)S.yearInc=0;
  const net=gross+inc.shows+inc.other-exp.life-exp.crew-exp.mgr-exp.interest-exp.other-taxDue;
  // relevance drain
  const since=S.month-S.lastRel;
  let drain=relDrain();
  const support=relSupport();
  const relFloor=Math.min(35,S.core/4000);
  const before=S.rel;
  S.rel=clamp(S.rel-drain+support,0,100);
  if(S.rel<relFloor&&before>=relFloor)S.rel=relFloor;else if(S.rel<relFloor)S.rel=Math.min(relFloor,before+1);
  S.rel=Math.round(S.rel*10)/10;
  // other drift
  S.core=Math.round(S.core*.98);
  S.well=clamp(S.well+4+(own('therapist')?6:0)-S.crew.length*1,0,100);
  S.fatigue=Math.max(0,S.fatigue-1.5);
  if(since>=6)S.cred=Math.max(0,S.cred-1);
  if(S.label){S.patience=clamp(S.patience-(since>=3?(S.label==='titan'?9:3):0),0,100)}
  S.trend.age++;let trendNews='';
  if(S.trend.age>=S.trend.life){const old=S.trend.n;S.trend={n:pick(TRENDS.filter(t=>t!==old)),age:0,life:ri(4,6)};trendNews=`New trend: ${S.trend.n}`;news('loopy',`Everyone is suddenly obsessed with ${S.trend.n}`)}
  // fade headline
  const r=S.rel;
  news(r>75?'spin':r>45?'gut':r>20?'gaz':'gut',r>75?pick([`Is ${S.name} the face of the year?`,`${S.name} can't leave the house without being mobbed`,`“${S.hit.title}” still everywhere, month ${S.month}`]):r>45?pick([`${S.name} spotted at a smoothie bar`,`What's next for ${S.name}?`,`Fans wonder when ${S.name} will drop new music`]):r>20?pick([`Remember “${S.hit.title}”? We checked in on ${S.name}`,`${S.name}: still around, technically`,`Whatever happened to the “${S.hit.title}” singer?`]):pick([`Pub quiz: who sang “${S.hit.title}”? (Nobody got it)`,`“${S.hit.title}” — that song you forgot you knew`,`${S.name}'s name trends after someone mistakes them for a furniture brand`]));
  const summary={m:S.month,relFrom,relTo:S.rel,drain:Math.round(drain-support),inc:Object.assign({},inc),exp:Object.assign({},exp),net,hitStreams,mine,trendNews};
  S.lastSummary=summary;resetMonthBooks();
  // next month
  S.month++;
  S.relHist.push(Math.round(S.rel));
  S.zero=S.rel<=1?S.zero+1:0;
  S.ap=3;
  if(S.busy>0){S.busy--;S.ap=0}
  else if(S.well<20)S.ap=2;
  UI.prevRel=relFrom;
  // label drop
  let dropped=false;
  if(S.label&&S.patience<=0){dropped=S.label;S.label=null;news('biz',`${LABELS[dropped].n} drops ${S.name}`,true);eff({rel:-6,cred:2})}
  // ending check
  const end=checkEnding();
  if(end){S.ending=end;recordEnding(end);save();UI.screen='ending';UI.modal=null;UI.queue=[];render();return}
  makeOffers(false);
  openModal({kick:`End of month ${summary.m}`,title:monthTitle(summary),body:summaryHTML(summary)});
  if(taxDue>0)openModal({kick:'Year-end',title:'The tax bill arrives',body:`<p>You earned a lot this year. The government noticed. <b class="bad">${cash(-taxDue)}</b> is gone${own('accountant')?' (your accountant saved you a chunk)':''}.</p>`+(S.cash<0?'<p class="bad">You\'re now in debt. Interest is 4% a month.</p>':'')});
  if(dropped)openModal({kick:'Bad news',title:`${LABELS[dropped].n} dropped you`,body:`<p>“We've decided to go in a different direction.” ${LABELS[dropped].masters?'They keep the hit\'s masters.':''} You're independent again.</p>`});
  if(S.cash<-150000&&!S.stats.bankrupt)bankruptcy();
  if(S.well<12)openModal({kick:'Burnout',title:'You collapsed backstage',body:`<p>Exhaustion. The doctor orders a full month off. This month you only have one move.</p>`+eff({well:30,rel:-5}),after:()=>{S.ap=1}});
  else if(chance(.9)){const e=pickEvent();if(e)fireEvent(e);if(chance(.3)){const e2=pickEvent();if(e2)fireEvent(e2)}}
  if(S.zero===2)openModal({kick:'Warning',title:'You\'re on the edge of oblivion',body:'<p>Your relevance has been at zero for two months. One more and you\'re a pub-quiz question forever.</p>'});
  makeVoices();
  save();
}
function resetBooksKeep(){/* shows/other already accumulated during the month */for(const k of ['hit','music'])S.mInc[k]=0;for(const k of ['life','crew','mgr','interest'])S.mExp[k]=0}
function monthTitle(s){const d=s.relTo-s.relFrom;return d>2?'You\'re heating up':d>-4?'Holding on':d>-10?'The spotlight drifts':'Fading fast'}
function summaryHTML(s){

function bankruptcy(){
  S.stats.bankrupt=1;const back=S.owned.reduce((s,id)=>s+(ITEMS.find(x=>x.id===id)||{cost:0}).cost*.35,0);S.owned=[];S.crew=[];

/* ================= endings ================= */
function checkEnding(){
  if(S.zero>=3)return 'forgotten';
  if(S.month>MONTHS)return finalEnding();
  return null;
}
// ending targets: shown live on the Now tab, so players always know what they're aiming for
function careerReqs(){
  const hits=S.releases.filter(r=>r.pos&&r.pos<=10&&r.month>MONTHS-18).length,best=S.best.peak/S.hit.peak;
  return [
    {t:'A release bigger than the hit, or 3 top-10s in your last 18 months',v:Math.max(best,hits/3),ok:S.surpassed||hits>=3,lab:S.surpassed?'done':`best ${Math.round(best*100)}% · ${hits}/3`},
    {t:'Cred 40+',v:S.cred/40,ok:S.cred>=40,lab:Math.round(S.cred)},
    {t:'60K core fans',v:S.core/60000,ok:S.core>=60000,lab:fmt(S.core)},
    {t:'Relevance 30+ when time runs out',v:S.rel/30,ok:S.rel>=30,lab:Math.round(S.rel)}];
}
function cultReqs(){return [
  {t:'80K core fans',v:S.core/80000,ok:S.core>=80000,lab:fmt(S.core)},
  {t:'Cred 45+',v:S.cred/45,ok:S.cred>=45,lab:Math.round(S.cred)}]}
function finalEnding(){
  if(careerReqs().every(r=>r.ok))return 'career';
  if(cultReqs().every(r=>r.ok))return 'cult';
  if(S.rel>=12||S.core>=40000)return 'nostalgia';
  return 'forgotten';
}
function relDrain(){const since=S.month-S.lastRel;return 5+S.month*.14+(since>6?2:0)+(since>12?2:0)}
function relSupport(){return (S.hit.heat/S.hit.peak)*3.5+(S.legacy>=40?1.5:0)}
function endingText(k){
  const n=esc(S.name),t=esc(S.hit.title),L=S.legacy;
  if(k==='career')return {kick:'Three years later',head:`${n}: Not a One-Hit Wonder`,deck:`The “${t}” singer has quietly become one of the most important artists of the decade.`,body:`<p>${S.surpassed?`“${esc(S.best.title)}” outgrew the song that made you famous.`:'Hit after hit after hit.'} When people talk about “${t}” now, they call it <i>an early single</i>. Ten years from now there'll be a box set. There'll be a documentary, and this time you get to choose the story.</p>`};
  if(k==='cult')return {kick:'Three years later',head:`${n} Is Your Favourite Artist's Favourite Artist`,deck:`Mainstream radio moved on. ${fmt(S.core)} people never did.`,body:`<p>You sell out the same 2,000-capacity rooms every night, and the crowd sings the deep cuts louder than “${t}”. Critics write long essays about you. Younger artists name-check you. You will never be on a talk show again, and you are completely fine with that.</p>`};
  if(k==='nostalgia')return {kick:'Three years later',head:L>=20?`“${t}” Is Forever. So Is the Tour.`:`Still Doing ${esc(S.hit.dance.replace(/^the /,'The '))} at County Fairs`,deck:L>=20?`${n} plays the hit every night and everyone sings every word.`:`${n} has found a comfortable home on the cruise ship circuit.`,body:`<p>${S.stats.nostalgia?'The “Remember When?” tour keeps calling, and you keep saying yes. ':''}You open with a new song, and people check their phones. Then the first notes of “${t}” play and the whole room lights up. It pays the bills. ${L>=20?'It\'s a beloved song, and you\'re its keeper.':'It\'s a punchline, and you\'ve made your peace with being in on the joke.'}</p>`};
  return {kick:'Pub quiz, round four',head:`Q: Who Sang “${t}”?`,deck:`A: Nobody at the table could remember.`,body:`<p>${S.stats.bankrupt?'The money went first. ':''}${L<=-40?`The song lives on as a meme template. Your face does not.`:`The song still pops up on throwback playlists. Your name, increasingly, does not.`} Somewhere, a quizmaster reads out the answer and a whole pub goes “ohhh, <i>them</i>”. You're doing okay, honestly. You have a normal job. Sometimes you hum the hook at the supermarket and nobody notices.</p>`};
}

function spark(arr,h=56){if(arr.length<2)arr=[arr[0]||0,arr[0]||0];const w=300,st=w/(arr.length-1);const pts=arr.map((v,i)=>`${(i*st).toFixed(1)},${(h-3-(v/100)*(h-6)).toFixed(1)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Relevance history"><polyline points="0,${h} ${pts} ${w},${h}" fill="rgba(255,91,20,.18)" stroke="none"/><polyline points="${pts}" fill="none" stroke="#16151a" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`}

  <div class="card"><div class="between"><h2>Make music</h2><span class="pill">${S.ap} move${S.ap===1?'':'s'} left</span></div><div class="list">${['write','single','sequel','trend'].map(actRow).join('')}</div></div>
  <div class="card"><h2>The album</h2>${A?`<div class="between"><b>“${esc(A.title)}”</b><span class="pill b">${A.dir==='hitfactory'?'Hit factory':A.dir==='personal'?'Personal':'Pivot'}</span></div><div class="bar b"><i style="width:${Math.min(100,A.prog)}%"></i></div><small class="mute">${A.qs.length} session${A.qs.length===1?'':'s'} · quality so far ${albumQ()||'—'}${S.producer?' · produced by Marisol Reyes':''}</small>`:'<p class="mute">No album in progress. Singles keep you visible; albums build careers.</p>'}<div class="list">${['albumStart','albumWork','leadSingle','albumRelease'].map(actRow).join('')}</div></div>
  <div class="card"><div class="between"><h2>Demos</h2><small class="mute">Best first · max 8</small></div>${S.demos.length?`<div class="list">${S.demos.map(d=>`<div class="between"><span>“${esc(d.title)}”</span><span class="pill ${d.q>=70?'l':''}">Q ${d.q}</span></div>`).join('')}</div>`:'<div class="empty">No demos. Write some songs.</div>'}</div>
  <div class="card"><h2>Discography</h2><div class="list"><div class="between"><span><b>“${esc(S.hit.title)}”</b><br><small class="mute">The hit · ${fmt(S.hit.total)} plays since</small></span><span class="pill t">#1</span></div>${S.releases.map(r=>`<div class="between"><span style="min-width:0"><b>“${esc(r.title)}”</b><br><small class="mute">M${r.month} · ${r.type==='album'?'Album':r.type==='sequel'?'Sound-alike':r.type==='trend'?'Trend chase':r.type==='collab'?'Collab':r.type==='diss'?'Diss track':'Single'} · Q ${r.q} · ${fmt(r.total+r.streams)} plays</small></span><span class="pill ${r.pos&&r.pos<=10?'l':r.pos?'':'r'}">${r.pos?'#'+r.pos:'flop'}</span></div>`).join('')}</div></div>
  </div>`;
}
function spotView(){
  return `<div class="sec">
  <div class="card"><div class="between"><h2>Get seen</h2><span class="pill">${S.ap} move${S.ap===1?'':'s'} left</span></div><div class="list">${['press','post','stunt'].map(actRow).join('')}</div>${S.fatigue>=2?'<small class="bad">Overexposed: promo is less effective until people miss you a bit.</small>':''}</div>
  <div class="card"><h2>Play live</h2><div class="list">${['shows','tour'].map(actRow).join('')}</div></div>
  <div class="card"><div class="between"><h2>What's trending</h2><span class="pill ${trendLate()?'t':'l'}">${trendLate()?'peaking':'rising'}</span></div><p style="font-family:var(--serif);font-size:26px;line-height:1">${esc(S.trend.n)}</p><div class="bar ${trendLate()?'t':'l'}"><i style="width:${Math.round(S.trend.age/S.trend.life*100)}%"></i></div><small class="mute">Trends burn out in a few months. Chase early or not at all.</small></div>
  </div>`;
}
function lifeView(){
  const s=S.lastSummary;
  return `<div class="sec">
  <div class="card"><h2>Look after yourself</h2><div class="list">${['rest','party'].map(actRow).join('')}</div></div>
  <div class="card"><h2>Money</h2><div class="stats"><div class="stat"><span>Cash</span><b class="${S.cash<0?'bad':''}">${cash(S.cash)}</b></div><div class="stat"><span>Burn / mo</span><b>${cash(4000+S.owned.reduce((a,id)=>a+(ITEMS.find(x=>x.id===id)||{up:0}).up,0)+S.crew.reduce((a,c)=>a+c.cost,0))}</b></div><div class="stat"><span>Hit share</span><b>${Math.round(S.hit.cut*100)}%</b></div></div>${s?`<small class="mute">Last month: ${cash(s.net)} net. Taxes are due at the end of each year.</small>`:'<small class="mute">Royalties arrive at the end of each month. Taxes are due at year end.</small>'}</div>
  <div class="card"><h2>Team</h2><div class="list">
    <div class="between"><span><b>Label</b><br><small class="mute">${S.label?`${LABELS[S.label].n} · you keep ${Math.round(LABELS[S.label].cut*100)}% of new music`:'Independent · you keep 80% of new music'}</small></span></div>
    <div class="between"><span><b>Manager</b><br><small class="mute">${S.mgr?`${MGRS[S.mgr].n} · ${MGRS[S.mgr].cut*100}% of income`:'Self-managed · fewer offers'}</small></span>${S.mgr?'<button class="btn sm alt" data-a="firemgr">Fire</button>':''}</div>
    ${S.crew.map((c,i)=>`<div class="between"><span><b>${esc(c.n)}</b><br><small class="mute">${esc(c.role)} · ${cash(c.cost)}/mo</small></span><button class="btn sm alt" data-a="fire" data-i="${i}">Fire</button></div>`).join('')}
  </div></div>
  <div class="card"><h2>Spend it</h2><div class="list">${ITEMS.map(it=>{const o=own(it.id);return `<div class="between" style="align-items:flex-start"><span style="min-width:0"><b>${esc(it.n)}${it.id==='tiger'?esc(S.tiger):''}</b><br><small class="mute">${esc(it.d)}</small></span>${o?`<button class="btn sm alt" data-a="sell" data-id="${it.id}">Sell</button>`:`<button class="btn sm" data-a="buy" data-id="${it.id}" ${S.cash<it.cost?'disabled':''}>${it.cost?cash(it.cost):'Hire'}</button>`}</div>`}).join('')}</div></div>
  </div>`;
}
function feedView(){
  return `<div class="sec"><div class="card" style="background:transparent;box-shadow:none;border:0;padding:0"><h2 style="font-family:var(--serif);font-weight:400;font-size:30px">The Feed</h2><small class="mute">What the world is saying about you.</small></div>
  ${S.feed.map((f,i)=>`${i===0||S.feed[i-1].m!==f.m?`<div class="feedmonth">Month ${f.m}</div>`:''}<div class="clip ${f.big?'big':''}" style="--r:${(i%3-1)*.6}deg"><div class="src"><span>${esc(OUTLETS[f.src]||f.src)}</span></div><h3>${esc(f.t)}</h3></div>`).join('')}</div>`;
}
function endingView(){
  const k=S.ending,T=endingText(k),E=endingsFound();
  return `<div class="wrap title"><div class="front"><div class="mast"><b>The Daily Spin</b><span class="k">${esc(T.kick)}</span></div><span class="sticker" style="align-self:flex-start">Ending: ${ENDINGS[k].n}</span><h1>${T.head}</h1><p class="deck">${T.deck}</p>${T.body}
  ${spark(S.relHist)}<small class="mute">Relevance, month by month.</small>
  <div class="stats"><div class="stat"><span>Core fans</span><b>${fmt(S.core)}</b></div><div class="stat"><span>Cred</span><b>${Math.round(S.cred)}</b></div><div class="stat"><span>Cash</span><b>${cash(S.cash)}</b></div><div class="stat"><span>Releases</span><b>${S.releases.length}</b></div><div class="stat"><span>Top 10s</span><b>${S.stats.hits10}</b></div><div class="stat"><span>The hit is</span><b>${legacyLabel()}</b></div></div>
  ${S.best.peak?`<small>Biggest since the hit: <b>“${esc(S.best.title)}”</b>, ${Math.round(S.best.peak/S.hit.peak*100)}% as big.</small>`:''}</div>
  <div class="card"><div class="between"><h2>Endings found</h2><span class="pill">${Object.keys(E).length}/4</span></div><div class="ends">${Object.keys(ENDINGS).map(x=>`<div class="endtile ${E[x]?'got':''}"><span class="ic">${E[x]?ENDINGS[x].ic:'🔒'}</span>${E[x]?ENDINGS[x].n:'???'}</div>`).join('')}</div></div>
  <div class="row"><button class="btn alt" data-a="title" style="flex:1">Title screen</button><button class="btn hot" data-a="again" style="flex:1">New hit</button></div></div>`;
}
function helpHTML(){return `<p>You start with a massive viral hit. Your <b>relevance</b> drains every month, and faster as time goes on. Hit zero for three months and you're forgotten.</p>
<p>Each month you get <b>3 moves</b>. Write, record, release, promote, tour, or rest. Then end the month: royalties arrive, bills leave, and something usually happens.</p>
<p><b>Quick tricks</b> (sound-alike singles, trend chasing, ads, reality TV) buy attention but cost credibility and turn your hit into a joke. <b>Real work</b> (better songs, albums, touring) is slow but builds core fans who stick around.</p>
<p>After ${MONTHS} months you'll get one of four endings: <b>Trivia Answer</b>, <b>Nostalgia Circuit</b>, <b>Cult Favorite</b>, or <b>Not a One-Hit Wonder</b>. The <b>Your goals</b> card on the Now tab shows exactly what each good ending needs and which one you're heading for.</p>
<p class="mute"><small>Saves automatically after every move.</small></p>`}
function modalHTML(){
  const m=UI.modal;if(!m)return '';
  const ch=m.choices&&m.choices.length?m.choices.map((c,i)=>`<button class="choice ${i===0&&m.choices.length>1?'':''}" data-a="mc" data-i="${i}" ${isDis(c)?'disabled style="opacity:.4"':''}><b>${esc(c.t)}</b>${c.d?`<small>${esc(c.d)}</small>`:''}</button>`).join(''):`<button class="btn wide" data-a="mok">${UI.queue.length?'Next':'OK'}</button>`;
  return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">${m.kick?`<div class="kick"${m.kc?` style="color:${m.kc}"`:''}>${esc(m.kick)}</div>`:''}<h2 id="mt">${esc(m.title)}</h2>${m.body?`<div class="body">${m.body}</div>`:''}<div class="stack">${ch}</div></div></div>`;
}
function gameView(){
  const views={now:nowView,studio:studioView,spot:spotView,life:lifeView,feed:feedView};
  const tabs=[['now','Now'],['studio','Studio'],['spot','Spotlight'],['life','Life'],['feed','Feed']];
  const nOff=S.offers.length;
  return hud()+`<main class="wrap">${views[UI.tab]()}</main>
  <div class="endbar"><div class="wrap"><button class="btn ${S.ap===0?'hot':''}" data-a="end">${S.month>=MONTHS?'Finish the final month':`End month ${S.month}`} ▸</button></div></div>
  <nav class="tabs"><div class="wrap">${tabs.map(([k,n])=>`<button class="tab ${UI.tab===k?'on':''}" data-a="tab" data-v="${k}">${ICONS[k]}${n}${k==='now'&&nOff?`<span class="dot">${nOff}</span>`:''}</button>`).join('')}</div></nav>`;
}
function render(){
  const app=$('#app');
  let html;
  if(UI.screen==='game'&&S)html=gameView();
  else if(UI.screen==='ending'&&S)html=endingView();
  else if(UI.screen==='setup')html=setupView();
  else html=titleView();
  app.innerHTML=html+modalHTML()+(UI.toast?`<div class="toast" role="status">${esc(UI.toast)}</div>`:'');
  const f=S&&UI.screen!=='title'?clamp(1-S.rel/100,0,1):0;
  document.documentElement.style.setProperty('--fade',f.toFixed(3));
  // animate relevance bars from previous value to current
  const bars=document.querySelectorAll('.relbar i[data-to]');
  if(bars.length)requestAnimationFrame(()=>requestAnimationFrame(()=>bars.forEach(b=>b.style.width=b.dataset.to+'%')));
  UI.prevRel=null;
}

/* ---------- input ---------- */
const ACT={
  tab:d=>{UI.tab=d.v;window.scrollTo(0,0)},
  act:d=>doAction(d.id),
  accept:d=>acceptOffer(+d.i),
  decline:d=>declineOffer(+d.i),
  end:()=>{if(S.ap>0&&!S.busy){openModal({kick:'Wait',title:`You still have ${S.ap} move${S.ap>1?'s':''}`,body:'<p>Unused moves are lost. The world won\'t wait for you.</p>',choices:[{t:'End the month anyway',fn:()=>{UI.modal=null;UI.queue=[];endMonth();return null}},{t:'Keep playing',fn:()=>null}]});return}endMonth()},
  mc:d=>{const m=UI.modal;const c=m&&m.choices[+d.i];if(!c||isDis(c))return;closeModal();const r=c.fn?c.fn():null;if(r)openModal({kick:'Result',title:m.title,body:r});if(S)save()},
  mok:()=>{closeModal();if(S)save()},
  menu:()=>openModal({kick:'Menu',title:S.name,body:`<p class="mute">Month ${S.month} of ${MONTHS} · Slot ${S.slot}. Your progress saves automatically.</p>`,choices:[{t:'How to play',fn:()=>helpHTML()},{t:'Back to title screen',d:'Your game is saved.',fn:()=>{save();UI.screen='title';UI.queue=[];return null}},{t:'Close',fn:()=>null}]}),
  help:()=>openModal({kick:'How to play',title:'Don\'t fade away',body:helpHTML()}),
  newgame:d=>{UI.draft={slot:+d.n,name:genName(),hit:genHit()};UI.screen='setup'},
  load:d=>{const s=readSlot(+d.n);if(!s)return;S=s;S.slot=+d.n;UI.screen=S.ending?'ending':'game';UI.tab='now'},
  delslot:d=>openModal({kick:'Delete',title:`Delete slot ${d.n}?`,body:'<p>This can\'t be undone.</p>',choices:[{t:'Delete it',fn:()=>{delSlot(+d.n);if(S&&S.slot===+d.n)S=null;return null}},{t:'Cancel',fn:()=>null}]}),
  rname:()=>{UI.draft.name=genName()},
  rhit:()=>{UI.draft.name=($('#f-name')||{}).value||UI.draft.name;UI.draft.hit=genHit()},
  start:()=>{const nm=(($('#f-name')||{}).value||'').trim()||UI.draft.name;newGame(UI.draft.slot,nm.slice(0,28),UI.draft.hit);UI.screen='game';UI.tab='now';
    openModal({kick:'Week one',title:`“${UI.draft.hit.title}” is everywhere`,body:`<p>It was ${esc(UI.draft.hit.origin)}. Now it's #1 in 14 countries, and ${esc(UI.draft.hit.dance)} is on every phone on Earth.</p><p>Your phone has not stopped ringing. Labels, managers, talk shows. Check your <b>Offers</b>.</p><p>The <b>relevance</b> meter at the top is the most important number in your life. It only goes one way unless you push back.</p>`})},
  title:()=>{UI.screen='title';UI.modal=null;UI.queue=[]},
  again:()=>{const n=S.slot;UI.draft={slot:n,name:S.name,hit:genHit()};UI.screen='setup'},
  fire:d=>{const c=S.crew.splice(+d.i,1)[0];if(c){news('gut',`${S.name} cuts ties with ${c.n}`);toast(`${c.n} is off the payroll.`)}save()},
  firemgr:()=>{const m=MGRS[S.mgr].n;S.mgr=null;news('biz',`${S.name} parts ways with manager ${m}`);toast(`You fired ${m}.`);save()},
  buy:d=>{const it=ITEMS.find(x=>x.id===d.id);if(!it||own(it.id)||S.cash<it.cost)return;S.cash-=it.cost;S.mExp.other+=it.cost;S.owned.push(it.id);const r=eff(it.fx);if(it.cost>=50000)news('gut',`${S.name} splashes out on a ${it.id==='tiger'?'tiger':it.n.toLowerCase()}`);openModal({kick:'Purchased',title:it.n+(it.id==='tiger'?S.tiger:''),body:r||'<p>Done.</p>'});save()},
  sell:d=>{const it=ITEMS.find(x=>x.id===d.id);if(!it||!own(it.id))return;S.owned=S.owned.filter(x=>x!==it.id);const back=Math.round(it.cost*.4);S.cash+=back;S.mInc.other+=back;toast(it.cost?`Sold for ${cash(back)}.`:'Cancelled.');save()}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.a];if(!f)return;
  f(b.dataset,b);render();
});
document.addEventListener('input',e=>{if(e.target.id==='f-name'&&UI.draft)UI.draft.name=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='f-name'){e.target.blur()}});

/* ---- auto-update: reload when a newer version is published ---- */
const APP_VER='202610240600';
function checkUpdate(){if(!/^https?:/.test(location.protocol))return;fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/const APP_VER='(\d+)'/);if(m&&m[1]!==APP_VER&&!UI.modal){save();location.replace(location.pathname+'?v='+m[1])}}).catch(()=>{})}
setTimeout(checkUpdate,1500);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else checkUpdate()});
window.addEventListener('pagehide',save);

/* ---- boot: resume last slot straight into the game ---- */
(function boot(){let n=1;try{n=+localStorage.getItem(LAST_KEY)||0}catch(e){}const s=n?readSlot(n):null;if(s&&!s.ending){S=s;S.slot=n;UI.screen='game'}render()})();
</script>
</body>
</html>
