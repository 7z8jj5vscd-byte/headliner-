<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dream Academy">
<meta name="theme-color" content="#0d0e10">
<meta name="color-scheme" content="dark">
<meta name="description" content="Dream Academy: Story Mode. An unofficial fan game: train the twenty Dream Academy contestants, survive the show, debut, and keep a group together for twelve years.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Dream Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Serif:ital,wght@0,600;1,600&display=swap">
<style>
/* Look: raw documentary footage. Charcoal slate, a red REC mark, monospace timecodes, confessional cards. */
:root{--ground:#0d0e10;--surface:#16181c;--raised:#1f2228;--rule:#2c3038;--text:#ecebe6;--muted:#a5a7ad;--faint:#73777f;
 --rec:#e5484d;--amber:#f0b44c;--ok:#6fcf97;--bad:#ff6b6b;
 --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"IBM Plex Serif",Georgia,serif;--r:10px}
*{box-sizing:border-box}
html{background:var(--ground);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.5 var(--sans);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.05;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:not-allowed}
h1,h2,h3{margin:0 0 6px;line-height:1.2;text-wrap:balance}h1{font:600 34px/1.08 var(--serif)}h2{font:600 20px/1.25 var(--serif)}
h3{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
p{margin:0 0 8px}.small{font-size:12.5px}.muted{color:var(--muted)}.faint{color:var(--faint)}.pos{color:var(--ok)}.neg{color:var(--bad)}.spot{color:var(--amber)}.mono{font-family:var(--mono)}
.eyebrow{display:block;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rec);margin-bottom:4px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:720px;margin:0 auto;padding-bottom:96px}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap;margin-top:12px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}.stack.tight{gap:8px;margin-top:12px}.pad{padding:0 16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;margin:12px 16px}
.card.note{border-style:dashed}
.btn{background:var(--text);color:var(--ground);border:0;border-radius:6px;padding:9px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--rule)}.btn.sm{padding:6px 12px;font-size:12.5px}.btn.big{padding:13px 20px;font-size:15px;width:100%;margin-top:10px}
.btn.warnbtn{background:var(--rec);color:#fff}
.rec{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);letter-spacing:.12em;color:var(--rec)}.rec::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--rec);animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
.tag{display:inline-block;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);margin:2px 4px 2px 0;vertical-align:middle}
.tag.focus{color:var(--ground);background:var(--amber);border-color:var(--amber)}.tag.warn{color:var(--amber);border-color:var(--amber)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.calm{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 60%,var(--rule))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:var(--raised);border:1px solid var(--rule);border-radius:6px;padding:6px 11px;font-size:12.5px;font-weight:500}
.chip.on{background:var(--text);color:var(--ground);border-color:var(--text);font-weight:700}
.choice{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.choice b{display:block}.choice span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}.choice:hover,.choice.on{border-color:var(--text)}
.field{display:flex;flex-direction:column;gap:4px;margin:6px 0}.field span{font-size:12px;color:var(--muted)}.field.inline{flex-direction:row;align-items:center;gap:8px}
select,textarea{background:var(--raised);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;max-width:100%}
textarea.code{width:100%;height:120px;font:11px var(--mono);margin:8px 0}
.bar{flex:1;height:6px;background:var(--raised);border-radius:2px;overflow:hidden;min-width:40px;display:block}.bar i{display:block;height:100%;background:var(--text)}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--amber)}.bar.bad i{background:var(--bad)}
.statrow{display:flex;align-items:center;gap:10px;margin:6px 0}.statrow>span:first-child{width:96px;font-size:12.5px;color:var(--muted)}.statrow>b{width:30px;text-align:right;font:500 13px var(--mono)}
.av{display:inline-block;border-radius:6px;overflow:hidden;flex:none;vertical-align:middle;background:#1b1e23}.av svg{display:block;width:100%;height:100%}
/* title */
.title{padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 24px;display:flex;flex-direction:column;gap:10px}
.title h1 span{font-style:italic;color:var(--muted)}
.slate{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:8px;font-size:11px;color:var(--faint)}
.lead{font-size:15px;color:var(--muted);max-width:520px}
.cast-strip{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.notice{font-size:12px;color:var(--faint);border-left:2px solid var(--rec);padding-left:10px;margin-top:10px}
.setup .seg{display:grid;gap:8px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pick{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
.pick b{font-size:13px}.pick span{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.2}.pick.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
/* top */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;border-bottom:1px solid var(--rule)}
.date{font-size:15px;font-weight:700}.chap{font-size:11px;color:var(--muted);letter-spacing:.08em;text-align:right}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}.st{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:4px 2px;text-align:center}
.st b{display:block;font:700 14px var(--mono)}.st span{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;border:1px solid var(--rule);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;position:relative}
.tab.on{background:var(--text);color:var(--ground);border-color:var(--text);font-weight:700}
.badge{position:absolute;top:-6px;right:-5px;background:var(--rec);color:#fff;font:700 10px var(--mono);font-style:normal;border-radius:99px;padding:0 5px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(transparent,var(--ground) 30%);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.foot .btn.big{max-width:688px;display:flex;margin:0 auto}
/* plan */
.prow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}.prow:first-of-type{border-top:0}
.pav{padding:0;border:0;background:none;align-self:flex-start}.pmain{flex:1;min-width:0}
.ctrl{font-size:12px;padding:4px 6px}
.mini{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--faint);margin:4px 0}.mini .bar{max-width:90px}.mini .mono{color:var(--text)}
.acts .chip{padding:5px 9px;font-size:12px}
.grade{font:700 12px var(--mono)}.gAp{color:var(--ok)}.gA{color:#a8e6c3}.gB{color:var(--text)}.gC{color:var(--amber)}.gD{color:var(--bad)}
/* cast */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ccard{background:var(--raised);border:1px solid var(--rule);border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.ccard .tags{line-height:1}
.prof{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.grades{display:flex;flex-wrap:wrap;gap:6px}.grades .grade{background:var(--raised);border-radius:4px;padding:2px 6px}
.bonds{display:flex;flex-direction:column;gap:4px}.bondrow{display:flex;align-items:center;gap:8px;font-size:12.5px}.bondrow>span:nth-child(2){width:80px}.bondrow b{width:34px;text-align:right;font-size:12px}
.bbar{flex:1;height:6px;background:var(--raised);position:relative;border-radius:2px}.bbar i{position:absolute;top:0;height:100%;max-width:50%}.bbar i.pos{background:var(--text)}.bbar i.neg{background:var(--bad)}
.bbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--faint)}
.lookprev{margin:8px 0}.sw{display:flex;flex-wrap:wrap;gap:6px}.swatch{width:32px;height:32px;border-radius:6px;border:2px solid var(--rule)}.swatch.on{border-color:var(--amber)}
/* drama */
.web{width:100%;max-width:420px;display:block;margin:0 auto}.wnode{padding:0;border:0;background:none;display:block;width:100%;height:100%}.wnode .av{width:100%!important;height:100%!important;border-radius:50%;box-shadow:0 0 0 2px var(--ground)}
.wlabel{fill:var(--muted);font:500 9px var(--mono)}
.tension{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}.tension:first-of-type{border-top:0}.tension .tl{flex:1;min-width:0}
.pair{display:flex}.pair .av+.av{margin-left:-8px;box-shadow:-2px 0 0 var(--surface)}.pair.big{margin:10px 0}
.heat{display:flex;gap:3px;margin-top:4px}.heat i{width:16px;height:5px;background:var(--raised);border-radius:1px}.heat i.on{background:var(--rec)}
.confs{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.conf{display:flex;gap:10px;align-items:flex-start;background:#0a0b0d;border:1px solid var(--rule);border-radius:8px;padding:10px}
.conf p{margin:2px 0 0;font:italic 600 14px var(--serif)}
/* feed */
.post{padding:9px 0;border-top:1px solid var(--rule)}.post:first-of-type{border-top:0}.post p{margin:2px 0 0}.post.neg b{color:var(--bad)}
.card.hate{border-color:var(--rec);background:color-mix(in srgb,var(--rec) 8%,var(--surface))}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:10px 0}.stages span{font:700 9px var(--mono);text-transform:uppercase;text-align:center;padding:5px 2px;border-radius:3px;background:var(--raised);color:var(--faint)}.stages span.on{background:var(--rec);color:#fff}
/* charts */
.rel{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}.rel:first-of-type{border-top:0}.rel .tl{flex:1;min-width:0}
.spark path{fill:none;stroke:var(--text);stroke-width:1.5}.spark .ref{stroke:var(--faint);stroke-dasharray:2 3}
.peak{width:52px;text-align:right;display:flex;flex-direction:column}.peak b{font-size:15px}
.logrow{padding:6px 0;border-top:1px solid var(--rule);font-size:13px}.logrow:first-of-type{border-top:0}.k-drama{color:#f2c7c7}.k-hate{color:var(--bad)}.k-release{color:var(--amber)}.k-chapter{font-weight:700}
.evalboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px}.ev{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 6px;border-radius:4px;background:var(--raised)}
.ev>span:nth-child(3){flex:1}.ev.me{outline:1px solid var(--amber)}.ev.warn{background:color-mix(in srgb,var(--rec) 18%,var(--raised))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.grid2>div{background:var(--raised);border-radius:6px;padding:8px}.grid2 b{display:block;font:700 20px var(--mono)}.grid2 span{font-size:11px;color:var(--faint)}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:8px 0}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:#000c;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:92dvh;overflow:auto;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 18px);position:relative}
.sheet p.big{font:600 17px/1.45 var(--serif)}
.x{position:absolute;top:10px;right:10px;background:var(--raised);border:1px solid var(--rule);border-radius:6px;width:32px;height:32px;font-size:18px;line-height:1}
.modal.archive .sheet{background:#0a0b0d;border-color:#3a2a2a}.modal.archive .sheet p:not(.small){font:600 18px/1.45 var(--serif)}
.modal.hatem .sheet{border-color:var(--rec)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:14px}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%) translateY(160px);background:var(--raised);border:1px solid var(--text);border-radius:8px;padding:10px 14px;max-width:calc(100% - 32px);transition:transform .25s;z-index:60;font-size:13px}.toast.on{transform:translateX(-50%) translateY(0)}
/* rhythm */
.rhythm{position:fixed;inset:0;z-index:80;background:#050607;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 0 calc(env(safe-area-inset-bottom,0px) + 16px);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.rh-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;align-items:center;gap:10px}.rh-top b{flex:1;font:600 16px var(--serif)}
.rh-sub{text-align:center;color:var(--faint);font-size:12.5px;margin-bottom:8px;padding:0 16px}
.rh-c{display:block;width:100%}
.rh-judge{text-align:center;font:700 22px var(--mono);height:32px;color:var(--text);opacity:0}.rh-judge.on{opacity:1}.rh-judge.perfect{color:var(--ok)}.rh-judge.good{color:var(--amber)}.rh-judge.miss,.rh-judge.offbeat{color:var(--faint)}
.rh-score{text-align:center;font:500 13px var(--mono);color:var(--muted)}
/* 3D */
.stage3d{width:100%;height:220px;border-radius:8px;overflow:hidden;background:#25282e;position:relative}.stage3d canvas{display:block;touch-action:pan-y}
.stage3d.no3d::after{content:"3D view needs WebGL";position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.title3d{height:240px;border:1px solid var(--rule)}
.card.room{padding:0;overflow:hidden}.card.room .stage3d{border-radius:0}.roomrow{padding:10px 14px}
.trainbtn{margin-top:4px}.sess{color:var(--ok);margin:4px 0 0}
.posrow span{width:96px}.posrow select{flex:1}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:middle}
.lines{display:flex;height:16px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--raised)}.lines i{display:block;height:100%;position:relative;overflow:hidden}.lines span{position:absolute;left:4px;top:1px;font:500 9.5px var(--mono);color:#111;white-space:nowrap}
.beat{position:relative;border-top:1px solid var(--rule);padding:8px 28px 8px 0}.beat p{margin:2px 0;font-size:13px}.beat i{position:absolute;right:2px;top:10px;font-style:normal;font:700 16px var(--mono);color:var(--faint)}
.beat.ok i{color:var(--ok)}.beat.no i{color:var(--bad)}
.troph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.tr{background:var(--raised);border:1px solid var(--rule);border-radius:6px;padding:8px;opacity:.5;position:relative}
.tr b{display:block;font-size:13px}.tr span{font-size:11.5px;color:var(--muted)}.tr em{position:absolute;top:6px;right:8px;font-size:10px;color:var(--amber);font-style:normal}.tr.on{opacity:1;border-color:var(--amber)}
.judge{font:italic 600 14px/1.45 var(--serif);color:var(--muted);border-left:2px solid var(--rule);padding-left:10px}
.scn{position:fixed;inset:0;z-index:75;background:#050607;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.scn-3d{flex:1;min-height:0;position:relative;overflow:hidden}.scn-3d.flat{background:radial-gradient(circle at 50% 40%,#2a2d36,#050607)}
.scn-box{background:linear-gradient(transparent,#000 18%);padding:28px 18px calc(env(safe-area-inset-bottom,0px) + 18px);min-height:190px;position:relative;cursor:pointer;max-width:720px;width:100%;margin:0 auto}
.scn-who{display:flex;align-items:center;gap:8px;min-height:30px;margin-bottom:6px}.scn-who b{font-size:14px}.scn-who .faint{margin-left:2px}
.scn-t{font:600 18px/1.45 var(--serif);margin:0}.scn-t.narr{font-style:italic;color:var(--muted)}.narr{font-size:11px;letter-spacing:.14em;color:var(--rec)}
.scn-next{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:11px;color:var(--faint)}
.av.npc{display:inline-grid;place-items:center;color:#fff;font:700 11px var(--mono);border-radius:50%}
/* mini-games */
.mg{position:fixed;inset:0;z-index:80;background:#050607;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:auto}
.mg-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px}.mg-top b{flex:1;font:600 16px var(--serif)}
.mg-3d{position:relative;height:38vh;min-height:200px;flex:none;overflow:hidden;background:#111}.mg-3d.flat{height:12px;min-height:0}
.mg-sub{text-align:center;color:var(--faint);font-size:12.5px;padding:8px 16px 0}
.mg-play{flex:1;padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px;max-width:640px;width:100%;margin:0 auto}
.mg-c{display:block;width:100%;height:150px}.mg-c.tall{height:190px}
.mg-judge{text-align:center;font:700 20px var(--mono);height:28px;opacity:0}.mg-judge.on{opacity:1}.mg-judge.perfect{color:var(--ok)}.mg-judge.good{color:var(--amber)}.mg-judge.miss{color:var(--faint)}
.mg-score{text-align:center;font-size:13px;color:var(--muted)}
.mg-tap{background:var(--raised);border:1px solid var(--rule);border-radius:10px;padding:18px;font-weight:700;font-size:16px;width:100%}
.mg-lanes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mg-lanes button{background:var(--raised);border:1px solid var(--rule);border-radius:10px;padding:20px 8px;font-weight:700}
.mg-seq{display:flex;justify-content:center;gap:8px;min-height:48px}.mg-seq i{font:700 26px var(--mono);font-style:normal;width:40px;height:44px;display:grid;place-items:center;background:var(--raised);border-radius:8px;color:var(--faint)}
.mg-seq i.on{background:var(--amber);color:#111}.mg-seq i.good{background:color-mix(in srgb,var(--ok) 35%,var(--raised));color:var(--ok)}.mg-seq i.bad{background:color-mix(in srgb,var(--bad) 30%,var(--raised));color:var(--bad)}
.mg-pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:". u ." "l d r";gap:8px;max-width:300px;margin:0 auto;width:100%}
.mg-pad button{background:var(--raised);border:1px solid var(--rule);border-radius:10px;font:700 26px var(--mono);padding:14px 0}.mg-pad [data-d=U]{grid-area:u}.mg-pad [data-d=L]{grid-area:l}.mg-pad [data-d=D]{grid-area:d}.mg-pad [data-d=R]{grid-area:r}
.mg-pad.off{opacity:.35;pointer-events:none}
.mg-cams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mg-cams button{background:var(--raised);border:1px solid var(--rule);border-radius:10px;padding:22px 4px;font:700 13px var(--mono);position:relative}
.mg-cams button.live{border-color:var(--rec);box-shadow:0 0 0 2px var(--rec)}.mg-cams button.live::before{content:"";position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--rec)}
.mg-fairy{display:grid;place-items:center;height:150px;position:relative}.mg-fairy .ring{width:110px;height:110px;border:3px solid var(--amber);border-radius:50%;position:absolute}.mg-fairy p{position:relative;font-size:12.5px;color:var(--muted);margin:0}
.mg-sheet{background:#0a0b0d;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font:600 15px/1.5 var(--serif)}.mg-sheet p{margin:2px 0}
.mg-opts{display:flex;flex-direction:column;gap:6px}.mg-opts button{text-align:left;background:var(--raised);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}.mg-opts button span{display:block;font-size:11px;color:var(--faint)}
.mg-q p{font:600 16px/1.4 var(--serif);margin:4px 0 8px}.mg-timer{height:4px;background:var(--raised);border-radius:2px;overflow:hidden}.mg-timer i{display:block;height:100%;width:100%;background:var(--amber)}
.mg-res{text-align:center;padding-top:8px}.mg-grade{font:700 54px var(--mono)}
.mg-chant{position:absolute;left:50%;top:18%;transform:translateX(-50%);font:700 22px var(--mono);color:#fff;text-shadow:0 2px 12px #000;animation:chant 1.6s ease-out forwards;white-space:nowrap;pointer-events:none}
@keyframes chant{from{opacity:0;transform:translate(-50%,10px) scale(.9)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-30px) scale(1.1)}}
.gAp{color:var(--ok)}.gA{color:#a8e6c3}.gB{color:var(--text)}.gC{color:var(--amber)}.gD{color:var(--bad)}
@media(max-width:380px){.statrow>span:first-child{width:80px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}.rec::before{animation:none}}
