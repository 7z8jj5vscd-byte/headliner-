  const sky=srand(hsh(S.label));for(let i=0;i<9;i++){const h=.5+sky()*1.6;mesh(T,new T.BoxGeometry(.32,h,.02),new T.MeshBasicMaterial({color:new T.Color('#0e1424')}),-1.6+i*.4,-1.2+h/2,.01,win);
    for(let j=0;j<4;j++)if(sky()>.45)mesh(T,new T.PlaneGeometry(.06,.06),new T.MeshBasicMaterial({color:new T.Color('#ffd27a')}),-1.6+i*.4+(sky()-.5)*.18,-1.1+sky()*h,.025,win)}
  // label sign
  const sign=new T.Mesh(new T.PlaneGeometry(4,.9),new T.MeshBasicMaterial({map:textTex(T,[{t:L().n.toUpperCase(),s:46,c:L().col},{t:'A&R · '+R().n.toUpperCase(),s:26,w:500,c:'#9a9aa0'}],1024,230,'#24232a')}));sign.position.set(.6,4.7,-3.88);root.add(sign);
  // plaques: one for every top 40 hit
  const hits=Object.values(S.acts).filter(a=>a.p&&a.p.top40);const n=Math.max(hits.length,0);
  for(let i=0;i<Math.max(n,3);i++){const x=-1.6+i%5*1.1,y=3.1-Math.floor(i/5)*1.15;const has=i<n;mesh(T,new T.BoxGeometry(.8,1,.06),has?'#1a1a1a':'#2e2d33',x,y,-3.86,root);
    if(has){const pl=hits[i].p.top10;const d=mesh(T,new T.CylinderGeometry(.28,.28,.02,28),pl?'#e8e8ee':'#d9b25f',x,y+.08,-3.81,root);d.rotation.x=Math.PI/2;mesh(T,new T.CylinderGeometry(.08,.08,.025,16),'#111111',x,y+.08,-3.8,root);
      const lab=new T.Mesh(new T.PlaneGeometry(.66,.16),new T.MeshBasicMaterial({map:textTex(T,[{t:hits[i].name,s:44}],512,110,'#1a1a1a')}));lab.position.set(x,y-.36,-3.82);root.add(lab)}}
  // desk, monitor, chair
  mesh(T,new T.BoxGeometry(3.4,.12,1.5),'#5b3a24',.6,1.5,0,root);for(const [x,z] of [[-1,-.6],[2.2,-.6],[-1,.6],[2.2,.6]])mesh(T,new T.BoxGeometry(.1,1.5,.1),'#3b2416',x,.75,z,root);
  mesh(T,new T.BoxGeometry(1.3,.8,.06),'#0d0d0f',.4,2.08,-.45,root);
  const scr=new T.Mesh(new T.PlaneGeometry(1.2,.7),new T.MeshBasicMaterial({map:textTex(T,[{t:'PULSE 40',s:40,c:'#d9b25f'},{t:(S.chart&&S.chart[0]?'#1 '+S.chart[0].t:'—'),s:34,w:500}],512,300,'#131217')}));scr.position.set(.4,2.08,-.41);root.add(scr);
  mesh(T,new T.BoxGeometry(.1,.3,.1),'#222222',.4,1.7,-.45,root);
  const chair=new T.Group();chair.position.set(.5,0,1.25);root.add(chair);mesh(T,new T.BoxGeometry(.9,.12,.9),'#1d1d22',0,.95,0,chair);mesh(T,new T.BoxGeometry(.9,1,.12),'#1d1d22',0,1.5,.42,chair);mesh(T,new T.CylinderGeometry(.06,.06,.9,8),'#555555',0,.45,0,chair);
  // demo pile: one box per act on your radar
  const rd=Math.min(14,radarActs().length);for(let i=0;i<rd;i++){const b=mesh(T,new T.BoxGeometry(.42,.04,.36),pick(['#ff6fa8','#7fd1ff','#ffd27a','#4dffd2','#ff8a3d','#f2f2f2']),1.75,1.58+i*.045,.1,root);b.rotation.y=rnd(-.3,.3)}
  // the turntable
  const tt=new T.Group();tt.position.set(-.6,1.56,.2);root.add(tt);mesh(T,new T.BoxGeometry(.8,.1,.62),'#d8d2c4',0,0,0,tt);const rec=mesh(T,new T.CylinderGeometry(.26,.26,.02,28),'#0c0c0c',-.05,.07,0,tt);mesh(T,new T.CylinderGeometry(.08,.08,.025,16),L().col,-.05,.08,0,tt);
  // a plant
  mesh(T,new T.CylinderGeometry(.3,.24,.6,12),'#c46a3c',3.6,.3,-3,root);for(let i=0;i<6;i++){const l=mesh(T,new T.SphereGeometry(.32,10,8),'#3f7d4a',3.6+Math.cos(i)*.25,.95+i*.12,-3+Math.sin(i)*.25,root);l.scale.set(1,.6,1)}
  const cam=new T.PerspectiveCamera(42,1,.1,60);cam.position.set(1.9,3.3,5.4);cam.lookAt(-.1,2.4,-1.6);
  V3.anim=[t=>{rec.rotation.y=t*3.5;lamp.intensity=.75+Math.sin(t*.8)*.05}];
  return {sc,cam,root}}
function can3D(){return S&&S.three!==false&&!V3.failed}
function hydrate(scope=document){const els=[...document.querySelectorAll('[data-stage]')];const el=els[els.length-1];if(!el||!can3D())return;
  loadThree().then(T=>{if(!el.isConnected)return;mount(T,el)}).catch(()=>{})}
function mount(T,el){
  if(!V3.r){try{V3.r=new T.WebGLRenderer({antialias:true});V3.r.setPixelRatio(Math.min(2,window.devicePixelRatio||1));const c=V3.r.domElement;c.setAttribute('aria-label','3D scene. Drag to spin.');
    c.addEventListener('pointerdown',e=>{V3.drag={x:e.clientX,r:V3.rotY};try{c.setPointerCapture(e.pointerId)}catch(_){}});
    c.addEventListener('pointermove',e=>{if(V3.drag){V3.rotY=V3.drag.r+(e.clientX-V3.drag.x)*.011}});
    ['pointerup','pointercancel'].forEach(k=>c.addEventListener(k,()=>{V3.drag=null}))}catch(e){V3.failed=true;return}}
  const key=el.dataset.stage+'|'+(el.dataset.stage==='office'?S.hits+'|'+radarActs().length+'|'+S.rank:'');
  if(key!==V3.key){dispose();const [kind,id]=el.dataset.stage.split(':');try{const b=kind==='act'?buildAct(T,actById(id)):buildOffice(T);V3.sc=b.sc;V3.cam=b.cam;V3.root=b.root}catch(e){console.warn(e);return}V3.key=key;V3.rotY=0}
  const w=el.clientWidth||320,h=el.clientHeight||250;V3.r.setSize(w,h,false);V3.cam.aspect=w/h;V3.cam.updateProjectionMatrix();
  if(V3.r.domElement.parentNode!==el)el.insertBefore(V3.r.domElement,el.firstChild);
  if(!V3.raf){V3.t0=performance.now();V3.raf=requestAnimationFrame(loop3)}}
function loop3(){V3.raf=0;const c=V3.r&&V3.r.domElement;if(!c||!c.isConnected||!V3.sc||document.hidden)return;const t=V3.still?0:(performance.now()-V3.t0)/1000;
  V3.root.rotation.y=V3.rotY+(V3.drag||V3.still?0:Math.sin(t*.25)*.12);for(const f of V3.anim)f(t);V3.r.render(V3.sc,V3.cam);if(!V3.still)V3.raf=requestAnimationFrame(loop3)}
function dispose(){if(!V3.sc)return;V3.sc.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material.map)o.material.map.dispose()});V3.sc=null;V3.key=''}
function stop3D(){if(V3.raf)cancelAnimationFrame(V3.raf);V3.raf=0;dispose();if(V3.r&&V3.r.domElement.parentNode)V3.r.domElement.remove()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&V3.sc&&!V3.raf)V3.raf=requestAnimationFrame(loop3)});
window.addEventListener('resize',()=>{const c=V3.r&&V3.r.domElement;const el=c&&c.parentNode;if(el&&V3.cam){const w=el.clientWidth,h=el.clientHeight;V3.r.setSize(w,h,false);V3.cam.aspect=w/h;V3.cam.updateProjectionMatrix()}});

/* ---------- live updates and boot ---------- */
// Same approach as the other games: when the app opens or returns to the foreground, fetch the
// latest page and reload into it if its version is newer.
function checkUpdate(){if(!/^https?:/.test(location.protocol))return;fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/const APP_VER='(\d+)'/);if(m&&m[1]!==APP_VER){try{save()}catch(e){}location.replace(location.pathname+'?v='+m[1])}}).catch(()=>{})}
setTimeout(checkUpdate,1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
render();
</script>
