<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A&amp;R">
<meta name="theme-color" content="#171719">
<meta name="description" content="Play a label talent scout: read unsigned acts, outbid rival scouts, negotiate the deal and live with the results.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>A&amp;R: The Talent Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Data terminal: dark, flat, figures in mono. Gold is reserved for two things: the selection line and the truth. */
:root{
  --ground:#171719;--surface:#131217;--raised:#212023;--raised2:#2a292d;--border:#26262a;--rule:#222125;--control:#3a3a3e;
  --text:#ffffff;--soft:#d6d6d9;--muted:#8f9197;--accent:#d9b25f;--accent-ink:#171719;
  --positive:#4fb38f;--negative:#ec5f78;--warning:#e0913c;
  --band:rgba(255,255,255,.2);
  --pill-pos-bg:#1b2828;--pill-pos:#5fc39c;--pill-neg-bg:#2c1a20;--pill-neg:#ef6d84;--pill-warn-bg:#2b2116;--pill-warn:#e6a052;--pill-neu-bg:#232226;--pill-neu:#c4c4c8;
  --r:6px;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--sans:'Public Sans',Inter,system-ui,sans-serif;
  --top:calc(env(safe-area-inset-top,0px) + 56px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:dark}
html,body{margin:0;background:var(--ground);color:var(--text);-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;font-weight:600;text-wrap:balance}
h1{font-size:24px;letter-spacing:-.01em}h2{font-size:19px}h3{font-size:16px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}.soft{color:var(--soft)}.small{font-size:13px}.xs{font-size:12px}
.pos{color:var(--positive)}.neg{color:var(--negative)}.warn{color:var(--warning)}.gold{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.mark{width:30px;height:30px;flex:none;display:block}
.top .when{display:flex;flex-direction:column;min-width:0;flex:1}
.top .when b{font-size:15px;font-weight:600}
.top .when span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;align-items:center}
.pips i{width:7px;height:16px;border-radius:2px;background:var(--control)}
.pips i.on{background:var(--text)}
.app{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.app.bare{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;color:var(--muted);font-size:11.5px;font-weight:500;position:relative;min-height:54px}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--text)}
.tab.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:1px;background:var(--accent)}
.tab .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--text);color:var(--ground);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:transparent;border:0;padding:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:17px;font-weight:600}
.sec .aside{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:6px;min-width:0}
.list{display:flex;flex-direction:column}
.list>*{border-top:1px solid var(--rule)}
.list>*:first-child{border-top:0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.kv>div{padding:10px 12px;min-width:0;border-left:1px solid var(--border)}
.kv>div:first-child{border-left:0}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{display:block;font-family:var(--mono);font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv small{font-size:12px;color:var(--muted)}
.kv.two{grid-template-columns:1fr 1fr}
.kv.four{grid-template-columns:repeat(2,1fr)}
.kv.four>div:nth-child(3){border-left:0}
.kv.four>div:nth-child(n+3){border-top:1px solid var(--border)}

/* controls */
.btn{border:0;border-radius:999px;min-height:40px;padding:0 18px;font-weight:600;font-size:14.5px;background:var(--text);color:var(--ground);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .08s,opacity .15s}
.btn.sec2{background:var(--raised2);color:var(--text)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--control)}
.btn.sm{min-height:34px;padding:0 13px;font-size:13.5px}
.btn.block{width:100%;min-height:46px}
.btn.danger{background:transparent;color:var(--negative);border:1px solid #4a2630}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:not(:disabled):hover{opacity:.88}
.opt:not(:disabled):hover{border-color:var(--control)}
.btn:not(:disabled):active,.opt:not(:disabled):active,.rowbtn:active{transform:scale(.98)}
.opt{background:var(--raised);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%;min-height:48px;transition:border-color .15s,background .15s}
.opt b{font-weight:600;font-size:14.5px}
.opt small{color:var(--muted);font-size:12.5px;line-height:1.35}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt.on{border-color:var(--accent);background:#25231f}
.opt .cost{font-family:var(--mono);font-size:12px;color:var(--soft)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.one{grid-template-columns:1fr}
.seg{display:flex;gap:18px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{background:none;border:0;padding:10px 0 9px;color:var(--muted);font-size:14px;font-weight:500;position:relative;white-space:nowrap}
.seg button.on{color:var(--text)}
.seg button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--accent)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--pill-neu-bg);color:var(--pill-neu);white-space:nowrap}
.pill.pos{background:var(--pill-pos-bg);color:var(--pill-pos)}.pill.neg{background:var(--pill-neg-bg);color:var(--pill-neg)}.pill.warn{background:var(--pill-warn-bg);color:var(--pill-warn)}
.pill.gold{background:#2a2518;color:var(--accent)}
.rowbtn{background:none;border:0;width:100%;text-align:left;padding:12px 0;display:flex;gap:12px;align-items:center;min-height:56px}
.rowbtn .chev{color:var(--muted)}
.step{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px}
.step button{height:40px;border-radius:999px;border:1px solid var(--control);background:var(--raised);font-size:18px;font-weight:600}
.step button:disabled{opacity:.3}
.step output{text-align:center;font-family:var(--mono);font-size:17px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12.5px;color:var(--muted)}
.field>span b{color:var(--text);font-weight:600}
input[type=text]{width:100%;background:var(--raised);border:1px solid var(--control);border-radius:var(--r);padding:11px 12px;min-height:46px;font-size:16px}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4}

/* the read: range bands */
.reads{display:flex;flex-direction:column;gap:9px}
.read{display:grid;grid-template-columns:86px 1fr 62px;gap:10px;align-items:center;font-size:13px}
.read .k{color:var(--soft)}
.read .v{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--soft);white-space:nowrap}
.track{position:relative;height:14px;background:var(--raised);border-radius:3px}
.track::before,.track::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}
.track::before{left:33.3%}.track::after{left:66.6%}
.track .band{position:absolute;top:2px;bottom:2px;background:var(--band);border-radius:2px;transition:left .5s,width .5s}
.track .mean{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--text);transition:left .5s}
.track .truth{position:absolute;top:-3px;width:10px;height:10px;margin-left:-5px;background:var(--accent);transform:rotate(45deg);top:2px}
/* taste-skill-ignore: a hatch is the data mark for 'not read yet', not decoration */
.read.unknown .band,.band.unk{background:repeating-linear-gradient(90deg,var(--control) 0 2px,transparent 2px 6px)} /* taste-skill-ignore */
.minireads{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.minireads div{display:flex;flex-direction:column;gap:3px}
.minireads span{font-size:10.5px;color:var(--muted);text-align:center;font-weight:500}
.minireads .track{height:8px}
.minireads .track::before,.minireads .track::after{display:none}
.minireads .band{top:1px;bottom:1px}

/* act rows */
.act{display:flex;gap:12px;align-items:flex-start;width:100%;background:none;border:0;text-align:left;padding:13px 0}
.act .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.act .nm{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.act .nm b{font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .meta{font-size:12.5px;color:var(--muted)}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:block;background:var(--raised)}
.avatar.lg{width:64px;height:64px}
.tag{font-size:12px;color:var(--soft)}

/* 3D */
.stage{position:relative;height:250px;border-radius:var(--r);overflow:hidden;background:#0d0c10;border:1px solid var(--border);touch-action:pan-y}
.stage.tall{height:300px}
.stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;padding:16px;text-align:center}
.stage canvas~.fb{display:none}
.stage .cap{position:absolute;left:10px;bottom:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:12px}
.stage .cap span{background:rgba(0,0,0,.6);padding:3px 9px;border-radius:999px;color:#fff}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.chartrow{display:grid;grid-template-columns:28px 1fr 74px;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.chartrow .pos0{font-family:var(--mono);color:var(--muted);text-align:right;font-size:13px}
.chartrow .s{min-width:0}
.chartrow .s b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chartrow .s span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chartrow .n{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--soft)}
.chartrow.mine{box-shadow:inset 2px 0 0 var(--accent);padding-left:8px;margin-left:-8px}
.chartrow.mine .s b{color:var(--accent)}
.heat{display:grid;grid-template-columns:132px 1fr 46px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.heat .bar{height:8px;background:var(--raised);border-radius:2px;overflow:hidden}
.heat .bar i{display:block;height:100%;background:var(--soft)}
.heat .bar i.hot{background:var(--text)}
.meter{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--text);border-radius:3px}
.meter.gold i{background:var(--accent)}
.meter.neg i{background:var(--negative)}

/* feed */
.post{display:flex;gap:10px;padding:12px 0}
.post .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#111}
.post .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.post .h{font-size:13px;color:var(--muted)}
.post .h b{color:var(--text);font-weight:600}
.post p{font-size:14.5px}
.post .stats{font-size:12px;color:var(--muted);font-family:var(--mono)}
.news{padding:12px 0;display:flex;flex-direction:column;gap:4px}
.news .src{font-size:12px;color:var(--muted)}
.news b{font-size:15.5px;font-weight:600;line-height:1.3}
.news p{font-size:13.5px;color:var(--soft)}
.mail{padding:12px 0;display:flex;flex-direction:column;gap:4px;background:none;border:0;text-align:left;width:100%}
.mail .h{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.mail b{font-size:15px;font-weight:600}
.mail.unread b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px}
.mail p{font-size:13.5px;color:var(--soft)}
.tell{font-size:13.5px;padding:8px 0;display:flex;gap:10px}
.tell .src{flex:none;width:74px;font-size:12px;color:var(--muted)}
.tell p{color:var(--soft)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{background:var(--ground);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;border:1px solid var(--border);border-bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:up .2s ease-out;overscroll-behavior:contain}
.sheet>*{flex-shrink:0}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--control);margin:-6px auto 0;flex:none}
.sheet .x{position:sticky;top:-16px;z-index:2;background:var(--ground);margin:-16px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule)}
.sheet .x h2{font-size:18px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--control);background:var(--raised);display:grid;place-items:center;flex:none}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:60;display:flex;flex-direction:column;gap:6px;width:min(560px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--text);color:var(--ground);padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:up .2s ease-out}

/* title */
.hero{padding:calc(env(safe-area-inset-top,0px) + 28px) 0 4px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:44px;letter-spacing:-.03em;line-height:.95;font-weight:700}
.hero p{font-size:16px;color:var(--soft);max-width:34ch}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.labelpick{display:flex;flex-direction:column;gap:8px}
.lab{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.lab .mk{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#111}
.ladder{display:flex;flex-direction:column}
.ladder div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;color:var(--muted)}
.ladder div:first-child{border-top:0}
.ladder div.now{color:var(--text);box-shadow:inset 2px 0 0 var(--accent);padding-left:10px}
.target{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.target .row b{font-weight:500}
.grade{font-family:var(--mono);font-size:48px;line-height:1;font-weight:500}
.dealrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.dealrow span{color:var(--muted)}
.dealrow b{font-family:var(--mono);font-weight:500;text-align:right}
.bigfig{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1.1}
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cal div{background:var(--raised);border-radius:4px;padding:6px 4px;text-align:center;font-size:11.5px;color:var(--muted);min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.cal div.used{background:var(--surface);border:1px solid var(--border);color:var(--soft)}
.cal div b{font-size:11px;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event{display:flex;flex-direction:column;gap:8px;padding:12px 0}
.empty{padding:22px 0;text-align:center;color:var(--muted);font-size:14px}
@media (min-width:700px){.opts{grid-template-columns:1fr 1fr 1fr}.opts.one{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="top"></div>
<main class="app" id="app"></main>
<nav id="tabs"></nav>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="sheet"></div>
<script>
'use strict';
const APP_VER='202610250100';
const $=(s,r=document)=>r.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const chance=p=>Math.random()<p;
const sum=a=>a.reduce((s,x)=>s+x,0);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const N=(m,s)=>m+gauss()*s;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
function hsh(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

<script>

/* ---------- acts ---------- */
function wcity(){return chance(.45)?cityOf(L().city):pick(CITIES)}
function genAct(o={}){
  const city=o.city?cityOf(o.city):wcity();
  const genre=o.genre||(chance(.72)?pick(city.g):pick(GK));const G=GENRES[genre];
  const r=Math.random();const kind=r<G.band?'band':r<G.band+G.duo?'duo':'solo';
  const n=kind==='band'?ri(3,5):kind==='duo'?2:1;
  const st=()=>clamp(Math.round(N(47,17)),4,97);
  const h={tal:st(),eth:st(),ego:st(),dur:st(),fit:st(),sell:st()};
  let arch='plain';const ar=Math.random();
  if(ar<.13){arch='gem';h.tal=clamp(h.tal+22,4,98);h.sell=clamp(h.sell+10,4,98);h.fit=clamp(h.fit+8,4,98)}

  else if(ar<.35){arch='diva';h.ego=clamp(h.ego+32,4,99);h.tal=clamp(h.tal+10,4,98)}
  else if(ar<.45){arch='grinder';h.eth=clamp(h.eth+26,4,98);h.dur=clamp(h.dur+20,4,98);h.tal=clamp(h.tal-4,4,98)}
  const fake=arch==='hype'||chance(.04);

  let fol=Math.round(Math.pow(10,2.4+h.sell/100*1.5+rnd(0,1.3)+(o.boost||0)));
  if(arch==='gem')fol=Math.round(fol*rnd(.15,.4));
  if(fake)fol=Math.round(fol*rnd(5,14));
  if(o.raw)fol=Math.round(fol*rnd(.08,.3));
  const gr=+(N(2.5+(h.sell-50)/14,2.5)+(fake?rnd(6,14):0)).toFixed(1);
  const a={id:uid(),kind,n,genre,city:city.n,age:ri(17,31),h,fake,arch,fol:Math.max(60,fol),gr,buzz:0,ask:0,
    name:'',lawyer:chance(.25)?pick(['Marcus Bell','Ana Ortiz','Simone Achterberg','Jules Pratt','Hugo Mensah']):'',mgr:'',
    e:Object.fromEntries(STATS.map(s=>[s[0],{m:50,v:484}])),tells:[],seen:0,done:{},src:o.src||'feed',wk:S?S.wk:1,dl:0,status:'market',known:false,
    riv:{},aff:0,rounds:0,fakeKnown:null,look:[],demos:[songTitle(),songTitle(),songTitle()].filter((t,i,s)=>s.indexOf(t)===i),own:rnd(.2,1)};

  a.bio=pick(BIO).replace('{c}',a.city).replace('{k}',kind==='solo'?'singer':kind==='duo'?'duo':'band').replace('{r}',pick(BIOR)).replace('{v}',pick(BIOV));
  for(let i=0;i<n;i++)a.look.push(genLook(hsh(a.id+i)));
  refreshBuzz(a);a.ask=askOf(a);
  a.dl=(S?S.wk:1)+(a.buzz>58?ri(3,7):ri(9,22));

function actName(a){
  if(a.kind==='band')return (chance(.55)?'The ':'')+pick(BADJ)+' '+pick(BNOUN);
  if(a.kind==='duo')return chance(.5)?pick(FIRST)+' & '+pick(FIRST):pick(BADJ)+' '+pick(BNOUN).replace(/s$/,'');

function observe(a,k,sd,src,bias=0){
  const s=sd*ears();const o=clamp(a.h[k]+bias+N(0,s),0,100);const e=a.e[k];
  const v=1/(1/e.v+1/(s*s));e.m=v*(e.m/e.v+o/(s*s));e.v=v;
  const lv=o<36?0:o<64?1:2;const t=pick(TELLS[k][lv]);
  if(!a.tells.some(x=>x.t===t))a.tells.unshift({w:S.wk,src,k,t});
  if(a.tells.length>14)a.tells.length=14;
  return o}

function spendCash(c,why){if(!c)return;S.exp+=c;S.qExp+=c;S.budget-=c}

function spawnMarket(n){for(let i=0;i<n;i++){const a=genAct();S.acts[a.id]=a}}

function weekEvents(){
  const ev=[],me=L().city,w=S.wk,wq=w%52;
  const mk=(t,o)=>{const ids=[];for(let i=0;i<o.n;i++){const a=genAct({city:o.city,genre:o.genre&&chance(.6)?o.genre:null,raw:o.raw,boost:o.boost||0,src:'event'});a.ev=true;S.acts[a.id]=a;ids.push(a.id)}

  const FEST=[[10,'Southpaw Showcase','Austin','indie'],[19,'Pier Sessions','London','pop'],[24,'Northside Week','Toronto','rnb'],[37,'Harbour Nights','Berlin','dance'],[48,'Lagos Live Week','Lagos','afro'],[30,'Riverside Country Week','Nashville','country']];

/* ---------- reads and rivals ---------- */
function rivalRead(rv,a){return trueValue(a)+N(0,rv.noise)+rv.hype*(a.buzz-50)*.3+(a.fake?rv.hype*16:0)}
function rivalsWeek(){
  const out=[];
  for(const rv of RIVALS){
    const st=S.rv[rv.id];st.spent=st.spent*.97;
    for(const a of marketActs()){
      const ri0=a.riv[rv.id]||0;const read=rivalRead(rv,a);

      else if(ri0===1&&read>58&&chance(.35)){a.riv[rv.id]=2;a.rivOffer=a.rivOffer||{};a.rivOffer[rv.id]=rivalOffer(rv,a,read)}
      else if(ri0===2&&!a.nego&&chance(.45)&&st.spent<rv.cap){out.push([rv,a])}
    }}
  const signed=new Set();
  for(const [rv,a] of out){if(signed.has(a.id)||a.status==='signed'||a.status==='gone')continue;signed.add(a.id);rivalSigns(rv,a)}}
function rivalOffer(rv,a,read){const adv=r5k(a.ask*rnd(.85,1.25)*rv.aggr*(read/60));return {rid:rv.id,adv:Math.min(adv,rv.cap*.6),pts:ri(16,19),p360:rv.id==='paper'?0:pick([10,15,20]),opts:ri(2,4),type:rv.id==='paper'?'split':'royalty',split:50,rec:r5k(adv*.6),mkt:0}}
function rivalSigns(rv,a){
  const o=(a.rivOffer&&a.rivOffer[rv.id])||rivalOffer(rv,a,60);
  const wasMine=a.known;a.status='gone';a.to=rv.id;a.toAdv=o.adv;a.wkGone=S.wk;S.rv[rv.id].spent+=o.adv;S.rv[rv.id].signed++;
  const rel=S.wk+ri(14,24);S.rivalActs.push({id:a.id,rid:rv.id,rel,peak:0,adv:o.adv,rep:false});
  news('Trackside',`${rv.label} signs ${a.name}`,`${rv.scout} closes a ${DEALS[o.type].n.toLowerCase()} worth a reported ${fmt$(o.adv)} up front for the ${a.city} ${GENRES[a.genre].n.toLowerCase()} ${a.kind==='solo'?'artist':a.kind}.`);
  if(wasMine){mail(rv.scout+'\'s office','We got there first',`${a.name} signed with ${rv.label} this week for about ${fmt$(o.adv)}. Your read had them at ${Math.round(readValue(a))} out of 100.`,a.id);S.lost++}}
function rumours(){
  for(const a of radarActs()){for(const [rid,lv] of Object.entries(a.riv)){
    const k=rid+lv;if(a.heard&&a.heard[k])continue;if(!chance(.75))continue;a.heard=a.heard||{};a.heard[k]=1;const rv=rivalOf(rid);
    a.rum=a.rum||[];a.rum.unshift({w:S.wk,t:lv===1?`${rv.scout} (${rv.label}) has been asking about them.`:`${rv.label} has a deal on the table: about ${fmt$(a.rivOffer[rid].adv)}, ${a.rivOffer[rid].pts} points${a.rivOffer[rid].p360?', '+a.rivOffer[rid].p360+'% 360':''}.`,rid,lv})}}}

/* ---------- negotiating ---------- */
function worthW(a){return a.ask*2}
function offerValue(a,o,prest){const W=worthW(a);let v=o.adv+o.rec*.15+o.mkt*.2;
  if(o.type==='royalty')v+=(o.pts-17)/100*W*1.3;
  else if(o.type==='split')v+=(o.split-50)/100*W*.9+W*.1;
  else v+=(o.lic-70)/100*W*.8+W*.28*a.own;
  v-=o.p360/100*W*.9*(.6+a.h.dur/120);v-=(o.opts-2)*.05*W;v+=(prest-65)/100*W*.4;v+=a.aff/100*W*.5;return v}
function needOf(a){return a.ask*(.95+(a.h.ego-50)/260)*(a.lawyer?1.06:1)}
function defaultOffer(a){const l=L();return {id:a.id,type:l.deal,adv:r5k(a.ask*.8),pts:17,split:50,lic:70,p360:l.no360?0:l.d360,opts:3,rec:r5k(Math.max(30000,a.ask*.5)),mkt:100000}}
function bestRival(a){let best=null;if(!a.rivOffer)return null;for(const [rid,o] of Object.entries(a.rivOffer)){if((a.riv[rid]||0)<2)continue;const rv=rivalOf(rid);const v=offerValue(a,o,rv.id==='iron'?70:rv.id==='paper'?62:66);if(!best||v>best.v)best={o,v,rv}}return best}
function submitOffer(o){
  const a=actById(o.id);const need=needOf(a);const v=offerValue(a,o,L().prest);
  a.rounds++;a.nego=true;spendSlots(1,'Offer: '+a.name);
  // A serious bid puts the act in play: rivals who were circling make their move.
  for(const rv of RIVALS){const lv=a.riv[rv.id]||0;const rd=rivalRead(rv,a);if(lv>=1&&rd>54&&chance(.6)){a.riv[rv.id]=2;a.rivOffer=a.rivOffer||{};a.rivOffer[rv.id]=a.rivOffer[rv.id]||rivalOffer(rv,a,rd)}
    else if(lv===0&&a.buzz>60&&rd>60&&chance(.3)){a.riv[rv.id]=2;a.rivOffer=a.rivOffer||{};a.rivOffer[rv.id]=rivalOffer(rv,a,rd)}}
  const br=bestRival(a);
  const max=a.lawyer?4:3;

  else if(v>=need&&(!br||v>=br.v*1.02)){res.kind='yes'}
  else if(br&&br.v>=need&&br.v>v){res.kind='rival'}
  else res.kind='counter';
  if(res.kind!=='yes'&&a.rounds>=max){res.kind='walk'}
  res.short=Math.max(0,Math.max(need,br?br.v*1.03:0)-v);
  if(res.kind==='counter'||res.kind==='rival')res.ask=counterAsk(a,o,res.short);
  return res}
function counterAsk(a,o,short){const W=worthW(a);
  if(o.p360>0&&a.h.dur>55&&short<o.p360/100*W*.9)return {k:'p360',t:'Drop the 360. They make their money on the road and they know it.'};
  if(o.opts>3&&short<W*.05*(o.opts-2))return {k:'opts',t:`Fewer option albums. They want ${o.opts-1}, not ${o.opts}.`};
  if(o.type==='royalty'&&a.lawyer&&o.pts<20&&chance(.5))return {k:'pts',t:`Their lawyer wants ${Math.min(22,o.pts+2)} points.`};
  return {k:'adv',t:`They want about ${fmt$(r5k(o.adv+short))} up front.`}}
function closeDeal(a,o){

  if(!contested)news('Trackside',`${L().short} signs ${a.name}`,`${S.name} adds the ${GENRES[a.genre].n.toLowerCase()} ${a.kind==='solo'?'artist':a.kind} to the roster: ${DEALS[o.type].n.toLowerCase()}, ${fmt$(o.adv)} advance.`);
  social(a,'signed')}

/* ---------- releases and the money ---------- */
function heat(g){return S.heat[g]||1}
function appeal(a,choice,quality){const h=a.h,w=(SINGLES.find(s=>s.id===choice)||SINGLES[0]).w;
  const fitHeat=clamp(h.fit*heat(a.genre),0,140);
  const core=L().core.includes(a.genre)?3:0;
  return (.34*h.sell*(w.sell||1)+.2*h.tal*(w.tal||1)+.12*fitHeat*(w.fit||1)+.12*quality+.07*h.eth+.15*a.buzz*(w.buzz||1)+core)/100}
function mktMult(m){return 1+.32*Math.log10(1+m/40000)*L().mkt}
function releaseCurve(t){if(t<0)return 0;if(t===0)return .55;if(t===1)return .85;if(t===2)return 1;return Math.max(.92**(t-2),.06*.997**t)}
function actStreams(a){let s=0;for(const r of a.p.rel){s+=r.peak*releaseCurve(S.wk-r.wk)*(r.boost&&r.boostTo>=S.wk?r.boost:1)}return s*(a.p.slump&&a.p.slump>=S.wk?.88:1)}
function focusStreams(a){const p=a.p;if(!p.rel.length)return 0;const last=p.rel[p.rel.length-1];let s=0;for(const r of p.rel){const c=r.peak*releaseCurve(S.wk-r.wk)*(r.boost&&r.boostTo>=S.wk?r.boost:1);s+=r===last||r.kind==='single'?c*(r.kind==='album'?.3:1):0}return s}

  const A=appeal(a,p.single||'radio',p.q||50);const sd=(SINGLES.find(s=>s.id===p.single)||SINGLES[0]).sd;

  const peak=Math.pow(10,lp)*mktMult(p.mkt||0)*(a.fake?.8:1);
  const r={kind,wk:S.wk,peak,t:kind==='album'?albumTitle(a):pick(a.demos.concat([songTitle()])),alb:p.alb};p.rel.push(r);if(!p.firstRel)p.firstRel=S.wk;
  if(kind==='single'){const vid=r5k(rnd(25000,70000));p.cost+=vid;p.recoup+=vid*.5;p.video=vid}

function albumTitle(a){return chance(.4)?pick(TW1)+' '+pick(TW2):pick(['Everything After','Night Shift','Open Late','Second Skin','All of It','Smaller Hours','Gold Teeth','Low Season','Back Roads','Velvet Static','Wide Awake','Neon Prayer'])}
function moneyWeek(a){const p=a.p,d=a.deal;const st=actStreams(a);
  const rev=st*PER_STREAM;let labelNet=rev;

  else if(d.type==='split'){const prof0=p.rev-p.cost;const prof1=prof0+rev;const share=d.split/100;const pay=Math.max(0,prof1)*share-Math.max(0,prof0)*share;p.cred+=rev*share;p.paid+=Math.max(0,pay);labelNet=rev-Math.max(0,pay)}
  else {const credit=rev*d.lic/100;const before=Math.max(0,p.cred-p.recoup);p.cred+=credit;const after=Math.max(0,p.cred-p.recoup);const pay=after-before;p.paid+=pay;labelNet=rev-pay}
  const live=(['single','album','cycle'].includes(p.ph)?st*LIVE_PER_STREAM*(.6+a.h.dur/110):0);const r360=live*.4*d.p360/100;
  p.rev+=rev;p.r360+=r360;const net=labelNet+r360;p.qRev+=net;S.qRev+=net;S.lifeNet+=net;p.weekly.push(Math.round(st));if(p.weekly.length>156)p.weekly.shift();
  p.lastStreams=st;if(st>p.peak)p.peak=st;return net}
const labelNet=a=>{const p=a.p;return p.rev-p.paid+p.r360-p.cost};
function artistBalance(a){const p=a.p;if(a.deal.type==='split')return p.rev-p.cost;return p.cred-p.recoup}

/* ---------- reveals: the truth comes out ---------- */
function reveal(a,k){const p=a.p;if(p.revealed[k])return;p.revealed[k]=1;const err=Math.abs(a.e[k].m-a.h[k]);S.xp+=Math.max(0,22-err)/2;S.reads.push(err)}

/* ---------- feeds ---------- */
function news(src,t,d,mine){S.news.unshift({w:S.wk,src,t,d,mine:!!mine});if(S.news.length>90)S.news.length=90}
function mail(from,subj,body,actId,quiet){S.mail.unshift({id:uid(),w:S.wk,from,subj,body,act:actId||null,read:!!quiet});if(S.mail.length>70)S.mail.length=70}
function social(a,kind){

  const T={
    live_good:[`${nm} live last night was unreal. Whole room was screaming the words`,`saw ${nm} open for nobody and they were better than the headliner`,`${nm} at a 200-cap room is going to be a story people lie about being at`],

function chatter(){for(const a of radarActs()){if(!chance(.22))continue;
  if(a.fake&&chance(.55))social(a,'fake');else if(a.h.sell+N(0,18)>62)social(a,'live_good');else if(a.h.dur+N(0,20)<38)social(a,'live_bad');else social(a,'real')}}

/* ---------- the chart ---------- */
function bgSong(age){return {t:songTitle(),ar:pick(BGARTISTS),peak:Math.pow(10,rnd(6.75,7.75)),wk:S.wk-age,g:pick(GK)}}
function bgStreams(b){const t=S.wk-b.wk;if(t<0)return 0;if(t===0)return b.peak*.7;return b.peak*Math.max(.955**t,.18)}

  const rows=[];

      if(r.pos<=40&&!a.p.top40){a.p.top40=true;S.rep=clamp(S.rep+5,0,100);S.hits++;news('Pulse Daily',`${a.name} cracks the Pulse 40`,`“${r.t}” climbs to #${r.pos} with ${fmtN(r.s)} streams this week.`,true);social(a,'hit')}
      if(r.pos<=10&&!a.p.top10){a.p.top10=true;S.rep=clamp(S.rep+6,0,100);news('Pulse Daily',`Top ten for ${a.name}`,`${poss(L().short)} ${a.name} is at #${r.pos}. ${S.name} signed them ${S.wk-a.signedWk} weeks ago.`,true)}
      if(r.pos===1&&!a.p.no1){a.p.no1=true;S.rep=clamp(S.rep+10,0,100);news('Pulse Daily',`${a.name} is number one`,`“${r.t}” tops the Pulse 40. The A&R behind it, ${S.name}, is suddenly very popular.`,true)}}}
  S.bg=S.bg.filter(b=>bgStreams(b)>4.2e6||S.wk-b.wk<3);while(S.bg.length<92)S.bg.push(bgSong(-ri(0,1)))}

/* ---------- new game ---------- */
function newGame(name,label,slot){
  S={v:1,slot,name:name||'Alex Mercer',label,wk:1,rank:0,trust:60,rep:22,xp:0,budget:LABELS[label].budget,exp:0,qExp:0,qSign:0,qRev:0,qBest:999,lifeNet:0,
    acts:{},used:[],events:[],news:[],social:[],mail:[],dec:[],reviews:[],signings:[],rivalActs:[],bg:[],chart:null,heat:{},trend:null,
    rv:Object.fromEntries(RIVALS.map(r=>[r.id,{spent:0,signed:0}])),hits:0,lost:0,reads:[],rankQ:0,sound:true,three:true,over:false,tgt:null,recap:null,demoSeen:0,qNo:0};

  mail('Insights team','How we read numbers',`Follower counts are cheap. Ask us to run the data on anyone before you bid: we can usually tell bought streams from real fans, but not always.`);
  news('Trackside',`${l.short} hires a new ${RANKS[0].n.toLowerCase()}`,`${S.name} joins ${l.n} in ${l.city}, reporting to ${l.boss}.`,true)}
function targets(){const r=S.rank,q=S.qNo||0,tm=L().tmult;
  const revBase=[14000,38000,90000,190000,380000][r];

<script>

/* ---------- roster: the life of a signing ---------- */
function rosterActs(){return Object.values(S.acts).filter(a=>a.status==='signed')}

  if(['studio','single','album','cycle'].includes(p.ph)&&p.events<6)rosterEvent(a)}
function rosterEvent(a){const p=a.p,h=a.h;const r=Math.random();
  const add=k=>{p.events++;S.dec.push({t:'evt',id:a.id,k})};
  if(p.ph==='studio'&&h.ego>66&&r<.05)add('producer');
  else if(p.ph!=='studio'&&h.dur<40&&r<.04)add('burnout');
  else if(p.ph!=='studio'&&h.ego>70&&r<.035)add('rant');
  else if(p.ph!=='studio'&&h.sell>62&&r<.045&&!p.viral){p.viral=true;const last=p.rel[p.rel.length-1];last.boost=2.6;last.boostTo=S.wk+3;news('Pulse Daily',`A Clipstream trend sends ${a.name} flying`,`Two million videos use “${last.t}” in a week.`,true);social(a,'hit');p.events++}
  else if(p.ph!=='studio'&&h.tal>72&&r<.03&&!p.sync){p.sync=true;const fee=r5k(rnd(30000,90000));p.rev+=fee;p.qRev+=fee*.5;S.qRev+=fee*.5;S.lifeNet+=fee*.5;p.cred+=fee*.5;mail('Sync team',`${a.name} placed in a trailer`,`A streaming series trailer licensed “${p.rel[0].t}”. Fee ${full$(fee)}, split 50/50 between the label and the artist's account.`,a.id);p.events++}
  else if(p.ph!=='studio'&&p.lastStreams>1.2e6&&r<.03&&!p.tourAsk)add('tour')}
const EVT={
  producer:{t:a=>`${a.name} ${vb(a,'want','wants')} a famous producer`,b:a=>`Halfway through the album, ${a.name} ${vb(a,'want','wants')} to scrap four songs and re-cut them with a big-name producer. It will cost ${full$(60000)} (recoupable) and three more weeks.`,
    c:[{n:'Pay for it',d:'$60K recoupable, +3 weeks. Better record if the talent is there.',f:a=>{a.p.need+=3;a.p.cost+=60000;a.p.recoup+=60000;a.p.sulk=-(a.h.tal>65?6:2);a.aff+=6;return 'They are thrilled. The studio bills start arriving.'}},
       {n:'Say no',d:'Saves money. Expect a sulk in the studio.',f:a=>{a.p.sulk=4;a.aff-=14;return 'They finish the record, unhappily. Word is they call you "the accountant".'}}]},
  burnout:{t:a=>`${a.name} ${vb(a,'cancel','cancels')} the promo run`,b:a=>`Their manager calls: ${a.name} ${vb(a,'are','is')} exhausted and ${vb(a,'have','has')} pulled out of next week's promo, two radio sessions and a festival slot. The fans are noticing.`,
    c:[{n:'Pay for a wellness break',d:'$15K label cost. Streams dip for two weeks, then recover.',f:a=>{a.p.cost+=15000;a.p.slump=S.wk+2;a.aff+=8;return 'They take two weeks off. They come back sharper.'}},
       {n:'Push them through it',d:'Free. Risky with a fragile act.',f:a=>{if(chance(.45)){a.p.slump=S.wk+8;S.rep=clamp(S.rep-2,0,100);return 'They push through, then collapse on stage in week two. The tour is off.'}a.aff-=10;return 'They grit their teeth and do it. They will remember.'}}]},
  rant:{t:a=>`${a.name} ${vb(a,'go','goes')} off at the label online`,b:a=>`A late-night thread: ${a.name} ${vb(a,'say','says')} ${L().short} "doesn't get it" and the marketing is "embarrassing". It has 40,000 reposts.`,
    c:[{n:'Call them, privately',d:'Costs a day next week. Usually works.',f:a=>{S.debtSlots=(S.debtSlots||0)+1;a.aff+=4;const last=a.p.rel[a.p.rel.length-1];if(last){last.boost=1.15;last.boostTo=S.wk+2}return 'A long call. They delete the thread, the streams got a bump anyway.'}},
       {n:'Put out a statement',d:'Free. Makes it a story.',f:a=>{S.rep=clamp(S.rep-2,0,100);a.aff-=12;social(a,'rant');return 'The statement becomes the story. Your boss is not pleased.'}},
       {n:'Ignore it',d:'Let it burn out.',f:a=>{a.aff-=5;return 'It burns out in two days. Mostly.'}}]},
  tour:{t:a=>`${a.name} ${vb(a,'want','wants')} tour support`,b:a=>`The record is working and an agent has a 24-date run in mid-size rooms. They want ${full$(80000)} in tour support (recoupable) to cover the bus and crew.`,
    c:[{n:'Fund the tour',d:'$80K recoupable. Builds fans; more 360 income.',f:a=>{a.p.tourAsk=1;a.p.cost+=80000;a.p.recoup+=80000;const last=a.p.rel[a.p.rel.length-1];last.boost=1.3;last.boostTo=S.wk+8;a.aff+=8;return 'The tour sells well. Streams climb in every city they play.'}},
       {n:'Decline',d:'Saves the money.',f:a=>{a.p.tourAsk=1;a.aff-=6;return 'They tour anyway, smaller, and play the label down from the stage.'}}]}};

/* ---------- the week ---------- */
function endWeek(){
  const log=[];const prevRep=S.rep;
  // the market moves
  for(const a of marketActs()){a.gr=+(a.gr*.8+((a.h.sell-50)/16+1.5)*.2+N(0,1)).toFixed(1);if(chance(.012+a.h.sell/4000)){a.gr+=rnd(10,22);a.viral=S.wk}
    a.fol=Math.max(60,Math.round(a.fol*(1+a.gr/100)));a.ml=Math.round(a.ml*(1+a.gr/110));refreshBuzz(a);if(!a.nego)a.ask=Math.max(a.ask*.9,askOf(a));a.ask=r5k(a.ask);
    if(a.viral===S.wk&&a.known)news('Clipstream trends',`${a.name} ${vb(a,'blow','blows')} up on Clipstream`,`A clip of “${a.demos[0]}” passes a million views. Their follower count jumps ${Math.round(a.gr)}% this week.`)}
  rivalsWeek();rumours();
  for(const a of marketActs()){if(S.wk>=a.dl&&!a.nego){if(a.status==='radar'){a.status='gone';a.to='other';a.wkGone=S.wk;mail(a.mgr?a.mgr+' (manager)':'Their manager',`${a.name} went another way`,`Thanks for the interest. ${a.name} signed a smaller deal with a regional indie this week.`,a.id,true)}else{delete S.acts[a.id]}}}
  for(const a of Object.values(S.acts)){a.nego=false;
    // forget acts you never met: unvisited showcase acts, passes and strangers signed elsewhere
    const keepRival=S.rivalActs.some(r=>r.id===a.id);
    if((a.ev&&!a.known&&a.status==='market')||a.status==='passed'||(a.status==='gone'&&!a.known&&!keepRival))delete S.acts[a.id]}
  S.rivalActs=S.rivalActs.filter(r=>r.rel>S.wk-60||(actById(r.id)&&actById(r.id).known));
  // your roster
  for(const a of rosterActs()){rosterWeek(a,log)}
  S.wk++;
  for(const a of Object.values(S.acts))if((a.status==='signed'||a.status==='dropped')&&a.p&&a.p.rel.length)moneyWeek(a);
  // rival releases
  for(const r of S.rivalActs){if(r.rel===S.wk){const a=actById(r.id);if(!a)continue;const A=(.34*a.h.sell+.2*a.h.tal+.12*a.h.fit*heat(a.genre)+.12*(a.h.tal*.7+15)+.07*a.h.eth+.15*a.buzz)/100;
      r.peak=Math.pow(10,3.9+3.6*A+N(0,.3))*1.25*(a.fake?.75:1);r.t=pick(a.demos);}
    if(r.rel+4===S.wk&&!r.rep){r.rep=true;const a=actById(r.id);if(!a)continue;const rv=rivalOf(r.rid);const pos=(S.chart||[]).find(x=>x.id===a.id);const big=r.peak>9e6;
      news('Pulse Daily',big?`${poss(rv.label)} ${a.name} is a hit`:`${poss(rv.label)} ${fmt$(r.adv)} signing ${a.name} stalls`,big?`“${r.t}” is at #${pos?pos.pos:'40'} after a month.`:`“${r.t}” is doing ${fmtN(r.peak*releaseCurve(4))} streams a week. ${a.fake?'Insiders say the pre-signing numbers were bought.':'It may need time.'}`);
      if(a.known){a.truthOut=true;S.reads.push(Math.abs(readValue(a)-trueValue(a)))}}}
  // genre trends
  for(const g of GK){S.heat[g]=+clamp(S.heat[g]+(1-S.heat[g])*.04+N(0,.035)+(S.trend&&S.trend.g===g&&S.trend.to>=S.wk?.045:0),.5,1.7).toFixed(3)}
  if((!S.trend||S.trend.to<S.wk-4)&&chance(.08)){const g=pick(GK);S.trend={g,to:S.wk+6};news('The Ledger',`Is it ${GENRES[g].n}'s year?`,`Playlist editors and radio are leaning into ${GENRES[g].n.toLowerCase()}. Labels are scrambling to sign it.`)}
  buildChart();chatter();
  spawnMarket(ri(3,5));
  // the inbox brings demos
  const sub=pick(Object.values(S.acts).filter(a=>a.status==='market'&&!a.ev));if(sub&&chance(.7)){knowAct(sub,'inbox');mail(sub.mgr?sub.mgr+' (manager)':sub.name,`Demo: ${sub.name}`,`${sub.bio} Three tracks attached: ${sub.demos.map(t=>'“'+t+'”').join(', ')}. ${fmtN(sub.fol)} followers. Would love your ears on it.`,sub.id,true)}
  S.events=weekEvents();S.used=[];if(S.debtSlots){for(let i=0;i<S.debtSlots;i++)S.used.push('Damage control');S.debtSlots=0}
  if(wInQ(S.wk)===1)S.dec.unshift({t:'review'});
  if(S.wk%52===1&&S.wk>1){S.budget=Math.round(L().budget*R().bm);mail(L().boss,'New year, new budget',`Your signing budget for ${yearOf(S.wk)} is ${full$(S.budget)}. Spend it on records.`)}
  S.recap={w:S.wk-1,log,rep:S.rep-prevRep,net:rosterActs().reduce((s,a)=>s+(a.p.weekly.length?a.p.weekly[a.p.weekly.length-1]*PER_STREAM:0),0)}}

/* ---------- quarterly review ---------- */
function review(){const T=S.tgt;const parts=[];
  parts.push({n:`Sign ${T.sign} act${T.sign>1?'s':''}`,got:S.qSign,need:T.sign,ok:S.qSign>=T.sign,score:Math.min(1,S.qSign/T.sign)});
  if(T.rev)parts.push({n:`Roster net revenue ${fmt$(T.rev)}`,got:fmt$(S.qRev),need:fmt$(T.rev),ok:S.qRev>=T.rev,score:Math.min(1,S.qRev/T.rev)});
  if(T.hit)parts.push({n:`A release in the top ${T.hit}`,got:S.qBest<999?'#'+S.qBest:'none',need:'#'+T.hit,ok:S.qBest<=T.hit,score:S.qBest<=T.hit?1:S.qBest<=T.hit*2?.4:0});
  const qBud=L().budget*R().bm/4;const over=S.qExp>qBud*1.6;
  const sc=sum(parts.map(p=>p.score))/parts.length-(over?.2:0);
  const g=sc>=.95?'A':sc>=.75?'B':sc>=.5?'C':sc>=.25?'D':'F';
  const dt={A:16,B:8,C:0,D:-12,F:-22}[g];
  return {parts,g,dt,over,q:qOf(S.wk-1),y:yearOf(S.wk-1)}}
function applyReview(rv){S.trust=clamp(S.trust+rv.dt,0,100);S.reviews.unshift({q:rv.q,y:rv.y,g:rv.g,rank:S.rank});S.rankQ++;S.qNo++;
  let promo=false,fired=false;
  if(S.trust<=0||(S.qNo>4&&S.reviews.length>=2&&S.reviews[0].g==='F'&&S.reviews[1].g==='F')){fired=true;S.over='fired'}
  else if(S.rank<4&&S.trust>=70&&S.rankQ>=2&&S.rep>=RANKS[S.rank+1].rep){S.rank++;S.rankQ=0;promo=true;S.trust=clamp(S.trust-15,0,100);
    S.budget+=Math.round(L().budget*(RANKS[S.rank].bm-RANKS[S.rank-1].bm)*(1-((S.wk-1)%52)/52));
    news('Trackside',`${L().short} promotes ${S.name} to ${RANKS[S.rank].n}`,`The move follows a run of signings that worked.`,true)}
  if(!fired&&S.qNo>=24){S.over='retire'}
  S.qSign=0;S.qRev=0;S.qBest=999;S.qExp=0;for(const a of rosterActs())a.p.qRev=0;S.tgt=targets();
  return {promo,fired}}
function careerScore(){const net=S.lifeNet-sum(rosterActs().concat(Object.values(S.acts).filter(a=>a.status==='dropped')).map(a=>a.p?a.p.cost:0));
  const reads=S.reads.length?S.reads.reduce((s,x)=>s+x,0)/S.reads.length:30;
  return Math.round(S.rep*6+S.hits*40+S.rank*120+Math.max(-200,net/20000)+Math.max(0,30-reads)*6)}
</script>
<script>
'use strict';
/* ---------- small pieces ---------- */
const IC={
  scout:'<circle cx="7" cy="14" r="4"/><circle cx="17" cy="14" r="4"/><path d="M7 10V6h3l1 4M17 10V6h-3l-1 4M11 14h2"/>',
  roster:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3"/>',
  charts:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
  feed:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/>',
  career:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12h18"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',play:'<path d="M8 5l11 7-11 7z"/>',chev:'<path d="M9 6l6 6-6 6"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>'};
const ico=(k,c='ico')=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
function markSVG(col){return `<svg class="mark" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="${col}"/><circle cx="15" cy="15" r="8.5" fill="none" stroke="#171719" stroke-width="2"/><circle cx="15" cy="15" r="2.4" fill="#171719"/><path d="M15 6.5v4" stroke="#171719" stroke-width="2"/></svg>`}
function initials(n){const w=n.replace(/^(The|Lil|Yung|Big|Baby) /,'').split(/[\s&]+/).filter(Boolean);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()}
function avatar(a,cls='avatar'){const c=GENRES[a.genre].col;const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#2a292d"/><circle cx="32" cy="32" r="29" fill="none" stroke="${c}" stroke-width="2.5"/><text x="32" y="40" font-family="Public Sans,Arial" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">${esc(initials(a.name))}</text></svg>`;
  return `<img class="${cls}" src="data:image/svg+xml,${encodeURIComponent(svg)}" width="${cls.includes('lg')?64:46}" height="${cls.includes('lg')?64:46}" alt="">`}
function readRow(a,k,truth){const e=a.e[k];const [lo,hi]=band(e);const unk=unknown(e);const T=truth&&a.p&&a.p.revealed&&a.p.revealed[k];const tv=truth===true||T;
  return `<div class="read ${unk?'unknown':''}"><span class="k">${SNAME[k]}</span><div class="track" role="img" aria-label="${SNAME[k]}: ${unk?'unknown':'between '+Math.round(lo)+' and '+Math.round(hi)}${tv?', truth '+a.h[k]:''}">
    <i class="band" style="left:${unk?0:lo}%;width:${unk?100:Math.max(2,hi-lo)}%"></i>${unk?'':`<i class="mean" style="left:${e.m}%"></i>`}${tv?`<i class="truth" style="left:${a.h[k]}%"></i>`:''}</div>
    <span class="v">${tv?`<span class="gold">${a.h[k]}</span>`:unk?'?':Math.round(lo)+'–'+Math.round(hi)}</span></div>`}
function miniReads(a){return `<div class="minireads" role="img" aria-label="${esc(STATS.map(([k,n])=>{const e=a.e[k];const [lo,hi]=band(e);return n+' '+(unknown(e)?'unknown':Math.round(lo)+' to '+Math.round(hi))}).join(', '))}">${STATS.map(([k,,s])=>{const e=a.e[k];const [lo,hi]=band(e);const unk=unknown(e);return `<div><div class="track ${unk?'':''}"><i class="band ${unk?'unk':''}" style="left:${unk?0:lo}%;width:${unk?100:Math.max(3,hi-lo)}%"></i>${unk?'':`<i class="mean" style="left:${e.m}%"></i>`}</div><span>${s}</span></div>`}).join('')}</div>`}
function rivalPill(a){const lv=Math.max(0,...Object.entries(a.riv).filter(([rid])=>a.heard&&(a.heard[rid+1]||a.heard[rid+2])).map(([,v])=>v));
  if(lv>=2)return '<span class="pill neg">Rival offer</span>';if(lv===1)return '<span class="pill warn">Rivals circling</span>';return ''}
function pips(){const m=slotsMax(),u=S.used.length;return `<div class="pips" role="img" aria-label="${m-u} of ${m} days left">${Array.from({length:m},(_,i)=>`<i class="${i<m-u?'on':''}"></i>`).join('')}</div>`}
function lineChart(vals,{h=150,w=340,startWk}={}){if(!vals.length)return '<p class="empty">No streams yet.</p>';
  const max=Math.max(...vals,1);const mag=Math.pow(10,Math.floor(Math.log10(max)));let step=mag;for(const m of [1,2,2.5,5,10]){if(max/(mag*m)<=4){step=mag*m;break}}const top=Math.ceil(max*1.05/step)*step;
  const L0=44,B=h-20,T0=8,W=w-L0-6;const x=i=>L0+(vals.length===1?W/2:i/(vals.length-1)*W);const y=v=>B-(v/top)*(B-T0);
  let g='';for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${L0}" x2="${w-6}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#3a3a3e':'#242327'}" stroke-width="1"/><text x="${L0-6}" y="${y(v)+3.5}" text-anchor="end">${fmtN(v)}</text>`}
  const n=vals.length;const ticks=[0,Math.floor(n/3),Math.floor(2*n/3),n-1].filter((v,i,s)=>s.indexOf(v)===i);
  for(const i of ticks)g+=`<text x="${clamp(x(i),L0+12,w-20)}" y="${h-4}" text-anchor="middle">${startWk?dateOf(startWk+i):'wk '+(i+1)}</text>`;
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Weekly streams, peak ${fmtN(max)}">${g}<polyline points="${pts}" fill="none" stroke="#d9b25f" stroke-width="2" stroke-linejoin="round"/></svg>`}
function toast(t){const box=$('#toasts');box.innerHTML='';const el=document.createElement('div');el.className='toast';el.textContent=t;box.appendChild(el);clearTimeout(toast.h);toast.h=setTimeout(()=>el.remove(),2800)}
function when(){return `Week ${wInQ(S.wk)} · Q${qOf(S.wk)} ${yearOf(S.wk)}`}

/* ---------- screens ---------- */
function render(){
  const app=$('#app'),top=$('#top'),tabs=$('#tabs');
  if(UI.scr==='title'){top.innerHTML='';tabs.innerHTML='';app.className='app bare';app.innerHTML=titleScreen();renderSheet();return}
  if(UI.scr==='new'){top.innerHTML='';tabs.innerHTML='';app.className='app bare';app.innerHTML=newScreen();renderSheet();return}
  if(S.over&&!UI.sheet){if(!UI.overTop){UI.overTop=1;window.scrollTo(0,0)}top.innerHTML='';tabs.innerHTML='';app.className='app bare';app.innerHTML=overScreen();renderSheet();hydrate();return}
  app.className='app';
  top.innerHTML=`<header class="top"><div class="in">${markSVG(L().col)}<div class="when"><b>${when()}</b><span>${dateOf(S.wk)} · ${esc(L().short)} · ${R().n}</span></div>${pips()}<button class="btn sm" data-a="endweek">End week</button></div></header>`;
  const unread=S.mail.filter(m=>!m.read).length;
  const T=[['scout','Scout'],['roster','Roster'],['charts','Charts'],['feed','Feed'],['career','Career']];
  tabs.innerHTML=`<div class="tabs"><div class="in">${T.map(([k,n])=>`<button class="tab ${UI.tab===k?'on':''}" aria-current="${UI.tab===k?'page':'false'}" data-a="tab" data-v="${k}">${ico(k)}<span>${n}</span>${k==='feed'&&unread?`<span class="badge">${unread}</span>`:''}</button>`).join('')}</div></div>`;
  app.innerHTML=({scout:scoutTab,roster:rosterTab,charts:chartsTab,feed:feedTab,career:careerTab}[UI.tab])();
  renderSheet();if(!UI.sheet)hydrate()}

function titleScreen(){const slots=[1,2,3].map(n=>({n,s:readSlot(n)}));const last=lastSlot();const ls=last?readSlot(last):null;
  return `<section class="hero"><svg viewBox="0 0 30 30" width="56" height="56" aria-hidden="true"><rect width="30" height="30" rx="7" fill="#d9b25f"/><circle cx="15" cy="15" r="8.5" fill="none" stroke="#171719" stroke-width="2"/><circle cx="15" cy="15" r="2.4" fill="#171719"/><path d="M15 6.5v4" stroke="#171719" stroke-width="2"/></svg>
    <h1>A&amp;R: The&nbsp;Talent Scout</h1><p>You don't make the music. You decide who gets to. Read unsigned acts, outbid rival scouts, write the deal, and live with the records.</p></section>
  ${ls&&!ls.over?`<button class="btn block" data-a="cont">Continue: ${esc(ls.name)} · Week ${wInQ(ls.wk)}, Q${qOf(ls.wk)} ${yearOf(ls.wk)}</button>`:''}
  <section class="card"><div class="sec"><h2>Careers</h2><span class="aside">Saved on this device</span></div><div class="list">${slots.map(({n,s})=>`<div class="slot" style="padding:10px 0"><div class="stack"><b>${s?esc(s.name):'Empty slot '+n}</b><span class="small muted">${s?`${esc(LABELS[s.label].short)} · ${RANKS[s.rank].n} · Q${qOf(s.wk)} ${yearOf(s.wk)}${s.over?' · ended':''}`:'Start a new career here'}</span></div>
    <div class="row">${s?`<button class="btn sm sec2" data-a="load" data-v="${n}">Open</button><button class="iconbtn" data-a="del" data-v="${n}" aria-label="Delete slot ${n}">${ico('close')}</button>`:`<button class="btn sm" data-a="newslot" data-v="${n}">New</button>`}</div></div>`).join('')}</div></section>
  <button class="btn ghost block" data-a="how">How to play</button>
  <p class="hint">All artists, labels, scouts and companies in this game are fictional.</p>`}
function newScreen(){const d=UI.newGame;
  return `<section class="hero" style="gap:8px"><h1 style="font-size:32px">Your first day</h1><p>Pick a label. It decides your budget, your boss, the deals you can offer and how artists see you.</p></section>
  <label class="field"><span>Your name</span><input type="text" name="player" data-f="name" value="${esc(d.name)}" maxlength="24" autocomplete="off"></label>
  <div class="labelpick">${Object.entries(LABELS).map(([k,l])=>`<button class="opt ${d.label===k?'on':''}" data-a="pickl" data-v="${k}"><div class="lab"><div class="mk" style="background:${l.col}">${l.short[0]}</div><div class="stack"><b>${l.n}</b><span class="small muted">${l.kind} · ${l.city} · ${fmt$(l.budget)} a year</span><small>${l.desc}</small></div></div></button>`).join('')}</div>

function econ(o){const a=actById(o.id);const vid=45000;const out=o.adv+o.rec+o.mkt+vid;const recoup=o.adv+o.rec+vid*.5;
  const rate=o.type==='royalty'?o.pts/100:o.type==='license'?o.lic/100:o.split/100;
  const artistAt=o.type==='split'?out/PER_STREAM:recoup/(PER_STREAM*rate);
  const labelBE=o.type==='license'?out/(PER_STREAM*(1-o.lic/100)):out/PER_STREAM;
  // the data team projects first-year streams from your read, not from the truth
  const e=a.e;const A=(.34*e.sell.m+.2*e.tal.m+.12*e.fit.m*heat(a.genre)+.12*(e.tal.m*.62+18)+.07*e.eth.m+.15*a.buzz)/100;const sd=readSD(a)/100*3.6+.3;
  const yr=lp=>Math.pow(10,lp)*mktMult(o.mkt)*2.5*13;const mid=3.9+3.6*A;
  return {out,recoup,artistAt,labelBE,p10:yr(mid-1.28*sd),p50:yr(mid),p90:yr(mid+1.28*sd),left:S.budget-o.adv-o.rec}}
function econHTML(o){const E=econ(o);
  return `<div class="dealrow"><span>From your budget now</span><b>${full$(o.adv+o.rec)}</b></div>
  <div class="dealrow"><span>Budget left after</span><b class="${E.left<0?'neg':''}">${full$(E.left)}</b></div>
  <div class="dealrow"><span>Label outlay incl. marketing and video</span><b>${full$(E.out)}</b></div>
  <div class="dealrow"><span>Label breaks even at</span><b>${fmtN(E.labelBE)} streams</b></div>
  <div class="dealrow"><span>${o.type==='split'?'Artist shares profit after':'Artist recoups after'}</span><b>${fmtN(E.artistAt)} streams</b></div>
  <div class="dealrow"><span>Insights: first year, from your read</span><b>${fmtN(E.p10)}–${fmtN(E.p90)}</b></div>
  <p class="hint">At about ${'$'+PER_STREAM.toFixed(4)} of master revenue per stream, ${fmtN(E.labelBE)} streams is ${E.labelBE>E.p90?'more than your optimistic case':E.labelBE>E.p50?'above your middle case':'inside your middle case'}. Most signings never recoup.</p>`}
function offerSheet(){const o=UI.offer,a=actById(o.id),l=L();const br=bestRival(a);const known=br&&a.heard&&a.heard[br.rv.id+2];const max=Math.max(5000,Math.min(S.budget-o.rec,r5k(a.ask*3.5)));

  ${known?`<div class="card"><div class="sec"><h3>On the table from ${esc(br.rv.label)}</h3></div><p class="small soft">${fmt$(br.o.adv)} advance · ${br.o.type==='split'?'50/50 profit split':br.o.pts+' points'} · ${br.o.p360?br.o.p360+'% 360':'no 360'} · ${br.o.opts} options</p></div>`:''}
  <div class="opts one">${Object.entries(DEALS).map(([k,d])=>`<button class="opt ${o.type===k?'on':''}" data-a="otype" data-v="${k}"><b>${d.n}</b><small>${d.d}</small></button>`).join('')}</div>
  ${rng('adv','Advance (recoupable)',0,max,5000,full$)}
  ${o.type==='royalty'?rng('pts','Royalty',12,24,1,v=>v+' points'):o.type==='split'?rng('split','Artist share of net profit',30,60,5,v=>v+'%'):rng('lic','Artist share of revenue',55,85,5,v=>v+'%')}
  ${rng('rec','Recording fund (recoupable)',20000,300000,5000,full$)}

  ${l.no360?'<p class="hint">Low Tide does not do 360 deals.</p>':rng('p360','360: share of touring, merch and brand net',0,30,5,v=>v?v+'%':'none')}
  ${rng('opts','Option albums after the first',0,5,1,v=>v+(v===1?' option':' options'))}
  <section class="card" id="econ">${econHTML(o)}</section>
  <button class="btn block" data-a="submit" ${o.adv+o.rec>S.budget||slotsLeft()<1?'disabled':''}>Send the offer · 1 day</button>`}
function negoSheet(){const r=UI.nego,a=r.a;const o=r.o;
  const head={yes:'Deal.',counter:'They come back with a counter.',rival:'They have a better offer.',insult:'That went badly.',walk:'They walk.'}[r.kind];

  else if(r.kind==='counter')body=`<p class="soft">${esc(r.ask.t)}</p><p class="small muted">${a.rounds} of ${r.max} rounds used.</p>`;

/* Feed */
function feedTab(){const unread=S.mail.filter(m=>!m.read).length;
  return `<div class="seg">${[['news','Trade news'],['social','Social'],['inbox','Inbox'+(unread?' '+unread:'')]].map(([k,n])=>`<button class="${UI.feed===k?'on':''}" data-a="feed" data-v="${k}">${n}</button>`).join('')}</div>
  ${UI.feed==='news'?`<section class="list">${S.news.map(n=>`<article class="news"><span class="src">${esc(n.src)} · ${dateOf(n.w)} ${yearOf(n.w)}${n.mine?' · <span class="gold">your label</span>':''}</span><b>${esc(n.t)}</b><p>${esc(n.d)}</p></article>`).join('')||'<p class="empty">No news yet.</p>'}</section>`:
   UI.feed==='social'?`<section class="list">${S.social.map(p=>{const a=actById(p.act);const c=a?GENRES[a.genre].col:'#888';return `<article class="post"><div class="av" style="background:${c}">${esc(p.h[0].toUpperCase())}</div><div class="body"><span class="h"><b>@${esc(p.h)}</b> · ${dateOf(p.w)}</span><p>${esc(p.t)}</p><span class="stats">${fmtN(p.likes)} likes</span></div></article>`}).join('')||'<p class="empty">Quiet out there.</p>'}</section>`:
   `<section class="list">${S.mail.map(m=>`<button class="mail ${m.read?'':'unread'}" data-a="mail" data-v="${m.id}"><div class="h"><span>${esc(m.from)}</span><span>${dateOf(m.w)}</span></div><b>${esc(m.subj)}</b><p>${esc(m.body.length>110?m.body.slice(0,108)+'…':m.body)}</p></button>`).join('')||'<p class="empty">Inbox zero.</p>'}</section>`}`}
function mailSheet(m){const a=m.act&&actById(m.act);return `<div class="x"><h2>${esc(m.subj)}</h2><button class="iconbtn" data-a="close" aria-label="Close">${ico('close')}</button></div><p class="small muted">${esc(m.from)} · ${dateOf(m.w)} ${yearOf(m.w)}</p><p class="soft">${esc(m.body)}</p>${a?`<button class="btn sec2 block" data-a="${a.status==='signed'||a.status==='dropped'?'openros':'openact'}" data-v="${a.id}">Open ${esc(a.name)}</button>`:''}`}

/* Career */
function careerTab(){const T=S.tgt;const reads=S.reads.length?S.reads.reduce((s,x)=>s+x,0)/S.reads.length:null;const calib=reads==null?null:Math.round(clamp(100-reads*3,0,100));
  const prog=[[`Sign ${T.sign} act${T.sign>1?'s':''}`,S.qSign,T.sign,`${S.qSign} of ${T.sign}`]];
  if(T.rev)prog.push([`Roster net revenue`,S.qRev,T.rev,`${fmt$(S.qRev)} of ${fmt$(T.rev)}`]);
  if(T.hit)prog.push([`A release in the top ${T.hit}`,S.qBest<=T.hit?1:0,1,S.qBest<999?'best #'+S.qBest:'none yet']);
  return `<div class="sec"><h1>${esc(S.name)}</h1><span class="aside">${R().n}, ${esc(L().short)}</span></div>
  <div class="stage tall" data-stage="office"><div class="fb">Your office</div><div class="cap"><span>Your office · ${S.hits} plaque${S.hits===1?'':'s'}</span><span>Drag to spin</span></div></div>
  <div class="kv"><div><span>Boss trust</span><b>${Math.round(S.trust)}</b></div><div><span>Reputation</span><b>${Math.round(S.rep)}</b></div><div><span>Ears</span><b>${calib==null?'–':calib+'%'}</b><small>calibration</small></div></div>
  <section class="card"><div class="sec"><h2>Q${qOf(S.wk)} targets</h2><span class="aside">review on ${dateOf(S.wk+QW-wInQ(S.wk)+1)}</span></div>
    ${prog.map(([n,v,m,t])=>`<div class="target"><div class="row between"><b>${n}</b><span class="num small soft">${t}</span></div><div class="meter ${v>=m?'gold':''}"><i style="width:${clamp(v/m*100,0,100)}%"></i></div></div>`).join('')}
    <p class="hint">${esc(L().boss)} grades every quarter. Two failing grades in a row, or no trust left, and you are out.</p></section>
  <section class="card"><div class="sec"><h2>Budget</h2><span class="aside">${yearOf(S.wk)}</span></div><div class="dealrow"><span>Left for advances and recording</span><b>${full$(S.budget)}</b></div><div class="dealrow"><span>Spent this quarter, incl. travel</span><b>${full$(S.qExp)}</b></div></section>
  <section class="card"><div class="sec"><h2>The ladder</h2></div><div class="ladder">${RANKS.map((r,i)=>`<div class="${i===S.rank?'now':''}"><span>${r.n}</span><span class="num">${i>S.rank?'rep '+r.rep:i===S.rank?'you':'done'}</span></div>`).slice().reverse().join('')}</div><p class="hint">Promotion needs two quarters in the job, trust of 70 and the reputation shown. It brings a bigger budget and more days.</p></section>
  ${S.reviews.length?`<section class="card"><div class="sec"><h2>Reviews</h2></div><div class="list">${S.reviews.slice(0,8).map(r=>`<div class="dealrow"><span>Q${r.q} ${r.y} · ${RANKS[r.rank].n}</span><b>${r.g}</b></div>`).join('')}</div></section>`:''}
  <section class="card"><div class="sec"><h2>Rival scouts</h2></div><div class="list">${RIVALS.map(r=>`<div class="dealrow"><span><b style="color:var(--text);font-family:var(--sans)">${r.scout}</b>, ${r.label}<br><small class="muted">${r.style}</small></span><b>${S.rv[r.id].signed} signed</b></div>`).join('')}</div></section>
  <div class="opts"><button class="opt" data-a="how"><b>How to play</b><small>The rules and the money</small></button><button class="opt" data-a="sound"><b>Sound ${S.sound?'on':'off'}</b><small>Demo clips</small></button><button class="opt" data-a="three"><b>3D ${S.three?'on':'off'}</b><small>Stages and office</small></button><button class="opt" data-a="quit"><b>Save and exit</b><small>Back to the title</small></button></div>`}
function overScreen(){const sc=careerScore();const fired=S.over==='fired';
  return `<section class="hero"><h1 style="font-size:36px">${fired?'Security walks you out.':'You leave on your own terms.'}</h1><p>${fired?`${esc(L().boss)} keeps it short. Your plaques stay on the wall; your badge does not.`:`Six years at ${esc(L().short)}. The office plaques stay; the ears go with you.`}</p></section>
  <div class="stage tall" data-stage="office"><div class="fb">Your office</div></div>
  <div class="kv four"><div><span>Final rank</span><b>${R().n}</b></div><div><span>Top 40 hits</span><b>${S.hits}</b></div><div><span>Reputation</span><b>${Math.round(S.rep)}</b></div><div><span>Career score</span><b class="gold">${sc}</b></div></div>
  <section class="card"><div class="sec"><h2>Your signings</h2></div><div class="list">${S.signings.map(id=>{const a=actById(id);return a?`<div class="dealrow"><span>${esc(a.name)}<br><small class="muted">read ${Math.round(readValue(a))} · truth ${Math.round(trueValue(a))}</small></span><b class="${labelNet(a)<0?'neg':'pos'}">${fmt$(labelNet(a))}</b></div>`:''}).join('')||'<p class="empty">None.</p>'}</div></section>
  <button class="btn block" data-a="totitle">Back to the title</button>`}
</script>
<script>
'use strict';
/* ---------- sheets ---------- */
function renderSheet(){const el=$('#sheet');const sh=UI.sheet;if(!sh){el.innerHTML='';document.body.style.overflow='';return}
  const prev=el.querySelector('.sheet');const st=prev&&prev.dataset.k===sheetKey(sh)?prev.scrollTop:0;
  let h='';const k=sh.k;
  if(k==='act'){const a=actById(sh.id);if(!a){UI.sheet=null;return renderSheet()}h=actSheet(a)}
  else if(k==='ros'){const a=actById(sh.id);h=rosSheet(a)}
  else if(k==='offer')h=offerSheet();
  else if(k==='nego')h=negoSheet();
  else if(k==='mail')h=mailSheet(S.mail.find(m=>m.id===sh.id));
  else if(k==='recap')h=recapSheet();
  else if(k==='dec')h=decSheet();
  else if(k==='how')h=howSheet();
  else if(k==='event')h=eventSheet(sh.r);
  const modal=['recap','dec','nego'].includes(k);
  el.innerHTML=`<div class="scrim" ${modal?'':'data-a="scrim"'}><div class="sheet" data-k="${sheetKey(sh)}" role="dialog" aria-modal="true">${modal?'':'<div class="grab"></div>'}${h}</div></div>`;
  document.body.style.overflow='hidden';const ns=el.querySelector('.sheet');if(ns)ns.scrollTop=st;hydrate(el)}
const vb=(a,pl,sg)=>a.kind==='solo'?sg:pl;
const poss=n=>n.endsWith('s')?n+"'":n+"'s";
const sheetKey=sh=>sh.k+(sh.id||'');
function recapSheet(){const r=S.recap;const ros=rosterActs();const top=S.news.filter(n=>n.w===r.w||n.w===r.w+1).slice(0,4);
  return `<div class="x"><h2>Week ${wInQ(r.w)} wrap</h2><span class="small muted">${dateOf(r.w)} to ${dateOf(r.w,6)}</span></div>
  ${ros.length?`<div class="kv two"><div><span>Roster streams</span><b>${fmtN(sum(ros.map(a=>a.p.lastStreams||0)))}</b></div><div><span>Net this quarter</span><b>${fmt$(S.qRev)}</b></div></div>`:''}
  ${r.log.length?`<div class="list">${r.log.map(t=>`<p class="small soft" style="padding:6px 0">${esc(t)}</p>`).join('')}</div>`:''}
  ${top.length?`<section class="list">${top.map(n=>`<article class="news"><span class="src">${esc(n.src)}</span><b>${esc(n.t)}</b><p>${esc(n.d)}</p></article>`).join('')}</section>`:'<p class="soft">A quiet week in the business.</p>'}
  ${r.rep?`<p class="small ${r.rep>0?'pos':'neg'}">Reputation ${r.rep>0?'+':''}${Math.round(r.rep)}</p>`:''}
  <button class="btn block" data-a="recapok">${S.dec.length?`Next: ${S.dec.length} decision${S.dec.length>1?'s':''}`:'On to the new week'}</button>`}
function decSheet(){const d=S.dec[0];
  if(d.t==='review'){const rv=UI.rev||(UI.rev=review());
    return `<div class="x"><h2>Q${rv.q} ${rv.y} review</h2><span class="small muted">${esc(L().boss)}</span></div>
    <div class="row"><div class="grade">${rv.g}</div><p class="soft grow">${{A:'"That is how you do the job. Keep going."',B:'"Good quarter. I want more of that."',C:'"Fine. Fine is not why we hired you."',D:'"I am defending you in meetings. Do not make me stop."',F:'"This cannot happen again."'}[rv.g]}</p></div>
    <div class="list">${rv.parts.map(p=>`<div class="dealrow"><span>${esc(p.n)}</span><b class="${p.ok?'pos':'neg'}">${esc(String(p.got))}</b></div>`).join('')}${rv.over?'<div class="dealrow"><span>Spending</span><b class="neg">Over the quarterly line</b></div>':''}</div>
    <p class="small ${rv.dt>=0?'pos':'neg'}">Boss trust ${rv.dt>=0?'+':''}${rv.dt}</p><button class="btn block" data-a="revok">Continue</button>`}
  const a=actById(d.id);if(!a){S.dec.shift();return recapSheet()}
  if(d.t==='plan'){const p=a.p;UI.plan=UI.plan||{single:'radio',plan:'standard'};
    return `<div class="x"><h2>${esc(a.name)}: the album is done</h2></div>
    <p class="soft">The record is finished. In the room it sounds like a ${p.q>=75?'career':p.q>=55?'solid record':'record with problems'}: quality <b class="num">${p.q}</b> of 100. The studio told you the truth about their talent, fit and work ethic.</p>
    <div class="reads">${['tal','fit','eth'].map(k=>readRow(a,k,'r')).join('')}</div>
    <div class="sec"><h3>Lead single</h3></div><div class="opts one">${SINGLES.map(s=>`<button class="opt ${UI.plan.single===s.id?'on':''}" data-a="plansingle" data-v="${s.id}"><b>${s.n}</b><small>${s.d}</small></button>`).join('')}</div>
    <div class="sec"><h3>Marketing</h3><span class="aside">half comes from your budget</span></div><div class="opts one">${PLANS.map(s=>{const need=Math.max(s.mkt,a.deal.mkt);return `<button class="opt ${UI.plan.plan===s.id?'on':''}" data-a="planmkt" data-v="${s.id}" ${S.budget<need/2&&s.id!=='lean'?'disabled':''}><b>${s.n} · ${fmt$(need)}</b><small>${s.d}${a.deal.mkt>s.mkt?' The contract commits you to at least '+fmt$(a.deal.mkt)+'.':''}</small></button>`}).join('')}</div>
    <button class="btn block" data-a="planok">Release the single</button>`}
  if(d.t==='evt'){const E=EVT[d.k];if(UI.evtRes)return `<div class="x"><h2>${esc(E.t(a))}</h2></div><p class="soft">${esc(UI.evtRes)}</p><button class="btn block" data-a="evtok">Continue</button>`;
    return `<div class="x"><h2>${esc(E.t(a))}</h2></div><p class="soft">${esc(E.b(a))}</p><div class="opts one">${E.c.map((c,i)=>`<button class="opt" data-a="evtpick" data-v="${i}"><b>${c.n}</b><small>${c.d}</small></button>`).join('')}</div>`}
  if(d.t==='option'){const p=a.p;const left=a.deal.opts-p.optUsed;const cost=r5k(a.deal.adv*1.25)+a.deal.rec;
    return `<div class="x"><h2>${esc(a.name)}: option on album ${p.alb+1}</h2></div>
    <p class="soft">The cycle is done. ${left>0?`The contract gives ${esc(L().short)} the right to another album: ${full$(cost)} for the option advance and recording.`:'There are no options left; they are out of contract.'}</p>
    <div class="kv"><div><span>Label P&amp;L</span><b class="${labelNet(a)<0?'neg':'pos'}">${fmt$(labelNet(a))}</b></div><div><span>Best chart</span><b>${p.best<999?'#'+p.best:'none'}</b></div><div><span>Streams/wk</span><b>${fmtN(p.lastStreams||0)}</b></div></div>
    <div class="reads">${STATS.map(([k])=>readRow(a,k,'r')).join('')}</div>
    <div class="opts one">${left>0?`<button class="opt" data-a="optup" ${S.budget<cost?'disabled':''}><b>Pick up the option · ${fmt$(cost)}</b><small>Another album. Catalogue and fans carry over.</small></button>`:''}
      <button class="opt" data-a="optdrop"><b>${left>0?'Drop them':'Let them go'}</b><small>The label keeps the masters you paid for${a.deal.type==='license'?' until the licence ends':''}; the catalogue keeps earning.</small></button></div>`}
  return ''}
function eventSheet(r){return `<div class="x"><h2>${esc(r.t)}</h2><button class="iconbtn" data-a="close" aria-label="Close">${ico('close')}</button></div><p class="soft">${esc(r.d)}</p>
  <div class="list">${r.ids.map(id=>{const a=actById(id);return a?`<button class="act" data-a="openact" data-v="${a.id}">${avatar(a)}<div class="who"><div class="nm"><b>${esc(a.name)}</b><span class="num small soft">${fmt$(a.ask)}</span></div><span class="meta">${GENRES[a.genre].n} · ${esc(a.city)}</span>${miniReads(a)}<p class="small soft">${esc((a.tells[0]||{}).t||'')}</p></div></button>`:''}).join('')}</div>
  ${r.riv.length?`<p class="small warn">Also in the room: ${r.riv.map(x=>esc(x)).join(', ')}.</p>`:''}`}
function howSheet(){return `<div class="x"><h2>How to play</h2><button class="iconbtn" data-a="close" aria-label="Close">${ico('close')}</button></div>
  <p class="soft"><b>You are the scout, not the artist.</b> Every act has six hidden numbers: talent, work ethic, ego, durability, genre fit and sellability. You never see them directly. You see your read: a range that narrows each time you look.</p>
  <p class="soft"><b>Each week has six days.</b> Go to open mics and showcases, dig the feeds, listen to demos, see acts live, check references, run the data or book a test session. Each move reads different numbers, with different accuracy. Feeds flatter sellability; some acts buy their streams.</p>
  <p class="soft"><b>Rivals read the same acts.</b> ${RIVALS.map(r=>r.scout+' at '+r.label+' ('+r.style.toLowerCase()+')').join('; ')}. A hot act decides by a deadline. Bid too early and you overpay; wait and they are gone.</p>
  <p class="soft"><b>The deal.</b> The advance and recording fund come out of your budget and are recoupable: the artist's royalty pays them back before the artist sees a cent. At about $${PER_STREAM.toFixed(4)} per stream, a ${fmt$(300000)} outlay needs about ${fmtN(300000/PER_STREAM)} streams to break even. 360 clauses take a share of touring and merch; artists who tour hate them. Options let you keep a good act for more albums.</p>
  <p class="soft"><b>Then the truth comes out.</b> The studio reveals talent, fit and ethic; release reveals sellability; the road reveals ego and durability. Gold diamonds show the truth against your read. Good reads train your ears.</p>
  <p class="soft"><b>Every quarter you are graded</b> on signings, roster revenue and chart hits. Do well to climb from Scout to President of A&amp;R. Two failing grades in a row and you are fired. The career runs six years.</p>`}

/* ---------- actions ---------- */
function doScout(a,k){const m=SCOUT[k];const tr=travelOf(a.city);const sl=m.travel?tr.slots:m.slots,c=m.travel?tr.cost:m.cost;
  spendSlots(sl,SCOUT[k].n.split(' ')[0]+': '+a.name);spendCash(c);a.done[S.wk]=a.done[S.wk]||{};a.done[S.wk][k]=1;a.seen++;
  const src={demo:'Demo',gig:'Live',refs:'References',data:'Data',dinner:'Dinner',studio:'Studio'}[k];
  for(const [st,sd] of m.reads)observe(a,st,sd,src,st==='sell'&&k==='data'?fakeBias(a):0);
  if(m.fake){if(a.fake&&chance(.75)){a.fakeKnown=true;a.e.sell.m=Math.max(5,a.e.sell.m-18);a.e.sell.v=Math.min(a.e.sell.v*1.6,484);a.tells.unshift({w:S.wk,src:'Data',k:'sell',t:'62% of streams come from three playlists run out of one data centre. Bought.'});S.rep=clamp(S.rep+1,0,100)}
    else if(a.fakeKnown==null){a.fakeKnown=false;a.tells.unshift({w:S.wk,src:'Data',k:'sell',t:'Listeners look organic: saves, shares and repeat plays line up with the follower count.'})}}
  if(m.aff)a.aff+=m.aff;if(m.buzz){for(const rv of RIVALS)if(chance(.35))a.riv[rv.id]=Math.max(a.riv[rv.id]||0,1)}
  if(k==='demo'){a.demoQ=a.h.tal+N(0,15*ears());playDemo(a,0)}
  if(k==='gig'&&chance(.4))social(a,a.h.sell>55?'live_good':'live_bad');
  toast(`${m.n}: ${a.tells[0]?a.tells[0].t:'noted.'}`)}
function attend(ev){spendSlots(ev.slots,ev.t.split(' ')[0]+': '+ev.city);spendCash(ev.cost);ev.done=true;
  const sd={open:[['tal',18],['sell',20]],show:[['tal',13],['sell',15],['ego',20]],fest:[['tal',12],['sell',14],['ego',20],['fit',18]],camp:[['tal',14],['fit',14]]}[ev.kind];
  const riv=[];for(const id of ev.ids){const a=actById(id);if(!a)continue;knowAct(a,'event');a.seen++;for(const [k,s] of sd)observe(a,k,s,ev.kind==='camp'?'Camp':'Live');
    if(ev.kind==='show'||ev.kind==='fest')for(const rv of RIVALS)if(chance(ev.kind==='fest'?.6:.3)){a.riv[rv.id]=Math.max(a.riv[rv.id]||0,1);if(!riv.includes(rv.scout+' ('+rv.label+')'))riv.push(rv.scout+' ('+rv.label+')')}}
  UI.sheet={k:'event',r:{t:ev.t,d:ev.kind==='open'?'Five acts, a lot of covers and one broken mic stand. Here is who stood out.':'The acts on the bill, and what you made of them.',ids:ev.ids,riv}}}
function dig(){spendSlots(1,'Feeds: deep dig');const pool=Object.values(S.acts).filter(a=>a.status==='market'&&!a.ev);
  const hot=pool.sort((x,y)=>y.buzz-x.buzz).slice(0,6);const deep=pool.filter(a=>a.buzz<40);const got=[];
  for(const a of [pick(hot),pick(hot),pick(deep)])if(a&&!got.includes(a)){got.push(a);knowAct(a,'feed');observe(a,'sell',20,'Feeds',8+fakeBias(a))}
  toast(got.length?`Added ${got.map(a=>a.name).join(', ')} to your radar.`:'Nothing new on the feeds.')}
const ACT={
  tab:v=>{UI.tab=v;window.scrollTo(0,0)},
  cont:()=>{const n=lastSlot();const s=readSlot(n);if(s){S=s;UI.scr='game';UI.tab='scout'}},
  load:v=>{const s=readSlot(+v);if(s){S=s;UI.scr='game';UI.tab='scout';try{localStorage.setItem('ar_last',v)}catch(e){}}},
  del:v=>{if(confirm('Delete this career? This cannot be undone.'))delSlot(+v)},
  newslot:v=>{UI.newGame={slot:+v,name:'',label:'northbound'};UI.scr='new'},
  pickl:v=>{UI.newGame.label=v},
  back:()=>{UI.scr='title'},
  start:()=>{const d=UI.newGame;newGame((d.name||'').trim()||'Alex Mercer',d.label,d.slot);UI.scr='game';UI.tab='scout';save();UI.sheet={k:'how'}},
  how:()=>{UI.sheet={k:'how'}},
  close:()=>{UI.sheet=null},scrim:()=>{UI.sheet=null},
  openact:v=>{UI.sheet={k:'act',id:v}},
  openros:v=>{UI.sheet={k:'ros',id:v}},
  watch:v=>{const a=actById(v);knowAct(a,'feed');observe(a,'sell',22,'Feeds',8+fakeBias(a));toast(`${a.name} added to your radar.`)},
  dig:()=>{if(slotsLeft()>=1)dig()},
  attend:v=>{const ev=S.events.find(e=>e.id===v);if(ev&&!ev.done&&slotsLeft()>=ev.slots)attend(ev)},
  scout:v=>{const [id,k]=v.split('|');const a=actById(id);doScout(a,k)},
  playdemo:v=>{const [id,i]=v.split('|');playDemo(actById(id),+i)},
  pass:v=>{const a=actById(v);a.status='passed';a.known=false;UI.sheet=null;toast(`Passed on ${a.name}.`)},
  offer:v=>{const a=actById(v);UI.offer=a.lastOffer?{...a.lastOffer}:defaultOffer(a);UI.sheet={k:'offer',id:v}},
  otype:v=>{UI.offer.type=v},
  submit:()=>{const o=UI.offer;const a=actById(o.id);a.lastOffer={...o};const r=submitOffer(o);UI.nego=r;if(r.kind==='yes')closeDeal(a,o);
    else if(r.kind==='walk'){if(r.br)rivalSigns(r.br.rv,a);else{a.cold=S.wk+4;a.rounds=0;a.aff-=5}}
    UI.sheet={k:'nego',id:a.id}},
  revise:()=>{const r=UI.nego;const o={...r.o};if(r.ask){if(r.ask.k==='p360')o.p360=0;else if(r.ask.k==='opts')o.opts=Math.max(0,o.opts-1);else if(r.ask.k==='pts')o.pts=Math.min(24,o.pts+2);else o.adv=r5k(o.adv+r.short)}
    UI.offer=o;UI.sheet={k:'offer',id:o.id}},
  walkaway:()=>{const a=UI.nego.a;a.cold=S.wk+3;a.rounds=0;UI.sheet=null;toast(`You step back from ${a.name}.`)},
  closenego:()=>{const a=UI.nego.a;UI.sheet=a.status==='signed'?{k:'ros',id:a.id}:null;if(a.status==='signed'){UI.tab='roster';UI.ros='now'}},
