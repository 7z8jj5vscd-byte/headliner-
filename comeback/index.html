<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comeback Tour">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Twenty years after the split, the offer arrives. Get the band back together and survive the reunion tour.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Comeback Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Look: true-black flat. One ground, elevation by lightness alone (#000, #111, #2a2a2a), no borders or shadows on
   cards at rest, the primary action inverted to a white pill. The only hue is the follow-spot amber, and it sits on data. */
:root{
  --ground:#000;--surface:#111;--raised:#2a2a2a;--sunk:#1b1b1b;--rule:#1f1f1f;--control:#444;
  --text:#fff;--muted:#b4b4b4;--faint:#949494;
  --spot:#f5b041;            /* follow-spot amber: the data hue */
  --positive:#3fc07a;--negative:#e5566f;
  --pill-pos-bg:#172a1d;--pill-pos-ink:#3fc07a;--pill-neg-bg:#2c1a20;--pill-neg-ink:#e5566f;
  --pill-warn-bg:#2b2414;--pill-warn-ink:#e5a93b;--pill-neu-bg:#222;--pill-neu-ink:#fff;
  --rc:20px;--rn:12px;--gap:14px;--pad:18px;--ch:36px;
  --tabh:58px;--toph:52px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ground);color-scheme:dark}
.skip{position:absolute;left:12px;top:-60px;z-index:99;background:#fff;color:#000;padding:10px 14px;border-radius:999px;font-weight:500}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2;text-wrap:balance}
h1{font-size:20px;letter-spacing:-.01em}h2{font-size:16px}h3{font-size:14px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.pos{color:var(--positive)}.neg{color:var(--negative)}.spot{color:var(--spot)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.stack.tight{gap:8px}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* shell */
.top{position:sticky;top:0;z-index:30;background:var(--ground);padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:640px;margin:0 auto;height:var(--toph);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.mark{width:28px;height:28px;flex:none;display:block}
.top-name{min-width:0;flex:1}
.top-name b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-name span{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:999px;border:0;background:none;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:active{background:var(--surface)}
.iconbtn svg{width:20px;height:20px}
.wrap{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap.notabs{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ground);border-top:1px solid var(--rule);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:#bbb;position:relative}
.tab svg{width:20px;height:20px;stroke:currentColor;opacity:.75}
.tab.on{color:#fff}.tab.on svg{opacity:1}
.tab:hover{color:#fff}
.person{border-radius:12px;transition:background .12s}
button.person:hover{background:#1a1a1a}
button.person:active{background:#222}
.lineup .slot{border-radius:12px;padding:4px 0;transition:background .12s}
.lineup .slot:hover{background:#1c1c1c}
.mini:hover:not(:disabled){border-color:#777;color:#fff}
.linkbtn:hover{color:#fff}
.seg button:hover:not(.on){color:#fff}
.tab .dot{position:absolute;top:8px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:var(--spot)}
.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}

/* surfaces */
.card{background:var(--surface);border-radius:var(--rc);padding:var(--pad);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.well{background:var(--raised);border-radius:var(--rn);padding:12px 14px}
.sunk{background:var(--sunk);border-radius:var(--rn);padding:12px 14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h .small{color:var(--faint)}
.lede{font-size:15px;line-height:1.55}
.story p+p{margin-top:10px}
.story{font-size:15px;line-height:1.6}
.story i{color:var(--muted)}
.quote{border-left:2px solid var(--spot);padding:2px 0 2px 12px;font-size:15px}

/* controls */
.btn{min-height:var(--ch);padding:0 16px;border-radius:999px;border:1px solid var(--control);background:none;color:var(--text);font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform .06s,background .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:#fff;color:#000;border-color:#fff}
.btn.pri:active{background:#ddd}
.btn.lg{min-height:48px;font-size:15px;padding:0 22px}
.btn.wide{width:100%}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--negative);border-color:#5a2a33}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn:hover:not(:disabled){border-color:#777}
.btn.pri:hover:not(:disabled){border-color:#fff;background:#eee}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:999px;min-height:38px;padding:0 8px;font-size:13px;font-weight:500;color:#bbb;line-height:1.15}
.seg button.on{background:var(--raised);color:#fff}
.seg button small{display:block;font-size:11px;font-weight:400;color:var(--faint)}
.seg button.on small{color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{width:100%;text-align:left;border:0;background:var(--raised);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:3px;transition:transform .06s,background .12s}
.choice:active{transform:scale(.985);background:#333}
.choice:hover:not(:disabled){background:#313131}
.choice b{font-weight:600;font-size:14px}
.choice span{font-size:13px;color:var(--muted)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice .fx{font-size:12px;color:var(--faint)}

/* data */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-radius:var(--rc)}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:14px 16px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--rule)}
.kpi span{display:block;font-size:12px;color:var(--faint)}
.kpi b{display:block;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kpi b small{font-size:12px;color:var(--faint);font-weight:400;margin-left:2px}
.kpi.lead b{font-size:26px}
.meter{display:flex;flex-direction:column;gap:5px}
.meter .between{font-size:13px}
.meter .between b{font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:#e6e6e6}
.bar.spot i{background:var(--spot)}.bar.neg i{background:var(--negative)}.bar.pos i{background:var(--positive)}
.list{display:flex;flex-direction:column}
.list>*{padding:11px 0;border-top:1px solid var(--rule)}
.list>*:first-child{border-top:0;padding-top:0}
.list>*:last-child{padding-bottom:0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
.kv span{color:var(--muted)}
.kv b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;flex:none;background:var(--pill-neu-bg);color:var(--pill-neu-ink)}
.pill.pos{background:var(--pill-pos-bg);color:var(--pill-pos-ink)}.pill.neg{background:var(--pill-neg-bg);color:var(--pill-neg-ink)}.pill.warn{background:var(--pill-warn-bg);color:var(--pill-warn-ink)}
.pill.spot{background:#2e2310;color:var(--spot)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:400;color:var(--faint);text-align:left;padding:0 0 6px;font-size:12px}
table.t td{padding:8px 0;border-top:1px solid var(--rule);vertical-align:top}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
.empty{border:1px dashed #333;border-radius:12px;padding:12px 14px;color:var(--faint);font-size:13px}

/* people */
.face{width:52px;height:52px;border-radius:50%;flex:none;display:block;background:var(--raised);object-fit:cover}
.face.lg{width:76px;height:76px}.face.sm{width:36px;height:36px}.face.xs{width:26px;height:26px}
.face.ghost{opacity:.4;filter:grayscale(1)}
.person{display:flex;gap:12px;align-items:center;min-width:0;width:100%;text-align:left;background:none;border:0;padding:0}
.person .who{min-width:0;flex:1}
.person .who b{display:block;font-weight:600;font-size:15px}
.person .who span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center}
.lineup .slot{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;background:none;border:0;padding:0}
.lineup .slot .face{width:100%;height:auto;aspect-ratio:1;max-width:60px}
.lineup .slot b{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lineup .slot span{font-size:11px;color:var(--faint);white-space:nowrap}
.lineup .slot.on span{color:var(--spot)}
.grudge{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}

/* stage */
.stage{position:relative;height:230px;border-radius:var(--rc);overflow:hidden;background:#050505;touch-action:pan-y}
.stage.tall{height:min(46vh,340px)}
.stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px}
.stage canvas~.stage-fb{display:none}
.stage-cap{position:absolute;left:12px;bottom:10px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:12px;color:#ddd}
.stage:not(:has(canvas)) .stage-cap span:last-child{display:none}
.stage-cap span{background:rgba(0,0,0,.6);padding:3px 9px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* feed */
.post{display:flex;gap:10px;align-items:flex-start}
.post .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;color:#000}
.post .bd{min-width:0;flex:1}
.post .hd{display:flex;gap:6px;align-items:baseline;font-size:13px;min-width:0}
.post .hd b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .hd span{color:var(--faint);white-space:nowrap;font-size:12px}
.post p{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.post .meta{font-size:12px;color:var(--faint);margin-top:4px}
.press{display:flex;flex-direction:column;gap:3px}
.press .src{font-size:12px;color:var(--faint)}
.press b{font-weight:600;font-size:15px;line-height:1.3}
.press p{font-size:13px;color:var(--muted)}
.stars{display:inline-flex;gap:2px;flex:none}
.stars svg{display:block}
.narr{display:flex;flex-direction:column;gap:8px}

/* setlist */
.song{display:flex;align-items:center;gap:10px;min-width:0}
.song .n{width:20px;text-align:right;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.song .st{min-width:0;flex:1}
.song .st b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .st span{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .ctl{display:flex;gap:4px;flex:none}
.mini{width:34px;height:34px;border-radius:999px;border:1px solid var(--control);background:none;display:grid;place-items:center;color:var(--muted);padding:0}
.mini svg{width:16px;height:16px}
.mini:disabled{opacity:.3}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}

/* show night */
.setrun{display:flex;flex-direction:column;gap:0}
.setrun .ln{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.setrun .ln.in{opacity:1;transform:none}
.setrun .ln:first-child{border-top:0}
.setrun .ln .n{color:var(--faint);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.setrun .ln .t{min-width:0}
.setrun .ln .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrun .ln .t span{font-size:12px;color:var(--muted);display:block}
.crowdbar{width:64px;height:6px;border-radius:99px;background:var(--raised);overflow:hidden}
.crowdbar i{display:block;height:100%;background:var(--spot);border-radius:99px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72)}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;background:#151515;border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain;animation:up .22s ease-out}
.sheet>*{flex-shrink:0}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:#444;margin:0 auto 2px;flex:none}
.sheet .card{background:#1d1d1d}
.sheet .choice{background:#262626}
.sheet .choice:hover:not(:disabled){background:#2e2e2e}
.sheet .well{background:#232323}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:#fff;color:#000;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;max-width:520px;text-align:center;animation:up .2s ease-out}

/* title & ending */
.title{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hero{padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;width:100%}
.wordmark{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1}
.wordmark span{color:var(--spot)}
.ticket{background:var(--surface);border-radius:var(--rc);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--ground);transform:translateY(-50%)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.headline{font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.12}
.epi{display:flex;gap:12px;align-items:flex-start}
.endings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ending{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--faint)}
.ending.got{background:var(--raised);color:#fff}
.ending b{display:block;font-weight:600;font-size:13px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--raised)}
.progress i.on{background:#e6e6e6}.progress i.now{background:var(--spot)}
@media (min-width:700px){.stage{height:280px}.stage.tall{height:380px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="sheet" hidden></div>
<script>
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const sum=a=>a.reduce((s,x)=>s+x,0);
const avg=a=>a.length?sum(a)/a.length:0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>Math.round(n).toLocaleString('en-US');
function fmt$(n){const neg=n<0,a=Math.abs(n);let s;
  if(a>=1e6)s='$'+(a/1e6).toFixed(a>=1e7?1:2)+'M';else if(a>=1e4)s='$'+Math.round(a/1e3)+'k';else if(a>=1e3)s='$'+(a/1e3).toFixed(1)+'k';else s='$'+Math.round(a);
  return (neg?'−':'')+s}
const sgn=(n,f=x=>Math.round(x))=>(n>0?'+':n<0?'−':'±')+f(Math.abs(n));
const NOW=Math.max(2026,new Date().getFullYear());
const hsh=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const poss=n=>n+(/s$/.test(n)?"'":"'s");
const plural=(n,w,p)=>n===1?w:(p||w+'s');

/* ================= the world ================= */
const GENRES={
  britpop:{n:'Britpop',home:'uk',peak:[1994,2001],r5:'Keys',sound:'Swaggering guitar anthems with a terrace-chant chorus'},
  alt:{n:'Alt-rock',home:'us',peak:[1991,1999],r5:'Rhythm guitar',sound:'Loud-quiet-loud alt-rock with a bruised heart'},
  poppunk:{n:'Pop-punk',home:'us',peak:[1999,2005],r5:'Rhythm guitar',sound:'Three-chord pop-punk about suburbs and bad decisions'},

    load:sum(ss.map(s=>s.diff)),encore:ids.length&&song(ids[ids.length-1])?song(ids[ids.length-1]).tier>=2:false}}
const VPLAN={full:{n:'All live',d:'Every note real',drain:1.1,boost:0},safety:{n:'Safety tracks',d:'Recorded harmonies under the chorus',drain:.72,boost:7,risk:.035},track:{n:'Lead track',d:'A guide vocal under the lead',drain:.4,boost:18,risk:.11}};

const PRE={rest:{n:'Rest',d:'Hotel, tea, silence'},soundcheck:{n:'Long soundcheck',d:'Run the hard ones'},press:{n:'Press day',d:'Radio, a podcast, a photo shoot'},care:{n:'One-on-one',d:'Time with one member'},write:{n:'Writing session',d:'Work on new songs'}};

function crowdWeight(s){if(s.kind==='new')return .32+S.rep.young/400+(S.album.single&&S.album.single.id===s.id&&S.album.hit?.35:0);if(s.kind==='solo')return .3;
  let w=[.46,.66,.86,1][s.tier];if(S.flags.viral===s.id)w=Math.max(w,.98);return w}
function playShow(){const d=nextDate(),L=lineup(),V0=S.voice,R={d,lines:[],moments:[],issues:[],posts:[]};
  const pl=S.plan,vp=VPLAN[pl.vocal],en=ENERGY[pl.energy],v=voc();
  // the day before
  if(pl.pre==='soundcheck'){S.tight=clamp(S.tight+3);L.forEach(m=>m.stam=clamp(m.stam-4))}
  if(pl.pre==='rest'){S.voice=clamp(S.voice+5,0,S.voiceBase);L.forEach(m=>m.stam=clamp(m.stam+6))}
  if(pl.pre==='press'){S.rep.buzz=clamp(S.rep.buzz+4);S.voice=clamp(S.voice-3)}
  if(pl.pre==='write'){S.album.prog=clamp(S.album.prog+12);L.forEach(m=>{if(!m.repl)m.mood=clamp(m.mood+2)})}
  if(pl.pre==='care'&&pl.care){const cm=M(pl.care);if(cm){cm.mood=clamp(cm.mood+ri(8,14));R.care=careLine(cm)}}
  const dem=demand(d);const sold=d.kind==='festival'?d.cap:Math.round(d.cap*Math.min(1,dem*rnd(.93,1.04)));R.sold=sold;
  const chem=100-avg(L.flatMap((a,i)=>L.slice(i+1).map(b=>G(a.id,b.id))));const stam=avg(L.map(m=>m.stam));const skill=avg(L.map(m=>m.skill-(m.arc==='health'&&/guitar|Guitar|Drums/.test(m.role)?8:0)));
  const st=setStats();const ids=S.set.slice();let tot=0,wsum=0,crack=false;const keysAdj=S.keysDown?12:0;
  ids.forEach((id,i)=>{const s=song(id);if(!s)return;const need=40+s.diff*15-keysAdj;const have=S.voice*(1+vp.boost/100)+vp.boost;
    const vq=clamp(have-need+78);const late=i/ids.length;
    let perf=.34*vq+.24*S.tight+.15*chem+.14*clamp(stam-late*12)+.13*skill+en.q+rnd(-7,7);
    if(s.kind==='new')perf+=(S.album.q-50)/8;
    perf=clamp(perf);const w=crowdWeight(s);let crowd=clamp(perf*.55+w*48+(d.kind==='festival'?S.rep.young/10:0)+rnd(-5,5));
    if(s.id===S.band.sig&&perf>60)crowd=clamp(crowd+8);
    if(vq<38&&s.diff>=2&&!crack){crack=true;R.moments.push({bad:1,t:`${poss(v.first)} voice cracked on the top note of "${s.t}". Twenty thousand phones caught it.`})}
    R.lines.push({s,perf:Math.round(perf),crowd:Math.round(crowd)});tot+=perf*(.6+w);wsum+=.6+w;
    S.voice=clamp(S.voice-s.diff*vp.drain*(S.keysDown?.75:1)*(pl.energy==='all'?1.2:1)*(v.repl?.75:1)*.42)});
  let q=tot/(wsum||1);const crowdAvg=avg(R.lines.map(l=>l.crowd));
  // the setlist itself
  if(!st.sig){q-=9;R.issues.push(`No "${sig().t}". People were still chanting for it in the car park.`)}
  if(st.hits<st.hitsN-1)q-=(st.hitsN-1-st.hits)*2.5;
  if(st.neu>=3){q-=(st.neu-2)*2.5;R.issues.push(`${st.neu} new songs in a row of hits: the bar queues were enormous.`)}
  if(!st.encore)q-=3;
  if(st.n<12){q-=(12-st.n)*1.5;R.issues.push(`A ${st.min}-minute set at these prices. People noticed.`)}
  if(S.flags.short&&st.min>95){const h=byArc('health');if(h&&h.status==='signed'){h.mood=clamp(h.mood-6);h.stam=clamp(h.stam-8)}}
  // replacements
  for(const r of L.filter(m=>m.repl)){if(r.accept<45&&chance(.4)){R.moments.push({bad:1,t:`A section of the crowd chanted "${M(r.replaces).first}" during ${poss(r.first)} first song.`});q-=2}r.accept=clamp(r.accept+(q>65?2.5:.8))}
  const outs=L.filter(m=>m.out>0);if(outs.length){q-=outs.length*4;R.issues.push(`${outs[0].first} watched from the wings while a fill-in played the parts.`)}
  q=clamp(q);
  const stars=clamp(Math.round(((q-30)/11.5)*2)/2,1,5);R.q=Math.round(q);R.stars=stars;R.crowd=Math.round(crowdAvg);
  // highlights
  const best=R.lines.slice().sort((a,b)=>b.crowd-a.crowd)[0];
  if(best&&best.crowd>78)R.moments.unshift({t:best.s.id===S.band.sig?`When "${best.s.t}" arrived, ${fmtN(sold)} people took the first verse off ${v.first}. ${v.first} just stood there and let them.`:`"${best.s.t}" was the loudest moment of the night. ${d.city} sang every word.`});
  if(S.flags.viral&&ids.includes(S.flags.viral)&&chance(.7))R.moments.push({t:`Teenagers at the barrier filmed "${song(S.flags.viral).t}" with their parents. Both generations knew the words.`});
  // backing tracks
  if(vp.risk){S.flags.susp=(S.flags.susp||0)+vp.risk*(pl.vocal==='track'?1.6:1);if(chance(S.flags.susp*.5)&&!S.flags.exposed){S.flags.exposed=pl.vocal;S.queue.push('exposed')}}

  const injP=L.map(m=>({m,p:(.012+(m.age-50)*.0012+(m.stam<35?.04:0)+(m.arc==='health'?.035:0))*en.inj*(S.flags.pace?.6:1)}));
  for(const x of injP){if(S.tour.i<S.tour.dates.length-1&&chance(x.p)&&!S.flags.injThisShow){S.flags.injThisShow=1;S.flags.injured=x.m.id;S.queue.push(x.m.arc==='health'&&/heart/.test(x.m.cond||'')?'heart':'injury')}}
  // tension on stage
  const pairs=L.flatMap((a,i)=>L.slice(i+1).map(b=>({a,b,g:G(a.id,b.id)}))).sort((x,y)=>y.g-x.g);
  if(pairs[0]&&pairs[0].g>68&&chance(.2+(pairs[0].g-68)/100+(S.flags.doc===1?.1:0))){S.flags.fight=[pairs[0].a.id,pairs[0].b.id];addG(pairs[0].a.id,pairs[0].b.id,4);S.queue.push('fight');R.moments.push({bad:1,t:`${pairs[0].a.first} and ${pairs[0].b.first} didn't look at each other once. During the encore ${pairs[0].a.first} walked off before the last chorus.`})}
  // money
  const mon=showMoney(d,sold);const set=settle(mon,d.city);R.mon=mon;R.set=set;
  // reputation and moods
  const dl=stars-3.2;S.rep.legacy=clamp(S.rep.legacy+dl*1.3);S.rep.buzz=clamp(S.rep.buzz+dl*2.5+(d.kind==='festival'?4:0));
  if(d.kind==='festival'){S.rep.young=clamp(S.rep.young+4)}
  S.narr.triumph=clamp(S.narr.triumph+(stars>=4?6:stars<=2.5?-5:0));S.narr.nostalgia=clamp(S.narr.nostalgia+2);
  L.forEach(m=>{let dm=(stars-3)*3;if(!m.repl&&ids.some(id=>song(id).w.includes(m.id)))dm+=1;if(m.arc==='solo'&&S.flags.soloSongs&&!ids.some(id=>song(id).kind==='solo'))dm-=5;
    if(S.vip==='meet')dm-=m.arc==='bitter'?4:m.arc==='health'?3:1.5;if(m.ownRoom===false)dm-=0;m.mood=clamp(m.mood+dm)});
  if(S.vip==='meet')L.forEach(m=>m.stam=clamp(m.stam-4));

const REVIEW={
  5:[`{band} in {city}: not a nostalgia act, a resurrection`,`Believe it: {band} are better than they were in {peak}`,`The best reunion show in years, and it isn't close`],
  4:[`Twenty years on, {band} still know how to own a room`,`Older, slower, louder: {band} deliver in {city}`,`{band} make the case for second chances`],
  3:[`{band} give {city} what it paid for, mostly`,`Comfortable, competent, occasionally thrilling`,`The songs are still great. The band is getting there`],
  2:[`{band}: the songs survive, the band barely does`,`A tribute act starring the original members`,`{city} sings along, politely, to a band running on fumes`],
  1:[`{band} in {city}: please, just play the records`,`A reunion nobody should have had to watch`,`Twenty years of waiting for this?`]};
function review(R){const st=Math.round(R.stars),d=R.d,v=voc(),sg=sig(),L=lineup(),src=st<=2&&chance(.4)?'splash':pick(PRESS_SERIOUS);
  const head=pick(REVIEW[clamp(st,1,5)]).replace('{band}',bandName()).replace('{city}',d.city).replace('{peak}',S.band.albums[1].y);
  const bits=[];
  if(S.voice<40)bits.push(`${poss(v.first)} voice was in tatters by the encore, and the high notes of "${sg.t}" were left to the crowd.`);
  else if(S.keysDown&&chance(.5))bits.push(`${v.first} has dropped the big songs a tone, and almost nobody minded.`);
  else if(R.q>70)bits.push(v.repl?`${v.first}, the new voice up front, sounded astonishing and made the old songs ${pron(v).p} own.`:`${v.first} sounded astonishing, nothing like a singer of ${v.age}.`);
  if(S.tight>70&&R.q>60)bits.push('The band is drilled to within an inch of its life.');else if(S.tight<45)bits.push('Ragged starts, two false endings and a lot of nervous looks at the drum riser.');
  const g=Math.max(...L.flatMap((a,i)=>L.slice(i+1).map(b=>G(a.id,b.id))));if(g>70)bits.push('The chemistry between the members was, generously, absent.');else if(g<35&&R.q>60)bits.push('They look like they actually like each other, which nobody predicted.');
  const st2=setStats();if(st2.neu>=2)bits.push(`The ${st2.neu} new songs are ${S.album.q>65?'better than they had any right to be':'nobody\'s favourite'}.`);
  const rp=L.find(m=>m.repl);if(rp)bits.push(rp.accept>60?`${rp.first} has made the ${rp.role.toLowerCase()} job ${pron(rp).p} own.`:`${rp.first} is a fine player, but the empty space where ${M(rp.replaces).first} should be is louder than any amp.`);
  if(S.pricing==='dynamic'&&R.stars<4)bits.push(`At those dynamic prices, "fine" was never going to be enough.`);
  if(R.issues[0]&&chance(.6))bits.push(R.issues[0]);
  return {src,head,body:shuffle(bits).slice(0,2).join(' ')||'A long, loud night of old songs.'}}
const FANS=['stagedoor_dave','kerosenekid84','gigsandgravy','rebecca.plays','vinylmum','thebackrow','setlistsally','lost_in_96','frontbarrierfi','dad_rock_dan','mixtape_marie','nightbusnick'];
function crowdPosts(R){const d=R.d,P=[],st=R.stars,v=voc(),sg=sig();
  const TX={good:[`Cried at "${sg.t}". Forty-six years old and I cried like a baby. Worth every penny.`,`Took my daughter. She knew more words than me. ${d.city}, you were LOUD.`,`I waited twenty years for tonight and they played like they'd never been away.`,`${v.first} looked out at us before the last chorus and just mouthed "thank you". Gone.`],
    mid:[`Good night. Not the night I dreamed of, but good.`,`The old ones still slap. The new ones, I went for a wee.`,`Paid ${S.pricing==='dynamic'?'$340':'$118'} to stand behind a pillar, but "${sg.t}" made up for it.`],
    bad:[`That was hard to watch. I'd rather remember them how they were.`,`${v.first} couldn't hit a note all night. Refund?`,`Sorry but that's a cash grab and everyone in the arena knew it.`]};
  const pool=st>=4?TX.good:st>=3?TX.mid:TX.bad;shuffle(pool).slice(0,2).forEach(t=>P.push({k:'fan',who:pick(FANS),txt:t,likes:ri(12,900),mood:st>=4?1:st>=3?0:-1}));

const ENDINGS={
  legacy:{n:'The Legacy',d:'The tour that rewrote the story'},
  farewell:{n:'The Farewell',d:'One last time, and they meant it'},
  second:{n:'The Second Act',d:'A new album, a new audience'},
  payday:{n:'The Payday',d:'Rich, finished, and nobody is proud of it'},
  implosion:{n:'The Implosion',d:'It fell apart on the road'},
  never:{n:'The Reunion That Never Was',d:'They never made it back on stage'},

function decideEnding(){const st=S.stats,a=avg(st.stars);
  if(S.flags.farewell)return 'farewell';
  if(S.album.st==='released'&&S.album.hit&&S.rep.young>=45)return 'second';
  if(a>=3.6&&S.rep.legacy>=62)return 'legacy';
  return 'payday'}
function finish(kind,why){S.phase='end';const st=S.stats;S.end={kind,why:why||'',a:avg(st.stars),shows:st.shows,gross:st.gross,net:st.net,comm:st.comm,legacy:Math.round(S.rep.legacy),young:Math.round(S.rep.young)};
  try{const E=JSON.parse(localStorage.getItem('comeback_endings')||'{}');E[kind]=(E[kind]||0)+1;localStorage.setItem('comeback_endings',JSON.stringify(E));
    const H=JSON.parse(localStorage.getItem('comeback_hof')||'[]');H.unshift({band:S.band.name,kind,a:+S.end.a.toFixed(1),net:Math.round(st.net),id:S.id});localStorage.setItem('comeback_hof',JSON.stringify(H.filter((h,i)=>H.findIndex(x=>x.id===h.id)===i).slice(0,12)))}catch(e){}
  save()}

const EV={};

EV.soloclash={ph:'reunion',once:1,w:()=>{const s=byArc('solo');return s&&s.status!=='no'&&S.week>=2?1:0},title:'The residency',scene:'empty',
  body:()=>{const s=byArc('solo');return `<div class="story"><p>${P(s,`{f}'s manager sends a PDF. {P} solo residency has been extended, and the new dates sit right across the second leg of the tour.`)}</p><p>"Obviously {f} wants to make this work," the email says. "Obviously."</p></div>`.replace(/\{f\}/g,s.first)},
  ch:()=>{const s=byArc('solo');return [{t:'Move the second leg',d:`${PROMOTER} charges a $300k rescheduling penalty`,fx:()=>{ledger('Rescheduling penalty, leg two',-300000);s.will=clamp(s.will+12);s.mood=clamp(s.mood+6);return `<p>Done. The promoter's voice goes very flat on the phone, which is how you know it cost them more than $300k.</p>`}},
    {t:`Ask ${s.first} to cut the residency short`,d:'A test of how much this matters to them',fx:()=>{if(chance(.45+s.will/250)){s.mood=clamp(s.mood-6);s.will=clamp(s.will+6);return `<p>A long pause, then: "Fine. For them. Not for you." The residency ends early.</p>`}s.will=clamp(s.will-16);s.mood=clamp(s.mood-10);return `<p>"You want me to cancel paying shows for a maybe?" ${s.first} hangs up.</p>`}},
    {t:'Let them fly in and out',d:'Rehearsals without them; the band will feel it',fx:()=>{S.flags.commute=1;S.tight=clamp(S.tight-8);moodAll(-4,s);return `<p>${s.first} will commute. Everyone else learns to rehearse around an empty microphone.</p>`}}]}};

EV.firstroom={ph:'any',once:1,w:()=>signedOrig().length>=3&&S.phase!=='tour'?3:0,title:'The first room',scene:'rehearsal',
  body:()=>{const L=signedOrig();return `<div class="story"><p>A rented rehearsal room in ${S.band.town}, the one with the broken radiator, because you thought it would be funny. ${L.map(m=>m.first).join(', ').replace(/, ([^,]*)$/,' and $1')} in the same room for the first time in ${yearsApart()} years.</p><p>Nobody knows where to stand. ${L[0].first} has brought biscuits. ${L[1].first} looks older than you remembered, and then you catch your own reflection in the window.</p></div>`},
  ch:()=>[{t:`Plug in and play "${sig().t}"`,d:'Find out right now if it still works',fx:()=>{const q=S.tight+S.voice/2+rnd(-15,25);S.tight=clamp(S.tight+10);if(q>70){moodAll(9);signedOrig().forEach(a=>signedOrig().forEach(b=>{if(a.id<b.id)addG(a.id,b.id,-6)}));return `<p>Four bars in, ${voc()?voc().first:'someone'} starts laughing and can't stop. By the chorus nobody is laughing. It sounds like them. It sounds like being twenty-four.</p>`+fxm([['Everyone\'s mood',1,9],['Tightness',1,10]])}moodAll(-3);return `<p>It's a mess: wrong key, wrong tempo, a cable that buzzes. But at the end someone says "again", and you play it again.</p>`+fxm([['Tightness',1,10]])}},
    {t:'Order food and just talk',d:'No instruments today',fx:()=>{signedOrig().forEach(a=>signedOrig().forEach(b=>{if(a.id<b.id)addG(a.id,b.id,-8)}));return `<p>Curry on the amps. Kids, divorces, knees. ${pick(signedOrig()).first} tells the story about the ferry and everyone tells it differently.</p>`+fxm([['Old grudges',1,'eased']])}},
    {t:'Get straight to business',d:'Splits, dates, rules',fx:()=>{moodAll(-3);S.tight=clamp(S.tight+4);return `<p>Efficient and joyless. You get a lot done. Nobody stays for a drink.</p>`}}]};

EV.spouse={ph:'reunion',once:1,w:()=>S.m.some(m=>m.status==='talking'&&!m.repl&&m.will>30)?1:0,title:'The family says no',scene:'empty',
  body:()=>{const m=S.flags.spouseM?M(S.flags.spouseM):(S.flags.spouseM=anyM(m=>m.status==='talking'&&!m.repl&&m.will>30).id,M(S.flags.spouseM));return `<div class="story"><p>${P(m,`{f}'s partner rings you at 11pm. They were there for the last tour, the one that ended it. They remember what {s} was like when {s} came home.`)}</p><p>"I'm not asking you to leave {f} alone. I'm asking you what's different this time."</p></div>`.replace(/\{f\}'s/g,poss(m.first)).replace(/\{f\}/g,m.first)},
  ch:()=>{const m=M(S.flags.spouseM);return [{t:'Drive over and talk to them both',d:'It costs you a day',fx:()=>{S.ap=Math.max(0,S.ap-1);m.will=clamp(m.will+12);m.mood=clamp(m.mood+6);return `<p>You sit at their kitchen table until 2am. You make promises you intend to keep. At the door they say, "Bring {o} home in one piece."</p>`.replace('{o}',pron(m).o)}},
    {t:'Promise the family can join the tour',d:'Flights and hotels, $40k',fx:()=>{ledger(`Family travel for ${m.name}`,-40000);m.will=clamp(m.will+10);return `<p>The kids are coming to Europe. That helps more than any speech.</p>`}},
    {t:'Respect it and back off',d:'Their willingness drops',fx:()=>{m.will=clamp(m.will-10);return `<p>"Thank you," they say, and mean it. ${m.first} doesn't call for a week.</p>`}}]}};

EV.oldlabel={ph:'any',once:1,w:()=>S.phase!=='tour'&&S.week>=2?.8:0,title:`${OLDLABEL} want in`,scene:'empty',
  body:()=>`<div class="story"><p>${OLDLABEL} still own the masters. They want to put out a 25th-anniversary box set of <i>${S.band.albums[1].t}</i> to land with the tour: demos, a remaster, a live disc from ${S.band.albums[1].y}.</p><p>They offer a ${fmt$(400000)} advance, and they want the band to do promo for it.</p></div>`,
  ch:()=>[{t:'Take the box set',d:'+$400k now, more promo work later',fx:()=>{ledger(`${OLDLABEL} box set advance`,400000);rep('buzz',6);rep('old',4);S.flags.boxset=1;return `<p>The box set will be out in time for the first show. The demos include a version of "${sig().t}" with completely different words.</p>`+fxm([['Pot',1,'$400k'],['Buzz',1,6]])}},
    {t:'Ask for a better royalty rate instead',d:'Less now, more for decades',fx:()=>{if(chance(.5)){S.flags.betterRoy=1;return `<p>They agree to a higher rate on the catalog. Not glamorous. Worth more than the advance over ten years.</p>`}return `<p>They laugh politely and put out the box set anyway, without you.</p>`}},
    {t:'Say no',d:"They can't release it without you",fx:()=>{rep('cred',3);return `<p>"Your loss," they say. It probably isn't.</p>`}}]};

EV.doctor={ph:'any',once:1,w:()=>{const h=byArc('health');return h&&['talking','signed'].includes(h.status)&&S.phase!=='tour'?1.3:0},title:"The doctor's letter",scene:'empty',
  body:()=>{const h=byArc('health');return `<div class="story"><p>${P(h,`{f} forwards you a letter from {p} specialist. It's polite, technical, and the last paragraph is underlined:`)}</p><p class="quote">"I would strongly advise against a programme of more than two consecutive performances, sustained physical exertion, or long-haul travel without medical support."</p><p>The tour insurers want a medical before they'll cover ${h.first}.</p></div>`},
  ch:()=>{const h=byArc('health');return [{t:'Pay for a full medical',d:'$30k, and you find out exactly where you stand',fx:()=>{ledger('Tour insurance medical',-30000);S.flags.medical=1;if(!S.flags.pace){h.wants.forEach(w=>{if(w.k==='pace')w.seen=true});}h.mood=clamp(h.mood+5);return `<p>${h.first} passes, just. The insurer adds an exclusion for anything related to ${h.cond}. If something goes wrong, the band pays.</p>`}},
    {t:'Build the tour around it',d:'Agree to the gentler schedule now ($120k)',fx:()=>{const w=h.wants.find(x=>x.k==='pace');if(w&&!w.ok){acceptWant(h.id,'pace')}else ledger('Tour doctor',-120000);return `<p>Two shows, then a day off. Always. A doctor on the crew. ${h.first} reads the itinerary twice and then hugs you.</p>`}},
    {t:'File it and move on',d:'Everyone is a grown-up',fx:()=>{S.flags.ignoredDoc=1;return `<p>You put the letter in a drawer. You think about it most nights.</p>`}}]}};

EV.deadline={title:`${PROMOTER} want an answer`,scene:'empty',
  body:()=>`<div class="story"><p>"I love these guys," says the promoter. "I love you. But I have a board, and the board has a spreadsheet, and the spreadsheet says Friday week."</p><p>${readiness().filter(r=>!r.ok).map(r=>esc(r.t)).join(', ')||'Everything'} still needs sorting.</p></div>`,
  ch:()=>[{t:'Tell them you are close',d:'Keep the deadline',fx:()=>`<p>"Close is not a contract," they say, and hang up.</p>`},
    {t:'Ask for two more weeks',d:'The nightly guarantee drops 8%',fx:()=>{S.weeks+=2;S.deal.g=Math.round(S.deal.g*.92/1000)*1000;return `<p>Two more weeks, at ${fmt$(S.deal.g)} a night. "Last time," they say.</p>`}}]};

EV.fanletter={ph:'any',once:1,w:()=>S.phase!=='tour'?.7:0,title:'A letter',scene:'empty',
  body:()=>{const s=pick(S.songs.filter(x=>x.kind==='old'&&x.tier<=1));return `<div class="story"><p>It comes to your old office address, handwritten, four pages.</p><p class="quote">"My brother played '${s.t}' every day of the year he was ill. It was the last song he asked for. I'm not writing to ask for anything. I just wanted someone in the band to know it mattered."</p><p>Signed: Claire, ${pick(CITIES[S.band.home])}.</p></div>`},
  ch:()=>[{t:'Read it to the band',d:'Out loud, in the rehearsal room',fx:()=>{moodAll(5);S.m.filter(m=>m.status==='talking').forEach(m=>m.will=clamp(m.will+6));return `<p>Nobody speaks for a while. Then someone suggests putting the song back in the set.</p>`+fxm([['Everyone\'s mood',1,5]])}},
    {t:'Keep it for yourself',d:'Some things are private',fx:()=>`<p>It goes in your jacket pocket. You read it again on bad days.</p>`}]};

EV.interview={ph:'reunion',once:1,w:()=>{const s=byArc('solo');return s&&s.status!=='no'&&S.week>=3?.9:0},title:'Off script',scene:'empty',
  body:()=>{const s=byArc('solo');return `<div class="story"><p>${P(s,`On a breakfast TV sofa, promoting {p} new single, {f} is asked about the reunion rumours. {S} winks at the camera. "Never say never. Watch this space."`)}</p><p>Every other member is watching the same clip on a loop.</p></div>`},
  ch:()=>{const s=byArc('solo'),b=M(S.band.bitter);return [{t:'Back them up publicly',d:'Ride the wave',fx:()=>{rep('buzz',8);if(b!==s){addG(b.id,s.id,8);b.will=clamp(b.will-5)}return `<p>The clip does two million views. ${b.first} sends you a link to it with no message.</p>`}},
    {t:'Have a quiet word',d:'Nobody speaks for the band alone',fx:()=>{s.mood=clamp(s.mood-6);moodAll(2,s);return `<p>${s.first} apologises, sort of. The others appreciate that you said something.</p>`}}]}};

/* --- rehearsals --- */
EV.announce={title:'On sale',scene:'stage',
  body:()=>{const d=demand(),pr=PRICING[S.pricing];return `<div class="story"><p>The announcement goes out at 9am: a black-and-white photo of the five of them${lineup().some(m=>m.repl)?' (well, five of them)':''} in the ${S.band.town} rehearsal room, and the dates.</p><p>Presale opens on Friday. Pricing: <b>${pr.n}</b> (${pr.d}). VIP: <b>${VIPS[S.vip].n}</b>.</p><p>${d>1?'The queue for the presale reaches 400,000 people. The ticketing site falls over twice.':d>.85?'The presale is busy. Most of the first leg sells in a morning.':'The presale is quieter than anyone hoped. A few dates sell out; plenty do not.'}</p></div>`},
  ch:()=>[{t:'Watch the numbers come in',d:'',fx:()=>{const d=demand();rep('buzz',10);S.rep.old=clamp(S.rep.old+5);
    news('loud',`${bandName()} confirm reunion tour`,`Fifteen arena dates and a homecoming show in ${S.band.town}. "It felt like unfinished business," says a statement.`);
    fan('lost_in_96',`I have my ticket. I am 44 years old and I am shaking.`,ri(800,4000),1);
    if(S.pricing==='dynamic')S.queue.push('dynamic');if(lineup().some(m=>m.repl))S.queue.push('replfans');
    return `<p>${d>1?'Sold out in nine minutes. The resale sites list seats at four times face value.':d>.85?'Strong. The first leg is nearly gone.':'Respectable. The promoter says "it’ll pick up", which is what promoters say.'}</p>`}}]};

EV.dynamic={title:'The algorithm',scene:'empty',
  body:()=>`<div class="story"><p>Within an hour of presale opening, a screenshot is everywhere: a standing ticket for the ${S.band.town} show at <b>$612</b>, "in-demand pricing".</p><p class="quote">"Twenty years I waited. Turns out I was waiting for them to need a new kitchen." — 31,000 likes</p><p>${OUT.loud} is calling it "the most cynical reunion of the decade".</p></div>`,
  ch:()=>[{t:'Cap the prices',d:'Switch to market pricing and apologise',fx:()=>{S.pricing='market';rep('cred',3);S.narr.greed=clamp(S.narr.greed+8);news('dispatch',`${S.band.name} cap ticket prices after outcry`,'The band said they "did not know" how high prices would go.');return `<p>The statement goes out. Most fans accept it. Some screenshots are forever.</p>`}},
    {t:'Defend it',d:'"Market value, and it beats the touts"',fx:()=>{S.flags.backlash=1;S.narr.greed=clamp(S.narr.greed+30);rep('cred',-10);rep('legacy',-4);moodAll(-4);news('loud',`${S.band.name}: "it's what the market will pay"`,'Fans are not impressed.');return `<p>You make more money. The phrase "cash grab" attaches itself to the band and doesn't let go.</p>`+fxm([['Credibility',-1,10],['Legacy',-1,4]])}},
    {t:'Keep dynamic, give a share to charity',d:'10% of the premium to a music therapy charity',fx:()=>{S.flags.charity=1;S.narr.greed=clamp(S.narr.greed+12);rep('cred',-3);return `<p>It softens the headlines. It doesn't soften the forums.</p>`}}]};

EV.replfans={title:'Not without them',scene:'stage',
  body:()=>{const r=lineup().find(m=>m.repl),o=M(r.replaces);return `<div class="story"><p>#No${o.first.replace(/\W/g,'')}No${S.band.name.replace(/^The /,'').replace(/\W/g,'')} is trending in two countries.</p><p>${P(r,`Most of it is about {f} — about {p} age, {p} hair, the photo where {s} is standing where ${o.first} always stood.`)}</p></div>`},
  ch:()=>{const r=lineup().find(m=>m.repl),o=M(r.replaces);return [{t:`Film ${r.first} playing the hardest part`,d:'Let the playing do the talking',fx:()=>{r.accept=clamp(r.accept+(r.skill-65)/2);return `<p>The clip of ${r.first} nailing the solo from "${pick(S.songs.filter(s=>s.kind==='old'&&s.tier>=2)).t}" does a lot of quiet work.</p>`+fxm([['Fan acceptance',1,Math.round((r.skill-65)/2)]])}},
    {t:`Ask ${o.first} to give their blessing`,d:'A long shot',fx:()=>{if(chance(.35+(o.mood/200))){r.accept=clamp(r.accept+25);rep('old',6);return `<p>${o.first} posts one line: "Go easy on ${r.first}. ${pron(r).S}'s doing what I couldn't." It changes everything.</p>`}r.accept=clamp(r.accept-5);return `<p>${o.first} doesn't reply. Someone screenshots the "seen" receipt.</p>`}},
    {t:'Say nothing',d:'It will blow over, maybe',fx:()=>`<p>It mostly blows over. Mostly.</p>`}]}};

EV.keys={title:'The key question',scene:'rehearsal',
  body:()=>{const v=voc();return `<div class="story"><p>The vocal coach runs ${v.first} through "${sig().t}" in the original key. The top note arrives on time and leaves early.</p><p>${P(v,`"It's there," {f} says. "It's there on a good day." The coach looks at you. A tone lower and {s} could sing it every night until {s} is seventy.`)}</p><p>Voice today: <b>${Math.round(S.voice)} / 100</b>.</p></div>`},
  ch:()=>{const v=voc();return [{t:'Drop the big songs a tone',d:'Easier on the voice; purists will notice',fx:()=>{S.keysDown=true;rep('cred',-2);return `<p>The band relearn everything a tone down. The guitarist complains it "sounds like a covers band". Nobody else hears the difference.</p>`}},
    {t:'Keep the original keys',d:'The songs as they were. The voice pays for it',fx:()=>{v.mood=clamp(v.mood+6);rep('cred',2);return `<p>${v.first} is quietly relieved. ${P(v,'Pride matters to {o}.')} The coach adds two extra warm-up sessions a day.</p>`}},
    {t:'Hire the coach for the whole tour',d:'$60k; the voice recovers faster between shows',fx:()=>{ledger('Vocal coach on tour',-60000);S.voiceBase=Math.min(96,S.voiceBase+6);S.voice=Math.min(S.voiceBase,S.voice+6);return `<p>Steam inhalers, honey, no talking after midnight. ${v.first} hates it and sounds better than in years.</p>`}}]}};

EV.backing={title:"The musical director's question",scene:'rehearsal',
  body:()=>`<div class="story"><p>Mara Feld, the musical director, has toured with half the reunions of the last decade. She closes the door before she asks.</p><p class="quote">"Everyone does it. Some harmonies on a track, so the chorus is huge every night. Some do the lead too, on the bad nights. I need to know what you want in the system before we build it."</p></div>`,
  ch:()=>[{t:'Everything live, always',d:'Honest. Bad nights will sound like bad nights',fx:()=>{S.tracks='none';rep('cred',4);moodAll(2);return `<p>"Respect," says Mara, and means it. She also books an extra monitor engineer.</p>`}},
    {t:'Harmonies on a safety track',d:'Bigger choruses; small risk if anyone finds out',fx:()=>{S.tracks='harm';return `<p>It goes into the system as "BV stems". The audience will never know. Probably.</p>`}},
    {t:'Build in a lead vocal track too',d:'For emergencies only. Everyone says that',fx:()=>{S.tracks='lead';const v=voc();if(v&&!v.repl)v.mood=clamp(v.mood-6);return `<p>${voc().first} goes white when you explain it. "For emergencies," you say. Everyone says that.</p>`}}]};

EV.newsong={once:1,ph:'prep',w:()=>S.album.st==='none'?1.6:0,title:'Something new',scene:'rehearsal',
  body:()=>{const w=M(S.band.writer)&&M(S.band.writer).status==='signed'?M(S.band.writer):pick(signedOrig());S.flags.nsW=w.id;return `<div class="story"><p>${P(w,`On a lunch break {f} plays the band something on an acoustic guitar. It's called "${NEWSONGS[0]}". It is about being fifty-something, and it is good.`)}</p><p>Nobody asked for new material. The fans certainly didn't. But ${w.first} is looking at you.</p></div>`},
  ch:()=>[{t:'Make a whole new album',d:'Writing sessions through the tour, and a label conversation',fx:()=>{S.album.st='writing';S.album.prog=15;moodAll(4);return `<p>A new album. Even saying it out loud feels dangerous. The writing starts in hotel rooms and soundchecks.</p>`}},
    {t:'One new song in the set',d:'Test it on the crowd',fx:()=>{addNew(1,55);return `<p>"${NEWSONGS[0]}" goes into the setlist, somewhere in the middle, where it can't do too much damage.</p>`}},
    {t:'Not now',d:'The fans want the hits',fx:()=>{const w=M(S.flags.nsW);w.mood=clamp(w.mood-8);return `<p>${w.first} puts the guitar back in its case and doesn't bring it up again.</p>`}}]};
function addNew(n,q){for(let i=0;i<n;i++){const used=new Set(S.songs.map(s=>s.t));const t=NEWSONGS.find(x=>!used.has(x))||('New song '+(S.songs.length));S.songs.push({id:'n'+S.songs.length,t,al:-1,y:NOW,tier:0,w:[S.band.writer],diff:2,en:ri(1,3),peak:0,kind:'new',q});S.album.q=Math.max(S.album.q,q)}}

EV.biopic={once:1,ph:'prep',w:()=>.9,title:`${STUDIO} call`,scene:'empty',
  body:()=>`<div class="story"><p>${STUDIO} want to make the film. A director you've actually heard of, a script "in development", and the working title <i>${sig().t}</i>.</p><p>They offer <b>${fmt$(3500000)}</b> for the life rights of all five original members. Script approval is "something we can discuss".</p></div>`,
  ch:()=>[{t:'Sign it',d:'$3.5M, split between the members. No script approval',fx:()=>{S.flags.biopic='sold';ledger(`${STUDIO}: life rights`,3500000);const b=M(S.band.bitter);b.mood=clamp(b.mood-8);rep('buzz',8);return `<p>Done. ${b.first} asks, very quietly, who is going to play ${pron(b).o}, and whether they'll be the villain.</p>`}},
    {t:'Hold out for script approval',d:'$1.8M, but the band sees every draft',fx:()=>{S.flags.biopic='approval';ledger(`${STUDIO}: life rights with approval`,1800000);moodAll(3);rep('buzz',5);return `<p>Less money, fewer sleepless nights. ${STUDIO} grumble and agree.</p>`}},
    {t:'No film',d:'Some stories should stay theirs',fx:()=>{rep('cred',3);return `<p>"Your call," says the producer, who has already rung another band.</p>`}}]};

EV.doc={once:1,ph:'prep',w:()=>.9,title:'Cameras on the road',scene:'empty',
  body:()=>`<div class="story"><p>${DOCCO} have made two music documentaries everyone has seen. They want full access to the tour: dressing rooms, the bus, the rehearsals. A streaming service is already interested.</p><p>${fmt$(1200000)} up front, and a share of the back end.</p></div>`,
  ch:()=>[{t:'Full access',d:'$1.2M and a lot of buzz. Cameras make tempers worse',fx:()=>{S.flags.doc=1;ledger(`${DOCCO}: documentary access`,1200000);rep('buzz',10);S.narr.drama+=10;return `<p>A small crew moves in. Within a week, everyone has forgotten they're there, which is exactly what they want.</p>`}},
    {t:'Shows only, nothing backstage',d:'$350k. Safe',fx:()=>{S.flags.doc='lite';ledger(`${DOCCO}: concert film rights`,350000);rep('buzz',4);return `<p>A concert film. Nobody gets to film the fights.</p>`}},
    {t:'Decline',d:'',fx:()=>`<p>The crew goes off to film somebody else's reunion.</p>`}]};

EV.catalog={once:1,ph:'any',w:()=>S.phase!=='reunion'?1:0,title:'Buy the songs',scene:'empty',
  body:()=>{const roy=annualRoyalty(),mult=S.rep.young>40?17:13,off=Math.round(roy*mult/1e5)*1e5;S.flags.catOffer=off;const w=M(S.band.writer);
    return `<div class="story"><p>${FUND} buy song catalogs the way other funds buy apartment blocks. They want the band's share of the masters and the publishing on all four albums.</p><p>The catalog earns about <b>${fmt$(roy)}</b> a year. They offer <b>${fmt$(off)}</b>, ${mult} times that, today.</p>
    <p>${S.pub.status==='equal'?'Since the publishing is now split five ways, the money is too.':`Most of the publishing money would go to ${w.first}, who wrote the hits.`}</p></div><div class="well small">${stances()}</div>`},
  ch:()=>{const off=S.flags.catOffer;return [{t:'Sell the catalog',d:`${fmt$(off)} to the members, now and forever`,fx:()=>{S.flags.sold=off;S.m.filter(m=>!m.repl).forEach(m=>{m.mood=clamp(m.mood+(m.arc==='broke'?22:m.arc==='bitter'?-14:m.arc==='solo'?6:4))});rep('cred',-4);S.queue.push('adsync');news('biz',`${FUND} buys ${S.band.name} catalog in ${fmt$(off)} deal`,'Another heritage act cashes out.');return `<p>The money lands in four bank accounts and one trust fund. The songs belong to a spreadsheet now.</p>`}},
    {t:'Wait until after the tour',d:'A good tour could push the price up. Or the offer could go away',fx:()=>{S.flags.catWait=1;return `<p>"We'll be in touch," says the fund. They will.</p>`}},
    {t:'Never sell',d:'The songs stay theirs',fx:()=>{rep('cred',4);const b=byArc('broke');if(b)b.mood=clamp(b.mood-10);return `<p>${b?b.first+' takes it hard. ':''}The others are proud, in the quiet way that doesn't pay any bills.</p>`}}]}};
function stances(){return S.m.filter(m=>!m.repl&&m.status!=='no').map(m=>`<div class="kv"><span>${esc(m.first)}</span><b>${{broke:'Sell. Today.',bitter:'Over my dead body',solo:'Depends on the number',sober:'Whatever keeps the peace',health:'Sell. Think of the kids'}[m.arc]}</b></div>`).join('')}

EV.festival={once:1,ph:'prep',w:()=>S.week>=2?1.6:0,title:'The festival call',scene:'stage',
  body:()=>{const f=pick(FEST),fee=Math.round((1.6+S.rep.buzz/60)*10)/10*1e6;S.flags.fest={n:f.n,d:f.d,fee};return `<div class="story"><p><b>${f.n}</b> want ${bandName()} for ${f.d}, between the two legs. ${fmt$(fee)}, and 70,000 people who are mostly under thirty.</p><p>Festival crowds don't come for you. They come for the weekend. If it goes well, it goes very well.</p></div>`},
  ch:()=>[{t:'Take it',d:'Big money, a young crowd, one more date for tired bodies',fx:()=>{const f=S.flags.fest;S.tour.dates.splice(S.tour.dates.findIndex(d=>d.leg===2),0,{city:f.n,kind:'festival',cap:70000,fee:f.fee,leg:1.5,gap:3,fest:1});rep('buzz',5);return `<p>${f.n}, ${f.d}. The festival announces it with your name in letters two sizes smaller than you'd like.</p>`}},
    {t:'Turn it down',d:'Protect the arena shows and the bodies',fx:()=>`<p>"Next year?" says the booker. Everyone knows there might not be a next year.</p>`}]};

EV.row={ph:'prep',w:()=>{const L=lineup();return L.some((a,i)=>L.slice(i+1).some(b=>G(a.id,b.id)>60))?1.2:0},title:'The arrangement',scene:'rehearsal',
  body:()=>{const L=lineup();const pr=L.flatMap((a,i)=>L.slice(i+1).map(b=>[a,b])).sort((x,y)=>G(y[0].id,y[1].id)-G(x[0].id,x[1].id))[0];S.flags.rowP=[pr[0].id,pr[1].id];const s=pick(S.songs.filter(x=>x.kind==='old'&&x.tier>=1));
    return `<div class="story"><p>It starts with the tempo of "${s.t}". ${pr[0].first} wants it like the record. ${pr[1].first} wants it slower, "like adults". Ten minutes later it isn't about the tempo.</p><p>"You always did this," says ${pr[0].first}. "You always made it about you."</p></div>`},
  ch:()=>{const [a,b]=S.flags.rowP.map(M);return [{t:`Side with ${a.first}`,d:'Like the record',fx:()=>{a.mood=clamp(a.mood+5);b.mood=clamp(b.mood-9);addG(a.id,b.id,5);return `<p>${b.first} plays it ${poss(a.first)} way, perfectly, with a face like thunder.</p>`}},
    {t:`Side with ${b.first}`,d:'The grown-up version',fx:()=>{b.mood=clamp(b.mood+5);a.mood=clamp(a.mood-9);addG(a.id,b.id,5);return `<p>${a.first} goes outside to smoke, though ${pron(a).s} gave up in 2011.</p>`}},
    {t:'Call it for the day',d:'Everyone goes home',fx:()=>{S.tight=clamp(S.tight-3);addG(a.id,b.id,-4);return `<p>The next morning they play it somewhere in between, and it's better than either version.</p>`}}]}};

EV.beer={once:1,ph:'any',w:()=>{const s=byArc('sober');return s&&s.status==='signed'&&!S.flags.dry&&S.phase!=='reunion'?1.3:0},title:'The fridge',scene:'rehearsal',
  body:()=>{const s=byArc('sober');return `<div class="story"><p>${P(s,`Someone has stocked the rehearsal-room fridge with beer, because that's what rehearsal rooms have. {f} opens it for a water and stands there for a long moment.`)}</p><p>Then {f} closes it, very carefully, and goes back to {p} amp.</p></div>`.replace(/\{f\}/g,s.first).replace(/\{p\}/g,pron(s).p)},
  ch:()=>{const s=byArc('sober');return [{t:'Make the whole operation dry',d:'Effective today',fx:()=>{S.flags.dry=true;moodAll(-2,s);s.mood=clamp(s.mood+8);return `<p>The fridge is emptied by lunchtime. ${s.first} doesn't say thank you, but sits with the others at lunch for the first time.</p>`}},
    {t:`Talk to ${s.first} about it`,d:'Ask what they need',fx:()=>{s.mood=clamp(s.mood+5);S.flags.soberTalk=1;return `<p>"I need you to notice," ${s.first} says. "That's all. Just keep noticing."</p>`}},
    {t:'Leave it',d:'Adults, all of them',fx:()=>{S.flags.soberRisk=(S.flags.soberRisk||0)+.02;return `<p>The beer stays. So does the moment.</p>`}}]}};

/* --- the road --- */
EV.viral={once:1,ph:'tour',w:()=>S.tour.i>=2?(.6+S.rep.buzz/120):0,title:'Somebody\'s daughter filmed it',scene:'stage',
  body:()=>{const s=pick(S.songs.filter(x=>x.kind==='old'&&x.tier<=1));S.flags.viralC=s.id;return `<div class="story"><p>A 17-year-old in ${pick(CITIES[S.band.home])} filmed her dad singing every word of "${s.t}" in the car. Somebody slowed it down and put it over a clip of a sunset. It now has <b>${ri(18,46)} million</b> views on Loopr.</p><p>Kids who weren't born when the band split are calling it "the saddest song ever written". Its streams are up 4,000%.</p></div>`},
  ch:()=>{const s=song(S.flags.viralC);return [{t:'Lean in',d:`Put "${s.t}" in the set every night and invite young fans on stage`,fx:()=>{S.flags.viral=s.id;if(!S.set.includes(s.id))S.set.splice(Math.max(1,S.set.length-3),0,s.id);rep('young',30);rep('buzz',14);S.narr.discover+=30;S.band.listeners=Math.round(S.band.listeners*2.4);return `<p>You film a thank-you video in the dressing room. ${voc().first} says "we see you, kids" and immediately regrets it. The kids love it.</p>`+fxm([['Young fans',1,30],['Buzz',1,14]])}},
    {t:'Release the live version tonight',d:'Strike while it\'s hot',fx:()=>{S.flags.viral=s.id;rep('young',22);rep('buzz',10);rep('cred',-2);S.band.listeners=Math.round(S.band.listeners*2);ledger('Live single streaming advance',120000);S.narr.discover+=20;return `<p>A live recording from last night is on every platform by midnight. It goes top ten in three countries.</p>`}},
    {t:'Say thank you, change nothing',d:'Dignity',fx:()=>{rep('young',12);S.flags.viral=s.id;S.narr.discover+=10;return `<p>A short, kind post. The trend runs its course. Some of the kids buy tickets anyway.</p>`}}]}};

EV.voice={title:'The top notes are gone',scene:'stage',
  body:()=>{const v=voc();return `<div class="story"><p>${P(v,`After the show {f} can barely speak. The tour doctor looks at {p} throat with a torch and says the word "haemorrhage" in a tone of voice designed to frighten singers.`)}</p><p>Voice: <b>${Math.round(S.voice)} / 100</b>. Next show: ${esc(nextDate()?nextDate().city:'—')}.</p></div>`},
  ch:()=>{const v=voc(),nx=nextDate();const o=[{t:'Cancel the next show',d:'Refunds, insurance and a bad headline. The voice gets three days',fx:()=>{cancelNext('vocal rest');S.voice=clamp(S.voice+30,0,S.voiceBase);S.narr.fragile+=10;return `<p>${nx.city} is postponed "on medical advice". The forum is understanding for about an hour.</p>`}},
    {t:'A steroid shot',d:'The voice comes back for a while. Doctors hate it',fx:()=>{S.voice=clamp(S.voice+24,0,S.voiceBase);S.voiceBase=Math.max(55,S.voiceBase-4);S.flags.steroid=(S.flags.steroid||0)+1;return `<p>The shot works. It always works, until it doesn't.</p>`}},
    {t:'Push through',d:'Warm up harder and hope',fx:()=>{v.mood=clamp(v.mood-6);return `<p>${v.first} gargles salt water and stares at the wall.</p>`}}];
    if(S.tracks==='lead')o.splice(1,0,{t:'Lean on the lead track tonight',d:'Nobody will know. Almost certainly',fx:()=>{S.plan.vocal='track';return `<p>Tonight's plan is set to the lead track. ${v.first} won't look you in the eye.</p>`}});return o}};
function cancelNext(why){const d=nextDate();if(!d)return;d.cancelled=why;S.stats.cancel++;S.tour.i++;const ins=S.flags.medical?.5:.15;const cost=(d.kind==='festival'?d.fee*.2:S.deal.g*(1-ins)*.6);ledger(`${d.city} cancelled (${why})`,-cost);lineup().forEach(m=>{m.stam=clamp(m.stam+25)});rep('buzz',-3);logH(`${d.city} cancelled: ${why}.`)}

EV.injury={title:'Someone goes down',scene:'stage',
  body:()=>{const m=M(S.flags.injured);const what=/Drums/.test(m.role)?'{f}\'s back locks halfway through the encore. {S} finishes the song, then can\'t stand up from the stool.':/guitar|Guitar|Bass/.test(m.role)?'{f} falls off the front of the stage during the last song, landing on {p} wrist with a noise the front row will never forget.':m.role==='Keys'?'{f} collapses in the wings, dizzy and grey. It\'s dehydration, probably. The paramedics take {o} anyway.':'{f} tears a calf muscle running down the catwalk. {S} sings the last two songs sitting on the monitor.';
    return `<div class="story"><p>${P(m,what)}</p><p>The doctor says two shows off, at least. ${m.first} says ${pron(m).s} is fine. ${pron(m).S} is not fine.</p></div>`},
  ch:()=>{const m=M(S.flags.injured);return [{t:'Bring in a fill-in for two shows',d:'A session player learns the set in a day',fx:()=>{m.inj=2;m.out=2;S.tight=clamp(S.tight-6);m.mood=clamp(m.mood-6);rep('old',-2);return `<p>The fill-in is excellent and nobody wants ${pron(m).o}. ${m.first} watches from the side of the stage with ice on everything.</p>`}},
    {t:'Play through it',d:'Painkillers and pride',fx:()=>{m.stam=clamp(m.stam-15);m.mood=clamp(m.mood+3);S.flags.hurt=m.id;if(chance(.3)){m.stam=clamp(m.stam-15);return `<p>${m.first} plays. It gets worse. The doctor stops speaking to you.</p>`}return `<p>${m.first} plays, grimacing through every song. The crowd adores ${pron(m).o} for it.</p>`}},
    {t:'Cancel the next show',d:'Rest properly',fx:()=>{cancelNext('injury');m.stam=clamp(m.stam+30);S.narr.fragile+=8;return `<p>One show lost. ${m.first} sleeps for fourteen hours.</p>`}}]}};

EV.heart={title:'The ambulance',scene:'empty',
  body:()=>{const m=M(S.flags.injured);return `<div class="story"><p>${P(m,`{f} is quiet after the show, and then {f} is on the dressing-room floor, and then there is an ambulance in the loading bay with its lights going and nobody can find the right words.`)}</p><p>${S.flags.pace?'The tour doctor is there in seconds. That matters.':'There is no tour doctor. The venue first-aider does what they can.'}</p><p>By morning ${m.first} is stable, sitting up, and asking about the setlist. The cardiologist is asking other questions.</p></div>`},
  ch:()=>{const m=M(S.flags.injured);return [{t:'Pause the tour for two weeks',d:'Cancel the next three shows',fx:()=>{for(let i=0;i<3;i++)cancelNext('medical');m.stam=80;m.mood=clamp(m.mood+10);S.narr.fragile+=20;moodAll(4);rep('legacy',2);return `<p>Three shows postponed. ${m.first} goes home. The band sends flowers with five names on the card.</p>`}},
    {t:'Make this the farewell tour',d:'Finish the dates, then stop. For good',fx:()=>{S.flags.farewell=1;cancelNext('medical');m.stam=70;S.narr.fragile+=15;rep('buzz',12);news('loud',`${S.band.name} announce this will be their final tour`,`"We want to finish this properly, together," the band said.`);return `<p>One show cancelled, and a decision made. Every remaining date sells out within an hour of the announcement.</p>`}},
    {t:`Replace ${m.first} for the rest of the tour`,d:'Keep going. It feels wrong',fx:()=>{m.gone=true;m.status='signed';const r=hire(m.id,'session');S.ap=0;moodAll(-10);rep('old',-6);return `<p>${r.name} joins tomorrow. ${m.first} watches the next show on a phone in a hospital bed, and turns it off after three songs.</p>`}}]}};

EV.fight={title:'After the show',scene:'stage',
  body:()=>{const [a,b]=S.flags.fight.map(M);return `<div class="story"><p>You hear it from the corridor: ${a.first} and ${b.first}, in the dressing room, and it is about ${S.band.split} again. Then a crash.</p><p>When you get in, ${b.first} is holding a towel to ${pron(b).p} lip and ${a.first} is staring at ${pron(a).p} own hand like it belongs to someone else.${S.flags.doc===1?' The documentary crew got all of it.':''}</p></div>`},
  ch:()=>{const [a,b]=S.flags.fight.map(M);return [{t:'Separate buses for the rest of the tour',d:'$80k. Peace by distance',fx:()=>{ledger('Second tour bus',-80000);a.mood=clamp(a.mood+4);b.mood=clamp(b.mood+4);S.flags.twoBus=1;return `<p>Two buses. They meet at soundcheck and say nothing. It works, the way a plaster works.</p>`}},
    {t:'Sit them down, tonight',d:'Before anyone sleeps on it',fx:()=>{if(chance(.55)){addG(a.id,b.id,-22);return `<p>At 3am, in a hotel bar that has closed around them, ${a.first} says sorry first. Nobody remembers that ever happening before.</p>`}addG(a.id,b.id,10);a.mood=clamp(a.mood-6);b.mood=clamp(b.mood-6);return `<p>It goes round in circles until ${b.first} leaves. Nothing is fixed. Something might be broken.</p>`}},
    ...(S.flags.doc===1?[{t:'Let the documentary keep the footage',d:'It will be the trailer',fx:()=>{rep('buzz',10);S.narr.drama+=15;a.mood=clamp(a.mood-8);b.mood=clamp(b.mood-8);S.flags.docFight=1;return `<p>The director doesn't even try to hide how happy she is.</p>`}}]:[]),
    {t:'Fine them both and move on',d:'Professional, cold',fx:()=>{a.mood=clamp(a.mood-5);b.mood=clamp(b.mood-5);addG(a.id,b.id,-5);return `<p>Five thousand each to the crew fund. They both pay, without a word, which is somehow worse.</p>`}}]}};

EV.walkout={title:'Gone',scene:'empty',
  body:()=>{const m=M(S.flags.walk);return `<div class="story"><p>${P(m,`{f} isn't on the bus. {P} hotel room is empty. A text arrives at 7am: "I can't do this. I'm sorry. I'm going home."`)}</p><p>Next show: ${esc(nextDate()?nextDate().city:'the last one')}. ${S.tour.dates.length-S.tour.i} dates left.</p></div>`},
  ch:()=>{const m=M(S.flags.walk);return [{t:`Go after ${m.first}`,d:'Get on a plane and find them',fx:()=>{if(chance(.42+m.mood/150+(S.flags['care'+m.id]?.12:0))){m.mood=clamp(m.mood+20);S.m.filter(x=>x!==m&&!x.repl).forEach(x=>addG(x.id,m.id,-10));cancelNext(`${m.first} missing`);return `<p>You find ${pron(m).o} on ${pron(m).p} mother's porch. You talk until it gets dark. ${pron(m).S} comes back. One show is lost; the tour isn't.</p>`}
      return implode(`${m.first} wouldn't come back, and without ${pron(m).o} the rest of the tour was cancelled.`)}},
    {t:'Finish the tour without them',d:'A fill-in, and a lot of explaining',fx:()=>{m.gone=true;const r=hire(m.id,'session');S.ap=0;rep('old',-8);rep('legacy',-6);moodAll(-6);S.narr.feud+=20;news('splash',`${m.first.toUpperCase()} QUITS REUNION`,`${S.band.name} carry on with a session player.`);return `<p>${r.name} learns the set on the plane. The shows go on. The photos look wrong.</p>`}},
    {t:'Cancel the rest of the tour',d:'It\'s over',fx:()=>implode(`${m.first} walked out, and you called time on the whole thing.`)}]}};
function implode(why){S.flags.imploded=why;const left=S.tour.dates.slice(S.tour.i);left.forEach(d=>{d.cancelled='tour cancelled'});S.stats.cancel+=left.length;ledger('Cancellation costs and refunds',-S.deal.g*.35*left.length);news('splash',`IT'S OVER (AGAIN)`,`${S.band.name}'s reunion tour collapses with ${left.length} dates left.`);S.queue=['_end_implosion'];return `<p>${esc(why)}</p>`}

EV.relapse={title:'The glass',scene:'empty',
  body:()=>{const s=byArc('sober');return `<div class="story"><p>${P(s,`At the after-show party in a hotel nobody should have booked, {f} is holding a glass of something brown. {S} sees you see it.`)}</p><p>"It's one," {f} says. "It's one drink after ${s.sober} years. Don't make it a thing."</p></div>`.replace(/\{f\}/g,s.first)},
  ch:()=>{const s=byArc('sober');return [{t:'Make it a thing',d:'Stop the tour for a week. Get them to their sponsor',fx:()=>{cancelNext('family reasons');cancelNext('family reasons');s.mood=clamp(s.mood+12);s.relapsed=1;S.flags.dry=true;rep('legacy',1);return `<p>Two shows postponed, "family reasons". ${s.first} spends a week at home with ${pron(s).p} sponsor. ${pron(s).S} comes back clear-eyed and furious with you, and grateful.</p>`}},
    {t:'Put someone with them, every minute',d:'A sober companion, $45k',fx:()=>{ledger('Sober companion',-45000);s.relapsed=1;s.mood=clamp(s.mood-4);S.flags.minder=1;return `<p>A quiet, enormous man named Vic now goes everywhere ${s.first} goes. It works, mostly.</p>`}},
    {t:'Pretend you didn\'t see',d:'Not your business',fx:()=>{s.relapsed=2;s.mood=clamp(s.mood-10);s.skill-=8;S.tight=clamp(S.tight-6);return `<p>It isn't one. By the next show everybody knows, including the front row.</p>`}}]}};

EV.exposed={title:'The isolated vocal',scene:'empty',
  body:()=>`<div class="story"><p>A sound engineer with too much free time has isolated the vocal from a fan's phone footage of "${sig().t}". Over the top, clear as day, a second voice that sounds a lot like ${voc().first} in ${S.band.albums[1].y}.</p><p>It's called "${bandName()} miming EXPOSED" and it has 3.2 million views.</p></div>`,
  ch:()=>[{t:'Admit it and apologise',d:'"We used tracks on some harmonies. We\'re stopping."',fx:()=>{S.tracks='none';S.plan.vocal='full';rep('cred',-6);S.narr.fake+=15;voc().mood=clamp(voc().mood-8);return `<p>The apology is short and true. A few people respect it. Most just enjoy the clip.</p>`}},
    {t:'Deny it',d:'Phone audio is unreliable',fx:()=>{if(chance(.5)){rep('cred',-18);rep('legacy',-8);S.narr.fake+=40;S.tracks='none';S.plan.vocal='full';news('loud',`More footage proves ${S.band.name} vocals are pre-recorded`,'A second clip from a different night shows the same take.');return `<p>A second clip appears the next day, from a different city. Same take, same breath. It's much worse now.</p>`}rep('cred',-4);S.narr.fake+=10;return `<p>It gets muddied enough. The argument becomes about audio forensics, which nobody can follow.</p>`}},
    {t:'Blame the sound engineer',d:'"An error in the system"',fx:()=>{rep('cred',-8);S.narr.fake+=20;S.tight=clamp(S.tight-4);return `<p>The crew read the statement on their phones in catering. Nobody makes eye contact with you for a week.</p>`}}]};

EV.extension={once:1,title:`${PROMOTER} want more`,scene:'stage',
  body:()=>`<div class="story"><p>The first leg grossed more than anyone predicted. ${PROMOTER} want three more arena dates at the end of the second leg, same terms.</p><p>That's three more nights of ${fmt$(S.deal.g)}, and three more nights of bodies that are ${avg(lineup().map(m=>m.age)).toFixed(0)} years old on average.</p></div>`,
  ch:()=>[{t:'Add the dates',d:'More money, more strain',fx:()=>{const home=S.tour.dates.pop();shuffle(ABROAD[S.band.home].filter(c=>!S.tour.dates.some(d=>d.city===c))).slice(0,3).forEach(c=>S.tour.dates.push({city:c,kind:'arena',cap:ri(13,19)*1000,leg:2,gap:1}));S.tour.dates.push(home);lineup().forEach(m=>m.mood=clamp(m.mood+(m.arc==='broke'?6:m.arc==='health'?-8:-2)));return `<p>Three more dates. ${byArc('health')&&byArc('health').status==='signed'?byArc('health').first+' reads the new itinerary and closes ' + pron(byArc('health')).p+' eyes.':'The crew start a sweepstake on who breaks first.'}</p>`}},
    {t:'No. Stick to the plan',d:'Leave them wanting more',fx:()=>{moodAll(3);return `<p>"Leave them wanting more," you tell the promoter, who has never once in his life left anyone wanting more.</p>`}}]};

EV.farewell={once:1,title:'Is this the last time?',scene:'stage',
  body:()=>{const m=pick(lineup().filter(x=>!x.repl));return `<div class="story"><p>${P(m,`On the bus after ${S.tour.dates[S.tour.i-1].city}, {f} says it out loud. "I think this should be the last one. I think we should say so. Do it properly, this time. Say goodbye instead of slamming a door."`)}</p><p>Nobody answers for a while. The motorway goes past.</p></div>`},
  ch:()=>[{t:'Announce a farewell',d:'The remaining dates become the last ever',fx:()=>{S.flags.farewell=1;rep('buzz',14);moodAll(5);news('loud',`${S.band.name}: this tour will be our last`,`"We got to say goodbye properly. Not everybody gets that."`);return `<p>The statement goes out at midnight. By breakfast, every remaining date is sold out.</p>`}},
    {t:'Keep the door open',d:'Nobody knows what comes next',fx:()=>{moodAll(-1);return `<p>"Never say never," someone says, and everyone groans.</p>`}},
    ...(S.album.st!=='none'?[{t:'Talk about the new album instead',d:'Not an ending. A middle',fx:()=>{S.album.prog=clamp(S.album.prog+15);moodAll(3);return `<p>Somebody plays a demo on a phone speaker. By the end of the drive, there are three new songs on the setlist for rehearsals.</p>`}}]:[])]};

EV.albumdeal={once:1,title:'The new record',scene:'rehearsal',
  body:()=>`<div class="story"><p>There are enough new songs for an album. Rough, but real. ${LABEL} hear the demos and offer a <b>${fmt$(1500000)}</b> advance for a record and a lead single in the middle of the tour.</p><p>Or the band could put it out themselves, own every note, and earn nothing up front.</p></div>`,
  ch:()=>[{t:`Sign with ${LABEL}`,d:'$1.5M advance, a proper campaign',fx:()=>{ledger(`${LABEL} album advance`,1500000);S.album.st='recorded';S.album.label=1;finishAlbum();return `<p>The record is mixed in a week of nights between shows. ${LABEL} want the single out before the second leg.</p>`}},
    {t:'Release it themselves',d:'Own it outright. Smaller push',fx:()=>{S.album.st='recorded';S.album.label=0;rep('cred',5);finishAlbum();return `<p>Self-released, on the band's own label, with a logo ${pick(lineup()).first} drew on a napkin.</p>`}}]};
function finishAlbum(){const q=clamp(42+avg(lineup().map(m=>m.mood))/5+(100-avg(lineup().flatMap((a,i)=>lineup().slice(i+1).map(b=>G(a.id,b.id)))))/6+rnd(-10,14));S.album.q=Math.round(q);const have=S.songs.filter(s=>s.kind==='new').length;addNew(Math.max(0,3-have),Math.round(q));S.songs.filter(s=>s.kind==='new').forEach(s=>s.q=Math.round(q))}

EV.single={once:1,title:'The single',scene:'stage',
  body:()=>{const s=S.songs.find(x=>x.kind==='new');S.album.single={id:s.id,t:s.t};return `<div class="story"><p>The first new ${bandName()} song in ${yearsApart()} years goes to radio and streaming at midnight: "${s.t}".</p><p>The old fans want it to sound like ${S.band.albums[1].y}. The new fans, if there are any, want it to sound like now. It can't be both.</p></div>`},
  ch:()=>[{t:'A nostalgic lead single',d:'Sounds like the old records',fx:()=>releaseSingle('old')},{t:'Something that sounds like now',d:'A young producer, a different sound',fx:()=>releaseSingle('new')}]};
function releaseSingle(kind){const s=S.album.single;const score=S.album.q*.55+(kind==='old'?S.rep.old*.35:S.rep.young*.55)+S.rep.buzz*.2+rnd(-12,12)-(S.narr.greed>30?8:0);
  const hit=score>(kind==='old'?66:58);S.album.hit=hit;S.album.st='released';S.album.kind=kind;const pos=hit?ri(2,12):ri(28,70);S.album.pos=pos;
  if(hit){rep(kind==='old'?'old':'young',kind==='old'?8:22);rep('cred',kind==='old'?2:6);rep('buzz',12);S.narr.discover+=kind==='new'?20:5}else{rep('cred',-3);rep('buzz',-2)}
