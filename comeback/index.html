/* ---------- picking events ---------- */
function eligible(ph){return Object.entries(EV).filter(([id,e])=>e.w&&(!e.once||!S.seen[id])&&(e.ph==='any'||e.ph===ph)&&e.w()>0)}
function rollEvent(ph,p){if(!chance(p))return;const el=eligible(ph);if(!el.length)return;const tot=sum(el.map(([,e])=>e.w()));let r=Math.random()*tot;for(const [id,e] of el){r-=e.w();if(r<=0){S.queue.push(id);return}}}

/* ================= turn flow ================= */
const FOCUS={hits:{n:'The hits',d:'Drill the old set until it is automatic'},new:{n:'New songs',d:'Arrange and write new material'},voice:{n:'Voice',d:'Vocal coach, rest and warm-ups'},show:{n:'Production',d:'Staging, lights and run-throughs ($40k)'}};
function endWeek(){
  if(S.phase==='reunion'){
    S.m.forEach(m=>{if(['out','talking'].includes(m.status)&&!m.repl)m.will=clamp(m.will-2)});
    if(S.name.status==='court'){S.name.wk--;if(S.name.wk<=0){const o=M(S.name.owner);if(chance(.55)){S.name.status='won';news(pick(PRESS_SERIOUS),`${S.band.name} win battle over band name`,`The court ruled the trademark belongs to the band partnership, not ${o.name}.`);o.mood=clamp(o.mood-10)}else{S.name.status='members-of';news('splash','NAME GAME LOST',`${o.name} keeps the ${bare()} trademark. The rest will tour as "Members of".`);rep('cred',-4)}logH('The court ruled on the band name.')}}
    weeklyRumour();
    S.week++;S.ap=S.apMax;
    if(S.week>S.weeks){if(canAnnounce()){announce();return}finish('never',neverWhy());render();return}
    if(S.week===S.weeks-1&&!S.seen.deadline)S.queue.push('deadline');
    rollEvent('reunion',.8);
  }else if(S.phase==='prep'){
    const f=S.focus||'hits';ledger('Rehearsal room, crew and gear',-35000);
    if(f==='hits'){S.tight=clamp(S.tight+12);S.voice=clamp(S.voice-3)}
    if(f==='new'){S.tight=clamp(S.tight+5);if(S.album.st==='writing')S.album.prog=clamp(S.album.prog+25);else if(S.album.st==='none')S.tight=clamp(S.tight+2)}
    if(f==='voice'){S.voiceBase=Math.min(96,S.voiceBase+1);S.voice=clamp(S.voice+10,0,S.voiceBase);S.tight=clamp(S.tight+4)}
    if(f==='show'){ledger('Production rehearsals',-40000);S.tight=clamp(S.tight+7);rep('buzz',3)}
    if(S.flags.commute)S.tight=clamp(S.tight-3);
    lineup().forEach(m=>{m.stam=100});
    S.week++;S.ap=2;
    if(S.week===2&&!S.seen.keys)S.queue.push('keys');
    if(S.week===3&&!S.seen.backing)S.queue.push('backing');
    if(S.week>4){startTour();return}
    rollEvent('prep',.9);
  }
  save();render();openQueue();
}
function neverWhy(){const r=readiness().filter(x=>!x.ok).map(x=>x.t.toLowerCase());return `${PROMOTER} pulled the offer at the end of week ${S.weeks}. Still missing: ${r.join(', ')}.`}
function weeklyRumour(){const L=S.m.filter(m=>!m.repl);const s=L.filter(m=>m.status==='signed').length;
  if(chance(.6))fan(pick(FANS),pick([`Saw ${pick(L).first} in a supermarket in ${S.band.town}. Looked well. Did not ask about the reunion. Wanted to.`,`If ${M(S.band.bitter).first} isn't in it I'm not going. Simple.`,`My mum saw them in ${S.band.albums[1].y}. I'd go just to tell her about it.`,`Twenty quid says it's announced by the summer.`,`Remember when ${M(S.band.target).first} and ${M(S.band.bitter).first} were best mates? Different world.`]),ri(4,120));
  if(s>=2&&chance(.5))news('splash',pick([`${s} of the five are in, says insider`,`Reunion talks "at an advanced stage"`,`Old wounds threaten ${S.band.name} comeback`]),'A source close to the band says talks are continuing.')}
function announce(){S.phase='prep';S.week=1;S.ap=2;S.flags.announced=1;buildTour();S.queue.unshift('announce');rep('old',4);logH('The reunion was announced.');
  if(S.m.some(m=>m.status==='talking'))S.m.filter(m=>m.status==='talking').forEach(m=>{m.status='no'});
  save();UI.tab='today';render();openQueue()}
function startTour(){S.phase='tour';S.plan={vocal:'full',energy:'normal',pre:'rest'};lineup().forEach(m=>{m.stam=100});logH('The tour began.');
  news('marq',`${bandName()}: the tour starts tonight in ${S.tour.dates[0].city}`,`${S.tour.dates.length} dates. ${yearsApart()} years. One question: can they still do it?`);
  save();UI.tab='today';render();openQueue()}
function afterShow(){const L=lineup();
  L.forEach(m=>{if(m.out>0)m.out--});
  if(S.phase==='end')return;
  for(const m of L){if(!m.repl&&m.mood<16&&!S.seen['walk'+m.id]){S.seen['walk'+m.id]=1;S.flags.walk=m.id;S.queue.push('walkout');break}}
  const pr=L.flatMap((a,i)=>L.slice(i+1).map(b=>[a,b,G(a.id,b.id)])).sort((x,y)=>y[2]-x[2])[0];
  if(pr&&pr[2]>=88&&!S.queue.includes('walkout')){const w=pr[0].mood<pr[1].mood?pr[0]:pr[1];if(!w.repl&&!S.seen['walk'+w.id]){S.seen['walk'+w.id]=1;S.flags.walk=w.id;S.queue.push('walkout')}}
  const sb=byArc('sober');if(sb&&sb.status==='signed'&&!sb.gone&&!sb.relapsed){const p=.012+(S.flags.dry?0:.035)+(sb.mood<40?.03:0)+(S.flags.soberRisk||0)-(S.flags.sponsor?.012:0);if(chance(p))S.queue.push('relapse')}
  const prev=S.tour.dates[S.tour.i-1],nx=nextDate();
  if(prev&&nx&&prev.leg===1&&nx.leg!==1&&!S.seen.legbreak){S.queue.push('legbreak');if(avg(S.stats.stars)>=3.3&&!S.seen.extension)S.queue.push('extension')}
  if(nx&&!S.flags.farewell&&!S.seen.farewell&&S.tour.i>=Math.floor(S.tour.dates.length*.6)&&chance(.4))S.queue.push('farewell');
  if(S.album.st==='writing'&&S.album.prog>=100&&!S.seen.albumdeal)S.queue.push('albumdeal');
  if(S.album.st==='recorded'&&prev&&prev.leg>=1.5&&!S.seen.single)S.queue.push('single');
  if(S.queue.length<2)rollEvent('tour',.45);
  if(!nx)S.queue.push('_end_tour');
  save();openQueue()}
function openQueue(){if(UI.sheet)return;while(S&&S.queue.length){const id=S.queue.shift();
    if(id.startsWith('_end_')){const k=id.slice(5);if(k==='implosion')finish('implosion',S.flags.imploded);else finish(decideEnding());UI.scr='end';render();window.scrollTo(0,0);return}
    if(!EV[id])continue;if(EV[id].once&&S.seen[id]&&!['legbreak'].includes(id))continue;S.seen[id]=1;UI.sheet={k:'event',id};renderSheet();return}
  if(S&&S.phase==='tour'&&!nextDate()&&S.phase!=='end'){finish(decideEnding());UI.scr='end';render()}}

function gameHTML(){const body={today:todayHTML,band:bandHTML,money:moneyHTML,press:pressHTML,set:setHTML}[UI.tab]();if(UI.tab==='press')S.flags.feedSeen=S.feed.length?S.feed[0].t:-1;

/* ---- today ---- */
function todayHTML(){return S.phase==='reunion'?reunionHTML():S.phase==='prep'?prepHTML():tourHTML()}
function lineupGrid(){return `<div class="lineup">${slots().map(s=>{const m=s.who||s.o;const st=s.who?(s.who.repl?'New':'Signed'):STATUS[s.o.status][0];return `<button class="slot ${s.who?'on':''}" data-a="member" data-v="${m.id}">${face(m,s.who?'':'ghost')}<b>${esc(m.first)}</b><span>${esc(st)}</span></button>`}).join('')}</div>`}
function reunionHTML(){const r=readiness(),ok=canAnnounce(),ap=S.ap;const open=S.m.filter(m=>m.status==='no'&&!S.m.some(x=>x.replaces===m.id));

function prepHTML(){const ap=S.ap,f=S.focus||'hits',st=setStats(),L=lineup();const chem=100-avg(L.flatMap((a,i)=>L.slice(i+1).map(b=>G(a.id,b.id))));

  <div class="stage" data-stage="rehearsal"><div class="stage-fb">${L.map(m=>face(m)).join('')}</div><div class="stage-cap"><span>Rehearsal room, ${esc(S.band.town)}</span><span>drag to spin</span></div></div>
  <section class="card"><div class="card-h"><h2>Where the band is</h2><span class="small">0–100</span></div>${meter('Tightness',S.tight,'spot')}${meter(`${esc(poss(voc().first))} voice`,S.voice/S.voiceBase*100,'',Math.round(S.voice))}${meter('Chemistry',chem,'')}</section>
  <section class="card"><h2>This week's rehearsals</h2><div class="seg" role="group" aria-label="Rehearsal focus">${Object.entries(FOCUS).map(([k,v])=>`<button class="${f===k?'on':''}" data-a="focus" data-v="${k}" aria-pressed="${f===k}">${v.n}</button>`).join('')}</div><p class="small muted">${FOCUS[f].d}.${f==='new'&&S.album.st==='none'?' Nobody has brought in a new song yet.':''}</p></section>
  <section class="card"><h2>${ap} ${plural(ap,'day')} free this week</h2><div class="choices">
    <button class="choice" data-a="pickcare" ${ap?'':'disabled'}><b>One-on-one</b><span>Time with one member, away from the others</span></button>
    <button class="choice" data-a="picksit" ${ap?'':'disabled'}><b>Sit two of them down</b><span>Before the tour bus does it for you</span></button>
    <button class="choice" data-a="pressday" ${ap?'':'disabled'}><b>Press day</b><span>Radio, podcasts, a magazine cover. Buzz, and risk</span></button>
    ${S.album.st==='writing'?`<button class="choice" data-a="writeday" ${ap?'':'disabled'}><b>Writing session</b><span>New album: ${S.album.prog}% written</span></button>`:''}
    ${legal?`<button class="choice" data-a="legal"><b>See the lawyers</b><span>The publishing split is still open</span></button>`:''}

  ${latestHTML()}`}
function tourHTML(){const d=nextDate();if(!d)return `<div><h1>The tour is over</h1></div>`;const L=lineup(),v=voc(),pl=S.plan,dem=demand(d);

  <div class="stage tall" data-stage="show"><div class="stage-fb">${L.map(m=>face(m)).join('')}</div><div class="stage-cap"><span>${d.kind==='festival'?'Main stage':fmtN(Math.round(d.cap*sold))+' tickets sold'}</span><span>drag to spin</span></div></div>

   <p class="small muted">${PRE[pl.pre].d}.</p>${pl.pre==='care'?`<div class="faces">${L.map(m=>`<button class="pbtn" data-a="carewho" data-v="${m.id}" aria-label="${esc(m.first)}" style="background:none;border:0;padding:0;border-radius:50%;outline:${pl.care===m.id?'2px solid #fff':'none'};outline-offset:2px">${face(m,'sm')}</button>`).join('')}</div>`:''}</section>
  <section class="card"><h2>Tonight</h2>
   <div class="stack tight"><span class="small faint">Vocals</span><div class="seg" role="group" aria-label="Vocal plan">${vopts.map(([k,o])=>`<button class="${pl.vocal===k?'on':''}" data-a="vplan" data-v="${k}" aria-pressed="${pl.vocal===k}">${o.n}<small>${o.d}</small></button>`).join('')}</div></div>
   <div class="stack tight"><span class="small faint">Energy</span><div class="seg" role="group" aria-label="Energy">${Object.entries(ENERGY).map(([k,o])=>`<button class="${pl.energy===k?'on':''}" data-a="energy" data-v="${k}" aria-pressed="${pl.energy===k}">${o.n}<small>${o.d}</small></button>`).join('')}</div></div>
   <div class="kv"><span>Set</span><b>${st.n} songs · ${st.min} min</b></div>
   ${!st.sig?`<p class="small neg">"${esc(sig().t)}" is not in the set.</p>`:''}${S.flags.short&&st.min>95?`<p class="small neg">The set runs over the 95 minutes you promised ${esc(byArc('health').first)}.</p>`:''}
   <button class="btn pri lg wide" data-a="play">Play ${esc(d.city)}</button></section>
  <section class="card"><div class="card-h"><h2>The band tonight</h2><span class="small">Stamina</span></div>
   ${meter(`${esc(poss(v.first))} voice`,S.voice/S.voiceBase*100,S.voice<35?'neg':'spot',Math.round(S.voice))}
   <div class="list">${L.map(m=>`<button class="person" data-a="member" data-v="${m.id}">${face(m,'sm')}<div class="who"><b>${esc(m.first)}</b><span>${moodWord(m.mood)}${m.out>0?' · injured':''}</span></div><div style="width:96px">${bar(m.stam,m.stam<35?'neg':'')}</div></button>`).join('')}</div></section>
  ${lastShowHTML()}
  <section class="card"><h2>Coming up</h2><table class="t"><tbody>${S.tour.dates.slice(S.tour.i+1,S.tour.i+5).map(x=>`<tr><td>${esc(x.city)}<div class="small faint">${x.kind==='festival'?'Festival':x.kind==='stadium'?'Homecoming':'Arena'}${x.gap===0?' · the next night':''}</div></td><td class="r">${fmtN(x.cap)}</td></tr>`).join('')||'<tr><td class="faint">This is the last show.</td></tr>'}</tbody></table></section>`}
function lastShowHTML(){const prev=[...S.tour.dates.slice(0,S.tour.i)].reverse().find(d=>d.res);if(!prev)return '';const r=prev.res;
  return `<section class="card"><div class="card-h"><h2>Last show: ${esc(prev.city)}</h2>${starsHTML(r.stars)}</div><div class="kpis two" style="background:var(--sunk)"><div class="kpi"><span>Crowd</span><b>${fmtN(r.sold)}</b></div><div class="kpi"><span>Band net</span><b>${fmt$(r.net)}</b></div></div></section>`}
function latestHTML(){const f=S.feed.slice(0,3);if(!f.length)return '';return `<section class="card"><div class="card-h"><h2>Latest</h2><button class="linkbtn" data-a="tab" data-v="press">All press</button></div><div class="list">${f.map(feedItem).join('')}</div></section>`}

function bandHTML(){const L=S.m.filter(m=>!m.gone||m.repl);const people=S.m;
  const pairs=[];const act=S.m.filter(m=>m.status!=='no'&&!m.gone);act.forEach((a,i)=>act.slice(i+1).forEach(b=>pairs.push([a,b,G(a.id,b.id)])));pairs.sort((x,y)=>y[2]-x[2]);
  return `<div><h1>The band</h1><p class="sub">${esc(GENRES[S.band.genre].n)} from ${esc(S.band.town)}, ${S.band.formed}–${S.band.split}. ${esc(GENRES[S.band.genre].sound)}.</p></div>
  <section class="card"><div class="list">${people.map(m=>{const [st,c]=m.repl?['Joined','pos']:m.gone?['Left the tour','neg']:STATUS[m.status];return `<button class="person" data-a="member" data-v="${m.id}">${face(m,m.status==='no'||m.gone?'ghost':'')}<div class="who"><b>${esc(m.name)}</b><span>${esc(m.role)} · ${m.age} · ${ARC[m.arc]}</span></div><span class="pill ${c}">${st}</span></button>`}).join('')}</div></section>
  <section class="card"><div class="card-h"><h2>Old wounds</h2><span class="small">Grudge, 0–100</span></div><div class="list">${pairs.slice(0,6).map(([a,b,g])=>`<div class="stack tight"><div class="between"><span>${esc(a.first)} and ${esc(b.first)}</span><b class="num ${g>70?'neg':''}" style="font-weight:500">${Math.round(g)}</b></div>${bar(g,g>70?'neg':'')}</div>`).join('')}</div>${pairs.length>1&&S.phase!=='tour'?`<button class="btn wide" data-a="picksit" ${S.ap?'':'disabled'}>Sit two of them down</button>`:''}</section>
  <section class="card"><h2>How it ended</h2><p class="story">${esc(S.band.story)}</p></section>
  <section class="card"><div class="card-h"><h2>The records</h2><span class="small">Peak · sales</span></div><table class="t"><tbody>${S.band.albums.map((a,i)=>`<tr><td><b style="font-weight:500">${esc(a.t)}</b><div class="small faint">${a.y} · ${S.songs.filter(s=>s.al===i&&s.tier>=1).map(s=>esc(s.t)).join(', ')}</div></td><td class="r">#${a.peak}<div class="small faint">${(a.sales/1e6).toFixed(1)}M</div></td></tr>`).join('')}</tbody></table>
   <div class="kv"><span>Monthly listeners now</span><b>${fmtN(S.band.listeners)}</b></div></section>

function moneyHTML(){const sh=shares(),d=nextDate()||S.tour&&S.tour.dates[0];const dem=demand(d);const pre=S.phase==='reunion';
  const estFee=S.deal.type==='flat'?S.deal.g:Math.max(S.deal.g*.8,.85*(16000*Math.min(1,dem)*avgPrice(dem)*.76-130000));
  return `<div><h1>Money</h1><p class="sub">${S.cash<0?`The pot is ${fmt$(S.cash)}: spent ahead, recouped from the tour.`:'Everything the reunion has earned and spent so far.'}</p></div>
  <div class="kpis"><div class="kpi lead"><span>Band pot</span><b class="${S.cash<0?'neg':''}">${fmt$(S.cash)}</b></div><div class="kpi"><span>Tour gross</span><b>${fmt$(S.stats.gross)}</b></div><div class="kpi"><span>Your 15%</span><b>${fmt$(S.stats.comm)}</b></div></div>
  <section class="card"><div class="card-h"><h2>The deal with ${PROMOTER}</h2><span class="small">${S.tour?S.tour.dates.length:16} dates</span></div>
   <div class="kv"><span>Guarantee per arena show</span><b>${fmt$(S.deal.g)}</b></div><div class="kv"><span>Homecoming stadium</span><b>${fmt$(S.deal.g*2.6)}</b></div>
   ${pre?`<div class="seg" role="group" aria-label="Deal type"><button class="${S.deal.type==='flat'?'on':''}" data-a="deal" data-v="flat">Flat guarantee<small>Paid whatever sells</small></button><button class="${S.deal.type==='versus'?'on':''}" data-a="deal" data-v="versus">Versus deal<small>80% floor or 85% of net</small></button></div>

   ${S.deal.pushed<2?'<button class="btn wide" data-a="push">Push for a higher guarantee</button>':''}`:`<div class="kv"><span>Deal type</span><b>${S.deal.type==='flat'?'Flat guarantee':'Versus deal'}</b></div>`}</section>
  <section class="card"><h2>Tickets</h2><div class="seg" role="group" aria-label="Pricing">${Object.entries(PRICING).map(([k,p])=>`<button class="${S.pricing===k?'on':''}" data-a="pricing" data-v="${k}" aria-pressed="${S.pricing===k}">${p.n}<small>${p.d.split(',')[0]}</small></button>`).join('')}</div>
   <div class="seg" role="group" aria-label="VIP packages">${Object.entries(VIPS).map(([k,p])=>`<button class="${S.vip===k?'on':''}" data-a="vip" data-v="${k}" aria-pressed="${S.vip===k}">${p.n}</button>`).join('')}</div>
   <p class="small muted">${PRICING[S.pricing].d}. ${VIPS[S.vip].d}.${S.vip==='meet'?' Every night of photos wears the band down.':''}</p>
   ${meter('Demand, share of an arena',Math.min(dem,1)*100,'spot',Math.round(dem*100)+'%')}<div class="kv"><span>Average ticket</span><b>$${avgPrice(dem)}</b></div></section>

  <section class="card"><h2>The catalog</h2><div class="kv"><span>Royalties per year</span><b>${fmt$(annualRoyalty())}</b></div><div class="kv"><span>Publishing</span><b>${{open:'Disputed',equal:'Split five ways',points:'Writers keep it',kept:'Writers keep it'}[S.pub.status]}</b></div><div class="kv"><span>Ownership</span><b>${S.flags.sold?'Sold to '+FUND:'The band and '+OLDLABEL}</b></div></section>
  <section class="card"><h2>Ledger</h2><table class="t"><tbody>${S.ledger.slice(0,14).map(l=>`<tr><td>${esc(l.t)}<div class="small faint">${esc(l.w)}</div></td><td class="r ${l.amt<0?'':'pos'}">${l.amt>0?'+':''}${fmt$(l.amt)}</td></tr>`).join('')}</tbody></table></section>`}

/* ---- press ---- */
const NARR={nostalgia:['The nostalgia trip','Everyone wants to be twenty again for one night.'],greed:['The cash grab','The story is about the ticket prices, not the songs.'],feud:['The feud','Every interview is about who hates whom.'],fragile:['Too old for this','Cancellations and ambulances, and the press is counting.'],triumph:['The triumph','Critics are queuing up to call it the comeback of the decade.'],fake:['The miming scandal','The words "backing track" follow the band everywhere.'],discover:['The new generation','Teenagers have found the band, and the old fans are bemused.'],drama:['The soap opera','The cameras catch everything. The public can\'t look away.']};

const TIER=['Deep cut','Single','Big hit','The big one'];
function setHTML(){const st=setStats(),ids=S.set;const lock=S.phase==='reunion';
  const rest=S.songs.filter(s=>!ids.includes(s.id));const grp=[['Hits',rest.filter(s=>s.kind==='old'&&s.tier>=1)],['Deep cuts',rest.filter(s=>s.kind==='old'&&s.tier===0)],['New songs',rest.filter(s=>s.kind==='new')],['Solo songs',rest.filter(s=>s.kind==='solo')]].filter(g=>g[1].length);

function songMeta(s){const al=s.al>=0?S.band.albums[s.al].t+', '+s.y:s.kind==='new'?'written for the reunion':esc(M(s.w[0]).first)+"'s solo career";return `${S.flags.viral===s.id?'Viral · ':''}${s.kind==='old'?TIER[s.tier]+(s.peak?' #'+s.peak:''):s.kind==='new'?'New':'Solo song'}${s.diff===3?' · high notes':''} · ${esc(al)}`}

   <p class="small faint" style="padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))">Every band, person, promoter, label and publication in this game is fictional. Saved on this device.</p></div></div>`}
function setupHTML(){const B=UI.setup.band;const roles=B.members;

   <div class="row" style="flex-wrap:nowrap"><button class="btn lg" data-a="reroll" style="flex:1">Reroll</button><button class="btn pri lg" data-a="begin" style="flex:2">Make the call</button></div></main>`}
function endHTML(){const E=S.end,e=ENDINGS[E.kind],L=S.m;const v=S.m.find(m=>m.role==='Vocals'&&!m.repl);

   ${S.tour&&S.tour.dates.some(d=>d.res)?`<section class="card"><div class="card-h"><h2>Night by night</h2><span class="small">Review stars</span></div>${starChart()}</section>`:''}

   <button class="btn pri lg wide" data-a="totitle">Back to the title</button></main>`}
function starChart(){const ds=S.tour.dates.filter(d=>d.res||d.cancelled);const W=600,H=140,n=ds.length,step=(W-50)/Math.max(1,n-1);
  const pts=ds.map((d,i)=>d.res?[50+i*step,H-(d.res.stars-1)/4*(H-14)-4]:null);

  return `<svg class="chart" viewBox="0 0 ${W} ${H+30}" role="img" aria-label="Review stars per show"><g font-size="19" fill="#949494" font-family="Inter,system-ui">${[1,3,5].map(s=>`<line x1="50" x2="${W}" y1="${H-(s-1)/4*(H-14)-4}" y2="${H-(s-1)/4*(H-14)-4}" stroke="#222" stroke-dasharray="3 3"/><text x="0" y="${H-(s-1)/4*(H-14)+2}">${s}</text>`).join('')}
   <path d="${path}" fill="none" stroke="#f5b041" stroke-width="2"/>${ds.map((d,i)=>d.cancelled?`<text x="${50+i*step}" y="${H-2}" text-anchor="middle" fill="#e5566f">×</text>`:'').join('')}

function endDeck(){const E=S.end,a=E.a;switch(E.kind){

  case 'second':return `A reunion tour turned into a second career: a hit single, a new audience and a record deal for the next one.`;
  case 'payday':return `${fmt$(E.gross)} gross across ${E.shows} shows. The reviews were ${a>=3?'decent':'cruel'}, the photos were awkward, and the money cleared.`;

function epilogue(m){const ok=['legacy','farewell','second'].includes(S.end.kind),k=S.end.kind;if(m.repl)return `${m.first} ${m.accept>60?'is now a fixture in the band, and nobody calls '+pron(m).o+' "the new one" any more.':'went back to session work with a story to tell and a lot of strange messages from strangers.'}`;

function youLine(){const k=S.end.kind;return {legacy:'You get the credit in every documentary, which is to say a nod in the second hour. You don\'t mind.',farewell:'You stood at the side of the stage for the last song and cried like everybody else.',second:'You are managing a working band again, at your age. The phone never stops.',payday:'You made more money than in the whole first career. It feels less like winning than you expected.',implosion:'Your phone has 200 messages. You answer the one from the promoter last.',never:'You put the cream envelope in a drawer, on top of the other one, from ten years ago.'}[k]}

const AU={ctx:null,on:true};
function actx(){if(!AU.on)return null;try{if(!AU.ctx)AU.ctx=new (window.AudioContext||window.webkitAudioContext)();if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx}catch(e){return null}}
function noise(c,dur,gain,f){const n=c.sampleRate*dur,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=.6;const g=c.createGain();g.gain.value=gain;s.connect(fl);fl.connect(g);g.connect(c.destination);s.start()}
function beat(v){const c=actx();if(!c)return;noise(c,.22,.02+v/100*.05,900+v*6)}
function cheer(v){const c=actx();if(!c)return;noise(c,2.2,.05+v/100*.12,1200);setTimeout(()=>{if(AU.ctx)noise(AU.ctx,1.6,.04+v/100*.08,2200)},250)}

function startLoop(){if(!AV.raf)AV.raf=requestAnimationFrame(loop3)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)startLoop()});
window.addEventListener('resize',()=>{const el=AV.r&&AV.r.domElement.parentNode;if(el)sizeStage(el)});
function portraitURL(T,m){const ghost=m.status==='no'||m.gone;const key=[m.id,m.look.seed,m.look.grey.toFixed(2),(m.mood??60)<35,ghost].join('|');if(AV.cache.has(key))return AV.cache.get(key);
  if(!AV.pr){try{AV.pr=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});AV.pr.setPixelRatio(1);AV.pr.setSize(160,160,false)}catch(e){AV.failed=true;return null}}
  const sc=new T.Scene();sc.background=new T.Color(ghost?'#1a1a1a':'#2a2a2a');sc.add(new T.HemisphereLight(0xffffff,0x444444,.75));const dl=new T.DirectionalLight(0xffffff,.5);dl.position.set(2,4,5);sc.add(dl);const wl=new T.PointLight(0xf5b041,.5,10);wl.position.set(-2,3,2);sc.add(wl);
  const a=avatar(T,m,{inst:false});sc.add(a);const cam=new T.PerspectiveCamera(30,1,.1,50);cam.position.set(.35,2.82,2.45);cam.lookAt(0,2.74,0);AV.pr.render(sc,cam);
  let url=AV.pr.domElement.toDataURL('image/png');sc.traverse(o=>{if(o.geometry)o.geometry.dispose()});
  if(AV.cache.size>200)AV.cache.clear();AV.cache.set(key,url);return url}
function findPerson(id){return (S&&S.m.find(m=>m.id===id))||(UI.setup&&UI.setup.band.members.find(m=>m.id===id))||(UI.demo&&UI.demo.members.find(m=>m.id===id))}
function hydrate(root=document){const imgs=[...root.querySelectorAll('img[data-pid]')];const st=root.querySelectorAll('[data-stage]');const stEl=st[st.length-1];
  if(!imgs.length&&!stEl)return;
  loadThree().then(T=>{for(const im of imgs){if(!im.isConnected)continue;const m=findPerson(im.dataset.pid);if(!m)continue;const u=portraitURL(T,m);if(u)im.src=u}
    // the sheet's stage takes the renderer while a sheet is open; the page's stage gets it back on close
    const sheetSt=$('#sheet:not([hidden]) [data-stage]');const target=sheetSt||document.querySelector('#app [data-stage]');if(target&&target.isConnected)mountStage(target)})
  .catch(()=>{document.querySelectorAll('[data-stage]').forEach(fallbackStage)})}

/* ================= boot ================= */
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')e.target.blur()});
// Live updates (same approach as Headliner and Debut Dream): when the app opens or comes back to the foreground,
// fetch the latest page and reload into it if its version is newer. Never interrupts an open sheet.
const APP_VER='202610242205';
function checkUpdate(){if(!/^https?:/.test(location.protocol)||UI.sheet)return;fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/const APP_VER='(\d+)'/);if(m&&m[1]!==APP_VER&&!UI.sheet){try{save()}catch(e){}location.replace(location.pathname+'?v='+m[1])}}).catch(()=>{})}
setTimeout(checkUpdate,1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
function boot(){UI.demo=genBand();UI.demo.members.forEach(m=>m.status='signed');
  let n=null;try{n=+localStorage.getItem('comeback_last')||null}catch(e){}
  const s=n?readSlot(n):null;
  if(s&&s.phase!=='end'){S=s;S.slot=n;UI.scr='game'}else UI.scr='title';
  render();if(UI.scr==='game')openQueue()}
boot();
</script>
